<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belief — The Potato of Life</title><link rel="stylesheet" href="site.css"><style>main{max-width:1100px;margin:auto;padding:32px}.card{border:1px solid #ccc;background:#fff;padding:28px;margin:18px 0}.pill{border:1px solid #aaa;padding:5px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:inline-block}.coords,.timeline{font-family:monospace;background:#f5f3ee;padding:14px;overflow:auto}.timeline article{padding:14px 0;border-bottom:1px solid #ddd}.note{color:#555;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.mini{padding:14px;background:#faf9f6;border:1px solid #ddd}a{color:inherit}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav><a href="index.html">Home</a><a href="nations.html">195 Nations</a><a href="political-compass.html">Belief Compass</a><a href="repository.html">Atlas</a></nav></header><main><a href="political-compass.html">← Back to Belief Compass</a><div id="app" class="card"><p>Loading belief…</p></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');async function json(u){const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json()}async function load(){try{const[p,r,b,f]=await Promise.all([json('data/political-lexicon.json'),json('data/religious-lexicon.json'),json('data/potatoism-religion.json'),json('data/religious-foundations.json')]);const pe=(p.entries||[]).find(e=>e[0]===id),re=(r.entries||[]).find(e=>e[0]===id),fd=(f.records||[]).find(x=>x.tradition_id===id),isPotato=id==='potatoism';if(!pe&&!re&&!isPotato){document.getElementById('app').innerHTML='<h1>Belief not found</h1><p class="note">The requested identifier is not currently in the atlas.</p>';return}if(pe){document.title=id+' — Political Belief';document.getElementById('app').innerHTML='<span class="pill">Political ideology</span><h1>'+esc(id.replaceAll('-',' '))+'</h1><p>'+esc(pe[1])+'</p><h2>Analytical coordinates</h2><div class="coords">Economic: '+esc(pe[2])+'\nAuthority: '+esc(pe[3])+'\nQuadrant family: '+esc(pe[4])+'</div><p class="note">Coordinates are visualization approximations, not a complete definition of an ideology or its adherents.</p>'}else if(isPotato){document.title='Potatoism — The Potato of Life';document.getElementById('app').innerHTML='<span class="pill">Project-defined contemporary religious / mythic system</span><h1>Potatoism</h1><p>'+esc(b.epistemic_note)+'</p><h2>Birth / seed</h2><div class="mini"><strong>'+esc(b.birth.date)+'</strong><br>'+esc(b.birth.meaning)+'</div><h2>Growing timeline</h2><div class="timeline">'+b.timeline.map(x=>'<article><strong>'+esc(x.period||x.stage)+'</strong><p>'+esc(x.stage)+'</p><div>'+esc(x.description)+'</div></article>').join('')+'</div><h2>Symbolic architecture</h2><div class="grid">'+Object.entries(b.core_architecture).map(([k,v])=>'<div class="mini"><strong>'+esc(k)+'</strong><p>'+esc(Array.isArray(v)?v.join(' · '):JSON.stringify(v))+'</p></div>').join('')+'</div><p class="note">The birth marker is treated as the seed of the timeline, not as the date on which the finished architecture existed.</p>'}else{document.title=(re[0]||id)+' — Religious Worldview';const foundation=fd?'<h2>Foundation / emergence</h2><div class="mini"><strong>'+esc(fd.foundation_type)+'</strong><p><b>Field:</b> '+esc(fd.field)+'</p><p><b>Substrate:</b> '+esc((fd.substrate||[]).join(' · '))+'</p><p><b>Seed:</b> '+esc(fd.seed)+'</p><p><b>Historical emergence:</b> '+esc(fd.historical_emergence)+'</p><p><b>Formation markers:</b> '+esc((fd.formation_markers||[]).join(' · '))+'</p><p class="note">'+esc(fd.uncertainty)+'</p></div>':'';document.getElementById('app').innerHTML='<span class="pill">Religious tradition / worldview</span><h1>'+esc(re[0])+'</h1><p>'+esc(re[1])+'</p>'+foundation+'<h2>Worldview space</h2><p class="note">The religious cube is an analytical projection. Foundation, history, texts, practices, places, institutions, branches and evidence remain separate layers.</p><p><a href="political-compass.html#'+encodeURIComponent(id)+'">Locate this tradition in the belief space →</a></p>'}}catch(e){document.getElementById('app').innerHTML='<h1>Belief data unavailable</h1><p class="note">A belief data layer could not be loaded. Check the JSON paths and GitHub Pages deployment.</p>'}}load();</script></body></html>
