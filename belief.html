<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belief — The Potato of Life</title><link rel="stylesheet" href="site.css"><style>main{max-width:1100px;margin:auto;padding:32px}.card{border:1px solid #ccc;background:#fff;padding:28px;margin:18px 0}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #aaa;padding:5px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}.coords{font-family:monospace;background:#f5f3ee;padding:14px;overflow:auto}.back{display:inline-block;margin-bottom:18px}.note{color:#555;line-height:1.6}a{color:inherit}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav><a href="index.html">Home</a><a href="nations.html">195 Nations</a><a href="political-compass.html">Belief Compass</a><a href="repository.html">Atlas</a></nav></header><main><a class="back" href="political-compass.html">← Back to Belief Compass</a><div id="app" class="card"><p>Loading belief…</p></div></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');async function load(){const[p,r]=await Promise.all([fetch('data/political-lexicon.json').then(x=>x.json()),fetch('data/religious-lexicon.json').then(x=>x.json())]);const pe=p.entries.find(e=>e[0]===id),re=r.entries.find(e=>e[0]===id);if(!pe&&!re){document.getElementById('app').innerHTML='<h1>Belief not found</h1><p class="note">The requested identifier is not currently in the lexicon.</p>';return}if(pe){document.title=pe[0]+' — Political Belief';document.getElementById('app').innerHTML='<p class="pill">Political ideology</p><h1>'+esc(pe[0].replaceAll('-',' '))+'</h1><p>'+esc(pe[1])+'</p><h2>Current analytical coordinates</h2><div class="coords">Economic: '+pe[2]+'\nAuthority: '+pe[3]+'\nQuadrant family: '+esc(pe[4])+'</div><p class="note">These coordinates are visualization approximations, not a complete definition of the ideology. Historical variants, national adaptations, internal factions and individual adherents can occupy different positions.</p><p><a href="political-compass.html#'+encodeURIComponent(id)+'">Locate this belief in the cube →</a></p>'}else{document.title=re[0]+' — Religious Worldview';document.getElementById('app').innerHTML='<p class="pill">Religious tradition / worldview</p><h1>'+esc(re[0].replaceAll('-',' '))+'</h1><p>'+esc(re[1])+'</p><h2>Worldview space</h2><p class="note">Religious traditions are not assigned political left/right coordinates. The religious cube compares dimensions such as communal versus individual orientation, institutional/ritual versus experiential emphasis, and immanent versus transcendent orientation. These are analytical lenses, not judgments about believers.</p><p><a href="political-compass.html#'+encodeURIComponent(id)+'">Locate this tradition in the belief space →</a></p>')}}load();</script></body></html>
