<!doctype html>
<html lang="en" data-theme="spudlight">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text to Speech Reader — The Potato of Life</title>
<meta name="description" content="Compact text-to-speech reader with voice selection, volume, speed, spoken-word highlighting and layered themes.">
<link rel="canonical" href="https://thepotatooflife.github.io/TimDooley/tools/tts/">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:14px system-ui;background:var(--page);color:var(--text)}
:root{--page:radial-gradient(circle at 15% 0,#4a3315 0,transparent 36%),linear-gradient(140deg,#050606,#15130c 55%,#070706);--bar:linear-gradient(180deg,#302817dd,#15140fee);--panel:linear-gradient(180deg,#16150f,#0b0c0a);--control:linear-gradient(180deg,#332c1d,#171712);--control2:#40351f;--text:#f6f1e4;--muted:#aaa28e;--accent:#e7c15f;--line:#ffffff26;--focus:#e7c15f35;--focusline:#ffd97f;--shadow:#0008}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 70% 20%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 30%),linear-gradient(115deg,transparent 25%,#fff1 29%,transparent 34%);animation:drift 24s ease-in-out infinite alternate}@keyframes drift{to{transform:translate3d(4%,2%,0)}}
#app{height:100%;display:grid;grid-template-rows:40px 1fr;position:relative}.bar{display:flex;align-items:center;gap:5px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--bar);box-shadow:0 8px 30px var(--shadow);z-index:10}.btn,.pick{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--control);color:var(--text);box-shadow:inset 0 1px #fff1,0 2px 8px #0003;cursor:pointer}.btn{width:32px;padding:0}.btn:hover,.pick:hover{background:var(--control2)}.btn:disabled{opacity:.35;cursor:default}.pick{padding:0 9px;min-width:72px;max-width:280px;display:flex;gap:7px;align-items:center;white-space:nowrap}.pick .lab{overflow:hidden;text-overflow:ellipsis}.caret{opacity:.6}.sep{width:1px;height:22px;background:var(--line)}#voiceWrap{min-width:180px;flex:1;max-width:360px}.vol{display:flex;align-items:center;gap:3px;height:30px;padding-right:6px;border:1px solid var(--line);border-radius:8px;background:var(--control)}#vol{width:76px;accent-color:var(--accent)}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}.dot[data-s=reading]{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.reader{position:relative;overflow:hidden;background:var(--panel)}textarea{position:absolute;z-index:3;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;padding:28px clamp(24px,4vw,64px) 44px;background:transparent;color:var(--text);caret-color:var(--accent);font:20px/1.68 Georgia,serif}textarea::selection{background:color-mix(in srgb,var(--accent) 25%,transparent)}#mirror{position:absolute;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;font:20px/1.68 Georgia,serif;padding:28px clamp(24px,4vw,64px) 44px}#focus{position:absolute;z-index:2;pointer-events:none;opacity:0;border:1px solid var(--focusline);background:var(--focus);border-radius:5px;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 25%,transparent);transition:transform .1s ease,width .1s ease,height .1s ease,opacity .08s ease}#focus.on{opacity:1}.progress{position:absolute;z-index:6;bottom:0;left:0;right:0;height:2px}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--accent),#fff);box-shadow:0 0 8px var(--accent)}
.menu{position:fixed;z-index:99;top:39px;max-height:min(360px,calc(100vh - 50px));overflow:auto;border:1px solid var(--line);border-radius:10px;padding:5px;background:var(--bar);box-shadow:0 16px 50px #0009;min-width:150px}.menu[hidden]{display:none}.opt{width:100%;border:0;border-radius:7px;padding:8px 9px;text-align:left;background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px}.opt:hover,.opt.sel{background:color-mix(in srgb,var(--accent) 17%,transparent)}.sw{width:28px;height:14px;border-radius:99px;border:1px solid #fff3}.more{right:7px;width:280px}.more label{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;padding:6px}.more input[type=range]{width:100%;accent-color:var(--accent)}
@media(max-width:760px){#voiceWrap{min-width:120px}.bar{gap:3px}.pick{min-width:58px;padding:0 7px}#vol{width:54px}textarea,#mirror{font-size:18px;padding-left:18px;padding-right:18px}}@media(prefers-reduced-motion:reduce){body:before{animation:none}#focus{transition:none}}
</style>
</head><body><main id="app">
<div class="bar" role="toolbar"><button id="play" class="btn" aria-label="Play">▶</button><button id="pause" class="btn" aria-label="Pause" disabled>Ⅱ</button><button id="stop" class="btn" aria-label="Stop" disabled>■</button><span class="sep"></span>
<div class="pw"><select id="scope" hidden><option value="all">All text</option><option value="selection">Selection</option><option value="cursor">From cursor</option></select><button class="pick" data-pick="scope"><span class="lab">All text</span><span class="caret">⌄</span></button></div>
<div class="pw" id="voiceWrap"><select id="voice" hidden><option>Loading voices…</option></select><button class="pick" data-pick="voice"><span class="lab">Loading voices…</span><span class="caret">⌄</span></button></div>
<div class="vol"><button id="mute" class="btn" aria-label="Mute">🔊</button><input id="vol" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume"></div>
<div class="pw"><select id="speed" hidden><option value=".75">0.75×</option><option value=".9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2.0×</option></select><button class="pick" data-pick="speed"><span class="lab">1.0×</span><span class="caret">⌄</span></button></div>
<div class="pw"><select id="style" hidden><option value="focus">Focus</option><option value="glow">Glow</option><option value="underline">Underline</option><option value="band">Band</option><option value="off">Off</option></select><button class="pick" data-pick="style"><span class="lab">Focus</span><span class="caret">⌄</span></button></div>
<div class="pw"><select id="theme" hidden></select><button class="pick" data-pick="theme"><span class="lab">Theme</span><span class="caret">⌄</span></button></div><span id="dot" class="dot"></span><button id="more" class="btn">⋯</button></div>
<section class="reader" id="frame"><div id="mirror"></div><div id="focus"></div><textarea id="text" spellcheck="true" placeholder="Paste or type text here…"></textarea><div class="progress"><i id="prog"></i></div></section></main>
<div id="pickMenu" class="menu" hidden></div><div id="moreMenu" class="menu more" hidden><label>Text size <input id="font" type="range" min="14" max="32" value="20"></label><label>Auto-follow <input id="follow" type="checkbox" checked></label><label>Remember <input id="draft" type="checkbox" checked></label><button id="copy" class="opt">Copy text</button><button id="clear" class="opt">Clear text</button></div>
<script src="../../app/tts-reader.js?v=20260915"></script>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),text=$('text'),frame=$('frame'),mirror=$('mirror'),focus=$('focus'),prog=$('prog'),voice=$('voice'),scope=$('scope'),speed=$('speed'),style=$('style'),theme=$('theme'),vol=$('vol'),dot=$('dot'),menu=$('pickMenu'),moreMenu=$('moreMenu');
const KEY='potato-tts-settings',DRAFT='potato-tts-draft';const themes={spudlight:['#e7c15f','#f6f1e4','radial-gradient(circle at 15% 0,#4a3315,transparent 36%),linear-gradient(140deg,#050606,#15130c 55%,#070706)','#16150f'],northstar:['#69d3ff','#eff9ff','radial-gradient(circle at 18% 0,#103e75,transparent 38%),linear-gradient(145deg,#020712,#071b2d,#02070c)','#071725'],aurora:['#6ff0cf','#effffb','radial-gradient(circle at 5% 0,#0f6653,transparent 38%),radial-gradient(circle at 95% 100%,#583080,transparent 38%),linear-gradient(145deg,#04110e,#0e0d18)','#081715'],solar:['#ffc45f','#fff3d5','radial-gradient(circle at 30% -10%,#7a3308,transparent 42%),linear-gradient(145deg,#090706,#1b0d04)','#160d07'],moss:['#9ab875','#eef5df','radial-gradient(circle at 20% 0,#344b25,transparent 42%),linear-gradient(145deg,#050805,#11180d)','#0d140b'],ember:['#ef7040','#fff0e7','radial-gradient(circle at 20% 0,#6c1710,transparent 42%),linear-gradient(145deg,#090403,#1b0806)','#160705'],royal:['#a585ff','#f4efff','radial-gradient(circle at 15% 0,#3e216d,transparent 42%),linear-gradient(145deg,#07050d,#160e26)','#110b1d'],ice:['#4f91bc','#17232d','radial-gradient(circle at 20% 0,#fff,transparent 36%),linear-gradient(145deg,#dfeaf0,#afc2cf)','#c8d8e2'],parchment:['#9b6b31','#2a2115','radial-gradient(circle at 20% 0,#fff8df,transparent 40%),linear-gradient(145deg,#eadab2,#c29d68)','#ddc796'],terminal:['#73ff92','#d6ffdf','radial-gradient(circle at 20% 0,#103c1c,transparent 38%),linear-gradient(145deg,#010302,#061108)','#041008']};
for(const k of Object.keys(themes))theme.add(new Option(k[0].toUpperCase()+k.slice(1),k));let voices=[],active={text:'',base:0},word=null,lastVol=1,restart=0,open=null;const saved=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}},save=()=>localStorage.setItem(KEY,JSON.stringify({...saved(),voice:PotatoTTS.voiceIdentity(currentVoice()),speed:speed.value,style:style.value,theme:theme.value,vol:+vol.value,volume:+vol.value,font:+$('font').value,follow:$('follow').checked,followReading:$('follow').checked,draft:$('draft').checked}));
function applyTheme(k){const t=themes[k]||themes.spudlight;document.documentElement.style.setProperty('--accent',t[0]);document.documentElement.style.setProperty('--text',t[1]);document.documentElement.style.setProperty('--page',t[2]);document.documentElement.style.setProperty('--panel',`linear-gradient(180deg,${t[3]},color-mix(in srgb,${t[3]} 70%,#000))`);save()}function currentVoice(){return voices[+voice.value]||voices.find(v=>v.default)||voices[0]||null}function sync(sel){const b=document.querySelector(`[data-pick="${sel.id}"] .lab`),o=sel.options[sel.selectedIndex];if(b)b.textContent=o?.textContent||'Choose'}function refresh(){voices=[...speechSynthesis.getVoices()].sort((a,b)=>(a.lang||'').localeCompare(b.lang||''));const pick=PotatoTTS.chooseVoice(voices,saved().voice);voice.replaceChildren();voices.forEach((v,i)=>voice.add(new Option(`${v.name} · ${v.lang}`,i)));voice.value=String(Math.max(0,voices.indexOf(pick)));sync(voice)}
const engine=new PotatoTTS.TTSEngine({synth:speechSynthesis,Utterance:SpeechSynthesisUtterance,onEvent:e=>{prog.style.width=`${(e.progress*100)||0}%`;dot.dataset.s=e.state==='speaking'?'reading':'';if(e.type==='boundary'&&e.absoluteWord){word={start:active.base+e.absoluteWord.start,end:active.base+e.absoluteWord.end};showWord(word)}if(['complete','stop','error'].includes(e.type))setTimeout(()=>focus.classList.remove('on'),120);buttons()}});
function audio(){return{voice:currentVoice(),rate:+speed.value,volume:+vol.value,autoRecover:true,maxChars:180}}function range(){const v=text.value;if(scope.value==='selection'&&text.selectionStart!==text.selectionEnd)return{text:v.slice(text.selectionStart,text.selectionEnd),base:text.selectionStart};if(scope.value==='cursor')return{text:v.slice(text.selectionStart),base:text.selectionStart};return{text:v,base:0}}function play(at=0){active=range();if(!active.text.trim())return;engine.start(active.text,{...audio(),startAt:at});buttons()}function buttons(){$('pause').disabled=!['speaking','paused'].includes(engine.state);$('stop').disabled=engine.state==='idle';$('pause').textContent=engine.state==='paused'?'▶':'Ⅱ'}
function restartLive(){if(engine.state!=='speaking')return;clearTimeout(restart);restart=setTimeout(()=>{const at=Math.max(0,(word?.start??active.base)-active.base);engine.start(active.text,{...audio(),startAt:at})},90)}function measure(r){mirror.innerHTML='';const a=document.createTextNode(text.value.slice(0,r.start)),m=document.createElement('span');m.textContent=text.value.slice(r.start,r.end)||' ';mirror.append(a,m,document.createTextNode(text.value.slice(r.end)||'\u200b'));const cs=getComputedStyle(text);mirror.style.width=`${text.clientWidth}px`;mirror.style.padding=cs.padding;mirror.style.font=cs.font;mirror.style.lineHeight=cs.lineHeight;mirror.style.transform=`translateY(${-text.scrollTop}px)`;const q=m.getBoundingClientRect(),f=frame.getBoundingClientRect();return{x:q.left-f.left,y:q.top-f.top,w:q.width,h:q.height}}function showWord(r){if(style.value==='off')return focus.classList.remove('on');const m=measure(r);let x=m.x-2,y=m.y+m.h*.12,w=m.w+4,h=m.h*.78;if(style.value==='underline'){y=m.y+m.h-3;h=2}else if(style.value==='band'){x=18;w=frame.clientWidth-36}focus.style.transform=`translate3d(${x}px,${y}px,0)`;focus.style.width=`${w}px`;focus.style.height=`${h}px`;focus.classList.add('on');if($('follow').checked&&(m.y<text.clientHeight*.2||m.y>text.clientHeight*.78))text.scrollTo({top:Math.max(0,text.scrollTop+m.y-text.clientHeight*.42),behavior:'auto'})}
function openPicker(sel,btn){open=sel;menu.replaceChildren();[...sel.options].forEach((o,i)=>{const b=document.createElement('button');b.className='opt'+(sel.value===o.value?' sel':'');if(sel===theme){const s=document.createElement('span');s.className='sw';const t=themes[o.value];s.style.background=`linear-gradient(120deg,${t[3]},${t[0]})`;b.append(s)}b.append(document.createTextNode(o.textContent));b.onclick=()=>{sel.value=o.value;sync(sel);menu.hidden=true;open=null;sel.dispatchEvent(new Event('change'))};menu.append(b)});const r=btn.getBoundingClientRect();menu.style.left=`${Math.min(r.left,innerWidth-300)}px`;menu.style.width=`${Math.max(160,Math.min(sel===voice?380:220,innerWidth-12))}px`;menu.hidden=false}
document.querySelectorAll('[data-pick]').forEach(b=>{b.onclick=e=>{e.stopPropagation();moreMenu.hidden=true;const sel=$(b.dataset.pick);openPicker(sel,b)}});document.onclick=()=>{menu.hidden=true;moreMenu.hidden=true;open=null};menu.onclick=e=>e.stopPropagation();moreMenu.onclick=e=>e.stopPropagation();$('more').onclick=e=>{e.stopPropagation();menu.hidden=true;moreMenu.hidden=!moreMenu.hidden};
$('play').onclick=()=>engine.state==='paused'?engine.resume():play();$('pause').onclick=()=>engine.state==='speaking'?engine.pause():engine.resume();$('stop').onclick=()=>engine.stop();voice.onchange=()=>{save();restartLive()};speed.onchange=()=>{save();restartLive()};vol.oninput=()=>{if(+vol.value>0)lastVol=+vol.value;$('mute').textContent=+vol.value===0?'🔇':+vol.value<.5?'🔉':'🔊';engine.updateOptions({volume:+vol.value});save();restartLive()};$('mute').onclick=()=>{vol.value=+vol.value?0:lastVol;vol.dispatchEvent(new Event('input'))};style.onchange=()=>{save();if(style.value==='off')focus.classList.remove('on');else if(word)showWord(word)};theme.onchange=()=>applyTheme(theme.value);$('font').oninput=()=>{text.style.fontSize=mirror.style.fontSize=`${$('font').value}px`;save();if(word)showWord(word)};$('follow').onchange=()=>{save();if($('follow').checked&&word)showWord(word)};$('draft').onchange=()=>save();$('copy').onclick=()=>navigator.clipboard?.writeText(text.value);$('clear').onclick=()=>{engine.stop();text.value='';word=null;focus.classList.remove('on');localStorage.removeItem(DRAFT)};text.oninput=()=>{if(['speaking','paused'].includes(engine.state))engine.stop();word=null;focus.classList.remove('on');if($('draft').checked)localStorage.setItem(DRAFT,text.value)};text.onscroll=()=>word&&requestAnimationFrame(()=>showWord(word));window.onresize=()=>word&&requestAnimationFrame(()=>showWord(word));
const s=saved();speed.value=s.speed||'1';style.value=s.style||'focus';theme.value=s.theme||'spudlight';vol.value=Number.isFinite(+s.vol)?s.vol:Number.isFinite(+s.volume)?s.volume:1;$('font').value=s.font||20;$('follow').checked=(s.follow??s.followReading)!==false;$('draft').checked=s.draft!==false;if($('draft').checked)text.value=localStorage.getItem(DRAFT)||'';applyTheme(theme.value);[scope,speed,style,theme].forEach(sync);refresh();speechSynthesis.addEventListener?.('voiceschanged',refresh);[200,800].forEach(n=>setTimeout(refresh,n));buttons();
})();
</script></body></html>
