name: Verify TTS follow lazy integration

on:
  push:
    branches:
      - integration/tts-follow-lazy-2026-09-17

jobs:
  tts-follow-lazy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run combined TTS contract
        run: node scripts/test_tts_follow_lazy_integration.mjs
      - name: Run existing drawer contract
        run: node scripts/test_tts_drawer.mjs
      - name: Run Great Book lazy TTS contract
        run: node scripts/test_great_book_tts_autoload.mjs
