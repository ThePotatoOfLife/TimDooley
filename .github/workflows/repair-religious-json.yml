name: One-time religious JSON normalization

on:
  push:
    branches: [project-repair-2026-09-07]

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'normalize religious JSON') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize legacy JSON formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [
              Path('data/religious-foundations/enriched-records.json'),
              Path('data/religious-foundations/minor-traditions.json'),
          ]
          slash_n = chr(92) + 'n'
          for path in targets:
              raw = path.read_text(encoding='utf-8')
              count = raw.count(slash_n)
              print(f'{path}: literal backslash-n separators={count}')
              fixed = raw.replace(slash_n, '\n')
              if fixed != raw:
                  path.write_text(fixed, encoding='utf-8')
                  print(f'normalized {path}')
          PY
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git add data/religious-foundations/enriched-records.json data/religious-foundations/minor-traditions.json
          git commit -m "fix: normalize religious JSON"
          git push
