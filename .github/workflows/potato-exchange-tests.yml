name: Potato Exchange regression tests
on:
  push:
    paths:
      - 'games/potato-exchange/**'
      - 'tests/potato-exchange.test.cjs'
      - '.github/workflows/potato-exchange-tests.yml'
  pull_request:
    paths:
      - 'games/potato-exchange/**'
      - 'tests/potato-exchange.test.cjs'
      - '.github/workflows/potato-exchange-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check games/potato-exchange/engine.js
          node --check tests/potato-exchange.test.cjs
      - name: Run paper trading regression tests
        run: node --test tests/potato-exchange.test.cjs
