name: Maintain canonical country library

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/countries/index.json'
      - 'data/countries-blueprint.json'
      - 'data/countries/**'
      - 'data/country-*-index.json'
      - 'data/country-layer-manifest.json'
      - 'scripts/instantiate_country_nodes.py'
      - 'scripts/consolidate_country_library.py'
      - '.github/workflows/instantiate-country-nodes.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instantiate missing country nodes
        run: python scripts/instantiate_country_nodes.py

      - name: Consolidate sourced country records and remove generated clutter
        run: python scripts/consolidate_country_library.py

      - name: Commit canonical country library
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/countries data/country-layer-manifest.json data/country-enrichment-index.json
          if git diff --cached --quiet; then
            echo 'Country library already canonical.'
          else
            git commit -m 'Consolidate canonical country library'
            git push
          fi
