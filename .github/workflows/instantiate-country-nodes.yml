name: Instantiate country nodes

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/countries/index.json'
      - 'data/countries-blueprint.json'
      - 'data/blueprints/country-deepening.json'
      - 'scripts/instantiate_country_nodes.py'
      - 'scripts/merge_country_deepening.py'
      - '.github/workflows/instantiate-country-nodes.yml'

permissions:
  contents: write

jobs:
  instantiate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instantiate all country nodes
        run: python scripts/instantiate_country_nodes.py

      - name: Apply universal country deepening overlay
        run: python scripts/merge_country_deepening.py

      - name: Commit generated nodes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/countries
          if git diff --cached --quiet; then
            echo 'No country-node changes.'
          else
            git commit -m 'Deepen canonical country nodes'
            git push
          fi
