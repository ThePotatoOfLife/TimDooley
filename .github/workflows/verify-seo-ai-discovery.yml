name: Verify SEO AI discovery

on:
  push:
    branches:
      - feature/seo-ai-discovery-20260917

jobs:
  seo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run focused SEO and discovery validators
        run: |
          python scripts/validate_seo_2026_contract.py
          python scripts/validate_seo_pipeline.py
          python scripts/validate_discovery_projection.py
