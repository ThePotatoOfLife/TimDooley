name: Spatial overlay checks

on:
  push:
    branches: [feat/sacred-covenant-map-overlays]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-spatial-overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate spatial overlay contract
        run: python scripts/validate_world_map_spatial_overlays.py

      - name: Validate spatial overlay JavaScript syntax
        run: |
          node --check world-map/3d-spatial-overlays.js
          node --check world-map/3d-spatial-overlay-ui.js
          node --check world-map/3d-bootstrap.js

      - name: Run canonical World Map shell checks
        run: |
          python scripts/validate_world_map_source.py
          python scripts/validate_world_map_ui_shell.py
