name: Publish latest main to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'TODO.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Keep only the newest source revision. Rapid edits should collapse to one publish.
concurrency:
  group: pages-latest-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build source registries
        run: |
          python scripts/build_canonical_record_registry.py
          python scripts/build_repository_index.py
          python scripts/audit_source_of_truth.py

      - name: Build public site
        run: python scripts/build_site.py

      - name: Remove internal archive
        run: rm -rf _site/archive && test ! -e _site/archive

      - name: Build Bible comparator
        run: |
          python scripts/build_bible_study.py
          python scripts/check_bible_static_dynamic_parity.py
          python scripts/build_bible_comparator_quality.py
          python scripts/audit_bible_tim_side_quality.py

      - name: Build Science Research Papers
        run: |
          python scripts/build_science_catalog.py
          python scripts/validate_science_portal.py

      - name: Build discovery and ontology layers
        run: |
          python scripts/build_discovery.py
          python scripts/patch_home_discovery.py
          python scripts/patch_public_ontology.py
          python scripts/enrich_weak_descriptions.py

      - name: Optimize SEO
        run: |
          python scripts/optimize_seo.py
          python scripts/finalize_public_home.py

      - name: Project shared navigation and TTS
        run: |
          python scripts/patch_public_navigation.py
          python scripts/validate_public_navigation.py
          python scripts/validate_site_shell.py
          python scripts/validate_tts_coverage.py

      - name: Assert Research Papers entry and reader
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/science/index.html
          test -f _site/science/papers/index.html
          test -f _site/science/papers/advanced-retarded-door-handshake-recovery/index.html
          test -f _site/science/science-papers.css
          test -f _site/science/science-paper.css
          test -f _site/science/science-papers.js
          grep -q "Research Papers" _site/science/index.html
          grep -q "RESEARCH PAPERS" _site/science/papers/index.html
          grep -q 'class="page-nav' _site/science/papers/index.html
          grep -q 'class="paper-page"' _site/science/papers/advanced-retarded-door-handshake-recovery/index.html
          grep -q "science-time-door-handshake.svg" _site/science/papers/advanced-retarded-door-handshake-recovery/index.html

      - name: Assert Garden is in the public artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/garden/index.html
          test -f _site/app/garden-page.css
          test -f _site/app/garden-page.js
          test -f _site/assets/visuals/garden-eden-master.webp
          test -s _site/assets/visuals/garden-eden-master.webp
          grep -q 'data-site-floor="heaven"' _site/garden/index.html
          grep -q 'data-garden-world' _site/garden/index.html
          grep -q 'data-garden-zone="life"' _site/garden/index.html
          grep -q 'data-garden-zone="knowledge"' _site/garden/index.html
          grep -q 'data-garden-zone="gate"' _site/garden/index.html
          grep -q 'data-garden-dialogue' _site/garden/index.html
          grep -q 'Tree of Life' _site/garden/index.html
          grep -q 'Garden / Eden' _site/elevator/index.html
          grep -q 'href="garden/"' _site/index.html

      - name: Stamp direct Pages provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              "schema_version":"1.0.0",
              "source_sha":os.environ["GITHUB_SHA"],
              "quality_run_id":os.environ["GITHUB_RUN_ID"],
              "quality_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "repository":os.environ["GITHUB_REPOSITORY"],
              "artifact":"validated-pages-site",
              "publisher":"latest-main-direct",
          }
          Path("_site/build-provenance.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Deploy in the same runner job. This avoids a second GitHub-hosted
      # runner assignment, which is especially important during Actions delays.
      - name: Deploy current main
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live Garden and provenance
        shell: bash
        env:
          LIVE_BASE: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${LIVE_BASE%/}/"
          mkdir -p .live-smoke

          fetch_live() {
            local url="$1"
            local out="$2"
            python - "$url" "$out" <<'PY'
          import pathlib, sys, time, urllib.request
          url, out = sys.argv[1], pathlib.Path(sys.argv[2])
          last = None
          for attempt in range(1, 13):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"TimDooley-Garden-Smoke/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      if response.status != 200:
                          raise RuntimeError(f"HTTP {response.status}")
                      payload=response.read()
                  if not payload:
                      raise RuntimeError("empty response")
                  out.write_bytes(payload)
                  raise SystemExit(0)
              except Exception as exc:
                  last=exc
                  print(f"Attempt {attempt} failed for {url}: {exc}")
                  if attempt < 12:
                      time.sleep(5)
          raise SystemExit(f"Live Pages did not become healthy: {url}: {last}")
          PY
          }

          fetch_live "${base}build-provenance.json" ".live-smoke/build-provenance.json"
          fetch_live "${base}garden/" ".live-smoke/garden.html"
          fetch_live "${base}elevator/?level=heaven" ".live-smoke/elevator.html"
          fetch_live "${base}app/garden-page.js" ".live-smoke/garden-page.js"
          fetch_live "${base}app/garden-page.css" ".live-smoke/garden-page.css"
          fetch_live "${base}assets/visuals/garden-eden-master.webp" ".live-smoke/garden-eden-master.webp"

          python - <<'PY'
          import json, os
          from pathlib import Path
          expected=os.environ["EXPECTED_SHA"]
          provenance=json.loads(Path(".live-smoke/build-provenance.json").read_text(encoding="utf-8"))
          assert provenance.get("source_sha")==expected, (provenance.get("source_sha"),expected)
          assert provenance.get("publisher")=="latest-main-direct", provenance

          garden=Path(".live-smoke/garden.html").read_text(encoding="utf-8",errors="replace")
          elevator=Path(".live-smoke/elevator.html").read_text(encoding="utf-8",errors="replace")
          js=Path(".live-smoke/garden-page.js").read_text(encoding="utf-8",errors="replace")
          css=Path(".live-smoke/garden-page.css").read_text(encoding="utf-8",errors="replace")
          art=Path(".live-smoke/garden-eden-master.webp").read_bytes()

          for marker in (
              'data-site-floor="heaven"',
              'data-garden-world',
              'data-garden-zone="life"',
              'data-garden-zone="knowledge"',
              'data-garden-zone="gate"',
              'data-garden-dialogue',
              'garden-character-tim',
              'Tree of Life',
          ):
              assert marker in garden, f"live Garden missing {marker}"
          assert "Garden / Eden" in elevator, "live Heaven elevator missing Garden feature"
          assert "[data-garden-zone]" in js and "data-dialogue-line" in js, "live Garden RPG dialogue runtime incomplete"
          assert ".garden-world-canvas" in css and ".garden-dialogue" in css and ".garden-character-tim" in css, "live Garden RPG styling incomplete"
          assert len(art) > 40000 and art[:4] == b"RIFF" and b"WEBP" in art[:16], "live Garden master artwork missing or invalid"
          print("Live Garden verified at", expected)
          PY
