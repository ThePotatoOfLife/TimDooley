name: SEO authority verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate source authority contract
        run: python scripts/validate_seo_authority.py

      - name: Build Pages artifact
        run: python scripts/build_site.py

      - name: Build machine discovery layer
        run: python scripts/build_discovery.py

      - name: Enrich weak page descriptions
        run: python scripts/enrich_weak_descriptions.py

      - name: Optimize crawl and sitemap SEO
        run: python scripts/optimize_seo.py

      - name: Build and audit final authority discovery
        run: python scripts/build_site_authority.py

      - name: Verify final authority artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/site-authority.json
          grep -q 'site-authority.json' _site/llms.txt
          grep -q 'site-authority.json' _site/index.html
          grep -q 'site-authority.json' _site/tim-dooley/index.html
          python - <<'PY'
          import json
          from pathlib import Path

          authority = json.loads(Path('_site/site-authority.json').read_text(encoding='utf-8'))
          assert authority['project']['official_site'] == 'https://thepotatooflife.github.io/TimDooley/'
          assert authority['project']['official_repository'] == 'https://github.com/ThePotatoOfLife/TimDooley'
          assert authority['primary_subject']['canonical_url'] == 'https://thepotatooflife.github.io/TimDooley/tim-dooley/'
          assert set(authority['primary_routes']) == {'tim', 'religion', 'philosophy', 'science', 'world'}
          print('Verified final first-party authority manifest')
          PY
