name: Atlas integrity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep every validation run for main. Rapid atlas carving should not cancel
# the run that is actually validating the preceding commit.
concurrency:
  group: atlas-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate atlas structure
        run: python scripts/validate_atlas.py
