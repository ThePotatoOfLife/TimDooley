name: Atlas integrity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: atlas-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build canonical record registry
        run: python scripts/build_canonical_record_registry.py
      - name: Build repository index
        run: python scripts/build_repository_index.py
      - name: Audit source-of-truth and routes
        run: python scripts/audit_source_of_truth.py
      - name: Validate blueprint contract
        run: python scripts/validate_blueprints.py
      - name: Run whole-project stability audit
        run: python scripts/stability_audit.py
      - name: Validate atlas structure
        run: python scripts/validate_atlas.py
      - name: Validate repository spine
        run: python scripts/validate_repository_spine.py
      - name: Validate architecture layers
        run: python scripts/validate_architecture_layers.py
      - name: Validate content integrity
        run: python scripts/validate_content_integrity.py
      - name: Validate religious-adjacent layer
        run: python scripts/validate_religious_adjacent.py
      - name: Validate religious layer coupling map
        run: python scripts/validate_religious_layer_map.py
      - name: Validate Potatoism layer
        run: python scripts/validate_potatoism.py
      - name: Audit backend ownership, duplicates and graph orphans
        run: python scripts/audit_backend_coverage.py
      - name: Audit Atlas links and record coverage
        run: python scripts/audit_atlas_links.py
      - name: Audit web layer
        run: python scripts/audit_web.py
      - name: Build static site
        run: python scripts/build_site.py
      - name: Compile complete science catalog
        run: python scripts/build_science_catalog.py
      - name: Build search discovery layer
        run: python scripts/build_discovery.py
      - name: Expose discovery entry points
        run: python scripts/patch_home_discovery.py
      - name: Apply public ontology patch
        run: python scripts/patch_public_ontology.py
      - name: Optimize and audit SEO
        id: seo
        continue-on-error: true
        run: python scripts/optimize_seo.py
      - name: Capture exact SEO failures
        if: steps.seo.outcome == 'failure'
        run: |
          python - <<'PY'
          import html
          import re
          from pathlib import Path
          BASE='https://thepotatooflife.github.io/TimDooley/'
          attr=re.compile(r'([:\w-]+)\s*=\s*(["\'])(.*?)\2',re.I|re.S)
          meta=re.compile(r'<meta\b[^>]*>',re.I)
          link=re.compile(r'<link\b[^>]*>',re.I)
          title_re=re.compile(r'<title\b[^>]*>(.*?)</title>',re.I|re.S)
          tag=re.compile(r'<[^>]+>')
          def attrs(s): return {m.group(1).lower():html.unescape(m.group(3)).strip() for m in attr.finditer(s)}
          def get_meta(text,name):
              for m in meta.findall(text):
                  a=attrs(m)
                  if a.get('name','').lower()==name: return a.get('content','')
              return ''
          def canonical(text):
              for m in link.findall(text):
                  a=attrs(m)
                  if 'canonical' in a.get('rel','').lower().split(): return a.get('href','')
              return ''
          problems=[]
          for page in sorted(Path('_site').rglob('index.html')):
              text=page.read_text(encoding='utf-8',errors='replace')
              tm=title_re.search(text)
              title=' '.join(html.unescape(tag.sub(' ',tm.group(1))).split()) if tm else ''
              desc=get_meta(text,'description')
              canon=canonical(text)
              rel=page.relative_to('_site').as_posix()
              if len(title)<8: problems.append(f'{rel}: weak title ({title!r})')
              if len(desc)<40: problems.append(f'{rel}: weak description ({desc!r})')
              if not canon: problems.append(f'{rel}: missing canonical')
              elif not canon.startswith(BASE): problems.append(f'{rel}: canonical outside site ({canon})')
          Path('_site/seo-diagnostics.txt').write_text('\n'.join(problems)+'\n',encoding='utf-8')
          for p in problems: print('SEO DIAGNOSTIC:',p)
          PY
      - name: Upload SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: |
            _site/seo-report.json
            _site/seo-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail on SEO audit errors
        if: steps.seo.outcome == 'failure'
        run: exit 1
      - name: Validate built site shell
        run: python scripts/validate_site_shell.py
      - name: Verify SEO report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('_site/seo-report.json').read_text(encoding='utf-8'))
          assert report['errors'] == 0, report
          assert report['pages_with_open_graph'] == report['pages'], report
          assert report['pages_with_structured_data'] == report['pages'], report
          print(json.dumps(report, indent=2))
          PY
