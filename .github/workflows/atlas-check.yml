name: Atlas integrity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: atlas-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build canonical record registry
        run: python scripts/build_canonical_record_registry.py
      - name: Build repository index
        run: python scripts/build_repository_index.py
      - name: Audit source-of-truth and routes
        run: python scripts/audit_source_of_truth.py
      - name: Validate blueprint contract
        run: python scripts/validate_blueprints.py
      - name: Run whole-project stability audit
        run: python scripts/stability_audit.py
      - name: Validate atlas structure
        run: python scripts/validate_atlas.py
      - name: Validate repository spine
        run: python scripts/validate_repository_spine.py
      - name: Validate architecture layers
        run: python scripts/validate_architecture_layers.py
      - name: Validate content integrity
        run: python scripts/validate_content_integrity.py
      - name: Validate religious-adjacent layer
        run: python scripts/validate_religious_adjacent.py
      - name: Validate religious layer coupling map
        run: python scripts/validate_religious_layer_map.py
      - name: Validate Potatoism layer
        run: python scripts/validate_potatoism.py
      - name: Audit backend ownership, duplicates and graph orphans
        run: python scripts/audit_backend_coverage.py
      - name: Audit Atlas links and record coverage
        run: python scripts/audit_atlas_links.py
      - name: Audit web layer
        run: python scripts/audit_web.py
      - name: Validate science source syntax and contrast rules
        run: |
          python -m json.tool knowledge/science/science-model-registry.json >/dev/null
          node --check science/science.js
          ! grep -Eq 'Canvas(Text)?' science/science.css
          ! grep -q 'science-hub.css' science/index.html
          ! grep -Eq 'href="\./(catalog|research-map|quantum|axis-11d-sun-spiral|celestial-particles|spudlight|vibe-gates)/' science/index.html
      - name: Build static site
        run: python scripts/build_site.py
      - name: Compile /science/ page
        run: python scripts/build_science_catalog.py
      - name: Verify science model and record layers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('knowledge/science/science-model-registry.json').read_text(encoding='utf-8'))
          source = sorted((Path('knowledge') / 'science').glob('*.json'))
          catalog = json.loads(Path('_site/science/catalog.json').read_text(encoding='utf-8'))
          page = Path('_site/science/index.html').read_text(encoding='utf-8')
          assert len(registry.get('models', [])) >= 10
          assert catalog['count'] == len(source)
          assert page.count('class="catalog-card"') == len(source)
          assert 'id="model-list"' in page
          assert 'id="model-view"' in page
          assert '<h1>Science</h1>' in page
          assert 'SCIENCE ATLAS' not in page.upper()
          assert not (Path('_site') / 'science' / 'catalog' / 'index.html').exists()
          print(f"/science/: {len(registry['models'])} developed models, {len(source)} source records")
          PY
      - name: Validate built site shell
        run: python scripts/validate_site_shell.py
