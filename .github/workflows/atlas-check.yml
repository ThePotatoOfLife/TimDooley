name: Atlas integrity check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: atlas-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build canonical record registry
        run: python scripts/build_canonical_record_registry.py
      - name: Build repository index
        run: python scripts/build_repository_index.py
      - name: Audit source-of-truth and routes
        run: python scripts/audit_source_of_truth.py
      - name: Validate blueprint contract
        run: python scripts/validate_blueprints.py
      - name: Run whole-project stability audit
        run: python scripts/stability_audit.py
      - name: Validate atlas structure
        run: python scripts/validate_atlas.py
      - name: Validate Atlas projection and time contracts
        run: python scripts/validate_atlas_view_contracts.py
      - name: Validate Atlas mathematical calibration
        run: python scripts/validate_atlas_math_calibration.py
      - name: Validate 3D world atlas runtime
        run: python scripts/validate_world_map_3d.py
      - name: Validate 3D relationship path finder
        run: python scripts/validate_world_map_pathfinder.py
      - name: Validate entity-aware Trace
        run: python scripts/validate_world_map_entity_trace.py
      - name: Validate repository spine
        run: python scripts/validate_repository_spine.py
      - name: Validate architecture layers
        run: python scripts/validate_architecture_layers.py
      - name: Validate content integrity
        run: python scripts/validate_content_integrity.py
      - name: Validate religious-adjacent layer
        run: python scripts/validate_religious_adjacent.py
      - name: Validate religious layer coupling map
        run: python scripts/validate_religious_layer_map.py
      - name: Validate Potatoism layer
        run: python scripts/validate_potatoism.py
      - name: Audit backend ownership, duplicates and graph orphans
        run: python scripts/audit_backend_coverage.py
      - name: Audit Atlas links and record coverage
        run: python scripts/audit_atlas_links.py
      - name: Audit web layer
        id: audit_web
        continue-on-error: true
        run: python scripts/audit_web.py
      - name: Upload web audit diagnostics
        if: ${{ always() && hashFiles('audit-web-report.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-audit-report
          path: audit-web-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce web audit gate
        if: steps.audit_web.outcome == 'failure'
        run: exit 1

      # Mirror the public Pages build sequence before validating the built shell.
      - name: Build static site
        run: python scripts/build_site.py
      - name: Build population and religion snapshot
        env:
          ATLAS_DEMOGRAPHY_OUT: _site/data/world-country-demography.json
        run: python scripts/build_world_demography.py
      - name: Build D4 country observable snapshot
        env:
          ATLAS_D4_OUT: _site/data/world-country-observables.json
        run: python scripts/build_world_country_observables.py
      - name: Validate D4 observable runtime
        id: validate_d4
        continue-on-error: true
        run: python scripts/validate_world_country_observables.py
      - name: Show D4 observable diagnostics
        if: ${{ always() && hashFiles('world-country-observables-report.txt') != '' }}
        run: cat world-country-observables-report.txt
      - name: Upload D4 observable diagnostics
        if: ${{ always() && hashFiles('world-country-observables-report.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: d4-observable-report
          path: world-country-observables-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce D4 observable gate
        if: steps.validate_d4.outcome == 'failure'
        run: exit 1
      - name: Compile complete science catalog
        run: python scripts/build_science_catalog.py
      - name: Build search discovery layer
        run: python scripts/build_discovery.py
      - name: Expose discovery entry points
        run: python scripts/patch_home_discovery.py
      - name: Apply public ontology patch
        run: python scripts/patch_public_ontology.py
      - name: Validate built site shell
        run: python scripts/validate_site_shell.py
