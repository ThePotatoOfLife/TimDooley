name: Atlas foundation check

on:
  push:
    branches: [potato-atlas-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-atlas-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate Atlas constitution
        run: python scripts/validate_atlas_constitution.py
      - name: Validate Atlas node schema
        run: python scripts/validate_atlas_node_schema.py
      - name: Validate Atlas North spine
        run: python scripts/validate_atlas_north.py
      - name: Validate Atlas room views
        run: python scripts/validate_atlas_views.py
      - name: Validate Atlas relation grammar
        run: python scripts/validate_atlas_relation_types.py
      - name: Validate Atlas relation mappings
        run: python scripts/validate_atlas_relation_map.py
      - name: Validate Atlas artifacts
        run: python scripts/validate_atlas_artifacts.py
      - name: Validate Atlas deprecation ledger
        run: python scripts/validate_atlas_deprecations.py
      - name: Validate derived Atlas model
        run: python scripts/validate_atlas_model.py
      - name: Validate assembled Atlas runtime
        run: python scripts/validate_atlas_runtime.py
      - name: Build additive Atlas preview
        run: python scripts/build_atlas_pages.py
      - name: Validate Atlas page shell
        run: python scripts/validate_atlas_pages.py
      - name: Build composed public site
        run: python scripts/build_public_site.py
      - name: Validate public Atlas coexistence
        run: python scripts/validate_public_atlas_coexistence.py
      - name: Validate Atlas after full build
        run: python scripts/validate_atlas_pages.py
