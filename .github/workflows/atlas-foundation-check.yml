name: Atlas foundation check

on:
  push:
    branches: [potato-atlas-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-atlas-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate Atlas constitution
        run: python scripts/validate_atlas_constitution.py
      - name: Validate Atlas node schema
        run: python scripts/validate_atlas_node_schema.py
      - name: Validate Atlas North spine
        run: python scripts/validate_atlas_north.py
      - name: Validate Atlas registry builder
        run: python scripts/validate_atlas_registry_builder.py
      - name: Validate Atlas room views
        run: python scripts/validate_atlas_views.py
      - name: Validate Atlas view projection authority
        run: python scripts/validate_atlas_view_projection.py
      - name: Validate Atlas summit source
        run: python scripts/validate_atlas_summit.py
      - name: Validate Atlas relation grammar
        run: python scripts/validate_atlas_relation_types.py
      - name: Validate Atlas relation mappings
        run: python scripts/validate_atlas_relation_map.py
      - name: Validate Atlas artifacts
        run: python scripts/validate_atlas_artifacts.py
      - name: Validate Atlas deprecation ledger
        run: python scripts/validate_atlas_deprecations.py
      - name: Validate read-only public build contract
        run: python scripts/validate_public_build_readonly_contract.py
      - name: Validate Pages deployment contract
        run: python scripts/validate_pages_deploy_contract.py
      - name: Validate unified Bible mining loader
        run: |
          node --check app/bible-mining-loader.js
          python scripts/validate_bible_mining_loader.py
          python scripts/validate_bible_reader.py
      - name: Validate backend audit scope
        run: python scripts/validate_backend_audit_scope.py
      - name: Validate derived Atlas model
        run: python scripts/validate_atlas_model.py
      - name: Validate assembled Atlas runtime
        run: python scripts/validate_atlas_runtime.py
      - name: Validate Node and Artifact relation resolution
        run: python scripts/validate_atlas_relation_resolution.py
      - name: Validate Son canonical owner
        run: python scripts/validate_son_owner.py
      - name: Validate Tree of Life canonical owner
        run: python scripts/validate_tree_of_life_owner.py
      - name: Validate potato biology provenance
        run: python scripts/validate_potato_biology_sources.py
      - name: Report Atlas migration frontier
        run: python scripts/audit_atlas_frontier.py
      - name: Build additive Atlas preview
        run: python scripts/build_atlas_pages.py
      - name: Validate Atlas page shell
        run: python scripts/validate_atlas_pages.py
      - name: Validate public Atlas machine index
        run: python scripts/validate_atlas_public_index.py
      - name: Build composed public site
        run: python scripts/build_public_site.py
      - name: Validate public Atlas coexistence
        run: python scripts/validate_public_atlas_coexistence.py
      - name: Validate Atlas after full build
        run: python scripts/validate_atlas_pages.py
      - name: Validate public Atlas index after full build
        run: python scripts/validate_atlas_public_index.py
      - name: Audit backend consolidation frontier
        run: |
          python scripts/audit_backend_coverage.py
          python scripts/audit_atlas_swamp.py
      - name: Upload Atlas frontier diagnostics
        if: ${{ always() && hashFiles('atlas-frontier-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-frontier-report
          path: atlas-frontier-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload backend consolidation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-consolidation-report
          path: |
            data/backend-coverage-report.json
            atlas-swamp-report.json
          if-no-files-found: warn
          retention-days: 7
