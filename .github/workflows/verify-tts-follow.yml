name: Verify TTS follow

on:
  push:
    branches:
      - feature/tts-follow-reading

jobs:
  tts-follow-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run TTS drawer contract
        run: node scripts/test_tts_drawer.mjs
