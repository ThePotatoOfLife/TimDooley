name: World Map places and search

on:
  push:
    branches: [main]
    paths:
      - 'world-map/**'
      - 'data/world-cities.geo.json'
      - 'data/world-capitals.geo.json'
      - 'data/world-subdivisions/**'
      - 'data/countries/index.json'
      - 'scripts/build_world_cities.py'
      - 'scripts/test_world_cities_builder.py'
      - 'scripts/test_world_map_search.mjs'
      - 'scripts/validate_world_cities.py'
      - 'scripts/validate_world_map_places.py'
      - 'scripts/validate_world_map_search.py'
      - '.github/workflows/world-map-places-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'world-map/**'
      - 'data/world-cities.geo.json'
      - 'data/world-capitals.geo.json'
      - 'data/world-subdivisions/**'
      - 'data/countries/index.json'
      - 'scripts/build_world_cities.py'
      - 'scripts/test_world_cities_builder.py'
      - 'scripts/test_world_map_search.mjs'
      - 'scripts/validate_world_cities.py'
      - 'scripts/validate_world_map_places.py'
      - 'scripts/validate_world_map_search.py'
      - '.github/workflows/world-map-places-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate JavaScript syntax
        run: |
          node --check world-map/3d-search-core.js
          node --check world-map/3d-search.js
          node --check world-map/3d-places.js

      - name: Test search ranking
        run: node scripts/test_world_map_search.mjs

      - name: Test city runtime builder
        run: python -m unittest scripts.test_world_cities_builder -v

      - name: Validate city runtime when present
        run: python scripts/validate_world_cities.py

      - name: Validate Places integration
        run: python scripts/validate_world_map_places.py

      - name: Validate unified Search integration
        run: python scripts/validate_world_map_search.py

      - name: Validate existing subdivisions
        run: python scripts/validate_world_map_subdivisions.py

      - name: Validate existing 3D atlas contracts
        run: python scripts/validate_world_map_3d.py
