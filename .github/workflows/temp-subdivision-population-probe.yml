name: Temporary Subdivision Population Probe

on:
  push:
    branches: [feat/world-map-advance-2026-09-15]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Deterministic population contract
        run: python -m unittest scripts.test_world_subdivision_population -v
      - name: Enrich committed Denmark snapshot from Statistics Denmark
        run: python scripts/enrich_world_subdivision_population.py
      - name: Validate live Danish region population coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data/world-subdivisions')
          dnk=json.loads((root/'DNK.geo.json').read_text(encoding='utf-8'))
          index=json.loads((root/'index.json').read_text(encoding='utf-8'))
          features=dnk['features']
          assert len(features) == 5
          values={f['properties']['name']:f['properties'].get('population') for f in features}
          assert all(isinstance(v, dict) and v.get('value',0) > 0 for v in values.values())
          assert all(v.get('period') == '2026' for v in values.values())
          assert all('Statistics Denmark' in v.get('source','') for v in values.values())
          descriptor=index['partitions']['DNK']
          assert descriptor['population_status'] == 'official-observation'
          assert descriptor['population_coverage'] == 5
          print('LIVE DNK POPULATION PASSED')
          for name in sorted(values): print(name, values[name]['value'])
          PY
      - name: Publish verified population snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-subdivisions/DNK.geo.json data/world-subdivisions/index.json
          if ! git diff --cached --quiet; then
            git commit -m "data: add official 2026 Danish region populations"
            git push origin HEAD:feat/world-map-advance-2026-09-15
          fi
