name: Timeline naming migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/timeline-naming-migration.yml'
      - 'scripts/migrate_chronology_to_timeline.py'
      - 'scripts/validate_timeline_naming.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migrate Chronology naming to Timeline
        run: python scripts/migrate_chronology_to_timeline.py

      - name: Validate Timeline naming
        run: python scripts/validate_timeline_naming.py

      - name: Build site after rename
        run: python scripts/build_site.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset _site || true
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "refactor: make Timeline the canonical temporal system"
          git push origin HEAD:main
