name: Root Navigation CI

on:
  push:
    branches: [root-navigation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate root navigation contract
        run: python scripts/validate_root_navigation.py
      - name: Build canonical record registry
        run: python scripts/build_canonical_record_registry.py
      - name: Build repository index
        run: python scripts/build_repository_index.py
      - name: Build center navigation index
        run: python scripts/build_root_navigation_index.py
      - name: Audit source-of-truth and routes
        run: python scripts/audit_source_of_truth.py
      - name: Audit Potatoism concept integrity
        run: python scripts/audit_potatoism_concept_integrity.py
      - name: Audit cross-file duplication and ownership
        run: python scripts/audit_cross_file_duplicates.py
      - name: Validate blueprint contract
        run: python scripts/validate_blueprints.py
      - name: Build static site
        run: python scripts/build_site.py
      - name: Run whole-project stability audit
        run: python scripts/stability_audit.py
      - name: Validate built site shell
        run: python scripts/validate_site_shell.py
