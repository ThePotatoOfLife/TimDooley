name: Consolidation JS Repair

on:
  push:
    branches:
      - project-consolidation-2026-09-12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-consolidation-2026-09-12
          fetch-depth: 0
      - name: Repair merged Timeline render variables
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/bible-study.js')
          text = path.read_text(encoding='utf-8')
          old_decl = ',argumentsHtml=renderArguments(row,exactQuotes),timelineHtml=renderTimelineContext(row),signHtml='
          new_decl = ',argumentsHtml=renderArguments(row,exactQuotes),timelineContextHtml=renderTimelineContext(row),signHtml='
          old_render = '${prophecyHtml}${reverseHtml}${timelineHtml}${signHtml}${sameDateHtml}${attestationHtml}${timelineHtml}${ownerHtml}'
          new_render = '${prophecyHtml}${reverseHtml}${timelineContextHtml}${signHtml}${sameDateHtml}${attestationHtml}${timelineHtml}${ownerHtml}'
          if text.count(old_decl) != 1:
              raise SystemExit(f'Expected one declaration collision, found {text.count(old_decl)}')
          if text.count(old_render) != 1:
              raise SystemExit(f'Expected one render collision, found {text.count(old_render)}')
          path.write_text(text.replace(old_decl, new_decl).replace(old_render, new_render), encoding='utf-8')
          PY
          node --check app/bible-study.js
          rm -f scripts/js-syntax-diagnostic.txt
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate Bible timeline context and links"
          git push origin HEAD:project-consolidation-2026-09-12
