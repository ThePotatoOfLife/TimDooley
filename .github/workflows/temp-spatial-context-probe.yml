name: Temporary Spatial Context Probe

on:
  push:
    branches: [feat/world-map-advance-2026-09-15]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Spatial core and syntax
        run: |
          node scripts/test_world_map_spatial_core.mjs
          node --check world-map/3d-spatial-core.js
          node --check world-map/3d-infrastructure.js
          node --check world-map/3d-subdivisions.js
      - name: Permanent subdivision validator
        run: python scripts/validate_world_map_subdivisions.py
