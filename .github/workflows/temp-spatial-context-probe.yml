name: Temporary Spatial Context Probe

on:
  push:
    branches: [feat/world-map-advance-2026-09-15]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/test_world_map_spatial_core.mjs
