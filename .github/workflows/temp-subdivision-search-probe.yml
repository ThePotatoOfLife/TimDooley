name: Temporary Subdivision Search Probe

on:
  push:
    branches: [feat/world-map-places-search-v2]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/test_world_map_search.mjs
