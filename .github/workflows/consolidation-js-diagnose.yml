name: Consolidation JS Diagnostic

on:
  push:
    branches:
      - project-consolidation-2026-09-12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-consolidation-2026-09-12
          fetch-depth: 0
      - name: Capture parser output
        run: |
          set +e
          node --check app/bible-study.js > scripts/js-syntax-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> scripts/js-syntax-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/js-syntax-diagnostic.txt
          git commit -m "chore: capture Bible reader syntax diagnostic"
          git push origin HEAD:project-consolidation-2026-09-12
