name: Story evidence gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: story-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-story-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run Story evidence tests
        run: |
          python scripts/test_story_archive_validator.py
          python scripts/test_story_depth_audit.py

      - name: Validate Story evidence architecture
        run: python scripts/validate_story_archive.py

      - name: Check committed Story depth audit
        run: python scripts/build_story_depth_audit.py --check
