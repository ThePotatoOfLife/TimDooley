name: Temporary Canada Subdivision Probe

on:
  push:
    branches: [feat/world-map-advance-2026-09-15]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python -m unittest scripts.test_world_subdivision_canada -v
