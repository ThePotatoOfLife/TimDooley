name: World Map checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'world-map/**'
      - 'data/world-map-*.json'
      - 'data/atlas-*.json'
      - 'scripts/validate_world_map*.py'
      - 'scripts/test_world_map*.mjs'
      - '.github/workflows/world-map-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: world-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate canonical World Map runtime
        run: python scripts/validate_world_map_source.py

      - name: Validate World Map display and context contracts
        run: |
          python scripts/validate_world_map_ui_layout.py
          python scripts/validate_world_map_context_visibility.py
          python scripts/validate_world_map_visual_channels.py
          node scripts/test_world_map_display_system_contract.mjs
          node scripts/test_world_map_pinned_context_contract.mjs
          node scripts/test_world_map_inspection_bootstrap_staging.mjs
          node scripts/test_world_map_inspector_visibility.mjs
          node scripts/test_world_map_motion_compositor.mjs
          node scripts/test_world_map_route_geometry_semantics.mjs

      - name: Validate World Map visual channels
        run: |
          python scripts/validate_world_map_visual_channels.py
          node scripts/test_world_map_visual_channels.mjs

      - name: Validate World Map Places pipeline
        run: python scripts/validate_world_places_fixture_pipeline.py

      - name: Audit World Map runtime architecture
        run: python scripts/audit_world_map.py
