name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core · House · Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run Core · House · Atlas quality group
        run: python scripts/run_quality_group.py core
      - name: Upload Core · House · Atlas diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-core
          path: |
            quality-report-core.json
            .quality-logs/core/
          if-no-files-found: warn
          retention-days: 7

  world_map:
    name: World Map
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run World Map quality group
        run: python scripts/run_quality_group.py world_map
      - name: Upload World Map diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-world-map
          path: |
            quality-report-world_map.json
            .quality-logs/world_map/
            world-map-audit-report.json
          if-no-files-found: warn
          retention-days: 7

  content:
    name: Content · Research · Bible
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run Content · Research · Bible quality group
        run: python scripts/run_quality_group.py content
      - name: Upload Content · Research · Bible diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-content
          path: |
            quality-report-content.json
            .quality-logs/content/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Public build · SEO · Science
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build registries and source-of-truth indexes
        run: |
          python scripts/build_canonical_record_registry.py
          python scripts/build_repository_index.py
          python scripts/audit_source_of_truth.py
      - name: Build public site
        run: python scripts/build_site.py
      - name: Remove internal archive from public artifact
        run: rm -rf _site/archive && test ! -e _site/archive
      - name: Compile and validate Bible comparator
        run: |
          python scripts/build_bible_study.py
          python scripts/check_bible_static_dynamic_parity.py
          python scripts/build_bible_comparator_quality.py
      - name: Upload Bible comparator quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bible-comparator-quality-report
          path: knowledge/indexes/bible-comparator-quality-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Compile and validate science paper library
        run: |
          python scripts/build_science_catalog.py
          python scripts/validate_science_portal.py
      - name: Build discovery and ontology layers
        run: |
          python scripts/build_discovery.py
          python scripts/patch_home_discovery.py
          python scripts/patch_public_ontology.py
          python scripts/enrich_weak_descriptions.py
      - name: Optimize crawl, sharing and sitemap SEO
        id: seo
        continue-on-error: true
        run: python scripts/optimize_seo.py
      - name: Finalize public homepage metadata
        run: python scripts/finalize_public_home.py
      - name: Upload SEO diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-seo-report
          path: _site/seo-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce SEO gate
        if: steps.seo.outcome == 'failure'
        run: exit 1
      - name: Validate public navigation
        run: python scripts/validate_public_navigation.py
      - name: Audit machine discoverability
        id: machine_discovery
        continue-on-error: true
        run: python scripts/check_machine_discoverability.py
      - name: Upload machine-discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-machine-discoverability-report
          path: machine-discoverability-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce machine-discovery gate
        if: steps.machine_discovery.outcome == 'failure'
        run: exit 1
      - name: Validate built site shell
        run: python scripts/validate_site_shell.py
      - name: Upload site-shell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-site-shell-report
          path: site-shell-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Assert internal archive is absent from artifact
        run: test ! -e _site/archive

  validate:
    name: validate
    if: always()
    needs: [core, world_map, content, build]
    runs-on: ubuntu-latest
    steps:
      - name: Quality group summary
        env:
          CORE_RESULT: ${{ needs.core.result }}
          WORLD_MAP_RESULT: ${{ needs.world_map.result }}
          CONTENT_RESULT: ${{ needs.content.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf '%-18s %s\n' 'Core/House/Atlas' "$CORE_RESULT"
          printf '%-18s %s\n' 'World Map' "$WORLD_MAP_RESULT"
          printf '%-18s %s\n' 'Content/Research' "$CONTENT_RESULT"
          printf '%-18s %s\n' 'Public Build' "$BUILD_RESULT"
          test "$CORE_RESULT" = success
          test "$WORLD_MAP_RESULT" = success
          test "$CONTENT_RESULT" = success
          test "$BUILD_RESULT" = success
