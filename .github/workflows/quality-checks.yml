name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core · House · Atlas
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate explicit repository contracts
        run: |
          python scripts/validate_reader_richness.py
          python scripts/validate_seo_pipeline.py
          python scripts/validate_repo_hygiene.py
      - name: Run Core · House · Atlas quality group
        run: python scripts/run_quality_group.py core
      - name: Upload Core · House · Atlas diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-core
          path: |
            quality-report-core.json
            quality-inventory.json
            .quality-logs/core/
          if-no-files-found: warn
          retention-days: 7

  world_map:
    name: World Map
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run World Map quality group
        run: python scripts/run_quality_group.py world_map
      - name: Upload World Map diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-world-map
          path: |
            quality-report-world_map.json
            .quality-logs/world_map/
            world-map-audit-report.json
          if-no-files-found: warn
          retention-days: 7

  content:
    name: Content · Research · Bible
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run Content · Research · Bible quality group
        run: python scripts/run_quality_group.py content
      - name: Upload Content · Research · Bible diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-content
          path: |
            quality-report-content.json
            .quality-logs/content/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Public build · SEO · Science
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build registries and source-of-truth indexes
        run: |
          python scripts/build_canonical_record_registry.py
          python scripts/build_repository_index.py
          python scripts/audit_source_of_truth.py
      - name: Build public site
        run: python scripts/build_site.py
      - name: Remove internal archive from public artifact
        run: rm -rf _site/archive && test ! -e _site/archive
      - name: Vendor World Map engine into validated artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/world-map/vendor
          base='https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist'
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl.mjs" -o _site/world-map/vendor/maplibre-gl.mjs
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl-worker.mjs" -o _site/world-map/vendor/maplibre-gl-worker.mjs
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl-shared.mjs" -o _site/world-map/vendor/maplibre-gl-shared.mjs
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl.css" -o _site/world-map/vendor/maplibre-gl.css
          test -s _site/world-map/vendor/maplibre-gl.mjs
          test -s _site/world-map/vendor/maplibre-gl-worker.mjs
          test -s _site/world-map/vendor/maplibre-gl-shared.mjs
          test -s _site/world-map/vendor/maplibre-gl.css
      - name: Snapshot World Map runtime data into validated artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          curl -fsSL --retry 3 --retry-delay 1             https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json             -o _site/data/world-countries.geo.json
          test -s _site/data/world-countries.geo.json
          if ! curl -fsSL --retry 3 --retry-delay 1             'https://restcountries.com/v3.1/all?fields=name,cca3,population,area,latlng,capital,capitalInfo,region,subregion,borders'             -o _site/data/rest-countries-runtime.json; then
            rm -f _site/data/rest-countries-runtime.json
            echo 'REST Countries snapshot unavailable; runtime fallback remains enabled.'
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          geo_path=Path('_site/data/world-countries.geo.json')
          geo=json.loads(geo_path.read_text(encoding='utf-8'))
          assert geo.get('type')=='FeatureCollection'
          assert isinstance(geo.get('features'),list) and len(geo['features'])>=150
          rest_path=Path('_site/data/rest-countries-runtime.json')
          if rest_path.exists():
              try:
                  rows=json.loads(rest_path.read_text(encoding='utf-8'))
                  assert isinstance(rows,list) and len(rows)>=190
              except Exception as exc:
                  print(f'Discarding invalid REST Countries snapshot: {exc}')
                  rest_path.unlink(missing_ok=True)
          PY
      - name: Build population and religion snapshot into validated artifact
        env:
          ATLAS_DEMOGRAPHY_OUT: _site/data/world-country-demography.json
        run: python scripts/build_world_demography.py
      - name: Compile and validate Bible comparator
        run: |
          python scripts/build_bible_study.py
          python scripts/check_bible_static_dynamic_parity.py
          python scripts/build_bible_comparator_quality.py
      - name: Upload Bible comparator quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bible-comparator-quality-report
          path: knowledge/indexes/bible-comparator-quality-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Compile and validate science paper library
        run: |
          python scripts/build_science_catalog.py
          python scripts/validate_science_portal.py
      - name: Build discovery and ontology layers
        run: |
          python scripts/build_discovery.py
          python scripts/patch_home_discovery.py
          python scripts/patch_public_ontology.py
      - name: Enrich weak page descriptions
        run: python scripts/enrich_weak_descriptions.py
      - name: Optimize crawl, sharing and sitemap SEO
        id: seo
        continue-on-error: true
        run: python scripts/optimize_seo.py
      - name: Finalize public homepage metadata
        run: python scripts/finalize_public_home.py
      - name: Upload SEO diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-seo-report
          path: _site/seo-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce SEO gate
        if: steps.seo.outcome == 'failure'
        run: exit 1
      - name: Validate public navigation
        run: python scripts/validate_public_navigation.py
      - name: Audit machine discoverability
        id: machine_discovery
        continue-on-error: true
        run: python scripts/check_machine_discoverability.py
      - name: Upload machine-discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-machine-discoverability-report
          path: machine-discoverability-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce machine-discovery gate
        if: steps.machine_discovery.outcome == 'failure'
        run: exit 1
      - name: Finalize World Map runtime in validated artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          source_sha=os.environ['GITHUB_SHA']
          version=source_sha[:12]
          page_path=Path('_site/world-map/index.html')
          page=page_path.read_text(encoding='utf-8')
          old_css='https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist/maplibre-gl.css'
          local_css='./vendor/maplibre-gl.css?v=6.9.0'
          page=page.replace(old_css,local_css)
          for old,new in (
              ('./maplibre-loader.js?v=6466194',f'./maplibre-loader.js?v={version}'),
              ('./3d-boot-guard.js?v=6466194',f'./3d-boot-guard.js?v={version}'),
              ('src="./3d-bootstrap.js"',f'src="./3d-bootstrap.js?v={version}"'),
          ):
              page=page.replace(old,new)
          page_path.write_text(page,encoding='utf-8')
          assert local_css in page and old_css not in page
          assert f'./maplibre-loader.js?v={version}' in page
          assert f'./3d-boot-guard.js?v={version}' in page
          assert f'src="./3d-bootstrap.js?v={version}"' in page
          PY
      - name: Finalize universal TTS projection
        run: python scripts/patch_public_navigation.py
      - name: Validate built site shell
        run: python scripts/validate_site_shell.py
      - name: Validate TTS coverage
        run: python scripts/validate_tts_coverage.py
      - name: Upload site-shell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-site-shell-report
          path: site-shell-report.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Assert internal archive is absent from artifact
        run: test ! -e _site/archive
      - name: Stamp validated artifact provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
              "schema_version":"1.0.0",
              "source_sha":os.environ["GITHUB_SHA"],
              "quality_run_id":os.environ["GITHUB_RUN_ID"],
              "quality_run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],
              "repository":os.environ["GITHUB_REPOSITORY"],
              "artifact":"validated-pages-site",
          }
          Path("_site/build-provenance.json").write_text(json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Upload exact validated Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-pages-site
          path: _site
          if-no-files-found: error
          retention-days: 3

  validate:
    name: validate
    if: always()
    needs: [core, world_map, content, build]
    runs-on: ubuntu-latest
    steps:
      - name: Quality group summary
        env:
          CORE_RESULT: ${{ needs.core.result }}
          WORLD_MAP_RESULT: ${{ needs.world_map.result }}
          CONTENT_RESULT: ${{ needs.content.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf '%-18s %s\n' 'Core/House/Atlas' "$CORE_RESULT"
          printf '%-18s %s\n' 'World Map' "$WORLD_MAP_RESULT"
          printf '%-18s %s\n' 'Content/Research' "$CONTENT_RESULT"
          printf '%-18s %s\n' 'Public Build' "$BUILD_RESULT"
          test "$CORE_RESULT" = success
          test "$WORLD_MAP_RESULT" = success
          test "$CONTENT_RESULT" = success
          test "$BUILD_RESULT" = success
