name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Validate repository hygiene
        run: python scripts/validate_repo_hygiene.py

      - name: Validate World Map ownership
        run: python scripts/validate_world_map_ownership.py

      - name: Validate JavaScript syntax
        run: |
          node --check app/bible-study.js
          node --check world-map/3d-layer-registry.js
          node --check world-map/3d-compositor.js
          node --check world-map/3d-country-selection.js
          node --check world-map/3d-world-bar.js
          node --check world-map/3d-country-card.js
          node --check world-map/3d-gateways.js
          node --check world-map/3d-chain-explorer.js
          node --check world-map/3d-impact-trace.js
          node --check world-map/3d-impact-actions.js

      - name: Validate archive runtime hardening
        run: python scripts/validate_archive_runtime_hardening.py

      - name: Validate country refresh reliability
        run: python scripts/validate_country_refresh_reliability.py

      - name: Validate SEO pipeline
        run: python scripts/validate_seo_pipeline.py

      - name: Validate Timeline naming
        run: python scripts/validate_timeline_naming.py

      - name: Build canonical record registry
        run: python scripts/build_canonical_record_registry.py

      - name: Build repository index
        run: python scripts/build_repository_index.py

      - name: Audit source-of-truth and routes
        run: python scripts/audit_source_of_truth.py

      - name: Validate blueprint contract
        run: python scripts/validate_blueprints.py

      - name: Run whole-project stability audit
        run: python scripts/stability_audit.py

      - name: Validate Atlas structure
        run: python scripts/validate_atlas.py

      - name: Validate Atlas projection and time contracts
        run: python scripts/validate_atlas_view_contracts.py

      - name: Validate Atlas mathematical calibration
        run: python scripts/validate_atlas_math_calibration.py

      - name: Validate World Map data runtime
        run: python scripts/validate_world_map_data_runtime.py

      - name: Validate World Map Axis and systems
        run: python scripts/validate_world_axis_systems.py

      - name: Validate World Map system intelligence
        run: python scripts/validate_world_map_system_intelligence.py

      - name: Validate World Map functional chain explorer
        run: python scripts/validate_world_map_chain_explorer.py

      - name: Validate World Map entity and Africa repair
        run: python scripts/validate_world_map_entity_africa_repair.py

      - name: Validate World Map dependency impact trace
        run: python scripts/validate_world_map_impact_trace.py

      - name: Validate canonical World Map runtime
        run: python scripts/validate_world_map_source.py

      - name: Validate World Map UI shell
        run: python scripts/validate_world_map_ui_shell.py

      - name: Validate canonical World Map relationship path finder
        run: python scripts/validate_world_map_pathfinder_source.py

      - name: Validate World Map investigation utility
        run: python scripts/validate_world_map_investigation_utility.py

      - name: Validate entity-aware Trace
        run: python scripts/validate_world_map_entity_trace.py

      - name: Validate question-led reader surfaces
        run: python scripts/validate_reader_surfaces.py

      - name: Validate backend to frontend projection
        run: python scripts/validate_public_projection.py

      - name: Validate discovery provenance projection
        run: python scripts/validate_discovery_projection.py

      - name: Validate generated navigation projection
        run: python scripts/validate_generated_navigation.py

      - name: Validate Explore registry projection
        run: python scripts/validate_explore_projection.py

      - name: Validate repository spine
        run: python scripts/validate_repository_spine.py

      - name: Validate architecture layers
        run: python scripts/validate_architecture_layers.py

      - name: Validate content integrity
        run: python scripts/validate_content_integrity.py

      - name: Validate religious-adjacent layer
        run: python scripts/validate_religious_adjacent.py

      - name: Validate religious layer coupling map
        run: python scripts/validate_religious_layer_map.py

      - name: Validate Potatoism layer
        run: python scripts/validate_potatoism.py

      - name: Validate expansion layers
        run: python scripts/validate_expansion_layers.py

      - name: Check FAQ backend
        run: python scripts/check_faq_backend.py

      - name: Check CSS namespaces
        run: python scripts/check_css_namespace_collisions.py

      - name: Check biblical syncretism field
        run: python scripts/check_biblical_syncretism_field.py

      - name: Validate Bible reader
        run: python scripts/validate_bible_reader.py

      - name: Audit backend ownership, duplicates and graph orphans
        run: python scripts/audit_backend_coverage.py

      - name: Audit Atlas links and record coverage
        run: python scripts/audit_atlas_links.py

      - name: Audit web layer
        run: python scripts/audit_web.py

      - name: Build public site
        run: python scripts/build_site.py

      - name: Remove internal archive from public artifact
        run: rm -rf _site/archive && test ! -e _site/archive

      - name: Compile Bible comparator
        run: python scripts/build_bible_study.py

      - name: Compile science paper library
        run: python scripts/build_science_catalog.py

      - name: Validate science paper library
        run: python scripts/validate_science_portal.py

      - name: Build machine discovery layer
        run: python scripts/build_discovery.py

      - name: Expose machine discovery entry points
        run: python scripts/patch_home_discovery.py

      - name: Apply public ontology patch
        run: python scripts/patch_public_ontology.py

      - name: Enrich weak page descriptions
        run: python scripts/enrich_weak_descriptions.py

      - name: Optimize crawl, sharing and sitemap SEO
        id: seo
        continue-on-error: true
        run: python scripts/optimize_seo.py

      - name: Upload SEO diagnostics
        if: ${{ always() && hashFiles('_site/seo-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-seo-report
          path: _site/seo-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce SEO gate
        if: steps.seo.outcome == 'failure'
        run: exit 1

      - name: Validate public navigation
        run: python scripts/validate_public_navigation.py

      - name: Audit machine discoverability
        id: machine_discovery
        continue-on-error: true
        run: python scripts/check_machine_discoverability.py

      - name: Upload machine-discovery diagnostics
        if: ${{ always() && hashFiles('machine-discoverability-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-machine-discoverability-report
          path: machine-discoverability-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce machine-discovery gate
        if: steps.machine_discovery.outcome == 'failure'
        run: exit 1

      - name: Validate built site shell
        run: python scripts/validate_site_shell.py

      - name: Upload site-shell diagnostics
        if: ${{ always() && hashFiles('site-shell-report.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-site-shell-report
          path: site-shell-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Assert internal archive is absent from artifact
        run: test ! -e _site/archive
