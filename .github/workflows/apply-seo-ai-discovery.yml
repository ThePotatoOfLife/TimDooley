name: Apply SEO AI discovery hardening

on:
  push:
    branches:
      - feature/seo-ai-discovery-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Correct crawler source markers
        run: python scripts/fix_seo_pipeline_marker_patch.py
      - name: Commit correction when changed
        run: |
          git config user.name "Tim Dooley"
          git config user.email "thepotatooflife@hotmail.com"
          git add scripts/validate_seo_pipeline.py
          if git diff --cached --quiet; then
            echo "SEO validator correction already applied"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix(seo): align crawler source contract"
          git push origin HEAD:feature/seo-ai-discovery-20260917
