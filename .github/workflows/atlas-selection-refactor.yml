name: Atlas selection refactor

on:
  push:
    branches: [atlas-selection-layers-20260911]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atlas-selection-layers-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply final interaction polish
        run: python scripts/patch_atlas_final_polish.py

      - name: Build pinned local capital layer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/nvkelso/natural-earth-vector/ca96624a56bd078437bca8184e78163e5039ad19/geojson/ne_110m_populated_places_simple.geojson \
            -o /tmp/natural-earth-capitals.geojson
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/natural-earth-capitals.geojson').read_text(encoding='utf-8'))
          features = []
          for feature in payload.get('features', []):
              props = feature.get('properties') or {}
              if not (props.get('adm0cap') == 1 or props.get('capalt') == 1):
                  continue
              code = props.get('adm0_a3') or props.get('sov_a3')
              coords = (feature.get('geometry') or {}).get('coordinates')
              if not code or not isinstance(coords, list) or len(coords) != 2:
                  continue
              features.append({
                  'type':'Feature',
                  'properties':{
                      'iso3':code,
                      'name':props.get('name') or props.get('nameascii') or code,
                      'country':props.get('adm0name') or props.get('sov0name') or '',
                      'scalerank':int(props.get('scalerank') or 9),
                      'primary':props.get('adm0cap') == 1,
                      'source':'Natural Earth 1:110m populated places (pinned)',
                  },
                  'geometry':{'type':'Point','coordinates':[float(coords[0]),float(coords[1])]},
              })
          assert len(features) >= 150, len(features)
          Path('data/world-capitals.geo.json').write_text(
              json.dumps({'type':'FeatureCollection','name':'world-capitals','features':features}, separators=(',',':')),
              encoding='utf-8'
          )
          print(f'Built checked-in capital layer: {len(features)} features')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in world-map/*.js; do node --check "$f"; done

      - name: Validate Atlas contracts
        run: |
          python scripts/validate_atlas_view_contracts.py
          python scripts/validate_atlas_math_calibration.py
          python scripts/validate_world_map_3d.py
          python scripts/validate_world_map_pathfinder.py
          python scripts/validate_world_map_entity_trace.py

      - name: Verify capital layer survives site build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_site.py
          test -s _site/data/world-capitals.geo.json

      - name: Commit validated final polish
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Final polish already committed and validated.'
            exit 0
          fi
          git config user.name 'ThePotatoOfLife'
          git config user.email 'thepotatooflife@hotmail.com'
          git add world-map data/world-capitals.geo.json
          git commit -m 'Finish scalable atlas selection and layer polish'
          git push origin HEAD:atlas-selection-layers-20260911
