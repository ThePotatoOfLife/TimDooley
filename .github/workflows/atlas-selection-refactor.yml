name: Atlas selection refactor

on:
  push:
    branches: [atlas-selection-layers-20260911]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: atlas-selection-layers-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply deterministic refactor patch
        run: python scripts/patch_atlas_selection_layers.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in world-map/*.js; do node --check "$f"; done
      - name: Validate Atlas contracts
        run: |
          python scripts/validate_atlas_view_contracts.py
          python scripts/validate_atlas_math_calibration.py
          python scripts/validate_world_map_3d.py
          python scripts/validate_world_map_pathfinder.py
          python scripts/validate_world_map_entity_trace.py
      - name: Commit patched branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Branch already patched and validated.'
            exit 0
          fi
          git config user.name 'ThePotatoOfLife'
          git config user.email 'thepotatooflife@hotmail.com'
          git add world-map scripts .github/workflows/pages.yml
          git commit -m 'Refine country selection and future-proof atlas layers'
          git push origin HEAD:atlas-selection-layers-20260911
