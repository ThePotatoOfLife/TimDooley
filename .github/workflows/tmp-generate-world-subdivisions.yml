name: Temporary World Subdivision Generator

on:
  push:
    branches:
      - feat/world-map-population-subdivisions-2026-09-14

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/world-map-population-subdivisions-2026-09-14
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run focused tests
        run: |
          python scripts/test_world_population_contract.py
          python scripts/test_build_world_demography_population.py
          python scripts/test_build_world_subdivisions.py
      - name: Generate Census subdivision snapshot
        env:
          ATLAS_SUBDIVISIONS_OUT_DIR: _generated/world-subdivisions
        run: python scripts/build_world_subdivisions.py
      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('_generated/world-subdivisions')
          usa = json.loads((root / 'USA.geo.json').read_text())
          assert len(usa['features']) == 51
          assert len({f['properties']['id'] for f in usa['features']}) == 51
          assert all(f['properties']['population']['value'] > 0 for f in usa['features'])
          assert (root / 'USA.geo.json').stat().st_size < 1000000
          PY
      - name: Commit generated snapshot and remove temporary workflow
        run: |
          set -euo pipefail
          mkdir -p data/world-subdivisions
          cp _generated/world-subdivisions/index.json data/world-subdivisions/index.json
          cp _generated/world-subdivisions/USA.geo.json data/world-subdivisions/USA.geo.json
          git rm .github/workflows/tmp-generate-world-subdivisions.yml
          git add data/world-subdivisions/index.json data/world-subdivisions/USA.geo.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(world-map): pin official US subdivision snapshot'
          git push origin HEAD:feat/world-map-population-subdivisions-2026-09-14
