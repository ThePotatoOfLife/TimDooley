name: Temporary World Subdivision Generator

on:
  push:
    branches:
      - feat/world-map-population-subdivisions-2026-09-14

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Run focused population and subdivision tests
        run: |
          python scripts/test_world_population_contract.py
          python scripts/test_build_world_demography_population.py
          python scripts/test_build_world_subdivisions.py
      - name: Inspect official Census KML state archive
        run: |
          curl -fsSL --retry 3 --retry-delay 1 'https://www2.census.gov/geo/tiger/GENZ2025/kml/cb_2025_us_state_5m.zip' -o /tmp/states.zip
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/states.zip') as archive:
              print('files=', archive.namelist())
              kml = next(name for name in archive.namelist() if name.lower().endswith('.kml'))
              text = archive.read(kml).decode('utf-8-sig')
              print('kml-prefix=', text[:8000])
          PY
