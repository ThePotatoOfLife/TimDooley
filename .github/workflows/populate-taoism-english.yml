name: Populate English Taoism Reader

on:
  push:
    branches: [main]
    paths-ignore:
      - 'taoism.html'

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch public-domain James Legge text
        run: curl -L --fail --retry 3 https://www.gutenberg.org/cache/epub/216/pg216.txt -o /tmp/pg216.txt

      - name: Build local English reader
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape

          src = Path('/tmp/pg216.txt').read_text(encoding='utf-8')
          start = src.index('PART 1.')
          end = src.index('*** END OF THE PROJECT GUTENBERG EBOOK')
          book = src[start:end].strip()

          html = '''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>The Tao Teh King — The Tao and Its Characteristics</title>
          <style>
          :root{color-scheme:dark}
          body{margin:0;background:#0b0b0b;color:#e9e9e9;font:18px/1.85 Georgia,"Times New Roman",serif}
          main{max-width:1000px;margin:auto;padding:48px 28px 96px}
          h1{font-size:2.35rem;margin:0 0 .2em}
          h2{font-size:1.35rem;margin-top:2.5em;color:#ddd}
          .meta{font:14px/1.6 system-ui,sans-serif;color:#aaa}
          pre{white-space:pre-wrap;font:19px/2.0 Georgia,"Times New Roman",serif;background:#111;padding:32px;border:1px solid #292929;border-radius:8px;overflow:auto}
          a{color:#b9d8ff}
          </style>
          </head>
          <body><main>
          <h1>The Tao Teh King</h1>
          <p class="meta">The Tao and Its Characteristics · Lao-Tse (Laozi) · translated by James Legge · 81 chapters</p>
          <p class="meta">Complete English text of the 1891 James Legge translation. This local reader is based on Project Gutenberg eBook #216, which identifies the text as English and public domain in the USA.</p>
          <p class="meta">The ancient work is traditionally attributed to Laozi. The translation is James Legge's 1891 public-domain edition. The repository stores the text locally so reading does not depend on an external website.</p>
          <pre>''' + escape(book) + '''</pre>
          <p class="meta">Source provenance: Project Gutenberg eBook #216, <em>The Tao Teh King, or the Tao and its Characteristics</em>, translated by James Legge. The external source is retained only as provenance; the complete English text above is local.</p>
          </main></body></html>
          '''
          Path('taoism.html').write_text(html, encoding='utf-8')
          PY

      - name: Commit local reader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taoism.html
          git diff --cached --quiet || git commit -m 'Populate Taoism reader with complete English Dao De Jing'
          git push
