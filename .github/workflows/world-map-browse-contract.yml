name: World Map browse contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate browse-first interaction and render ownership
        run: python scripts/validate_world_map_browse_performance.py
      - name: Validate affected JavaScript syntax
        run: |
          test ! -f world-map/3d-active-view.js || node --check world-map/3d-active-view.js
          node --check world-map/3d-country-selection.js
          node --check world-map/3d-country-card.js
          node --check world-map/3d-country-pulse.js
          node --check world-map/3d-world-bar.js
          node --check world-map/3d-compositor.js
          node --check world-map/3d-scalar-runtime-bridge.js
          node --check world-map/3d-bootstrap.js
