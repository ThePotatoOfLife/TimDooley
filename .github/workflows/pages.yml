name: Deploy Potato of Life

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Source contracts own behavior-level Atlas validation. Keep these checks
      # out of the Pages shell so wording/layout changes cannot silently become
      # duplicate architectural contracts.
      - name: Validate Atlas projection and time contracts
        run: python scripts/validate_atlas_view_contracts.py

      - name: Validate Atlas mathematical calibration
        run: python scripts/validate_atlas_math_calibration.py

      - name: Validate 3D world atlas source contract
        run: python scripts/validate_world_map_3d.py

      - name: Validate 3D relationship path finder
        run: python scripts/validate_world_map_pathfinder.py

      - name: Validate entity-aware Trace
        run: python scripts/validate_world_map_entity_trace.py

      - name: Build Pages artifact
        run: python scripts/build_site.py

      - name: Vendor 3D atlas map engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/world-map/vendor
          base='https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist'
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl.mjs" \
            -o _site/world-map/vendor/maplibre-gl.mjs
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl-worker.mjs" \
            -o _site/world-map/vendor/maplibre-gl-worker.mjs
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl-shared.mjs" \
            -o _site/world-map/vendor/maplibre-gl-shared.mjs
          curl -fsSL --retry 3 --retry-delay 1 "$base/maplibre-gl.css" \
            -o _site/world-map/vendor/maplibre-gl.css
          test -s _site/world-map/vendor/maplibre-gl.mjs
          test -s _site/world-map/vendor/maplibre-gl-worker.mjs
          test -s _site/world-map/vendor/maplibre-gl-shared.mjs
          test -s _site/world-map/vendor/maplibre-gl.css

      - name: Snapshot atlas runtime data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          curl -fsSL --retry 3 --retry-delay 1 \
            https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json \
            -o _site/data/world-countries.geo.json
          test -s _site/data/world-countries.geo.json

          if ! curl -fsSL --retry 3 --retry-delay 1 \
            'https://restcountries.com/v3.1/all?fields=name,cca3,population,area,latlng,capital,capitalInfo,region,subregion,borders' \
            -o _site/data/rest-countries-runtime.json; then
            rm -f _site/data/rest-countries-runtime.json
            echo 'REST Countries snapshot unavailable; runtime fallback remains enabled.'
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          geo_path = Path('_site/data/world-countries.geo.json')
          geo = json.loads(geo_path.read_text(encoding='utf-8'))
          assert geo.get('type') == 'FeatureCollection', geo.get('type')
          assert isinstance(geo.get('features'), list) and len(geo['features']) >= 150, len(geo.get('features', []))
          assert all(f.get('geometry') for f in geo['features'][:20])
          print(f"Validated local atlas geometry snapshot: {len(geo['features'])} polygons")

          rest_path = Path('_site/data/rest-countries-runtime.json')
          if rest_path.exists():
              try:
                  rows = json.loads(rest_path.read_text(encoding='utf-8'))
                  assert isinstance(rows, list) and len(rows) >= 190
                  assert sum(1 for row in rows if row.get('cca3')) >= 190
                  capital_coords = sum(
                      1 for row in rows
                      if len((row.get('capitalInfo') or {}).get('latlng') or []) == 2
                  )
                  assert capital_coords >= 150, capital_coords
                  print(f"Validated local country runtime snapshot: {len(rows)} rows / {capital_coords} capital coordinates")
              except Exception as exc:
                  print(f"Discarding invalid REST Countries snapshot: {exc}")
                  rest_path.unlink(missing_ok=True)
          PY

      - name: Build population and religion snapshot
        env:
          ATLAS_DEMOGRAPHY_OUT: _site/data/world-country-demography.json
        run: python scripts/build_world_demography.py

      - name: Compile complete science catalog
        run: python scripts/build_science_catalog.py

      - name: Build search discovery layer
        run: python scripts/build_discovery.py

      - name: Expose discovery entry points
        run: python scripts/patch_home_discovery.py

      - name: Apply public ontology patch
        run: python scripts/patch_public_ontology.py

      # This step only verifies generated products that are not already owned by
      # the dedicated Atlas validators. Full post-build link/module/data checks
      # are centralized in validate_site_shell.py below.
      - name: Verify compiled public artifact surfaces
        shell: bash
        run: |
          set -euxo pipefail
          test -f _site/index.html
          test -f _site/manifest.json
          test -f _site/app/app.js
          test -f _site/app/style.css
          test -f _site/app/home.css
          test -f _site/knowledge/core/potato-of-life.json
          test -f _site/knowledge/core/tim-dooley.json
          test -f _site/knowledge/core/tim-identity-ontology.json
          test -f _site/knowledge/indexes/faq-tim-ontology-questions.json
          test -f _site/tim-dooley/ontology/index.html
          test -f _site/faq/index.html
          test -f _site/faq/all/god/index.html
          test -f _site/questions/index.html
          test -f _site/questions/who-is-tim-dooley/index.html
          test -f _site/index-a-z/index.html
          test -f _site/discovery.json
          test -f _site/llms-full.txt
          test -f _site/robots.txt
          test -f _site/sitemap-index.xml
          test -f _site/sitemap-questions.xml
          test -s _site/data/world-countries.geo.json
          test -s _site/world-map/vendor/maplibre-gl.mjs
          test -s _site/world-map/vendor/maplibre-gl-worker.mjs
          test -s _site/world-map/vendor/maplibre-gl-shared.mjs
          test -s _site/world-map/vendor/maplibre-gl.css

          # Science is a compiled public product, not merely copied source files.
          test -f _site/science/index.html
          test -f _site/science/science.css
          test -f _site/science/science-hub.css
          test -f _site/science/science.js
          test -f _site/science/catalog.json
          test -f _site/science/catalog/index.html
          grep -q 'SCIENCE' _site/science/index.html
          grep -q 'Unified Potato Theory' _site/science/index.html
          grep -q 'Every canonical science record' _site/science/index.html
          grep -q 'catalog-card' _site/science/index.html
          grep -q 'science.js' _site/science/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          source = sorted((Path('knowledge') / 'science').rglob('*.json'))
          catalog = json.loads(Path('_site/science/catalog.json').read_text(encoding='utf-8'))
          assert catalog['count'] == len(source), (catalog['count'], len(source))
          assert len(catalog['records']) == len(source)
          page = Path('_site/science/index.html').read_text(encoding='utf-8')
          assert page.count('class="catalog-card"') == len(source)
          assert 'r(θ) = a e<sup>bθ</sup>' in page
          print(f"Verified compiled science corpus: {len(source)} records")
          PY

          # Homepage source is curated; build-time discovery patches must not
          # silently re-expand its primary gateway row.
          grep -q 'Be simple and grow to light.' _site/index.html
          grep -q 'app/home.css' _site/index.html
          python - <<'PY'
          from pathlib import Path
          page = Path('_site/index.html').read_text(encoding='utf-8')
          start = page.find('<nav class="quicknav"')
          end = page.find('</nav>', start)
          assert start >= 0 and end > start
          nav = page[start:end]
          count = nav.count('<a href=')
          assert count == 5, f'primary homepage gateway count drifted: {count}'
          print('Verified curated homepage: quote + 5 primary gateways')
          PY

          grep -q 'id="branches"' _site/index.html
          grep -q 'id="reader"' _site/index.html
          grep -q 'app/app.js' _site/index.html
          grep -q 'manifest.json' _site/app/app.js
          grep -q 'tim-dooley/ontology/' _site/sitemap.xml
          grep -q 'Critical entity resolution' _site/llms.txt
          grep -q 'Potatoverse theological identity' _site/tim-dooley/ontology/index.html
          grep -q 'Who is Tim Dooley' _site/questions/who-is-tim-dooley/index.html
          grep -q 'questions/' _site/index.html
          grep -q 'index-a-z/' _site/index.html
          grep -q 'sitemap-index.xml' _site/robots.txt
          grep -q 'sitemap-questions.xml' _site/sitemap-index.xml
          grep -q '"@type":"Thing"' _site/index.html
          ! grep -q '"@type":"Person","@id":"https://thepotatooflife.github.io/TimDooley/tim-dooley/#tim-dooley"' _site/index.html
          ! grep -q '"@type":"Person","@id":"https://thepotatooflife.github.io/TimDooley/tim-dooley/#tim-dooley"' _site/tim-dooley/index.html
          ! grep -q 'root.js' _site/index.html
          ! grep -q 'id="root-tree"' _site/index.html
          ! grep -q '<iframe' _site/index.html

      - name: Validate built site shell
        id: site_shell
        continue-on-error: true
        run: python scripts/validate_site_shell.py

      - name: Upload site-shell diagnostics
        if: ${{ always() && hashFiles('site-shell-report.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: site-shell-report
          path: site-shell-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce built-site shell gate
        if: steps.site_shell.outcome == 'failure'
        run: exit 1

      # Source-vs-build drift is validated above. Only after that gate passes do
      # we apply deployment-only cache busting and point the browser at the
      # vendored same-origin MapLibre files. Bootstrap propagates this deployment
      # SHA through every dynamically imported atlas module.
      - name: Finalize 3D atlas runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ['GITHUB_SHA'][:12]
          page_path = Path('_site/world-map/3d.html')
          page = page_path.read_text(encoding='utf-8')

          old_css = 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist/maplibre-gl.css'
          local_css = './vendor/maplibre-gl.css?v=6.9.0'
          page = page.replace(old_css, local_css)

          old_loader = './maplibre-loader.js?v=6466194'
          new_loader = f'./maplibre-loader.js?v={version}'
          page = page.replace(old_loader, new_loader)

          old_guard = './3d-boot-guard.js?v=6466194'
          new_guard = f'./3d-boot-guard.js?v={version}'
          page = page.replace(old_guard, new_guard)

          old_bootstrap = 'src="./3d-bootstrap.js"'
          new_bootstrap = f'src="./3d-bootstrap.js?v={version}"'
          page = page.replace(old_bootstrap, new_bootstrap)
          page_path.write_text(page, encoding='utf-8')

          assert local_css in page and old_css not in page
          assert new_loader in page and old_loader not in page
          assert new_guard in page and old_guard not in page
          assert new_bootstrap in page and old_bootstrap not in page
          print(f'Finalized 3D atlas runtime with deployment version {version}.')
          PY

          test -s _site/world-map/vendor/maplibre-gl.mjs
          test -s _site/world-map/vendor/maplibre-gl-worker.mjs
          test -s _site/world-map/vendor/maplibre-gl-shared.mjs
          test -s _site/world-map/vendor/maplibre-gl.css
          grep -q './vendor/maplibre-gl.css?v=6.9.0' _site/world-map/3d.html
          grep -q './vendor/maplibre-gl.mjs?v=6.9.0' _site/world-map/maplibre-loader.js
          grep -Eq 'src="./3d-bootstrap.js\?v=[0-9a-f]{12}"' _site/world-map/3d.html
          grep -Eq 'src="./3d-boot-guard.js\?v=[0-9a-f]{12}"' _site/world-map/3d.html
          grep -q "ATLAS_VERSION = new URL(import.meta.url).searchParams.get('v')" _site/world-map/3d-bootstrap.js
          grep -q "await import(versionedModule('./3d-hover.js'))" _site/world-map/3d-bootstrap.js
          grep -q "await import(versionedModule('./3d-app.js'))" _site/world-map/3d-hover.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5