name: Deploy Potato of Life

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build Pages artifact
        run: python scripts/build_site.py

      - name: Verify manifest-driven archive
        run: |
          test -f _site/index.html
          test -f _site/manifest.json
          test -f _site/app/app.js
          test -f _site/app/style.css
          test -f _site/knowledge/core/potato-of-life.json
          test -f _site/knowledge/core/tim-dooley.json
          grep -q 'id="branches"' _site/index.html
          grep -q 'id="reader"' _site/index.html
          grep -q 'app/app.js' _site/index.html
          grep -q 'manifest.json' _site/app/app.js
          ! grep -q 'root.js' _site/index.html
          ! grep -q 'id="root-tree"' _site/index.html
          ! grep -q '<iframe' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
