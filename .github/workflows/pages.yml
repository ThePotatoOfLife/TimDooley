name: Deploy Potato of Life

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build generated data
        run: |
          python scripts/build_canonical_record_registry.py
          python scripts/build_repository_index.py
          python scripts/build_root_navigation_index.py

      - name: Build Pages artifact
        run: python scripts/build_site.py

      - name: Verify Pages artifact
        run: |
          test -f _site/index.html
          test -f _site/root.js
          test -f _site/data/root-navigation.json
          test -f _site/data/root-record-index.json
          test -f _site/data/backend.json
          test -f _site/data/frontend-atlas-bridge.json
          test "$(find _site -type f -name '*.html' | wc -l)" -eq 1
          grep -q 'id="root-tree"' _site/index.html
          grep -q 'id="frame-content"' _site/index.html
          grep -q 'root.js?v=' _site/index.html
          ! grep -q '<iframe' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
