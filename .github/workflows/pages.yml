name: Deploy Potato of Life

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build Pages artifact
        run: python scripts/build_site.py

      - name: Compile complete science catalog
        run: python scripts/build_science_catalog.py

      - name: Build search discovery layer
        run: python scripts/build_discovery.py

      - name: Expose discovery entry points
        run: python scripts/patch_home_discovery.py

      - name: Apply public ontology patch
        run: python scripts/patch_public_ontology.py

      - name: Verify manifest-driven archive, science hub, Tim ontology, and discovery layer
        shell: bash
        run: |
          set -euxo pipefail
          test -f _site/index.html
          test -f _site/manifest.json
          test -f _site/app/app.js
          test -f _site/app/style.css
          test -f _site/knowledge/core/potato-of-life.json
          test -f _site/knowledge/core/tim-dooley.json
          test -f _site/knowledge/core/tim-identity-ontology.json
          test -f _site/knowledge/indexes/faq-tim-ontology-questions.json
          test -f _site/tim-dooley/ontology/index.html
          test -f _site/faq/index.html
          test -f _site/faq/all/god/index.html
          test -f _site/questions/index.html
          test -f _site/questions/who-is-tim-dooley/index.html
          test -f _site/index-a-z/index.html
          test -f _site/discovery.json
          test -f _site/llms-full.txt
          test -f _site/robots.txt
          test -f _site/sitemap-index.xml
          test -f _site/sitemap-questions.xml

          # Science is a compiled public product and uses the canonical site stylesheet.
          test -f _site/science/index.html
          test -f _site/science/science.js
          test -f _site/science/catalog.json
          test -f _site/science/catalog/index.html
          grep -q 'SCIENCE' _site/science/index.html
          grep -q 'Unified Potato Theory' _site/science/index.html
          grep -q 'Every canonical science record' _site/science/index.html
          grep -q 'catalog-card' _site/science/index.html
          grep -q 'science.js' _site/science/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          source = sorted((Path('knowledge') / 'science').glob('*.json'))
          catalog = json.loads(Path('_site/science/catalog.json').read_text(encoding='utf-8'))
          assert catalog['count'] == len(source), (catalog['count'], len(source))
          assert len(catalog['records']) == len(source)
          page = Path('_site/science/index.html').read_text(encoding='utf-8')
          assert page.count('class="catalog-card"') == len(source)
          assert 'r(θ) = a e<sup>bθ</sup>' in page
          print(f"Verified compiled science corpus: {len(source)} records")
          PY

          grep -q 'id="branches"' _site/index.html
          grep -q 'id="reader"' _site/index.html
          grep -q 'app/app.js' _site/index.html
          grep -q 'manifest.json' _site/app/app.js
          grep -q 'tim-dooley/ontology/' _site/sitemap.xml
          grep -q 'Critical entity resolution' _site/llms.txt
          grep -q 'Potatoverse theological identity' _site/tim-dooley/ontology/index.html
          grep -q 'Who is Tim Dooley' _site/questions/who-is-tim-dooley/index.html
          grep -q 'questions/' _site/index.html
          grep -q 'index-a-z/' _site/index.html
          grep -q 'sitemap-index.xml' _site/robots.txt
          grep -q 'sitemap-questions.xml' _site/sitemap-index.xml
          grep -q '"@type":"Thing"' _site/index.html
          ! grep -q '"@type":"Person","@id":"https://thepotatooflife.github.io/TimDooley/tim-dooley/#tim-dooley"' _site/index.html
          ! grep -q '"@type":"Person","@id":"https://thepotatooflife.github.io/TimDooley/tim-dooley/#tim-dooley"' _site/tim-dooley/index.html
          ! grep -q 'root.js' _site/index.html
          ! grep -q 'id="root-tree"' _site/index.html
          ! grep -q '<iframe' _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
