name: Consolidation Timeline Migration

on:
  push:
    branches:
      - project-consolidation-2026-09-12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-consolidation-2026-09-12
          fetch-depth: 0

      - name: Migrate recovered Chronology references
        run: python scripts/consolidation_timeline_migrate.py

      - name: Verify Timeline naming contract
        run: python scripts/validate_timeline_naming.py

      - name: Remove one-shot migration script and commit
        run: |
          rm scripts/consolidation_timeline_migrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "fix: finish Timeline consolidation migration"
          git push origin HEAD:project-consolidation-2026-09-12
