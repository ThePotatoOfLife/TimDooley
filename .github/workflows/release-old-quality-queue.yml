name: Repository quality checks

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-old-queue:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "This job is intentionally skipped; the workflow exists only to cancel stale concurrency-group runs."
