name: Refresh country atlas

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/country-refresh.yml'
      - 'scripts/refresh_country_atlas.py'
      - 'scripts/instantiate_country_nodes.py'
      - 'scripts/merge_country_deepening.py'
      - 'data/atlas-manifest.json'

permissions:
  contents: write

concurrency:
  group: country-atlas-refresh
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-country-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instantiate any missing country nodes
        run: python scripts/instantiate_country_nodes.py
      - name: Apply universal country deepening overlay
        run: python scripts/merge_country_deepening.py
      - name: Refresh normalized country observations and static snapshot
        run: python scripts/refresh_country_atlas.py
      - name: Commit refreshed country data
        run: |
          set -e
          git config user.name 'country-atlas-bot'
          git config user.email 'country-atlas-bot@users.noreply.github.com'
          git add data/countries data/country-refresh-state.json data/country-static.json
          if git diff --cached --quiet; then
            echo 'No country data changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh static country atlas data'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
          done
          echo 'Unable to push country refresh after 3 attempts.'
          exit 1
