name: Maintain country library

# One workflow owns country creation, refresh and consolidation.
# It intentionally writes canonical records, not snapshots or batch layers.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/country-refresh.yml'
      - 'scripts/refresh_country_atlas.py'
      - 'scripts/instantiate_country_nodes.py'
      - 'scripts/consolidate_country_library.py'
      - 'data/countries/index.json'
      - 'data/countries-blueprint.json'

permissions:
  contents: write

concurrency:
  group: country-library
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instantiate missing country nodes
        run: python scripts/instantiate_country_nodes.py
      - name: Refresh sourced country observations
        run: python scripts/refresh_country_atlas.py
      - name: Consolidate country records and remove generated clutter
        run: python scripts/consolidate_country_library.py
      - name: Commit canonical country library
        run: |
          set -e
          git config user.name 'country-atlas-bot'
          git config user.email 'country-atlas-bot@users.noreply.github.com'
          git add data/countries data/country-layer-manifest.json
          if git diff --cached --quiet; then
            echo 'No country library changes.'
            exit 0
          fi
          git commit -m 'Maintain canonical country library'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt ${attempt} lost a race; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
          done
          echo 'Unable to push country library after 3 attempts.'
          exit 1
