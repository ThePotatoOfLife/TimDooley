name: Temporary Subdivision Freeze Probe

on:
  push:
    branches: [fix/world-map-subdivision-freeze-2026-09-15]
    paths:
      - 'world-map/3d-subdivisions.js'
      - 'scripts/test_world_map_subdivision_freeze.mjs'
      - '.github/workflows/temp-subdivision-freeze-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/test_world_map_subdivision_freeze.mjs
      - run: node --check world-map/3d-subdivisions.js
