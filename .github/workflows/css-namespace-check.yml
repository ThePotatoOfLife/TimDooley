name: CSS namespace check

on:
  push:
    paths:
      - '**/*.html'
      - 'app/*.css'
      - 'scripts/check_css_namespace_collisions.py'
      - '.github/workflows/css-namespace-check.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'app/*.css'
      - 'scripts/check_css_namespace_collisions.py'
      - '.github/workflows/css-namespace-check.yml'

jobs:
  css-namespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_css_namespace_collisions.py
