name: Bible quality checks

on:
  push:
    paths:
      - 'app/bible-*.js'
      - 'app/bible-*.css'
      - 'traditions/bible/**'
      - 'knowledge/traditions/bible-*.json'
      - 'knowledge/traditions/biblical-*.json'
      - 'knowledge/indexes/bible-*.json'
      - 'scripts/bible_corpus.py'
      - 'scripts/*bible*.py'
      - '.github/workflows/bible-quality-checks.yml'
  pull_request:
    paths:
      - 'app/bible-*.js'
      - 'app/bible-*.css'
      - 'traditions/bible/**'
      - 'knowledge/traditions/bible-*.json'
      - 'knowledge/traditions/biblical-*.json'
      - 'knowledge/indexes/bible-*.json'
      - 'scripts/bible_corpus.py'
      - 'scripts/*bible*.py'
      - '.github/workflows/bible-quality-checks.yml'

permissions:
  contents: read

jobs:
  verify-bible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate manifest and corpus
        run: |
          python scripts/validate_bible_layer_manifest.py
          python scripts/test_bible_corpus.py
          python scripts/test_bible_comparator_coverage.py
          python scripts/check_biblical_scenes.py
          python scripts/build_bible_comparator_quality.py

      - name: Validate reader contract
        run: python scripts/validate_bible_reader.py

      - name: Validate JavaScript syntax
        run: node --check app/bible-corpus-loader.js && node --check app/bible-study.js

      - name: Build site and comparator
        run: |
          python scripts/build_site.py
          python scripts/build_bible_study.py

      - name: Validate static dynamic parity
        run: python scripts/check_bible_static_dynamic_parity.py
