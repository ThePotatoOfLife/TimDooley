<title id="title">Pixel village and mountain plane</title>
<desc id="desc">A cozy low-resolution RPG-style side view with blue sky, bright clouds, layered mountains, two villages, river, tower, fields, winding paths and roots beginning beneath the ordinary world.</desc>

