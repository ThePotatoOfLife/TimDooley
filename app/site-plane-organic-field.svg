<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Pixel village and mountain plane</title>
<desc id="desc">A cozy low-resolution RPG-style side view with blue sky, bright clouds, layered mountains, two villages, river, tower, fields, winding paths and roots beginning beneath the ordinary world.</desc>

<!--
  PLANE SCENE PLATE
  -----------------
  Old-RPG composition: readable landmarks, broad colour blocks, no filters.
  The upper edge echoes Heaven's light; the lower edge exposes the first soil/root pixels
  so the three floors feel like one vertical world rather than three unrelated wallpapers.
-->

