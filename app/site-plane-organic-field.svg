<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc">
<title id="title">Plane side-view scene</title>
<desc id="desc">A restrained pixel-art-like side view with mountain, two villages, open plane, curved paths, circles, trees and field spirals.</desc>
<defs>
  <linearGradient id="distance" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c8d8d4" stop-opacity=".22"/>
    <stop offset="1" stop-color="#718873" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b9c985" stop-opacity=".20"/>
    <stop offset="1" stop-color="#63764d" stop-opacity=".09"/>
  </linearGradient>
</defs>

<!-- distant round light / clouds -->
<circle cx="1270" cy="220" r="92" fill="#ffe5a3" fill-opacity=".14"/>
<g fill="#dce9e7" fill-opacity=".055">
  <ellipse cx="340" cy="290" rx="170" ry="48"/>
  <ellipse cx="455" cy="268" rx="120" ry="38"/>
  <ellipse cx="1035" cy="360" rx="210" ry="52"/>
  <ellipse cx="1165" cy="332" rx="126" ry="40"/>
</g>

<!-- stepped, pixel-art-like mountain silhouette -->
<path d="M0 720 H130 V675 H230 V620 H315 V560 H400 V500 H485 V430 H565 V360 H640 V420 H710 V485 H790 V540 H865 V595 H950 V640 H1045 V680 H1135 V720 H1600 V910 H0 Z"
      fill="url(#distance)"/>
<path d="M360 552 H445 V500 H520 V445 H600 V390 H640 V420 H710 V485 H765 V520 H680 V505 H625 V480 H560 V520 H500 V570 H430 V610 H360 Z"
      fill="#e5e1bd" fill-opacity=".06"/>

<!-- first village -->
<g opacity=".22">
  <g fill="#574e40">
    <rect x="155" y="875" width="92" height="72"/><rect x="285" y="895" width="78" height="58"/>
    <rect x="395" y="860" width="108" height="87"/><rect x="535" y="905" width="70" height="42"/>
  </g>
  <g fill="#766448">
    <path d="M145 875 L201 830 L257 875 Z"/><path d="M277 895 L324 858 L371 895 Z"/>
    <path d="M385 860 L449 808 L513 860 Z"/><path d="M527 905 L570 870 L613 905 Z"/>
  </g>
  <g fill="#f2d58c" fill-opacity=".46">
    <rect x="180" y="900" width="12" height="12"/><rect x="220" y="900" width="12" height="12"/>
    <rect x="418" y="887" width="13" height="13"/><rect x="468" y="887" width="13" height="13"/>
    <rect x="308" y="915" width="11" height="11"/>
  </g>
</g>

<!-- open plane: soft circular field boundaries instead of straight bands -->
<g fill="none" stroke-linecap="round">
  <ellipse cx="355" cy="1180" rx="430" ry="205" stroke="#d7d49f" stroke-opacity=".10" stroke-width="12"/>
  <ellipse cx="865" cy="1225" rx="535" ry="250" stroke="#b4c38b" stroke-opacity=".11" stroke-width="15"/>
  <ellipse cx="1360" cy="1160" rx="360" ry="192" stroke="#d9cf92" stroke-opacity=".08" stroke-width="10"/>
  <circle cx="790" cy="1270" r="135" stroke="#e4d7a0" stroke-opacity=".085" stroke-width="7"/>
  <circle cx="790" cy="1270" r="208" stroke="#9db88a" stroke-opacity=".06" stroke-width="6"/>
</g>

<!-- winding road / river: two entangled strings -->
<g fill="none" stroke-linecap="round">
  <path d="M-80 1015 C160 930 300 1100 505 1015 C735 920 870 1115 1085 1012 C1285 915 1455 1060 1680 955"
        stroke="#dfd0a0" stroke-opacity=".13" stroke-width="24"/>
  <path d="M-60 1035 C175 958 312 1120 520 1035 C748 942 892 1135 1105 1032 C1295 940 1472 1080 1660 985"
        stroke="#709b8d" stroke-opacity=".10" stroke-width="10"/>
</g>

<!-- trees are tiny block/squiggle hybrids -->
<g opacity=".18">
  <g fill="#314c37">
    <rect x="710" y="925" width="11" height="54"/><rect x="755" y="942" width="9" height="47"/>
    <rect x="880" y="910" width="11" height="57"/><rect x="925" y="940" width="9" height="44"/>
    <rect x="1110" y="915" width="10" height="52"/>
  </g>
  <g fill="#67845b">
    <circle cx="715" cy="912" r="30"/><circle cx="759" cy="930" r="24"/>
    <circle cx="885" cy="898" r="31"/><circle cx="929" cy="928" r="24"/><circle cx="1115" cy="902" r="29"/>
  </g>
</g>

<!-- second village, smaller/farther -->
<g opacity=".18">
  <g fill="#514a3e">
    <rect x="1160" y="1370" width="76" height="58"/><rect x="1270" y="1352" width="94" height="76"/>
    <rect x="1400" y="1380" width="68" height="48"/>
  </g>
  <g fill="#746046">
    <path d="M1150 1370 L1198 1332 L1246 1370 Z"/>
    <path d="M1260 1352 L1317 1305 L1374 1352 Z"/>
    <path d="M1392 1380 L1434 1347 L1476 1380 Z"/>
  </g>
  <g fill="#f1d185" fill-opacity=".40">
    <rect x="1190" y="1390" width="10" height="10"/><rect x="1301" y="1378" width="11" height="11"/>
    <rect x="1336" y="1378" width="11" height="11"/>
  </g>
</g>

<!-- field spirals and loops become more visible as the reader descends -->
<g fill="none" stroke="#d8d0a0" stroke-linecap="round">
  <path d="M310 1545 C365 1485 455 1508 446 1577 C436 1656 326 1652 300 1588 C272 1518 343 1462 420 1490 C518 1526 513 1645 430 1705"
        stroke-opacity=".12" stroke-width="10"/>
  <path d="M995 1600 C1058 1528 1168 1558 1144 1640 C1120 1725 1003 1695 1014 1616 C1023 1547 1122 1519 1184 1582 C1260 1660 1210 1780 1105 1802"
        stroke-opacity=".11" stroke-width="9"/>
  <path d="M560 1920 C650 1810 810 1865 785 1985 C760 2108 585 2080 600 1965 C612 1868 755 1832 842 1920"
        stroke-opacity=".09" stroke-width="12"/>
</g>

<!-- lower field: roots begin to show beneath the ordinary world -->
<g fill="none" stroke="#70805b" stroke-opacity=".11" stroke-linecap="round">
  <path d="M170 1710 C245 1810 150 1880 230 1985 C300 2080 190 2170 260 2390" stroke-width="11"/>
  <path d="M780 1700 C690 1810 845 1900 760 2010 C675 2118 825 2200 790 2390" stroke-width="13"/>
  <path d="M1390 1688 C1470 1790 1360 1895 1438 2005 C1510 2105 1390 2200 1450 2390" stroke-width="10"/>
  <path d="M-50 2080 C180 1955 360 2190 590 2070 C800 1960 1010 2190 1240 2060 C1410 1965 1515 2105 1660 2020" stroke-width="9"/>
</g>

<!-- quiet ground body -->
<path d="M0 920 C250 875 465 940 710 905 C965 870 1165 955 1600 890 V2400 H0 Z" fill="url(#field)" opacity=".42"/>
</svg>