<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Organic Plane field</title>
<desc id="desc">Soft circular landforms, spirals, entwined living lines and root-like curves for the middle Plane atmosphere.</desc>
<defs>
  <linearGradient id="vine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d7e7c1" stop-opacity=".10"/>
    <stop offset=".48" stop-color="#e8dca3" stop-opacity=".30"/>
    <stop offset="1" stop-color="#7eb0a5" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8d69d" stop-opacity=".08"/>
    <stop offset=".48" stop-color="#a3c18f" stop-opacity=".25"/>
    <stop offset="1" stop-color="#6f8c65" stop-opacity=".07"/>
  </linearGradient>
</defs>

<!-- circular / vesica-like landscape forms -->
<g fill="none" stroke-linecap="round">
  <ellipse cx="250" cy="760" rx="320" ry="205" stroke="#bbd5b0" stroke-opacity=".11" stroke-width="9"/>
  <ellipse cx="620" cy="820" rx="420" ry="260" stroke="#d6cea0" stroke-opacity=".085" stroke-width="7"/>
  <ellipse cx="1080" cy="790" rx="405" ry="245" stroke="#a8c6ae" stroke-opacity=".10" stroke-width="9"/>
  <ellipse cx="1435" cy="745" rx="290" ry="190" stroke="#d1c995" stroke-opacity=".08" stroke-width="7"/>
  <circle cx="805" cy="735" r="155" stroke="#e0d9aa" stroke-opacity=".075" stroke-width="5"/>
  <circle cx="805" cy="735" r="235" stroke="#9fbba3" stroke-opacity=".06" stroke-width="4"/>
</g>

