<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc">
<title id="title">Ground-to-depth root scene</title>
<desc id="desc">A side-view lower world beginning at grass and topsoil, then descending through circles, spirals, tangled roots, stones and darker earth.</desc>
<defs>
  <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d5a36f" stop-opacity=".34"/>
    <stop offset=".46" stop-color="#a26543" stop-opacity=".32"/>
    <stop offset="1" stop-color="#673e2d" stop-opacity=".18"/>
  </linearGradient>
</defs>

<!-- touchable surface / grass: broken, not a straight ruler -->
<g fill="#7f925a" fill-opacity=".34">
  <path d="M0 105 L32 82 L52 111 L88 66 L110 110 L148 76 L172 112 L210 68 L235 108 L270 78 L300 112 L340 62 L364 110 L405 73 L430 112 L470 64 L495 108 L530 80 L560 111 L600 68 L630 110 L665 73 L694 112 L735 65 L760 109 L802 72 L830 112 L868 65 L895 108 L935 77 L962 111 L1000 67 L1025 110 L1064 74 L1090 112 L1130 64 L1160 109 L1195 78 L1220 112 L1260 66 L1288 108 L1330 72 L1358 112 L1400 64 L1425 110 L1465 76 L1490 110 L1530 68 L1560 108 L1600 80 V145 H0 Z"/>
</g>
<g fill="#b28c5e" fill-opacity=".18">
  <ellipse cx="180" cy="160" rx="180" ry="68"/><ellipse cx="520" cy="175" rx="230" ry="85"/>
  <ellipse cx="930" cy="162" rx="245" ry="78"/><ellipse cx="1390" cy="175" rx="225" ry="82"/>
</g>

<!-- five major roots -->
<g fill="none" stroke="url(#root)" stroke-linecap="round">
