<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Pixel sediment, root swamp and lower fire</title>
<desc id="desc">A cozy low-resolution RPG-style vertical cross-section beginning at grass and light mud, descending through sediment, roots, pebbles, swamp pockets, steam, buried chambers and hotter fire-lit lower earth.</desc>

<!--
  BELOW SCENE PLATE
  =================
  The underside of the Plane: sediment first, cave-space second.
  The reader descends through compact soil, mud, root curtains, pebbles and wet pockets.
  Small hidden chambers are bubbles inside the earth, not one giant scenic cave.
  Deeper down the palette becomes swampier, steamier and hotter before near-black depth.
-->

