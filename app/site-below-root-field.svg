<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Pixel roots and underground caverns</title>
<desc id="desc">A cozy low-resolution RPG-style underground cross-section beginning at grass and topsoil, descending through roots, stones, lantern caverns, water pockets, spirals and a dark lower basin.</desc>

<!--
  BELOW SCENE PLATE
  -----------------
  This is the underside of the Plane, not a separate wallpaper.
  It begins with the same grassy soil lip, then turns into a Zelda-like cave/cellar world.
  Warm lanterns keep it inhabited and cozy; darkness increases with depth.
-->

