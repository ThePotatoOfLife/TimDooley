<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2600" role="img" aria-labelledby="title desc">
  <title id="title">Luminous world-tree perspective</title>
  <desc id="desc">A quiet world tree seen from beneath, with light rising from broad roots, spiralling through the trunk and opening into a crown among the stars.</desc>
  <defs>
    <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#423a34" stop-opacity=".08"/>
      <stop offset=".24" stop-color="#8b765e" stop-opacity=".22"/>
      <stop offset=".50" stop-color="#dcc394" stop-opacity=".34"/>
      <stop offset=".74" stop-color="#806b56" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3d3631" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="root" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6b77f" stop-opacity=".34"/>
      <stop offset=".56" stop-color="#9b7754" stop-opacity=".22"/>
      <stop offset="1" stop-color="#594536" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="lightRise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#efb76c" stop-opacity=".12"/>
      <stop offset=".28" stop-color="#ffe4a8" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#f7f2cf" stop-opacity=".86"/>
      <stop offset=".82" stop-color="#d8e7ff" stop-opacity=".66"/>
      <stop offset="1" stop-color="#cbbcff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="lightTwin" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c98b5e" stop-opacity=".06"/>
      <stop offset=".34" stop-color="#f2c99a" stop-opacity=".48"/>
      <stop offset=".66" stop-color="#d7eaff" stop-opacity=".54"/>
      <stop offset="1" stop-color="#bfa7ff" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="leaf" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cbd8b4" stop-opacity=".18"/>
      <stop offset=".58" stop-color="#9faf8c" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6d7867" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0c8" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#dce9ff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#dce9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wideGlow"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <!-- high sky: stars remain visible through the open crown -->
  <g fill="#f5efd9">
    <circle cx="166" cy="116" r="3" opacity=".58"/><circle cx="336" cy="244" r="2.2" opacity=".40"/>
    <circle cx="515" cy="88" r="2.6" opacity=".52"/><circle cx="736" cy="176" r="2.3" opacity=".36"/>
    <circle cx="931" cy="92" r="3.2" opacity=".58"/><circle cx="1128" cy="223" r="2.1" opacity=".44"/>
    <circle cx="1335" cy="110" r="2.8" opacity=".50"/><circle cx="1460" cy="292" r="2.2" opacity=".38"/>
    <circle cx="250" cy="420" r="1.8" opacity=".32"/><circle cx="1264" cy="452" r="1.9" opacity=".34"/>
    <circle cx="690" cy="315" r="1.8" opacity=".26"/><circle cx="866" cy="258" r="2" opacity=".32"/>
  </g>
  <ellipse cx="800" cy="330" rx="650" ry="390" fill="url(#halo)" filter="url(#softer)"/>

  <!-- crown seen from beneath: broad peripheral masses, open reading centre -->
  <g fill="url(#leaf)" filter="url(#soft)">
    <ellipse cx="245" cy="520" rx="345" ry="278"/>
    <ellipse cx="548" cy="392" rx="392" ry="304"/>
    <ellipse cx="988" cy="392" rx="420" ry="315"/>
    <ellipse cx="1362" cy="530" rx="360" ry="290"/>
    <ellipse cx="800" cy="674" rx="625" ry="320" opacity=".68"/>
  </g>

  <!-- a dim physical tree gives the light a body without becoming a foreground illustration -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M785 1375 C760 1185 720 1030 625 900 C520 760 365 662 170 590" stroke="url(#trunk)" stroke-width="58"/>
    <path d="M808 1368 C845 1168 902 1020 1005 880 C1112 735 1260 650 1472 575" stroke="url(#trunk)" stroke-width="62"/>
    <path d="M770 1180 C645 1080 520 1010 338 960" stroke="#b39972" stroke-opacity=".16" stroke-width="31"/>
    <path d="M840 1155 C1000 1055 1125 1008 1324 975" stroke="#b39972" stroke-opacity=".15" stroke-width="30"/>
    <path d="M674 932 C545 815 434 746 265 704" stroke="#c3a47b" stroke-opacity=".12" stroke-width="18"/>
    <path d="M1000 905 C1118 808 1240 748 1390 712" stroke="#c3a47b" stroke-opacity=".12" stroke-width="18"/>
  </g>

  <!-- broad lower trunk, deliberately translucent -->
  <path d="M708 1840 C710 1680 725 1515 770 1340 C792 1252 814 1248 836 1340 C880 1518 894 1685 902 1840 Z" fill="url(#trunk)"/>

  <!-- the Tree of Light: two intertwined currents climb from root flare into the stars -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M748 1910
             C650 1800 657 1688 760 1588
             C892 1460 910 1350 790 1235
             C670 1122 684 1000 824 884
             C954 776 948 665 805 552
             C690 460 704 350 832 242
             C895 188 930 132 946 74"
          stroke="url(#lightRise)" stroke-width="13" opacity=".78"/>
    <path d="M860 1910
             C958 1800 948 1682 838 1583
             C706 1464 695 1348 812 1238
             C930 1127 914 1002 775 892
             C646 790 652 668 794 555
             C914 460 900 344 777 246
             C718 198 684 143 668 86"
          stroke="url(#lightTwin)" stroke-width="10" opacity=".62"/>
    <path d="M800 1920 C802 1650 800 1370 803 1080 C806 795 804 510 805 185"
          stroke="#fff3ca" stroke-width="4" stroke-opacity=".46"/>
  </g>

  <!-- diffuse aura makes the luminous trunk read as radiance rather than neon -->
  <g fill="none" stroke-linecap="round" filter="url(#wideGlow)">
    <path d="M760 1900 C680 1760 688 1635 785 1530 C888 1418 890 1305 800 1205 C706 1100 710 985 812 875 C910 768 910 650 804 535 C734 458 735 350 804 250"
          stroke="#f8e9b5" stroke-width="44" stroke-opacity=".10"/>
  </g>

  <!-- luminous branch veins disperse from the spiral into canopy and sky -->
  <g fill="none" stroke="#edf4dc" stroke-linecap="round" filter="url(#glow)">
    <path d="M808 930 C690 812 548 710 352 638" stroke-width="6" stroke-opacity=".24"/>
    <path d="M808 930 C930 814 1078 705 1278 632" stroke-width="6" stroke-opacity=".24"/>
    <path d="M798 698 C690 592 570 510 426 458" stroke-width="4" stroke-opacity=".18"/>
    <path d="M808 698 C920 586 1040 510 1182 452" stroke-width="4" stroke-opacity=".18"/>
    <path d="M802 514 C740 430 710 348 712 270" stroke-width="3" stroke-opacity=".16"/>
    <path d="M808 514 C872 430 902 348 894 268" stroke-width="3" stroke-opacity=".16"/>
  </g>

  <!-- ground arrives late; it should be discovered, not announced -->
  <path d="M0 1870 C290 1835 500 1892 790 1860 C1080 1828 1300 1889 1600 1852 L1600 1930 C1285 1968 1060 1912 790 1942 C500 1976 272 1918 0 1950 Z" fill="#6f563d" opacity=".10"/>
  <path d="M0 1912 C305 1882 525 1937 792 1907 C1086 1874 1312 1930 1600 1896" fill="none" stroke="#d4b879" stroke-opacity=".16" stroke-width="5"/>

  <!-- physical roots fan toward the reader -->
  <g fill="none" stroke="url(#root)" stroke-linecap="round">
    <path d="M760 1870 C690 1980 560 2090 320 2255 C220 2324 126 2394 40 2508" stroke-width="62"/>
    <path d="M840 1870 C930 1980 1065 2098 1284 2250 C1392 2325 1483 2398 1566 2518" stroke-width="66"/>
    <path d="M785 1880 C752 2040 688 2195 585 2392 C550 2456 520 2516 500 2575" stroke-width="42"/>
    <path d="M822 1880 C862 2038 930 2192 1035 2390 C1070 2455 1103 2512 1128 2578" stroke-width="44"/>
    <path d="M798 1890 C800 2080 798 2300 800 2595" stroke-width="34"/>
  </g>

  <!-- light is gathered from the ground/root network into the ascending spiral -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M88 2512 C260 2350 474 2160 746 1910" stroke="#e7b96f" stroke-width="7" stroke-opacity=".24"/>
    <path d="M1518 2510 C1350 2345 1132 2155 858 1910" stroke="#f0cf91" stroke-width="7" stroke-opacity=".22"/>
    <path d="M505 2570 C588 2335 660 2110 748 1910" stroke="#f5d498" stroke-width="5" stroke-opacity=".20"/>
    <path d="M1120 2572 C1028 2335 950 2110 858 1910" stroke="#e9d9b8" stroke-width="5" stroke-opacity=".18"/>
  </g>

  <!-- close-ground stones and fine roots -->
  <g fill="#a79882">
    <ellipse cx="210" cy="2220" rx="18" ry="10" opacity=".09"/>
    <ellipse cx="410" cy="2420" rx="13" ry="8" opacity=".08"/>
    <ellipse cx="1192" cy="2355" rx="16" ry="9" opacity=".08"/>
    <ellipse cx="1438" cy="2208" rx="19" ry="11" opacity=".09"/>
  </g>
  <g fill="none" stroke="#b28a5e" stroke-opacity=".13" stroke-linecap="round">
    <path d="M318 2258 C260 2310 240 2385 232 2468" stroke-width="7"/>
    <path d="M1280 2258 C1348 2318 1370 2392 1382 2472" stroke-width="7"/>
    <path d="M585 2390 C530 2435 490 2500 470 2582" stroke-width="6"/>
    <path d="M1034 2392 C1088 2442 1124 2502 1143 2585" stroke-width="6"/>
  </g>
</svg>