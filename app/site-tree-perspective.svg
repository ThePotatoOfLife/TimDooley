<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2600" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">Pixel world tree above the heavenly garden</title>
<desc id="desc">A cozy low-resolution RPG-style world tree seen from below: purple starlit crown-space above, luminous canopy, peach-gold descent, garden terraces and a trunk carrying light from broad roots toward the stars.</desc>

<!--
  HEAVEN SCENE PLATE
  =================
  Deliberately built from large block shapes rather than filters or fine vector detail.
  It should read like an old 16/32-bit RPG background when viewed through the site glass.
  Continuity rule: crown and sky above, garden/terrace near the lower edge, trunk continues
  toward the Plane instead of ending as a decorative poster.
-->

