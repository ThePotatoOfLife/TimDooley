<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Long-form canonical Potatoism concept dossier."><title>Potatoism Entry — The Potato of Life</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css"><style>.potato-entry{max-width:1100px;margin:0 auto}.potato-entry-header{padding:34px 0 24px;border-bottom:1px solid var(--line,#d7d0c2)}.potato-entry-header h1{font-size:clamp(2.2rem,5vw,4.4rem);line-height:1.02;margin:.15em 0}.entry-meta{display:flex;gap:10px;flex-wrap:wrap}.entry-chip{display:inline-flex;padding:6px 10px;border:1px solid var(--line,#d7d0c2);background:var(--paper,#fffdf8);font-size:.82rem}.entry-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px;margin-top:28px}.entry-body{min-width:0}.entry-section{padding:24px 0;border-bottom:1px solid var(--line,#d7d0c2)}.entry-section h2{margin-top:0}.entry-section p{font-size:1.04rem;line-height:1.82;white-space:pre-line}.entry-section ul{line-height:1.75}.entry-aside{position:sticky;top:86px;align-self:start;padding:18px;background:var(--paper,#fffdf8);border:1px solid var(--line,#d7d0c2)}.entry-aside a{display:block;padding:7px 0}.entry-related{display:flex;flex-wrap:wrap;gap:8px}.entry-related a{padding:8px 10px;border:1px solid var(--line,#d7d0c2);text-decoration:none;background:var(--paper,#fffdf8)}.entry-notice{padding:16px 18px;margin-top:18px;border-left:4px solid var(--accent,#a94f2c);background:rgba(169,79,44,.06)}.entry-loading{padding:70px 0;font:400 2rem Georgia,serif;color:var(--muted,#706d65)}@media(max-width:800px){.entry-grid{grid-template-columns:1fr}.entry-aside{position:static}}</style></head><body><header class="portal-header"><a class="portal-brand" href="index.html">THE POTATO OF LIFE</a><nav aria-label="Primary"><a href="index.html">Home</a><a href="repository.html">Repository</a><a href="timeline.html">Timeline</a><a href="nations.html">World</a><a href="people.html">People</a><a href="belief.html">Ideas</a><a href="potatoism.html" aria-current="page">Potatoism</a><a href="hawkins.html">Hawkins</a></nav></header><main class="section potato-entry" id="entry-page"><div class="entry-loading">Preparing canonical dossier…</div></main><footer><span>THE POTATO OF LIFE · POTATOISM</span><span><a href="potatoism.html">Potatoism</a> · <a href="repository.html">Repository</a></span></footer><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=s=>String(s??'').toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');async function load(path){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error(`${path} ${r.status}`);return r.json()}
function byId(entries,id){const wanted=slug(id);return entries.find(x=>slug(x.id)===wanted||slug(x.term)===wanted)}
function build(term,all){const related=(term.related_terms||[]).map(id=>all.find(x=>slug(x.id)===slug(id)||slug(x.term)===slug(id))).filter(Boolean);const body=`<div class="potato-entry-header"><p class="section-label">POTATOISM · CANONICAL DOSSIER</p><h1>${esc(term.term)}</h1><div class="entry-meta"><span class="entry-chip">${esc(term.family||'project concept')}</span><span class="entry-chip">${esc(term.evidence_status||'project-defined')}</span><span class="entry-chip">One canonical identity</span></div><div class="entry-notice"><strong>This is the canonical reading surface.</strong> Other Potatoism files may contain occurrences, relationships or historical versions of this concept, but they do not create another definition.</div></div><div class="entry-grid"><article class="entry-body"><section class="entry-section"><p class="section-label">DEFINITION</p><h2>What it is</h2><p>${esc(term.definition||'No canonical definition has been written yet.')}</p></section><section class="entry-section"><p class="section-label">LONG FORM</p><h2>The study</h2><p>${esc(term.long_form||'This concept is registered, but its dense dossier has not yet been written. The archive deliberately shows that gap instead of generating repetitive filler.')}</p></section><section class="entry-section"><p class="section-label">RESEARCH QUESTIONS</p><h2>What remains to be worked out</h2>${(term.research_questions||[]).map(q=>`<p>• ${esc(q)}</p>`).join('')||'<p>No research questions have been recorded yet.</p>'}</section><section class="entry-section"><p class="section-label">RELATED CONCEPTS</p><h2>Connections, not duplicates</h2><div class="entry-related">${related.map(x=>`<a href="potatoism-entry.html?term=${encodeURIComponent(x.id)}">${esc(x.term)}</a>`).join('')||'<span class="muted">No canonical related concepts recorded yet.</span>'}</div></section><section class="entry-section"><p class="section-label">PROVENANCE</p><h2>Where this concept occurs</h2><p>This dossier is the canonical content owner. Source occurrences and projections remain addressable through the Repository so the history is not lost while duplicate identities are removed.</p>${(term.sources||[]).map(s=>`<p>${esc(s)}</p>`).join('')}</section></article><aside class="entry-aside"><strong>Canonical entry</strong><a href="potatoism.html">← Potatoism</a><a href="repository.html">Repository</a><hr><strong>Canonical ID</strong><p>${esc(term.id)}</p><strong>Family</strong><p>${esc(term.family||'project concept')}</p><strong>Status</strong><p>One identity · one dossier</p></aside></div>`;return body}
(async()=>{const params=new URLSearchParams(location.search),id=params.get('term')||'potato-of-life',data=await load('data/potatoism-dossiers.json');const entries=data.entries||[],term=byId(entries,id),root=document.getElementById('entry-page');if(!term){root.innerHTML='<div class="entry-notice"><strong>No canonical dossier exists for this term yet.</strong><p>The archive will not manufacture a duplicate or filler entry. Return to <a href="potatoism.html">Potatoism</a> or inspect the Repository.</p></div>';return}document.title=term.term+' — Potatoism — The Potato of Life';root.innerHTML=build(term,entries)})().catch(e=>{document.getElementById('entry-page').innerHTML=`<div class="entry-notice"><strong>Canonical dossier could not be loaded.</strong><p>${esc(e.message)}</p></div>`});</script></body></html>
