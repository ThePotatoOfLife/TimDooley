<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Long-form Potatoism entry dossier."><title>Potatoism Entry — The Potato of Life</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css"><style>.potato-entry{max-width:1100px;margin:0 auto}.potato-entry-header{padding:34px 0 24px;border-bottom:1px solid var(--line,#d7d0c2)}.potato-entry-header h1{font-size:clamp(2.2rem,5vw,4.4rem);line-height:1.02;margin:.15em 0}.entry-meta{display:flex;gap:10px;flex-wrap:wrap}.entry-chip{display:inline-flex;padding:6px 10px;border:1px solid var(--line,#d7d0c2);background:var(--paper,#fffdf8);font-size:.82rem}.entry-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px;margin-top:28px}.entry-body{min-width:0}.entry-section{padding:24px 0;border-bottom:1px solid var(--line,#d7d0c2)}.entry-section h2{margin-top:0}.entry-section p{font-size:1.04rem;line-height:1.82}.entry-section ul{line-height:1.75}.entry-aside{position:sticky;top:86px;align-self:start;padding:18px;background:var(--paper,#fffdf8);border:1px solid var(--line,#d7d0c2)}.entry-aside a{display:block;padding:7px 0}.entry-related{display:flex;flex-wrap:wrap;gap:8px}.entry-related a{padding:8px 10px;border:1px solid var(--line,#d7d0c2);text-decoration:none;background:var(--paper,#fffdf8)}.entry-notice{padding:16px 18px;margin-top:18px;border-left:4px solid var(--accent,#a94f2c);background:rgba(169,79,44,.06)}.entry-count{font-variant-numeric:tabular-nums}.entry-loading{padding:70px 0;font:400 2rem Georgia,serif;color:var(--muted,#706d65)}@media(max-width:800px){.entry-grid{grid-template-columns:1fr}.entry-aside{position:static}}</style></head><body><header class="portal-header"><a class="portal-brand" href="index.html">THE POTATO OF LIFE</a><nav aria-label="Primary"><a href="index.html">Home</a><a href="repository.html">Repository</a><a href="timeline.html">Timeline</a> const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=s=>String(s??'').toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');async function load(path,fallback){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error();return await r.json()}catch{return fallback}}function bySlug(entries,id){return entries.find(x=>slug(x.term||x.name||x.id)===id||slug(x.id)===id)}function relatedTerms(term,entries,edges){const id=slug(term.term),relIds=new Set();for(const e of edges||[]){if(slug(e.from)===id)relIds.add(slug(e.to));if(slug(e.to)===id)relIds.add(slug(e.from))}const lexical=(term.definition||'').toLowerCase();return entries.filter(x=>x!==term&&(relIds.has(slug(x.term))||lexical.includes(String(x.term).toLowerCase()))).slice(0,12)}function paragraphFor(term,section,related,research){const name=term.term,def=term.definition,family=term.family||'project vocabulary',relNames=related.map(x=>x.term).join(', ')||'the surrounding vocabulary';if(section==='definition')return `${name} is defined in the Potatoism lexicon as ${def} This is a project-level definition: it tells us how the repository uses the term, rather than claiming that the term has one universally accepted meaning outside the project. The family classification is ${family}. The entry is therefore a study of a term in context, not merely a label attached to an image.`;if(section==='function')return `Within the larger architecture, ${name} functions as a piece of a system rather than as an isolated object. Potatoism repeatedly asks what is above, below, inside, outside, before and after a thing. For ${name}, the surrounding vocabulary includes ${relNames}. Read together, these terms create a field in which each concept modifies the meaning of the others.`;if(section==='symbolic')return `The symbolic reading of ${name} begins with the ordinary meaning and asks what structural problem the symbol solves. A symbol concerning growth invites questions about root and fruit; a threshold invites questions about what is crossed; an orientation invites questions about the reference point; conflict invites questions about whether the tension is productive, destructive or unresolved.`;if(section==='relationships')return `The relationship layer is central here. ${name} is useful because it can be connected to ${relNames}. These connections should be read as typed relationships, not as proof that all the concepts historically came from one source. The repository keeps project-symbolic association, comparative analogy, historical influence, textual inheritance and empirical connection distinct.`;if(section==='development')return `A useful way to read ${name} through time is as a developing concept. An image can become a metaphor, acquire relationships and eventually become part of a larger architecture. The archive should distinguish origin, adoption, reinterpretation and later synthesis rather than projecting later meanings backwards.`;if(section==='comparative')return `Comparison gives ${name} more depth when differences are recorded alongside resemblance. A Christian door is not automatically the Potatoism Door; a real brain structure is not automatically a spiritual chamber; North as a compass direction is not automatically North of North. Comparison is productive when the source tradition, structural resemblance and Potatoism synthesis are kept visible.`;if(section==='world')return `The world-facing reading asks what happens when ${name} becomes an analytical question. The archive can ask what supports a system, where value enters, where it accumulates, what depends on what, which institutions mediate it, and what breaks when a connection is removed. The symbol prompts investigation without pretending to be measurement.`;if(section==='epistemology')return `The epistemic boundary matters especially for ${name}. Project mythology can be meaningful and internally coherent without becoming empirical fact. Historical claims need historical sources; scientific claims need scientific evidence; comparative claims need enough source material to distinguish resemblance from inheritance. The reader should always be able to tell which kind of statement they are reading.`;if(section==='research'){const hits=(research.layers||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(name.toLowerCase())).flatMap(x=>x.facts||[]).slice(0,4);return `${hits.length?`Relevant research material already in the archive includes: ${hits.join(' ')}`:`No dedicated external evidence paragraph is attached to ${name} yet; the archive marks that gap instead of inventing facts.`} The next research pass should collect primary or authoritative sources, competing interpretations, dates, provenance and negative evidence where relevant.`}return `This section expands the working study of ${name}. The term belongs to the ${family} family and participates in a network that includes ${relNames}. A dense entry is not simply a longer assertion; it is a larger surface on which evidence, disagreement, uncertainty and interpretation can be seen together.`}
function build(term,entries,edges,research){const related=relatedTerms(term,entries,edges),sections=[['Definition and scope','definition'],['Function inside Potatoism','function'],['Symbolic mechanics','symbolic'],['Relationship network','relationships'],['Development through time','development'],['Comparative reading','comparative'],['World-facing interpretation','world'],['Evidence and epistemic boundary','epistemology'],['Research dossier and open questions','research'],['Why this entry belongs in the archive','archive']];let body=`<div class="potato-entry-header"><p class="section-label">POTATOISM · FULL ENTRY</p><h1>${esc(term.term)}</h1><div class="entry-meta"><span class="entry-chip">${esc(term.family||'project vocabulary')}</span><span class="entry-chip entry-count">Long-form study</span><span class="entry-chip">Canonical lexicon term</span></div><div class="entry-notice"><strong>Reading rule:</strong> this page expands the project's internal framework. It does not turn symbolic correspondence into scientific or historical proof.</div></div><div class="entry-grid"><article class="entry-body">`;for(const [heading,key] of sections)body+=`<section class="entry-section"><p class="section-label">${esc(key.toUpperCase())}</p><h2>${esc(heading)}</h2><p>${esc(paragraphFor(term,key,related,research))}</p><p>${esc(paragraphFor(term,key,related,research))}</p></section>`;body+=`<section class="entry-section"><p class="section-label">RELATED TERMS</p><h2>Keep reading outward</h2><div class="entry-related">${related.map(x=>`<a href="potatoism-entry.html?term=${encodeURIComponent(slug(x.term))}">${esc(x.term)}</a>`).join('')||'<span class="muted">No direct lexical match yet; use the Repository relationship layer.</span>'}</div></section></article><aside class="entry-aside"><strong>Entry navigation</strong><a href="potatoism.html">← Potatoism</a><a href="repository.html">Repository</a><hr><strong>Term</strong><p>${esc(term.term)}</p><strong>Family</strong><p>${esc(term.family||'project vocabulary')}</p><strong>Definition</strong><p>${esc(term.definition)}</p></aside></div>`;return body}
(async()=>{const params=new URLSearchParams(location.search),id=params.get('term')||'potatoism';const [lex,research,rels]=await Promise.all([load('data/potatoism-lexicon.json',{entries:[]}),load('data/potatoism-research-expansion.json',{layers:[]}),load('data/potatoism-relationships.json',{edges:[]})]);const term=bySlug(lex.entries||[],slug(id)),root=document.getElementById('entry-page');if(!term){root.innerHTML='<div class="entry-notice"><strong>Entry not found.</strong><p>Return to <a href="potatoism.html">Potatoism</a> and choose a canonical term.</p></div>';return}document.title=term.term+' — Potatoism — The Potato of Life';root.innerHTML=build(term,lex.entries||[],rels.edges||[],research)})();</script></body></html>
