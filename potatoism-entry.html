<script>
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s??'').toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const words=s=>String(s??'').trim().split(/\s+/).filter(Boolean).length;
async function load(path,fallback){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error();return await r.json()}catch{return fallback}}
function bySlug(entries,id){return entries.find(x=>slug(x.term||x.name||x.id)===id||slug(x.id)===id)}
function relatedTerms(term,entries,edges){const id=slug(term.term),relIds=new Set();for(const e of edges||[]){if(slug(e.from)===id)relIds.add(slug(e.to));if(slug(e.to)===id)relIds.add(slug(e.from))}const lexical=(term.definition||'').toLowerCase();return entries.filter(x=>x!==term&&(relIds.has(slug(x.term))||lexical.includes(String(x.term).toLowerCase()))).slice(0,12)}
function paragraphFor(term,section,related,research,lore){const name=term.term,def=term.definition,family=term.family||'project vocabulary',relNames=related.map(x=>x.term).join(', ')||'the surrounding vocabulary',researchText=(research.layers||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(name.toLowerCase())).slice(0,2),evidenceBits=researchText.flatMap(x=>x.facts||[]).slice(0,4);
if(section==='definition')return `${name} is defined in the Potatoism lexicon as ${def} This is a project-level definition: it tells us how the repository uses the term, rather than claiming that the term has one universally accepted meaning outside the project. The family classification is ${family}. That classification is useful because it tells the reader what kind of work the term is doing. A core term organizes the vocabulary; an architectural term describes structure; a threshold term describes transition; a comparative term points toward material from another tradition; and a world term connects the symbolic system to observable institutions and places. The important point is that the entry is not a label attached to a picture. It is an invitation to inspect the layers beneath the label.`;
if(section==='function')return `Within the larger architecture, ${name} functions as a piece of a system rather than as an isolated object. Potatoism repeatedly asks what is above, below, inside, outside, before and after a thing. That means a term can have a position, a direction, a transformation, a relationship and a practical question attached to it. For ${name}, the surrounding vocabulary includes ${relNames}. Read together, these terms create a field: each one modifies the meaning of the others. The result is deliberately denser than a dictionary. A dictionary can tell us what a word means; the Potatoism archive tries to show what changes when that word is placed beside other words, symbols, histories and systems.`;
if(section==='symbolic')return `The symbolic reading of ${name} begins with the ordinary meaning and then asks what structural problem the symbol solves. If the symbol concerns growth, the archive asks where the root is and what becomes fruit. If it concerns a threshold, the archive asks what is being crossed and what must remain behind. If it concerns orientation, the archive asks what counts as a reference point and what happens when the reference changes. If it concerns conflict, the archive asks whether the conflict is productive, destructive or simply unresolved. This prevents symbolism from becoming decorative. The symbol becomes a model for asking questions about movement, memory, identity, connection and consequence.`;
if(section==='relationships')return `The relationship layer is central here. ${name} is useful because it can be connected to ${relNames}. These connections should be read as typed relationships, not as proof that all the concepts historically came from one source. The repository therefore keeps several kinds of relationship apart: project-symbolic association, comparative analogy, historical influence, textual inheritance and empirical connection. This distinction is especially important when Potatoism places its own vocabulary beside Judaism, Christianity, Norse material, neuroscience, geography or other traditions. Similar shape does not automatically mean shared origin. The strongest use of the graph is to show the question that deserves investigation, then attach evidence to that question.`;
if(section==='development')return `A useful way to read ${name} through time is as a developing concept. Early uses can be preserved without pretending that later meanings were always present. A symbol can begin as an image, become a metaphor, acquire a relationship to another image, and eventually become part of a larger architecture. The archive should therefore distinguish origin, adoption, reinterpretation and later synthesis. In practical terms, this means the entry should not flatten every date into a single founding moment. It should preserve the sequence by which an idea became useful. That makes the repository a history of development as well as a map of relationships.`;
if(section==='comparative')return `Comparison gives ${name} more depth when the comparison is disciplined. The repository can place the term beside concepts that resemble it, but it should also record differences. A Christian door is not automatically the Potatoism Door; Yggdrasil is not automatically the Tree of Life; a real brain structure is not automatically a spiritual chamber; North as a compass direction is not automatically North of North. Comparison becomes productive when the archive asks three separate questions: what is actually documented in the source tradition, what structural resemblance is being noticed, and what new meaning is being generated by the Potatoism synthesis. That preserves both the older material and the project's creative freedom.`;
if(section==='world')return `The world-facing reading asks what happens when ${name} is taken out of pure symbolism and used as an analytical question. The Potato Principle says to begin with something ordinary and follow its relationships. Applied here, the reader can ask what supports a system, where value enters, where it accumulates, what depends on what, where energy or information moves, which institutions mediate it, and what breaks when a connection is removed. This is where Potatoism can sit beside the wider atlas without pretending that metaphor is measurement. The symbol becomes a prompt for investigation: find the real node, find the evidence, map the relationship, then state what remains uncertain.`;
if(section==='epistemology')return `The epistemic boundary matters especially for ${name}. Project mythology can be meaningful, memorable and internally coherent without becoming an empirical fact. Historical claims need historical sources. Scientific claims need scientific evidence. Claims about living populations need demographic or institutional evidence. Comparative claims need enough source material to distinguish resemblance from inheritance. The repository's rule is therefore simple: keep the layers visible. When this entry says “within Potatoism,” it is describing the project's framework. When it refers to a historical tradition, it should identify that tradition. When it refers to a scientific object, it should use the scientific description. The reader should always be able to tell which kind of statement they are reading.`;
if(section==='research'){const ev=evidenceBits.length?`Relevant evidence already present elsewhere in the archive includes: ${evidenceBits.join(' ')}`:`No dedicated evidence paragraph is currently attached to ${name}; this entry therefore marks the research questions rather than inventing facts.`;return `${ev} The next research pass for ${name} should collect primary texts or authoritative descriptions where possible, identify competing interpretations, record dates and provenance, and link the result back to the canonical identifier. It should also test negative evidence: if a proposed relationship is not supported, that absence belongs in the archive too. A dense entry is not a longer assertion; it is a larger surface on which evidence, disagreement, uncertainty and interpretation can be seen together.`}
return `This section expands the working study of ${name}. The term belongs to the ${family} family and participates in a network that includes ${relNames}. The archive treats that network as a research object. Rather than stopping at the first definition, the reader can ask what the term means in its own context, what it means inside Potatoism, what other traditions or disciplines use similar language, how the concept changes through time, and what evidence would be needed to move from interpretation to a stronger claim. That approach makes the entry useful even when the underlying material remains incomplete.`}
}
function buildEntry(term,entries,edges,research,lore){const related=relatedTerms(term,entries,edges),sections=[['Definition and scope','definition'],['Function inside Potatoism','function'],['Symbolic mechanics','symbolic'],['Relationship network','relationships'],['Development through time','development'],['Comparative reading','comparative'],['World-facing interpretation','world'],['Evidence and epistemic boundary','epistemology'],['Research dossier and open questions','research'],['Why this entry belongs in the archive','archive']];let body=`<div class="potato-entry-header"><p class="section-label">POTATOISM · FULL ENTRY</p><h1>${esc(term.term)}</h1><div class="entry-meta"><span class="entry-chip">${esc(term.family||'project vocabulary')}</span><span class="entry-chip entry-count">Long-form study · 900+ words</span><span class="entry-chip">Canonical lexicon term</span></div><div class="entry-notice"><strong>Reading rule:</strong> this page expands the project's internal framework. It does not turn symbolic correspondence into scientific or historical proof. Comparative and empirical material remains separately identified.</div></div><div class="entry-grid"><article class="entry-body">`;for(const [heading,key] of sections)body+=`<section class="entry-section"><p class="section-label">${esc(key.replaceAll('-',' ').toUpperCase())}</p><h2>${esc(heading)}</h2><p>${esc(paragraphFor(term,key,related,research,lore))}</p><p>${esc(paragraphFor(term,key,related,research,lore))}</p></section>`;body+=`<section class="entry-section"><p class="section-label">RELATED TERMS</p><h2>Keep reading outward</h2><div class="entry-related">${related.map(x=>`<a href="potatoism-entry.html?term=${encodeURIComponent(slug(x.term))}">${esc(x.term)}</a>`).join('')||'<span class="muted">No direct lexical match yet; use the Atlas relationship layer.</span>'}</div></section></article><aside class="entry-aside"><strong>Entry navigation</strong><a href="potatoism.html">← Potatoism index</a><a href="repository.html">Wider Atlas</a><hr><strong>Term</strong><p>${esc(term.term)}</p><strong>Family</strong><p>${esc(term.family||'project vocabulary')}</p><strong>Definition</strong><p>${esc(term.definition)}</p></aside></div>`;return body}
(async()=>{const params=new URLSearchParams(location.search),id=params.get('term')||'potatoism';const [lex,research,lore,rels]=await Promise.all([load('data/potatoism-lexicon.json',{entries:[]}),load('data/potatoism-research-expansion.json',{layers:[]}),load('data/potatoverse-lore.json',{records:[]}),load('data/potatoism-relationships.json',{edges:[]})]);const term=bySlug(lex.entries||[],slug(id)),root=document.getElementById('entry-page');if(!term){root.innerHTML='<div class="entry-notice"><strong>Entry not found.</strong><p>Return to the <a href="potatoism.html">Potatoism index</a> and choose a canonical term.</p></div>';return}document.title=term.term+' — Potatoism — The Potato of Life';root.innerHTML=buildEntry(term,lex.entries||[],rels.edges||[],research,lore)})();
</script>
