<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Nations — The Potato of Life</title><link rel="stylesheet" href="site.css"><style>main{max-width:1400px;margin:auto;padding:48px 24px}.nation-toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin:28px 0}.nation-toolbar input,.nation-toolbar select{padding:14px;background:#111;color:#eee;border:1px solid #333;border-radius:8px}.nation-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.nation-card{display:block;padding:18px;border:1px solid #292929;border-radius:10px;background:#0b0b0b;color:inherit;text-decoration:none}.nation-card:hover{border-color:#777;transform:translateY(-1px)}.nation-card small{display:block;opacity:.6;margin-top:7px}.count{opacity:.7}.error{color:#f88}</style></head><body><main><p class="eyebrow">THE WORLD / 195 NATIONS</p><h1>World Nations</h1><p class="hero-lead">A searchable gateway into the national layer of the atlas. Every country is a record, and every record can grow into economics, government, geography, history, infrastructure, energy, trade, finance, technology, culture and relationships.</p><div class="nation-toolbar"><input id="q" placeholder="Search country, capital, ISO code…"><select id="region"><option value="">All regions</option></select><select id="subregion"><option value="">All subregions</option></select></div><p id="count" class="count">Loading…</p><div id="grid" class="nation-grid"></div></main><script>const q=document.getElementById('q'),region=document.getElementById('region'),sub=document.getElementById('subregion'),grid=document.getElementById('grid'),count=document.getElementById('count');let nations=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const term=q.value.trim().toLowerCase(),r=region.value,s=sub.value;const out=nations.filter(n=>(!term||[n.name,n.capital,n.iso2,n.iso3].join(' ').toLowerCase().includes(term))&&(!r||n.region===r)&&(!s||n.subregion===s));count.textContent=out.length+' of '+nations.length+' nations';grid.innerHTML=out.map(n=>`<a class="nation-card" href="nation.html?id=${encodeURIComponent(n.id)}"><strong>${esc(n.name)}</strong><small>${esc(n.capital)} · ${esc(n.iso3)} · ${esc(n.region)}</small></a>`).join('')||'<p>No nations match the current filters.</p>'}async function init(){try{const r=await fetch('data/nations.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);nations=(await r.json()).nations||[];[...new Set(nations.map(n=>n.region))].sort().forEach(v=>region.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));[...new Set(nations.map(n=>n.subregion))].sort().forEach(v=>sub.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`));render()}catch(e){grid.innerHTML='<p class="error">Could not load data/nations.json: '+esc(e.message)+'</p>'}}q.addEventListener('input',render);region.addEventListener('change',render);sub.addEventListener('change',render);init();</script></body></html>
