<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norse Edda — Raw Text Reader</title><style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:auto;padding:24px;line-height:1.6}textarea{width:100%;height:65vh;font:16px/1.6 ui-monospace,monospace;box-sizing:border-box}select,input{padding:10px;margin:4px}a{color:inherit}</style></head><body><p><a href="../../books.html">← Books</a></p><h1>Norse Edda — raw text</h1><p>This reader loads the actual repository text files. Use the browser's Find command to search every word in the displayed edition.</p><label>Edition <select id="edition"><option value="poetic-edda-bellows-1923.txt">Poetic Edda — Bellows (1923)</option><option value="prose-edda-anderson.txt">Prose Edda — Anderson</option></select></label><button id="load">Open text</button><p id="status"></p><textarea id="text" readonly>Loading…</textarea><script>const sel=document.getElementById('edition'),out=document.getElementById('text'),status=document.getElementById('status');async function load(){status.textContent='Loading repository text…';try{const r=await fetch(sel.value);if(!r.ok)throw Error(r.status);out.value=await r.text();status.textContent=out.value.length.toLocaleString()+' characters loaded.'}catch(e){status.textContent='Could not load text: '+e.message;out.value='Open the raw .txt file directly from the folder.'}}document.getElementById('load').onclick=load;load();</script></body></html>
