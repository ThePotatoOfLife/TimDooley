<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Norse Edda — Full Text Reader</title><link rel="stylesheet" href="../../site.css"><style>
body{max-width:1200px;margin:auto;padding:24px}.reader-grid{display:grid;grid-template-columns:280px 1fr;gap:22px}.panel,.work{border:1px solid var(--line,#d7d0c2);background:var(--paper,#fffdf8);padding:18px}.parts{display:grid;gap:7px}.parts button{text-align:left;padding:9px;border:1px solid var(--line,#d7d0c2);background:transparent;cursor:pointer}.parts button:hover{border-color:var(--accent,#a94f2c)}#text{width:100%;height:68vh;box-sizing:border-box;font:15px/1.55 ui-monospace,monospace;padding:16px;border:1px solid var(--line,#d7d0c2);background:#fff}input,select,button{font:inherit;padding:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.search-results{margin-top:12px;display:grid;gap:8px}.hit{padding:10px;border:1px solid var(--line,#d7d0c2);cursor:pointer}.hit mark{font-weight:700}.muted{color:var(--muted,#706d65)}@media(max-width:800px){.reader-grid{grid-template-columns:1fr}}
</style></head><body>
<p><a href="../../books.html">← Full-text library</a></p><p class="section-label">PRIMARY TEXT CORPUS</p><h1>Norse Edda — full text</h1><p id="status" class="muted">Loading the local corpus…</p>
<div class="toolbar"><select id="edition"><option value="poetic-edda-bellows-1923.txt">Poetic Edda — Bellows (1923)</option><option value="prose-edda-anderson.txt">Prose Edda — Anderson (1897)</option></select><input id="q" type="search" placeholder="Search the complete text…"><button id="search">Search</button><button id="load">Load edition</button></div>
<div class="reader-grid"><aside class="panel"><h2>Work structure</h2><p class="muted">These are navigational subjects over the stored edition. The raw text remains unchanged.</p><div id="parts" class="parts"></div></aside><main class="work"><h2 id="title">Edition</h2><div id="results" class="search-results"></div><textarea id="text" readonly>Loading…</textarea></main></div>
<script>
const $=s=>document.querySelector(s);let raw='';let structure=null;const editions={
'poetic-edda-bellows-1923.txt':{title:'The Poetic Edda — Henry Adams Bellows, 1923'},
'prose-edda-anderson.txt':{title:'The Younger Edda / Prose Edda — Rasmus Björn Anderson, 1897'}};
async function load(){const f=$('#edition').value;$('#status').textContent='Loading complete repository text…';const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw Error(r.status+' '+f);raw=await r.text();$('#text').value=raw;$('#title').textContent=editions[f].title;$('#status').textContent=raw.length.toLocaleString()+' characters loaded locally.';renderStructure();const p=new URLSearchParams(location.search);if(p.get('q')){$('#q').value=p.get('q');search()}}
function renderStructure(){if(!structure)return;const poetic=structure.works.find(w=>w.id==='poetic-edda');const prose=structure.works.find(w=>w.id==='prose-edda');const active=$('#edition').value.startsWith('poetic')?poetic:prose;$('#parts').innerHTML=(active.parts||[]).map(p=>`<button type="button" data-name="${p.title.replace(/"/g,'&quot;')}"><strong>${p.title}</strong><br><span class="muted">${p.domain}</span></button>`).join('');$('#parts').querySelectorAll('button').forEach(b=>b.onclick=()=>jumpTo(b.dataset.name))}
function jumpTo(name){const i=raw.toLocaleLowerCase().indexOf(name.toLocaleLowerCase());if(i<0){$('#status').textContent=`No exact heading found for ${name} in this edition.`;return}$('#text').focus();$('#text').setSelectionRange(Math.max(0,i-200),Math.min(raw.length,i+1000));$('#text').scrollTop=Math.max(0,(i/raw.length)*$('#text').scrollHeight)}
function search(){const q=$('#q').value.trim();const out=$('#results');out.innerHTML='';if(!q)return;const low=raw.toLocaleLowerCase(),needle=q.toLocaleLowerCase();let p=0,n=0;while(n<100){const i=low.indexOf(needle,p);if(i<0)break;const line=raw.slice(0,i).split('\n').length;const a=Math.max(0,i-180),z=Math.min(raw.length,i+q.length+420);const s=raw.slice(a,z).replace(/\s+/g,' ').trim();const safe=s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const marked=safe.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark>${m}</mark>`);out.insertAdjacentHTML('beforeend',`<div class="hit" data-index="${i}"><strong>line ${line}</strong><br>${marked}</div>`);p=i+Math.max(1,q.length);n++}out.querySelectorAll('.hit').forEach(x=>x.onclick=()=>{const i=Number(x.dataset.index);$('#text').focus();$('#text').setSelectionRange(i,Math.min(raw.length,i+q.length));$('#text').scrollTop=Math.max(0,(i/raw.length)*$('#text').scrollHeight)});$('#status').textContent=`${n} matches shown from the complete stored edition.`}
(async()=>{try{const r=await fetch('structure.json');structure=await r.json();renderStructure();await load()}catch(e){$('#status').textContent='Reader error: '+e.message}})();$('#load').onclick=()=>load().catch(e=>$('#status').textContent='Reader error: '+e.message);$('#search').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};$('#edition').onchange=()=>load().catch(e=>$('#status').textContent='Reader error: '+e.message);
</script></body></html>
