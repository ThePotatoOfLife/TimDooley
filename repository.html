<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Potato of Life — Repository</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css"><link rel="stylesheet" href="atlas-tree.css?v=20260908-15"></head><body><div data-site-header="canonical"></div><main class="repository-shell"><section class="repository-intro"><p class="eyebrow">THE POTATO OF LIFE · REPOSITORY</p><h1>Repository</h1><p class="lead">The searchable root of the archive. This page reads one build-generated index of the actual JSON corpus, so a missing optional data family cannot make the whole repository disappear.</p><div class="repository-page-tools"><a class="active" href="repository.html">2D ROOT</a><a href="axis.html">3D AXIS</a></div></section><section class="repository-toolbar"><div class="repository-state"><strong id="status">Loading repository index</strong><span id="count"></span></div><div class="tools"><label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search the entire repository…" autocomplete="off"></label><button id="open" type="button">Open all</button><button id="close" type="button">Close all</button></div></section><div id="crumbs" class="crumbs">ROOT / REPOSITORY</div><section id="tree" class="repository-tree" aria-label="Repository root"></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clean=v=>String(v??'').replace(/\s+/g,' ').trim();
const SCALE=[['world','WORLDS & DOMAINS','◎'],['region','REGIONS & TERRITORIES','⌖'],['institution','INSTITUTIONS & STRUCTURES','▣'],['network','NETWORKS & GROUPS','∞'],['person','PEOPLE & LIVING ACTORS','●'],['object','BODIES & OBJECTS','□'],['event','EVENTS & ACTIONS','→'],['record','RECORDS & SIGNALS','▤'],['ground','GROUND / GRAIN / DUST','·']];
const SPIRIT=[['source','SOURCE','◉'],['meaning','MEANING','◇'],['belief','BELIEF / FAITH','✦'],['myths','MYTHS','☼']];
const MIND=[['psychology','PSYCHOLOGY','◌'],['hawkinscale','HAWKINSCALE','↕'],['neurobiology','NEUROBIOLOGY','⌁']];
function text(x){return clean([x.name,x.description,x.type,x.layer,x.source].join(' ')).toLowerCase()}
function branchOf(x){const t=text(x);if(/tim dooley|father|source|origin|creation|heaven|throne|elohim/.test(t))return'source';if(/religion|religious|theology|belief|faith|doctrine|denomination|tradition|church|scripture|christian|jewish|islam|hindu|buddh|spiritual/.test(t))return'belief';if(/myth|mythology|sacred story|cosmology|cosmogony|legend|norse|eda|deity|goddess/.test(t))return'myths';if(/idea|vision|concept|symbol|principle|meaning|theory|model|pattern|interpretation|philosophy|worldview|axis|ladder|door|potatoism/.test(t))return'meaning';if(/neurobiolog|neuroscien|thalam|cortex|brain|nervous system|neuron|synap|pineal/.test(t))return'neurobiology';if(/hawkins|consciousness scale|hawkins-state/.test(t))return'hawkinscale';if(/psycholog|behavior|behaviour|cognit|memory|thought|identity|selfhood|perception|experience|dream|attention/.test(t))return'psychology';if(/particle|grain|dust|fragment|atom|molecule|micro/.test(t))return'ground';if(/record|document|dataset|measurement|archive|text|book|scripture|corpus|observation|finding|data|research/.test(t)||/research/.test(x.type))return'record';if(/event|war|election|birth|death|transaction|decision|action|campaign|crisis|revolution|treaty/.test(t)||x.type==='event')return'event';if(/person|people|population|demograph|family|individual|human|animal|organism|living/.test(t)||x.type==='person')return'person';if(/object|artifact|building|machine|technology|potato|money|energy|resource|matter|body|bodies|land/.test(t))return'object';if(/network|alliance|market|community|movement|supply chain|relation|relationship|ownership|control|obligation|trade|exchange/.test(t)||x.type==='movement')return'network';if(/government|institution|organization|company|bank|church|university|authority|kingdom|monarch|infrastructure|system/.test(t)||x.type==='system')return'institution';if(/nation|state|country|territor|region|subregion|city|place|geograph|greenland|denmark|canada|iceland|europe|asia|africa|america/.test(t))return'region';return'world'}
function leaf(x){const href=x.source==='data/geometry-records.json'?'geometry.html?id='+encodeURIComponent(x.id):x.source==='data/nations.json'?'nation.html?id='+encodeURIComponent(x.id):'node.html?id='+encodeURIComponent(x.id);return '<a class="leaf" href="'+esc(href)+'"><span class="leaf-mark">↳</span><span class="leaf-body"><strong>'+esc(x.name)+'</strong>'+(x.description?'<small>'+esc(x.description.slice(0,360))+'</small>':'')+'</span><span class="leaf-type">'+esc(x.type||x.layer||'record')+'</span></a>'}
function folder(title,icon,items){items.sort((a,b)=>a.name.localeCompare(b.name));return '<details class="folder"><summary><span class="twisty">+</span><span class="folder-icon">'+icon+'</span><span class="folder-name">'+esc(title)+'</span><span class="folder-count">'+items.length+'</span></summary><div class="folder-children">'+items.map(leaf).join('')+'</div></details>'}
function root(title,glyph,items,classes){const buckets=new Map(SCALE.concat(SPIRIT,MIND).map(x=>[x[0],[]]));items.forEach(x=>{const k=branchOf(x);if(buckets.has(k))buckets.get(k).push(x);else buckets.get('world').push(x)});const defs=classes==='spirit'?SPIRIT:classes==='mind'?MIND:SCALE;return '<details class="root-branch '+classes+'-root"><summary><span class="twisty">+</span><span class="root-glyph">'+glyph+'</span><span class="root-name">'+title+'</span><span class="root-description">'+(classes==='spirit'?'Source · Meaning · Belief / Faith · Myths':classes==='mind'?'Psychology · Hawkinscale · Neurobiology':'Worlds & Domains → Ground / Grain / Dust')+'</span><span class="root-count">'+items.length+'</span></summary><div class="root-children">'+defs.map(d=>folder(d[1],d[2],buckets.get(d[0])||[])).join('')+'</div></details>'}
let all=[];
function render(){const q=clean($('q').value).toLowerCase();const visible=q?all.filter(x=>(x.name+' '+x.description+' '+x.type+' '+x.layer+' '+x.source).toLowerCase().includes(q)):all;const sp=[],mi=[],ma=[];visible.forEach(x=>{const b=branchOf(x);if(SPIRIT.some(d=>d[0]===b))sp.push(x);else if(MIND.some(d=>d[0]===b))mi.push(x);else ma.push(x)});$('tree').innerHTML='<div class="root-spine"><div class="root-spine-title"><span class="root-glyph">│</span><div><strong>ROOT</strong><small>One source-aware index. Every visible entry records where it came from in the JSON corpus.</small></div><span class="root-count">'+visible.length+'</span></div>'+root('SPIRIT','✦',sp,'spirit')+root('MIND','◌',mi,'mind')+root('MATTER','□',ma,'matter')+'</div>';$('count').textContent=' · '+visible.length+' indexed records'+(q?' matched':'');$('status').textContent=q?'Search results':'Repository root';$('crumbs').textContent=q?'ROOT / SEARCH / '+q.toUpperCase():'ROOT / REPOSITORY';if(q)document.querySelectorAll('details').forEach(d=>d.open=true)}
async function main(){try{const r=await fetch('data/repository-index.json?v=20260908-15',{cache:'no-store'});if(!r.ok)throw Error('repository-index.json · HTTP '+r.status);const index=await r.json();if(!Array.isArray(index.records))throw Error('repository-index.json has no records array');const seen=new Set();all=index.records.filter(x=>x&&x.id&&x.name).filter(x=>{const k=x.source+'|'+x.id+'|'+JSON.stringify(x.path);if(seen.has(k))return false;seen.add(k);return true});render();}catch(e){$('status').textContent='Repository index failed';$('tree').innerHTML='<div class="error"><h2>The repository data index could not be loaded.</h2><p>'+esc(e.message)+'</p><p>This is now an explicit deployment error instead of a silent blank page. The Pages build must generate <code>data/repository-index.json</code> before deployment.</p></div>'}}$('q').addEventListener('input',render);$('open').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);$('close').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);main();
</script></body></html>
