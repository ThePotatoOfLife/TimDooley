<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Potato of Life — Repository</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css"><link rel="stylesheet" href="atlas-tree.css?v=20260908-14"></head><body><div data-site-header="canonical"></div><main class="repository-shell"><section class="repository-intro"><p class="eyebrow">THE POTATO OF LIFE · REPOSITORY</p><h1>Repository</h1><p class="lead">The searchable root of the archive. Spirit, Mind and Matter are filing branches; graph, scale, time, culture and evidence remain independent dimensions.</p><div class="repository-page-tools"><a class="active" href="repository.html">2D ROOT</a><a href="axis.html">3D AXIS</a></div></section><section class="repository-toolbar"><div class="repository-state"><strong id="status">Preparing repository</strong><span id="count"></span></div><div class="tools"><label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search substantive repository records…"></label><button id="open" type="button">Open all</button><button id="close" type="button">Close all</button></div></section><div id="crumbs" class="crumbs">ROOT / REPOSITORY</div><section id="tree" class="repository-tree" aria-label="Repository root"></section></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),clean=v=>String(v??'').replace(/\s+/g,' ').trim();
function arr(v){if(Array.isArray(v))return v;if(!v||typeof v!=='object')return[];for(const k of ['records','entries','items','nodes','nations','people','events','facts','scale','families','sector_families'])if(Array.isArray(v[k]))return v[k];return[]}
async function load(p){const r=await fetch(p+'?v=20260908-14',{cache:'no-store'});if(!r.ok)throw Error(p+' · HTTP '+r.status);return r.json()}
async function optional(p){try{return await load(p)}catch(e){console.warn('Optional repository source unavailable:',e);return {__error:e.message}}}
function record(x,kind,source=''){if(!x||typeof x!=='object')return null;const id=x.id||x.slug||x.iso3||x.country_id||x.key||x.term;if(!id)return null;const name=x.display_name||x.proper_name||x.name||x.title||x.tradition_name||x.label||x.term||id;const description=x.description||x.definition||x.summary||x.worldview||x.historical_emergence||x.purpose||x.notes||x.meaning||'';let href='node.html?id='+encodeURIComponent(id);if(source==='geometry')href='geometry.html?id='+encodeURIComponent(id);if(kind==='nation')href='nation.html?id='+encodeURIComponent(id);return{id:String(id),name:String(name),description:clean(description),kind,source,raw:x,href}}
const SCALE=[{id:'world',title:'WORLDS & DOMAINS',glyph:'◎',description:'Broad environments, fields and domains.'},{id:'region',title:'REGIONS & TERRITORIES',glyph:'⌖',description:'Geographic and jurisdictional fields.'},{id:'institution',title:'INSTITUTIONS & STRUCTURES',glyph:'▣',description:'Durable organizations, authorities and structures.'},{id:'network',title:'NETWORKS & GROUPS',glyph:'∞',description:'Connected populations, communities and movements.'},{id:'person',title:'PEOPLE & LIVING ACTORS',glyph:'●',description:'Persons, populations and living participants.'},{id:'object',title:'BODIES & OBJECTS',glyph:'□',description:'Embodied, built and material things.'},{id:'event',title:'EVENTS & ACTIONS',glyph:'→',description:'Things that happen, change or are done.'},{id:'record',title:'RECORDS & SIGNALS',glyph:'▤',description:'Texts, measurements, documents and traces.'},{id:'ground',title:'GROUND / GRAIN / DUST',glyph:'·',description:'Smallest concrete traces.'}];const SPIRIT=[{id:'source',title:'SOURCE',glyph:'◉',description:'Origin, Father, creation and spiritual source.'},{id:'meaning',title:'MEANING',glyph:'◇',description:'Ideas, symbols, principles, visions and interpretations.'},{id:'belief',title:'BELIEF / FAITH',glyph:'✦',description:'Religions, theology, doctrines and traditions.'},{id:'myths',title:'MYTHS',glyph:'☼',description:'Sacred stories, mythological figures and cosmologies.'}];const MIND=[{id:'psychology',title:'PSYCHOLOGY',glyph:'◌',description:'Mind, behaviour, development, cognition and inner life.'},{id:'hawkinscale',title:'HAWKINSCALE',glyph:'↕',description:'Comparative consciousness and emotion framework.'},{id:'neurobiology',title:'NEUROBIOLOGY',glyph:'⌁',description:'Brain, nervous system and embodied cognition.'}];
function textOf(x){return clean([x.name,x.description,x.kind,x.source,x.raw?.type,x.raw?.layer,x.raw?.category,x.raw?.family,x.raw?.status,x.raw?.role].join(' ')).toLowerCase()}function mindOf(x){const t=textOf(x);if(/neurobiolog|neuroscien|thalam|cortex|brain|nervous system|neuron|synap|pineal gland/.test(t))return'neurobiology';if(/hawkins scale|hawkinscale|hawkins-state/.test(t))return'hawkinscale';if(/psycholog|behavior|behaviour|cognit|memory|thought|identity|selfhood|perception|experience|dream|attention/.test(t))return'psychology';return null}function spiritOf(x){const t=textOf(x);if(/tim dooley|father|source|origin|creation|heaven|throne|god|elohim/.test(t))return'source';if(/religion|religious|theology|theolog|belief|faith|doctrine|denomination|tradition|church|scripture|christian|jewish|islam|hindu|buddh|spiritual conviction/.test(t))return'belief';if(/myth|mythology|sacred story|cosmology|cosmogony|legend|norse|eda|deity|goddess/.test(t))return'myths';if(/idea|dream|vision|concept|symbol|principle|meaning|theory|model|pattern|interpretation|philosophy|worldview|axis|ladder|door|potatoism|potato of life/.test(t))return'meaning';return null}function scaleOf(x){const t=textOf(x);if(/particle|grain|dust|fragment|atom|molecule|micro/.test(t))return'ground';if(/record|document|dataset|measurement|archive|text|book|scripture|corpus|observation|finding|data/.test(t)||x.kind==='research'||x.kind==='research-carving')return'record';if(/event|war|election|birth|death|transaction|decision|action|campaign|crisis|revolution|treaty/.test(t)||x.kind==='event')return'event';if(/person|people|population|demograph|family|individual|human|animal|organism|living/.test(t)||x.kind==='person')return'person';if(/object|artifact|building|machine|technology|potato|money|energy|resource|matter|body|bodies|land/.test(t))return'object';if(/network|alliance|market|community|movement|supply chain|relation|relationship|ownership|control|obligation|trade|exchange/.test(t)||x.kind==='movement')return'network';if(/government|institution|organization|company|bank|church|university|authority|kingdom|monarch|infrastructure|system/.test(t)||x.kind==='system')return'institution';if(/nation|state|country|territor|region|subregion|city|place|geograph|greenland|denmark|canada|iceland|europe|asia|africa|america/.test(t))return'region';return'world'}
function leaf(x){return '<a class="leaf" href="'+esc(x.href)+'"><span class="leaf-mark">↳</span><span class="leaf-body"><strong>'+esc(x.name)+'</strong>'+(x.description?'<small>'+esc(x.description.slice(0,320))+'</small>':'')+'</span><span class="leaf-type">'+esc(x.kind)+'</span></a>'}function folder(layer,items){items.sort((a,b)=>a.name.localeCompare(b.name));return '<details class="folder"><summary><span class="twisty">+</span><span class="folder-icon">□</span><span class="folder-name">'+esc(layer.title)+'</span><span class="folder-count">'+items.length+'</span></summary><div class="folder-children">'+items.map(leaf).join('')+'</div></details>'}function branch(root,items,buckets){const count=[...buckets.values()].reduce((n,a)=>n+a.length,0);return '<details class="root-branch '+root.id+'-root"><summary><span class="twisty">+</span><span class="root-glyph">'+root.glyph+'</span><span class="root-name">'+esc(root.title)+'</span><span class="root-description">'+esc(root.description)+'</span><span class="root-count">'+count+'</span></summary><div class="root-children">'+items.map(s=>folder(s,buckets.get(s.id)||[])).join('')+'</div></details>'}let allItems=[];function render(){const term=clean($('q').value).toLowerCase(),visible=term?allItems.filter(x=>(x.name+' '+x.description+' '+JSON.stringify(x.raw)).toLowerCase().includes(term)):allItems,sb=new Map(SPIRIT.map(s=>[s.id,[]])),mb=new Map(MIND.map(s=>[s.id,[]])),ab=new Map(SCALE.map(s=>[s.id,[]]));for(const x of visible){const sp=spiritOf(x);if(sp)sb.get(sp).push(x);else{const mi=mindOf(x);if(mi)mb.get(mi).push(x);else ab.get(scaleOf(x)).push(x)}}$('tree').innerHTML='<div class="root-spine"><div class="root-spine-title"><span class="root-glyph">│</span><div><strong>ROOT</strong><small>Spirit holds meaning and spiritual material. Mind holds inner experience and neurobiology. Matter holds the observable and embodied world.</small></div><span class="root-count">'+visible.length+'</span></div>'+branch({id:'spirit',title:'SPIRIT',glyph:'✦',description:'Source · Meaning · Belief / Faith · Myths'},SPIRIT,sb)+branch({id:'mind',title:'MIND',glyph:'◌',description:'Psychology · Hawkinscale · Neurobiology'},MIND,mb)+branch({id:'matter',title:'MATTER',glyph:'□',description:'Worlds & Domains → Ground / Grain / Dust'},SCALE,ab)+'</div>';$('count').textContent=' · '+visible.length+' records'+(term?' matched':' indexed');$('status').textContent=term?'Search results':'Repository root';$('crumbs').textContent=term?'ROOT / SEARCH / '+term.toUpperCase():'ROOT / REPOSITORY';if(term)document.querySelectorAll('details').forEach(x=>x.open=true)}$('q').addEventListener('input',render);$('open').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);$('close').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);
async function main(){const paths=['data/nodes.json','data/tree-child-records.json','data/tree-support-records.json','data/nations.json','data/people-registry.json','data/events.json','data/european-sector-atlas.json','data/religious-lexicon.json','data/religious-foundations.json','data/religious-adjacent/records.json','data/extremism-cults-atlas-expansion-2026-09.json','data/research.json','data/research-carvings-2026-09.json','data/tree-concept-records.json','data/graph-registry.json','data/hawkins-scale.json','data/geometry-records.json'];const values=await Promise.all(paths.map(optional));const [nodes,children,support,nations,people,events,sectors,religious,foundations,adjacent,movements,research,carvings,concepts,registry,hawkins,geometry]=values;const core=[...arr(nodes),...arr(children),...arr(support)].map(x=>record(x,'core'));const world=arr(nations).map(x=>record(x,'nation'));const persons=arr(people).map(x=>record(x,'person'));const history=arr(events).map(x=>record(x,'event'));const systems=arr(sectors).map(x=>record(x,'system'));const ideas=[...arr(religious),...arr(foundations),...arr(adjacent)].map(x=>record(x,'lexicon','religious'));const movement=arr(movements).map(x=>record(x,'movement'));const evidence=[...arr(research)].map(x=>record(x,'research'));const carving=arr(carvings).map(x=>record(x,'research-carving','research'));const treeConcepts=arr(concepts).map(x=>record(x,'concept'));const graph=arr(registry).map(x=>record(x,'registry'));const hk=arr(hawkins).map(x=>record({...x,id:'hawkins-'+x.level,name:x.name,description:x.psychology||x.hawkins_emotion||'',type:'hawkins-state',layer:'hawkinscale'},'framework','hawkinscale'));const geom=arr(geometry).map(x=>record(x,'framework','geometry'));allItems=[];const seen=new Set();for(const x of [...core,...world,...persons,...history,...systems,...ideas,...movement,...evidence,...carving,...treeConcepts,...graph,...hk,...geom])if(x&&!seen.has(x.id)){seen.add(x.id);allItems.push(x)}render()}main().catch(e=>{$('status').textContent='Repository error';$('tree').innerHTML='<div class="error">'+esc(e.message)+'</div>'});</script></body></html>
