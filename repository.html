<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="The Potato of Life — unfolding relationship-first root directory."><title>The Potato of Life — Atlas Root</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="consistency.css"><link rel="stylesheet" href="atlas-tree.css"></head><body><main class="tree-shell"><header class="tree-head"><div><div class="eyebrow">ATLAS · ROOT DIRECTORY</div><h1>Unfold the archive.</h1><p class="tree-sub">Start at the roots. Open a branch. Follow a record into its relationships. The alphabet is no longer the architecture; the tree is.</p></div><div class="view-switch"><a class="active" href="repository.html">2D ROOT</a><a href="axis.html">3D AXIS</a></div></header><div class="tree-tools"><input id="q" type="search" placeholder="Search the root directory…"><button id="open">Open all</button><button id="close">Close all</button></div><section id="tree" class="root" aria-label="Atlas root directory"></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}async function main(){const [n,c,s,r,e,sectors,countries,people,rel,found,adj,ext]=await Promise.all([j('data/nodes.json'),j('data/tree-child-records.json'),j('data/tree-support-records.json'),j('data/research.json'),j('data/events.json'),j('data/european-sector-atlas.json'),j('data/nations.json'),j('data/people-registry.json'),j('data/religious-lexicon.json'),j('data/religious-foundations.json'),j('data/religious-adjacent/records.json'),j('data/extremism-cults-atlas-2026-09.json')]);const roots=[['core','Core Atlas','records · concepts · structures',[...(n.nodes||[]),...(c.records||[]),...(s.records||[])]],['world','World','195 nations',countries.nations||[]],['people','People','people registry',people.people||people.records||[]],['history','History & Events','events',e.events||[]],['systems','Systems & Economy','sectors and infrastructure',sectors.sector_families||[]],['research','Evidence & Research','research records',r.facts||[]],['belief','Ideas & Religion','religions and foundations',[...(rel.entries||[]),...(found.records||[])]],['movements','Extremism / High-Control','movement research',ext.records||[]]];const norm=x=>({id:x.id||x.slug||x[0],name:x.name||x.tradition_name||x[0]||x.id,description:x.description||x.definition||x.historical_emergence||x.field||x.worldview||x.targets_or_hate||x[1]||''});const data=roots.map(x=>({id:x[0],name:x[1],meta:x[2],items:x[3].map(norm).filter(x=>x.id)}));function render(){const term=$('q').value.trim().toLowerCase();document.getElementById('tree').innerHTML=data.map(b=>{const items=b.items.filter(i=>!term||[i.id,i.name,i.description].join(' ').toLowerCase().includes(term));if(term&&!items.length)return '';return '<details class="branch"><summary><span class="branch-name">'+esc(b.name)+'</span><span class="branch-meta">'+(term?items.length+' matches':b.items.length+' records')+'</span></summary><div class="children">'+items.slice(0,500).map(i=>'<a class="leaf" href="node.html?id='+encodeURIComponent(i.id)+'"><strong>'+esc(i.name)+'</strong><small>'+esc(i.description).slice(0,180)+'</small></a>').join('')+'</div></details>'}).join('')||'<div class="empty">No branch matches.</div>'}$('q').oninput=render;$('open').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);$('close').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);render()}main().catch(e=>document.getElementById('tree').innerHTML='<div class="empty">Atlas load error: '+esc(e.message)+'</div>');</script></body></html>
