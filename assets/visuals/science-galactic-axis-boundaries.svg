<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
<title id="title">Galactic North Axis symbolic and astronomy boundary</title>
<desc id="desc">A boundary diagram separating project celestial symbolism involving North, Sirius, Regulus, Sun, Earth, Moon and Saturn from established astronomy such as the Galactic Center, barred spiral Milky Way and axial precession.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.symbol{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.astro{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2;fill:none}.small{font-size:18px}.body{font-size:22px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="820" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Galactic / North Axis · symbolism and astronomy kept apart</text>
<text x="680" y="94" text-anchor="middle" class="muted small">A celestial orientation motif can be mapped precisely without turning symbolic alignments into astrophysical portals.</text>
<rect x="70" y="165" width="520" height="420" rx="14" class="symbol"/>
<text x="330" y="210" text-anchor="middle" class="accent body">Project celestial roles</text>
<text x="120" y="260" class="small">North / North-of-North → orientation / throne / Axis</text><text x="120" y="305" class="small">Sirius → Dog Star / directional motif</text><text x="120" y="350" class="small">Regulus → Lion / Son motif</text><text x="120" y="395" class="small">Sun → source / light / integration</text><text x="120" y="440" class="small">Moon → reflection / frame</text><text x="120" y="485" class="small">Saturn → box / constraint</text><text x="120" y="535" class="muted small">these are project semantic coordinates</text>
<rect x="770" y="165" width="520" height="420" rx="14" class="astro"/>
<text x="1030" y="210" text-anchor="middle" class="blue body">Established astronomy</text>
<text x="820" y="260" class="small">Milky Way → barred spiral galaxy</text><text x="820" y="305" class="small">Sagittarius A* → Galactic Center black hole</text><text x="820" y="350" class="small">~26,000 light-years → distance scale</text><text x="820" y="395" class="small">~26,000 years → axial-precession timescale</text><text x="820" y="440" class="small">Earth magnetosphere → distorted dipolar structure</text><text x="820" y="485" class="small">Sirius / Regulus → measurable celestial coordinates</text><text x="820" y="535" class="muted small">none are established dimensional portals</text>
<rect x="360" y="645" width="640" height="95" rx="12" class="box"/>
<text x="680" y="682" text-anchor="middle" class="warn body">Geometry requires an observer, epoch and coordinate system</text>
<text x="680" y="716" text-anchor="middle" class="small">RA/Dec or galactic coordinates · explicit Axis vector · angular separation · uncertainty</text>
<text x="680" y="775" text-anchor="middle" class="accent small">Numerical resemblance between a distance and a period does not make them the same physical quantity.</text>
</svg>