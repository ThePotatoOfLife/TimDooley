<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
<title id="title">11D projection and reconstruction information model</title>
<desc id="desc">A diagram showing a high-dimensional state projected to a lower-dimensional representation, hidden fibers of states that share the same projection, a reconstruction map, reconstruction loss and task-specific sufficiency.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.hi{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.low{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1320" height="820" fill="#eee9dc"/>
<text x="660" y="58" text-anchor="middle" class="head">11D Projection · what survives a change of description?</text>
<text x="660" y="94" text-anchor="middle" class="muted small">The strongest scientific problem is projection, information loss and reconstruction—not a numbered ladder by itself.</text>

<rect x="80" y="180" width="330" height="230" rx="14" class="hi"/>
<text x="245" y="225" text-anchor="middle" class="blue body">High-dimensional state X</text>
<text x="120" y="270" class="small">P · configuration / geometry / fields</text>
<text x="120" y="305" class="small">many degrees of freedom</text>
<text x="120" y="340" class="muted small">physical 11D only if geometry/action are specified</text>

<rect x="495" y="180" width="330" height="230" rx="14" class="low"/>
<text x="660" y="225" text-anchor="middle" class="green body">Reduced description Y</text>
<text x="535" y="270" class="body">Y = π(X)</text>
<text x="535" y="310" class="small">coarse-graining · observation · compactification</text>
<text x="535" y="345" class="muted small">the mathematical type of π must be declared</text>

<rect x="910" y="180" width="330" height="230" rx="14" class="box"/>
<text x="1075" y="225" text-anchor="middle" class="accent body">Reconstruction X̂</text>
<text x="950" y="270" class="body">X̂ = R(Y)</text>
<text x="950" y="310" class="small">decoder / section / inverse problem</text>
<text x="950" y="345" class="muted small">R cannot recreate erased information without priors</text>

<path d="M410 295 H483" class="line"/><text x="446" y="274" text-anchor="middle" class="small">π</text>
<path d="M825 295 H898" class="line"/><text x="862" y="274" text-anchor="middle" class="small">R</text>

<rect x="120" y="515" width="320" height="170" rx="14" class="box"/>
<text x="280" y="557" text-anchor="middle" class="warn body">Hidden fiber</text>
<text x="160" y="602" class="small">π⁻¹(y) may contain many X</text>
<text x="160" y="638" class="muted small">same lower state, different hidden history/orientation</text>

<rect x="500" y="515" width="320" height="170" rx="14" class="box"/>
<text x="660" y="557" text-anchor="middle" class="accent body">Reconstruction loss</text>
<text x="540" y="602" class="body">Lrec = E[d(X,R(π(X)))]</text>
<text x="540" y="638" class="muted small">quantifies what the reduction cannot recover</text>

<rect x="880" y="515" width="320" height="170" rx="14" class="box"/>
<text x="1040" y="557" text-anchor="middle" class="green body">Task sufficiency</text>
<text x="920" y="602" class="small">A reduced Y can lose detail</text>
<text x="920" y="634" class="small">yet preserve everything needed for a task.</text>
<text x="920" y="666" class="muted small">lossless-for-task ≠ universally invertible</text>

<path d="M245 410 V503" class="dash"/><path d="M660 410 V503" class="dash"/><path d="M1075 410 V503" class="dash"/>
<text x="660" y="755" text-anchor="middle" class="accent small">A physical 11D claim needs an explicit compactification and 4D spectrum; an information model needs a channel, loss and observable task.</text>
</svg>