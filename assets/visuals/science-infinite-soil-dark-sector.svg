<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" role="img" aria-labelledby="title desc">
<title id="title">Infinite Soil and dark sector scientific branches</title>
<desc id="desc">A diagram separating the Infinite Soil metaphor from dark matter, dark energy and explicit interacting or unified dark-sector model forks, with Lambda CDM as the baseline to beat.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.base{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.metaphor{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.model{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="840" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Infinite Soil / Cosmic Soil · metaphor separated from dark-sector physics</text>
<text x="680" y="94" text-anchor="middle" class="muted small">One symbolic container does not establish one physical substance.</text>

<rect x="80" y="170" width="300" height="200" rx="14" class="metaphor"/>
<text x="230" y="215" text-anchor="middle" class="accent body">Historical Soil metaphor</text>
<text x="120" y="260" class="small">hidden substrate</text>
<text x="120" y="295" class="small">structure + expansion</text>
<text x="120" y="330" class="muted small">conceptual lineage, not a field equation</text>

<rect x="465" y="150" width="360" height="240" rx="14" class="base"/>
<text x="645" y="195" text-anchor="middle" class="blue body">ΛCDM baseline</text>
<text x="505" y="240" class="small">dark matter: clustering / structure growth</text>
<text x="505" y="278" class="small">dark energy: smooth accelerated expansion</text>
<text x="505" y="316" class="small">baryons + radiation + metric perturbations</text>
<text x="505" y="352" class="muted small">any descendant must recover these successes</text>

<rect x="910" y="170" width="360" height="200" rx="14" class="box"/>
<text x="1090" y="215" text-anchor="middle" class="warn body">Boundary</text>
<text x="950" y="260" class="small">dark matter ≠ dark energy by default</text>
<text x="950" y="297" class="small">“soil” does not prove common microphysics</text>
<text x="950" y="334" class="muted small">shared language is not a shared action</text>

<path d="M380 270 H453" class="dash"/><path d="M825 270 H898" class="dash"/>

<text x="680" y="470" text-anchor="middle" class="accent body">Explicit descendant forks</text>

<rect x="80" y="515" width="270" height="150" rx="12" class="model"/>
<text x="215" y="555" text-anchor="middle" class="green body">A · Separate sectors</text>
<text x="110" y="600" class="small">preferred null</text><text x="110" y="632" class="muted small">Soil remains only a container label</text>

<rect x="390" y="515" width="270" height="150" rx="12" class="model"/>
<text x="525" y="555" text-anchor="middle" class="green body">B · Scalar DE + DM</text>
<text x="420" y="600" class="small">φ drives expansion</text><text x="420" y="632" class="muted small">dark matter remains independent</text>

<rect x="700" y="515" width="270" height="150" rx="12" class="model"/>
<text x="835" y="555" text-anchor="middle" class="green body">C · Interacting sectors</text>
<text x="730" y="600" class="small">ρ̇c+3Hρc = +Q</text><text x="730" y="632" class="muted small">total conservation must still close</text>

<rect x="1010" y="515" width="270" height="150" rx="12" class="model"/>
<text x="1145" y="555" text-anchor="middle" class="green body">D · Unified dark fluid</text>
<text x="1040" y="600" class="small">one explicit stress-energy model</text><text x="1040" y="632" class="muted small">must fit background + perturbations</text>

<text x="680" y="760" text-anchor="middle" class="accent small">A new model earns “unification” only if one action fits expansion, growth and lensing and produces a distinguishing signal beyond ΛCDM.</text>
</svg>