<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Archive history clocks</title><desc id="d">Five parallel clocks distinguish occurrence, source, recovery, interpretation and reception time so later understanding does not overwrite earlier evidence.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="76" fill="#edf0e8" font-size="39" font-family="Georgia,serif">Memory needs more than one clock</text>
<text x="70" y="108" fill="#9da79b" font-size="15" font-family="system-ui,sans-serif">The archive gets clearer when “when did it happen?” and “when did we understand it that way?” are different questions.</text>
<g font-family="system-ui,sans-serif">
  <g transform="translate(95 180)"><circle cx="95" cy="95" r="78" fill="#111711" stroke="#52624f" stroke-width="2"/><path d="M95 95V48M95 95l34 22" stroke="#b8dc82" stroke-width="4" stroke-linecap="round"/><text x="95" y="205" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Occurrence</text><text x="95" y="230" text-anchor="middle" fill="#aeb7aa" font-size="11">when the event happened</text></g>
  <g transform="translate(315 180)"><circle cx="95" cy="95" r="78" fill="#111711" stroke="#52624f" stroke-width="2"/><path d="M95 95V58M95 95l-30 28" stroke="#b8dc82" stroke-width="4" stroke-linecap="round"/><text x="95" y="205" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Source</text><text x="95" y="230" text-anchor="middle" fill="#aeb7aa" font-size="11">when evidence was recorded</text></g>
  <g transform="translate(535 180)"><circle cx="95" cy="95" r="78" fill="#111711" stroke="#52624f" stroke-width="2"/><path d="M95 95V45M95 95l42-6" stroke="#b8dc82" stroke-width="4" stroke-linecap="round"/><text x="95" y="205" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Recovery</text><text x="95" y="230" text-anchor="middle" fill="#aeb7aa" font-size="11">when the archive found it</text></g>
  <g transform="translate(755 180)"><circle cx="95" cy="95" r="78" fill="#111711" stroke="#52624f" stroke-width="2"/><path d="M95 95V62M95 95l14-41" stroke="#b8dc82" stroke-width="4" stroke-linecap="round"/><text x="95" y="205" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Interpretation</text><text x="95" y="230" text-anchor="middle" fill="#aeb7aa" font-size="11">when meaning was added</text></g>
  <g transform="translate(975 180)"><circle cx="95" cy="95" r="78" fill="#111711" stroke="#52624f" stroke-width="2"/><path d="M95 95V52M95 95l-38-10" stroke="#b8dc82" stroke-width="4" stroke-linecap="round"/><text x="95" y="205" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Reception</text><text x="95" y="230" text-anchor="middle" fill="#aeb7aa" font-size="11">when others responded</text></g>
</g>
<path d="M115 485H1085" stroke="#30382f" stroke-width="2"/>
<g font-family="system-ui,sans-serif" fill="#d9dfd4">
  <text x="120" y="525" font-size="14">event</text><text x="320" y="525" font-size="14">capture / publication</text><text x="560" y="525" font-size="14">later recovery</text><text x="775" y="525" font-size="14">later synthesis</text><text x="1000" y="525" font-size="14">public memory</text>
</g>
<path d="M120 548H1080" stroke="#b8dc82" stroke-width="3"/>
<path d="M1064 538l16 10-16 10" fill="none" stroke="#b8dc82" stroke-width="3"/>
<text x="600" y="610" text-anchor="middle" fill="#edf0e8" font-size="20" font-family="Georgia,serif">A later clock can clarify an earlier one. It should not silently replace it.</text>
<text x="600" y="645" text-anchor="middle" fill="#9da79b" font-size="13" font-family="system-ui,sans-serif">Corrections remain visible; recovered originals can narrow or overturn later reconstructions.</text>
</svg>