<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" role="img" aria-labelledby="title desc">
<title id="title">Cosmic Potato morphology model comparison</title>
<desc id="desc">A morphology comparison between a compact tuber-like body, a filament, a sheet and a generic ellipsoid, with quantitative shape descriptors and a rule that visual resemblance is not enough.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.shape{fill:#e8edf0;stroke:#7c8b96;stroke-width:2}.potato{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="840" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Cosmic Potato morphology · replace resemblance with model competition</text>
<text x="680" y="94" text-anchor="middle" class="muted small">The question is not “does it look potato-like?” but which 3D shape model best explains a frozen dataset and segmentation rule.</text>

<rect x="80" y="180" width="270" height="240" rx="14" class="potato"/>
<text x="215" y="220" text-anchor="middle" class="accent body">Tuber-like</text>
<ellipse cx="215" cy="305" rx="88" ry="58" fill="#d8c9ac" stroke="#8b6f43" stroke-width="3"/>
<circle cx="170" cy="290" r="10" fill="#c4b18b"/><circle cx="245" cy="330" r="8" fill="#c4b18b"/>
<text x="215" y="385" text-anchor="middle" class="small">compact · triaxial · rough</text>

<rect x="380" y="180" width="270" height="240" rx="14" class="shape"/>
<text x="515" y="220" text-anchor="middle" class="blue body">Filament</text>
<path d="M425 330 C470 235 540 370 610 260" stroke="#7890a0" stroke-width="25" fill="none" stroke-linecap="round"/>
<text x="515" y="385" text-anchor="middle" class="small">elongated · skeleton-like</text>

<rect x="680" y="180" width="270" height="240" rx="14" class="shape"/>
<text x="815" y="220" text-anchor="middle" class="blue body">Sheet / wall</text>
<polygon points="725,270 875,245 910,340 755,360" fill="#d9e0e4" stroke="#7c8b96" stroke-width="3"/>
<text x="815" y="385" text-anchor="middle" class="small">planar · extended</text>

<rect x="980" y="180" width="270" height="240" rx="14" class="shape"/>
<text x="1115" y="220" text-anchor="middle" class="blue body">Ellipsoid</text>
<ellipse cx="1115" cy="305" rx="96" ry="48" fill="#d9e0e4" stroke="#7c8b96" stroke-width="3"/>
<text x="1115" y="385" text-anchor="middle" class="small">smooth baseline</text>

<rect x="130" y="510" width="1100" height="190" rx="14" class="box"/>
<text x="680" y="550" text-anchor="middle" class="accent body">Measure before naming</text>
<text x="175" y="598" class="small">axis ratios q=b/a, s=c/a</text>
<text x="475" y="598" class="small">planarity P · filamentarity F</text>
<text x="790" y="598" class="small">roughness · topology χ / Betti numbers</text>
<text x="175" y="640" class="small">rotation / line-of-sight stability</text>
<text x="475" y="640" class="small">threshold / smoothing robustness</text>
<text x="790" y="640" class="small">simulation / null distributions</text>
<text x="680" y="680" text-anchor="middle" class="muted small">The “potato” model wins only if preregistered descriptors outperform filament, sheet and generic-shape baselines.</text>

<text x="680" y="770" text-anchor="middle" class="accent small">Cross-scale universality needs a shared dimensionless descriptor or mechanism—not an appealing 2D silhouette.</text>
</svg>