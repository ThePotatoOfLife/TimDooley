<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Culture reproduction loop</title><desc id="d">A loop shows how encounter, shared object, language, roles and status, boundary, memory and reproduction can build a culture, with exits toward repair or capture.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="76" fill="#edf0e8" font-size="39" font-family="Georgia,serif">Culture is a pattern that learns how to reproduce itself</text>
<text x="70" y="108" fill="#9da79b" font-size="15" font-family="system-ui,sans-serif">The important question is not only who belongs, but what keeps the formation alive.</text>
<g fill="none" stroke="#b8dc82" stroke-width="4"><circle cx="600" cy="375" r="220"/></g>
<g font-family="system-ui,sans-serif">
  <g transform="translate(515 115)"><rect width="170" height="78" rx="16" fill="#111711" stroke="#40503e"/><text x="85" y="31" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Encounter</text><text x="85" y="55" text-anchor="middle" fill="#aeb7aa" font-size="11">people meet repeatedly</text></g>
  <g transform="translate(785 205)"><rect width="205" height="78" rx="16" fill="#111711" stroke="#40503e"/><text x="102" y="31" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Shared object</text><text x="102" y="55" text-anchor="middle" fill="#aeb7aa" font-size="11">interest · problem · creator · place</text></g>
  <g transform="translate(850 410)"><rect width="190" height="78" rx="16" fill="#111711" stroke="#40503e"/><text x="95" y="31" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Language</text><text x="95" y="55" text-anchor="middle" fill="#aeb7aa" font-size="11">jokes · symbols · compressed lore</text></g>
  <g transform="translate(650 555)"><rect width="220" height="78" rx="16" fill="#111711" stroke="#40503e"/><text x="110" y="31" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Roles + status</text><text x="110" y="55" text-anchor="middle" fill="#aeb7aa" font-size="11">creator · archive · audience · gate</text></g>
  <g transform="translate(340 555)"><rect width="190" height="78" rx="16" fill="#111711" stroke="#40503e"/><text x="95" y="31" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Boundary</text><text x="95" y="55" text-anchor="middle" fill="#aeb7aa" font-size="11">inside · outside · exit cost</text></g>
  <g transform="translate(155 405)"><rect width="190" height="78" rx="16" fill="#111711" stroke="#40503e"/><text x="95" y="31" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Memory</text><text x="95" y="55" text-anchor="middle" fill="#aeb7aa" font-size="11">archives · stories · recurring scenes</text></g>
  <g transform="translate(210 205)"><rect width="220" height="78" rx="16" fill="#111711" stroke="#40503e"/><text x="110" y="31" text-anchor="middle" fill="#e5c77f" font-size="20" font-family="Georgia,serif">Reproduction</text><text x="110" y="55" text-anchor="middle" fill="#aeb7aa" font-size="11">new people learn the pattern</text></g>
</g>
<circle cx="600" cy="375" r="104" fill="#141a14" stroke="#d8b56b" stroke-width="2"/>
<text x="600" y="353" text-anchor="middle" fill="#edf0e8" font-size="28" font-family="Georgia,serif">FORMATION</text>
<text x="600" y="383" text-anchor="middle" fill="#b8dc82" font-size="13" font-family="system-ui,sans-serif">scene · subculture · institution</text>
<text x="600" y="410" text-anchor="middle" fill="#9da79b" font-size="12" font-family="system-ui,sans-serif">not automatically healthy or harmful</text>
<path d="M485 490L385 680" stroke="#6b7a65" stroke-width="3"/><path d="M715 490L815 680" stroke="#6b7a65" stroke-width="3"/>
<text x="315" y="687" fill="#b8dc82" font-size="17" font-family="Georgia,serif">Garden / repair: dissent, exit, reciprocity, correction</text>
<text x="760" y="687" fill="#d8b56b" font-size="17" font-family="Georgia,serif">Farm / capture: dependence, extraction, recurrence</text>
</svg>