<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" role="img" aria-labelledby="title desc">
<title id="title">Spudlight source channel storage release framework</title>
<desc id="desc">A typed framework showing a source, channel, receiver, storage state and release or reflection, with separate lanes for physical light, plant carbon and information so the same architecture is not mistaken for one universal physical law.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.source{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.store{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.channel{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="840" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Spudlight · source → channel → storage → release</text>
<text x="680" y="94" text-anchor="middle" class="muted small">One structural grammar can describe several domains, but the variables and physical laws remain domain-specific.</text>

<rect x="60" y="180" width="220" height="155" rx="12" class="source"/>
<text x="170" y="222" text-anchor="middle" class="accent body">Source</text>
<text x="95" y="268" class="small">emitter / input</text><text x="95" y="301" class="muted small">S(t)</text>

<rect x="330" y="180" width="220" height="155" rx="12" class="channel"/>
<text x="440" y="222" text-anchor="middle" class="blue body">Channel</text>
<text x="365" y="268" class="small">transfer · noise · filter</text><text x="365" y="301" class="muted small">T or p(y|x)</text>

<rect x="600" y="180" width="220" height="155" rx="12" class="box"/>
<text x="710" y="222" text-anchor="middle" class="blue body">Receiver</text>
<text x="635" y="268" class="small">measurement / uptake</text><text x="635" y="301" class="muted small">Jin(t)</text>

<rect x="870" y="180" width="220" height="155" rx="12" class="store"/>
<text x="980" y="222" text-anchor="middle" class="green body">Storage K</text>
<text x="905" y="268" class="small">state / reservoir</text><text x="905" y="301" class="muted small">dK/dt = Jin − losses</text>

<rect x="1140" y="180" width="160" height="155" rx="12" class="box"/>
<text x="1220" y="222" text-anchor="middle" class="accent body">Release</text>
<text x="1170" y="268" class="small">output / reflection</text><text x="1170" y="301" class="muted small">Jout</text>

<path d="M280 258 H318 M550 258 H588 M820 258 H858 M1090 258 H1128" class="line"/>

<text x="80" y="425" class="accent body">Typed domain examples</text>

<rect x="80" y="455" width="1200" height="82" class="box"/>
<text x="110" y="488" class="blue small">Physical light</text><text x="300" y="488" class="small">Sun / lamp</text><text x="510" y="488" class="small">optical path</text><text x="710" y="488" class="small">detector / leaf</text><text x="910" y="488" class="small">absorbed energy</text><text x="1110" y="488" class="small">emission / heat</text>
<text x="110" y="520" class="muted small">Maxwell / radiative transfer laws apply here</text>

<rect x="80" y="555" width="1200" height="82" class="box"/>
<text x="110" y="588" class="green small">Plant carbon</text><text x="300" y="588" class="small">assimilation</text><text x="510" y="588" class="small">transport</text><text x="710" y="588" class="small">tuber</text><text x="910" y="588" class="small">starch pool</text><text x="1110" y="588" class="small">mobilization</text>
<text x="110" y="620" class="muted small">mass balance and physiology apply here</text>

<rect x="80" y="655" width="1200" height="82" class="box"/>
<text x="110" y="688" class="warn small">Information</text><text x="300" y="688" class="small">message source</text><text x="510" y="688" class="small">platform/channel</text><text x="710" y="688" class="small">observer</text><text x="910" y="688" class="small">memory/state</text><text x="1110" y="688" class="small">decision/output</text>
<text x="110" y="720" class="muted small">probability, coding and task relevance apply here</text>

<text x="680" y="790" text-anchor="middle" class="accent small">Shared arrows do not imply shared units or one hidden force. Cross-domain unification remains structural until a common law is derived.</text>
</svg>