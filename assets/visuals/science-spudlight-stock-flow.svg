<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Spudlight plant carbon storage benchmark</title>
<desc id="desc">A stock-flow model showing photosynthetic or carbohydrate input entering a measurable starch pool K, with mobilization and other turnover leaving the pool, alongside linear and saturating release alternatives.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.green{fill:#526d59}.blue{fill:#4d667d}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.stock{fill:#f1e9d9;stroke:#8b6f43;stroke-width:3}.line{stroke:#716a60;stroke-width:3;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:19px}.body{font-size:25px}.head{font-size:38px;font-weight:650}</style>
<rect width="1280" height="760" fill="#eee9dc"/>
<text x="640" y="58" text-anchor="middle" class="head">Spudlight / Starchforce as an ordinary stock-flow benchmark</text>
<text x="640" y="94" text-anchor="middle" class="muted small">The scientific descendant is plant carbon storage and mobilization—not a new fundamental force.</text>

<rect x="70" y="220" width="255" height="160" rx="12" class="box"/>
<text x="197" y="262" text-anchor="middle" class="green body">Input flux</text>
<text x="105" y="307" class="body">Jᵢₙ(t)</text>
<text x="105" y="340" class="muted small">photosynthate / declared carbon input</text>

<rect x="455" y="180" width="360" height="240" rx="14" class="stock"/>
<text x="635" y="230" text-anchor="middle" class="accent body">Stored pool K(t)</text>
<text x="635" y="280" text-anchor="middle" class="body">starch mass or declared carbon stock</text>
<text x="635" y="330" text-anchor="middle" class="accent body">dK/dt = Jᵢₙ − ηK − ΓK</text>
<text x="635" y="372" text-anchor="middle" class="muted small">η = mobilization rate · Γ = other turnover/loss</text>

<rect x="945" y="180" width="265" height="110" rx="12" class="box"/>
<text x="1077" y="220" text-anchor="middle" class="blue body">Mobilization</text>
<text x="1077" y="258" text-anchor="middle" class="body">Jout = ηK</text>

<rect x="945" y="325" width="265" height="110" rx="12" class="box"/>
<text x="1077" y="365" text-anchor="middle" class="warn body">Other turnover</text>
<text x="1077" y="403" text-anchor="middle" class="body">ΓK</text>

<path d="M325 300 H443" class="line"/><path d="M430 290 l17 10 -17 10" fill="none" stroke="#716a60" stroke-width="3"/>
<path d="M815 245 H933" class="line"/><path d="M920 235 l17 10 -17 10" fill="none" stroke="#716a60" stroke-width="3"/>
<path d="M815 360 H933" class="line"/><path d="M920 350 l17 10 -17 10" fill="none" stroke="#716a60" stroke-width="3"/>

<rect x="160" y="505" width="420" height="155" rx="12" class="box"/>
<text x="370" y="547" text-anchor="middle" class="accent body">Linear release</text>
<text x="200" y="592" class="body">Jout = ηK</text>
<text x="200" y="626" class="muted small">few parameters · exponential depletion when input stops</text>

<rect x="700" y="505" width="420" height="155" rx="12" class="box"/>
<text x="910" y="547" text-anchor="middle" class="accent body">Saturating candidate</text>
<text x="740" y="592" class="body">Jout = Jmax K/(K+Khalf)</text>
<text x="740" y="626" class="muted small">only earns extra complexity if held-out data improve</text>

<text x="640" y="710" text-anchor="middle" class="accent small">The test is predictive: does the stock-flow model beat persistence and simpler baselines on real plant/tuber measurements?</text>
</svg>