<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Project 11D Axis compared with actual M-theory dimensional physics</title>
<desc id="desc">Side-by-side diagram separating the Tim project dimension taxonomy from established M-theory and eleven-dimensional supergravity concepts. A central boundary says comparison is not identity.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.gold{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.project{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.physics{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}
</style>
<rect width="1280" height="800" fill="#0b0b0b"/>
<text x="640" y="58" text-anchor="middle" class="head">11D Axis and M-theory · compare without collapsing</text>
<text x="640" y="94" text-anchor="middle" class="muted small">One side is a project state-space taxonomy. The other is established mathematical physics.</text>

<rect x="55" y="135" width="475" height="565" rx="16" class="project"/>
<text x="292" y="180" text-anchor="middle" class="gold body">Tim / Potatoverse project coordinates</text>

<rect x="100" y="220" width="385" height="72" class="box"/>
<text x="125" y="250" class="body">11D · integrated apex / House</text>
<text x="125" y="278" class="muted small">project master-frame / North-of-North</text>

<rect x="100" y="303" width="385" height="112" class="box"/>
<text x="125" y="337" class="body">6D–10D · hidden structural layers</text>
<text x="125" y="369" class="small">sprouts · rooms · branches</text>
<text x="125" y="397" class="muted small">symbolic / state-space meaning unless separately physicalized</text>

<rect x="100" y="426" width="385" height="92" class="box"/>
<text x="125" y="462" class="gold body">5D · Door / Axis / threshold</text>
<text x="125" y="494" class="muted small">present-choice interface; guard surface is the safe formalization</text>

<rect x="100" y="529" width="385" height="130" class="box"/>
<text x="125" y="563" class="body">1D–4D · lower / manifested layers</text>
<text x="125" y="596" class="small">point · frame · enclosure · Earth / spacetime</text>
<text x="125" y="628" class="muted small">ordered project levels, not measured extra coordinates</text>

<rect x="575" y="255" width="130" height="280" rx="14" class="box"/>
<text x="640" y="305" text-anchor="middle" class="gold body">BOUNDARY</text>
<text x="640" y="350" text-anchor="middle" class="small">analogy</text>
<text x="640" y="384" text-anchor="middle" class="small">≠</text>
<text x="640" y="418" text-anchor="middle" class="small">identity</text>
<text x="640" y="466" text-anchor="middle" class="muted small">same number</text>
<text x="640" y="493" text-anchor="middle" class="muted small">does not mean</text>
<text x="640" y="520" text-anchor="middle" class="muted small">same dimensions</text>

<rect x="750" y="135" width="475" height="565" rx="16" class="physics"/>
<text x="988" y="180" text-anchor="middle" class="blue body">Established M-theory / 11D supergravity context</text>

<rect x="795" y="220" width="385" height="96" class="box"/>
<text x="820" y="253" class="body">11D supergravity</text>
<text x="820" y="284" class="muted small">low-energy 11D framework associated with M-theory</text>

<rect x="795" y="327" width="385" height="112" class="box"/>
<text x="820" y="360" class="body">M2 / M5 branes · C₃ / G₄</text>
<text x="820" y="391" class="small">genuine extended-object and higher-form structure</text>
<text x="820" y="420" class="muted small">not Potatoverse role labels</text>

<rect x="795" y="450" width="385" height="100" class="box"/>
<text x="820" y="484" class="green body">11D → 4D compactification</text>
<text x="820" y="517" class="small">7-real-dimensional internal geometry can arise;</text>
<text x="820" y="543" class="muted small">G₂ holonomy is a standard comparison for minimal SUSY</text>

<rect x="795" y="561" width="385" height="98" class="box"/>
<text x="820" y="594" class="warn body">Not standard M-theory claims</text>
<text x="820" y="626" class="small">“5D contains all timelines” · moral choices alter compactification</text>
<text x="820" y="651" class="muted small">these remain project symbolism / unsupported stronger claims</text>

<line x1="530" y1="414" x2="575" y2="414" class="line"/>
<line x1="705" y1="414" x2="750" y2="414" class="line"/>
<text x="640" y="752" text-anchor="middle" class="gold small">The scientifically strongest next step is to model the project ladder as a graded state space, then ask whether any independent physical mapping earns promotion.</text>
</svg>