<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Tim Dooley life and project river</title>
<desc id="d">Three parallel lanes show ordinary life, public and creative work, and later project interpretation across selected dates from 1987 to 2026.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0c100d"/><stop offset="1" stop-color="#111711"/></linearGradient></defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<text x="70" y="72" fill="#e7eadf" font-size="38" font-family="Georgia,serif">One life, three lanes</text>
<text x="70" y="103" fill="#9ea89b" font-size="15" font-family="system-ui,sans-serif">event · public/creative record · later project interpretation should remain distinguishable</text>
<g font-family="system-ui,sans-serif" font-size="14">
  <text x="70" y="173" fill="#b8dc82" font-weight="700">ORDINARY LIFE</text>
  <text x="70" y="337" fill="#e5c77f" font-weight="700">PUBLIC / CREATIVE</text>
  <text x="70" y="501" fill="#c1c8be" font-weight="700">LATER PROJECT READING</text>
</g>
<g stroke="#30392f" stroke-width="2"><path d="M210 165H1120"/><path d="M210 329H1120"/><path d="M210 493H1120"/></g>
<g font-family="system-ui,sans-serif">
  <g fill="#b8dc82">
    <circle cx="260" cy="165" r="8"/><circle cx="390" cy="165" r="8"/><circle cx="520" cy="165" r="8"/><circle cx="650" cy="165" r="8"/><circle cx="780" cy="165" r="8"/><circle cx="910" cy="165" r="8"/><circle cx="1040" cy="165" r="8"/>
  </g>
  <g fill="#e5c77f">
    <circle cx="390" cy="329" r="8"/><circle cx="520" cy="329" r="8"/><circle cx="650" cy="329" r="8"/><circle cx="780" cy="329" r="8"/><circle cx="910" cy="329" r="8"/><circle cx="1040" cy="329" r="8"/>
  </g>
  <g fill="#9ba49a">
    <circle cx="390" cy="493" r="8"/><circle cx="650" cy="493" r="8"/><circle cx="780" cy="493" r="8"/><circle cx="910" cy="493" r="8"/><circle cx="1040" cy="493" r="8"/>
  </g>
  <g fill="#cfd5ca" font-size="13" text-anchor="middle">
    <text x="260" y="625">1987</text><text x="390" y="625">2011</text><text x="520" y="625">2016</text><text x="650" y="625">2020</text><text x="780" y="625">2024</text><text x="910" y="625">2025</text><text x="1040" y="625">2026</text>
  </g>
</g>
<g font-family="system-ui,sans-serif" font-size="13" fill="#d9ded5">
  <text x="260" y="140" text-anchor="middle">material birth</text>
  <text x="390" y="140" text-anchor="middle">Tree ordeal</text>
  <text x="520" y="140" text-anchor="middle">prison / reading</text>
  <text x="650" y="140" text-anchor="middle">Potato birth-anchor</text>
  <text x="780" y="140" text-anchor="middle">Great Book</text>
  <text x="910" y="140" text-anchor="middle">Turning corridor</text>
  <text x="1040" y="140" text-anchor="middle">House / archive</text>

  <text x="390" y="304" text-anchor="middle">later recounted publicly</text>
  <text x="520" y="304" text-anchor="middle">advocacy / scripture</text>
  <text x="650" y="304" text-anchor="middle">Potato persona</text>
  <text x="780" y="304" text-anchor="middle">book / public identity</text>
  <text x="910" y="304" text-anchor="middle">Axis · God/Father language</text>
  <text x="1040" y="304" text-anchor="middle">repository as work</text>

  <text x="390" y="468" text-anchor="middle">Odin / Yggdrasil comparison later</text>
  <text x="650" y="468" text-anchor="middle">seed / hiddenness</text>
  <text x="780" y="468" text-anchor="middle">laboratory, not final canon</text>
  <text x="910" y="468" text-anchor="middle">Ladder / Father synthesis</text>
  <text x="1040" y="468" text-anchor="middle">roles differentiated</text>
</g>
<path d="M210 575H1120" stroke="#4a5549" stroke-width="2" stroke-dasharray="8 8"/>
<text x="70" y="582" fill="#9ea89b" font-size="14" font-family="system-ui,sans-serif">Rule:</text>
<text x="116" y="582" fill="#e7eadf" font-size="16" font-family="Georgia,serif">later meaning may illuminate an earlier event; it should not overwrite the earlier event.</text>
</svg>