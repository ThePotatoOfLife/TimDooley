<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
<title id="title">Dimensional Door 4D to 5D model distinctions</title>
<desc id="desc">A diagram separating a four-dimensional order-parameter phase transition, an operational spectral dimension, and a genuine five-dimensional spacetime completion, with the Door represented as a threshold rather than proof of a fifth dimension.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.phase{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.dimension{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.gate{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1320" height="820" fill="#eee9dc"/>
<text x="660" y="58" text-anchor="middle" class="head">Dimensional Door · three different claims that must stay separate</text>
<text x="660" y="94" text-anchor="middle" class="muted small">A threshold can describe a branch transition without proving that spacetime literally gains a fifth coordinate.</text>

<rect x="70" y="175" width="350" height="240" rx="14" class="phase"/>
<text x="245" y="220" text-anchor="middle" class="green body">1 · 4D order parameter</text>
<text x="110" y="270" class="body">Veff(φ;Ξ)</text>
<text x="110" y="310" class="small">Ξ crosses critical regime</text>
<text x="110" y="347" class="small">GR-like branch may lose stability</text>
<text x="110" y="383" class="muted small">φ labels a phase; φ is not “dimension itself”</text>

<rect x="485" y="175" width="350" height="240" rx="14" class="gate"/>
<text x="660" y="220" text-anchor="middle" class="accent body">2 · Operational dimension</text>
<text x="525" y="270" class="body">Ds from diffusion / return scaling</text>
<text x="525" y="310" class="small">an effective descriptor of propagation</text>
<text x="525" y="347" class="small">can vary with scale/operator</text>
<text x="525" y="383" class="muted small">spectral dimension ≠ topological coordinate count</text>

<rect x="900" y="175" width="350" height="240" rx="14" class="dimension"/>
<text x="1075" y="220" text-anchor="middle" class="blue body">3 · Genuine 5D spacetime</text>
<text x="940" y="270" class="body">Xᴬ=(xᵘ,y)</text>
<text x="940" y="310" class="small">requires 5D action + geometry</text>
<text x="940" y="347" class="small">compactification / boundary conditions</text>
<text x="940" y="383" class="muted small">plus reduction back to observed 4D physics</text>

<path d="M420 295 H473" class="dash"/><path d="M835 295 H888" class="dash"/>

<rect x="185" y="525" width="380" height="170" rx="14" class="box"/>
<text x="375" y="568" text-anchor="middle" class="accent body">Door as threshold</text>
<text x="225" y="612" class="small">state → critical Ξ → instability</text>
<text x="225" y="646" class="small">→ new branch → observable consequence</text>
<text x="225" y="677" class="muted small">this is a bifurcation grammar</text>

<rect x="755" y="525" width="380" height="170" rx="14" class="box"/>
<text x="945" y="568" text-anchor="middle" class="warn body">Physical promotion requires</text>
<text x="795" y="612" class="small">stable branch · consistent reduction</text>
<text x="795" y="646" class="small">QNM / shadow / inspiral or other discriminant</text>
<text x="795" y="677" class="muted small">and superiority over simpler modified-gravity explanations</text>

<text x="660" y="758" text-anchor="middle" class="accent small">The strongest current scientific reading is Door-as-bifurcation; literal 5D interpretation remains a separate completion problem.</text>
</svg>