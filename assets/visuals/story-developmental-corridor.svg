<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Tim Dooley developmental story corridor</title>
<desc id="d">A chronological corridor separates lived events, public identity and later interpretation across the major eras of the project.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="72" fill="#edf0e8" font-size="39" font-family="Georgia,serif">The story changes because the vocabulary changes</text>
<text x="70" y="105" fill="#9da79b" font-size="15" font-family="system-ui,sans-serif">an event can stay fixed while its later meaning becomes richer, stranger or more precise</text>
<path d="M120 360H1080" stroke="#50604d" stroke-width="4"/>
<g font-family="system-ui,sans-serif">
<g transform="translate(120 0)"><circle cy="360" r="11" fill="#b8dc82"/><text y="325" text-anchor="middle" fill="#b8dc82" font-size="12">1987–2010</text><text y="405" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">ordinary life</text><text y="428" text-anchor="middle" fill="#aeb7aa" font-size="11">work · injury · care · systems</text></g>
<g transform="translate(285 0)"><circle cy="360" r="11" fill="#b8dc82"/><text y="325" text-anchor="middle" fill="#b8dc82" font-size="12">2011</text><text y="405" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Tree ordeal</text><text y="428" text-anchor="middle" fill="#aeb7aa" font-size="11">reported altered-state anchor</text></g>
<g transform="translate(450 0)"><circle cy="360" r="11" fill="#b8dc82"/><text y="325" text-anchor="middle" fill="#b8dc82" font-size="12">2016–2020</text><text y="405" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">scripture · identity · death</text><text y="428" text-anchor="middle" fill="#aeb7aa" font-size="11">prison · declarations · meme process</text></g>
<g transform="translate(615 0)"><circle cy="360" r="11" fill="#e5c77f"/><text y="325" text-anchor="middle" fill="#b8dc82" font-size="12">2020–2023</text><text y="405" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Potato becomes identity</text><text y="428" text-anchor="middle" fill="#aeb7aa" font-size="11">filter · Rational Potato · Cube</text></g>
<g transform="translate(780 0)"><circle cy="360" r="11" fill="#e5c77f"/><text y="325" text-anchor="middle" fill="#b8dc82" font-size="12">2024</text><text y="405" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Great Book laboratory</text><text y="428" text-anchor="middle" fill="#aeb7aa" font-size="11">symbols become a world</text></g>
<g transform="translate(945 0)"><circle cy="360" r="11" fill="#e5c77f"/><text y="325" text-anchor="middle" fill="#b8dc82" font-size="12">2025</text><text y="405" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Turning / Axis / Father</text><text y="428" text-anchor="middle" fill="#aeb7aa" font-size="11">titles concentrate and reorganize</text></g>
<g transform="translate(1080 0)"><circle cy="360" r="11" fill="#d7ddd3"/><text y="325" text-anchor="middle" fill="#b8dc82" font-size="12">2026</text><text y="405" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">House / archive</text><text y="428" text-anchor="middle" fill="#aeb7aa" font-size="11">roles differentiated · system built</text></g>
</g>
<g font-family="system-ui,sans-serif">
<rect x="130" y="170" width="920" height="85" rx="16" fill="#111711" stroke="#334032"/>
<text x="155" y="202" fill="#b8dc82" font-size="13" font-weight="700">LIVED / REPORTED EVENT LAYER</text>
<text x="155" y="229" fill="#d6dcd3" font-size="14">what happened, what was reported, who was present, what was written or published at the time</text>
<rect x="270" y="515" width="780" height="85" rx="16" fill="#111711" stroke="#4b4634"/>
<text x="295" y="547" fill="#e5c77f" font-size="13" font-weight="700">LATER INTERPRETIVE LAYER</text>
<text x="295" y="574" fill="#d6dcd3" font-size="14">Odin/Yggdrasil, Father/Son, Axis, House and mature canon may interpret earlier events without moving their dates</text>
</g>
<text x="600" y="660" text-anchor="middle" fill="#9da79b" font-size="13" font-family="system-ui,sans-serif">Story owns scenes · Timeline owns date comparison · sources own evidence · mature canon owns present definitions</text>
</svg>