<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc">
<title id="title">Higgs and Potato sector model forks</title>
<desc id="desc">A field-theory diagram showing a shared Higgs baseline that branches into a neutral scalar singlet model and a complex U1 Potato sector, followed by vacuum selection, mass mixing and experimental observables.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.forka{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.forkb{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1320" height="820" fill="#eee9dc"/>
<text x="660" y="58" text-anchor="middle" class="head">Higgs / Quantum Tuber · choose the field content before calculating</text>
<text x="660" y="94" text-anchor="middle" class="muted small">The recovered UPT structure is under-defined until the Potato-sector representation is fixed.</text>

<rect x="445" y="155" width="430" height="150" rx="14" class="box"/>
<text x="660" y="198" text-anchor="middle" class="accent body">Shared Standard-Model baseline</text>
<text x="500" y="240" class="body">Higgs doublet H · electroweak vacuum v</text>
<text x="500" y="274" class="muted small">new interactions must remain gauge-consistent</text>

<path d="M660 305 V355 H360 V390" class="line"/>
<path d="M660 355 H960 V390" class="line"/>

<rect x="125" y="390" width="470" height="220" rx="14" class="forka"/>
<text x="360" y="432" text-anchor="middle" class="green body">Fork A · neutral real scalar P</text>
<text x="165" y="478" class="small">P is an SM singlet</text>
<text x="165" y="514" class="body">portal: P² H†H</text>
<text x="165" y="552" class="small">exact Z₂ can make P stable</text>
<text x="165" y="586" class="muted small">mixing only if symmetry/vacuum permits it</text>

<rect x="725" y="390" width="470" height="220" rx="14" class="forkb"/>
<text x="960" y="432" text-anchor="middle" class="blue body">Fork B · complex U(1)ₚ scalar Φₚ</text>
<text x="765" y="478" class="small">charged complex field + gauge boson Aₚ</text>
<text x="765" y="514" class="body">|DΦₚ|² − ¼Fₚ²</text>
<text x="765" y="552" class="small">portal: |Φₚ|² H†H</text>
<text x="765" y="586" class="muted small">charges, kinetic mixing and anomalies must be audited</text>

<rect x="355" y="665" width="610" height="105" rx="12" class="box"/>
<text x="660" y="705" text-anchor="middle" class="accent body">After the vacuum: mass matrix → mixing angle → observables</text>
<text x="660" y="744" text-anchor="middle" class="small">Higgs signal strengths · new scalar/vector resonances · invisible/exotic decays · cosmology where relevant</text>

<path d="M360 610 C360 640 520 640 570 653" class="dash"/>
<path d="M960 610 C960 640 800 640 750 653" class="dash"/>
<text x="660" y="800" text-anchor="middle" class="warn small">“Quantum Tuber” names a possible excitation only after the chosen equations actually support that solution class.</text>
</svg>