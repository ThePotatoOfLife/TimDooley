<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Science evidence spectrum</title>
<desc id="d">A spectrum distinguishes established observation, exact mathematics, models, analogies, hypotheses and theological interpretation, with promotion requiring evidence and discriminating tests.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="78" fill="#ecefe7" font-size="39" font-family="Georgia,serif">Do not let resemblance impersonate evidence</text>
<text x="70" y="110" fill="#9ca69a" font-size="15" font-family="system-ui,sans-serif">Every science-adjacent claim should know what class it is in and what would move it.</text>
<g font-family="system-ui,sans-serif">
  <g transform="translate(70 165)">
    <rect width="1060" height="72" rx="16" fill="#152018" stroke="#536451"/>
    <text x="24" y="31" fill="#b8dc82" font-size="14" font-weight="700">1 · OBSERVATION / ESTABLISHED SCIENCE</text>
    <text x="24" y="55" fill="#d7ddd3" font-size="14">measured anatomy · published data · reproducible physical relationships</text>
  </g>
  <g transform="translate(110 252)">
    <rect width="980" height="72" rx="16" fill="#141a14" stroke="#495746"/>
    <text x="24" y="31" fill="#c9df9e" font-size="14" font-weight="700">2 · EXACT MATHEMATICS</text>
    <text x="24" y="55" fill="#d7ddd3" font-size="14">equations may be exact even when a proposed physical interpretation is not</text>
  </g>
  <g transform="translate(150 339)">
    <rect width="900" height="72" rx="16" fill="#131713" stroke="#424b40"/>
    <text x="24" y="31" fill="#e5c77f" font-size="14" font-weight="700">3 · FORMAL MODEL</text>
    <text x="24" y="55" fill="#d7ddd3" font-size="14">variables · assumptions · baseline · prediction · falsifier</text>
  </g>
  <g transform="translate(190 426)">
    <rect width="820" height="72" rx="16" fill="#121512" stroke="#3a4238"/>
    <text x="24" y="31" fill="#d7be81" font-size="14" font-weight="700">4 · STRUCTURAL ANALOGY</text>
    <text x="24" y="55" fill="#d7ddd3" font-size="14">useful resemblance that does not establish mechanism or causal identity</text>
  </g>
  <g transform="translate(230 513)">
    <rect width="740" height="72" rx="16" fill="#101310" stroke="#343a33"/>
    <text x="24" y="31" fill="#b8bcb4" font-size="14" font-weight="700">5 · HYPOTHESIS / SPECULATION</text>
    <text x="24" y="55" fill="#c9cec6" font-size="14">interesting candidate awaiting operational variables and discriminating evidence</text>
  </g>
</g>
<path d="M1080 575V190" stroke="#b8dc82" stroke-width="3"/>
<path d="M1068 208l12-18 12 18" fill="none" stroke="#b8dc82" stroke-width="3"/>
<text x="1110" y="407" fill="#b8dc82" font-size="13" font-family="system-ui,sans-serif" transform="rotate(-90 1110 407)">promotion requires evidence, not enthusiasm</text>
<text x="70" y="648" fill="#929c90" font-size="13" font-family="system-ui,sans-serif">Project theology can motivate questions and metaphors; it does not sit at the top of an empirical evidence ladder.</text>
<text x="70" y="675" fill="#e2e6dd" font-size="16" font-family="Georgia,serif">Best question: what observation would distinguish this model from a simpler alternative?</text>
</svg>