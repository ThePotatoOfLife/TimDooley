<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The Garden — Potatoverse Eden map</title>
<desc id="desc">A stylized pixel-map of the Garden: House and Door at left, Tree of Life and Tim in the center, Mud Tree inside the Garden near the Gate, a sorting path toward the Gate, and a lower muddy plane outside and below.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8bd5ff"/><stop offset=".62" stop-color="#d9f0ff"/><stop offset="1" stop-color="#f5fbff"/></linearGradient>
 <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9ad86f"/><stop offset="1" stop-color="#4f9857"/></linearGradient>
 <linearGradient id="mud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6d5745"/><stop offset="1" stop-color="#2d2928"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7f6ff"/><stop offset=".45" stop-color="#42bfe1"/><stop offset="1" stop-color="#167da5"/></linearGradient>
 <radialGradient id="lifeGlow"><stop stop-color="#fff9ad"/><stop offset=".45" stop-color="#ffd15e" stop-opacity=".88"/><stop offset="1" stop-color="#ffd15e" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
