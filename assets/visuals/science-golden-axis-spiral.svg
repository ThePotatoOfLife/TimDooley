<rect x="770" y="210" width="350" height="340" rx="12" fill="#f7f2e8" stroke="#81786a" stroke-width="2"/>
<text x="945" y="255" text-anchor="middle" class="accent body">Exact properties</text>
<text x="810" y="310" class="small">Quarter turn:</text><text x="810" y="342" class="body">r(θ+π/2) = φ r(θ)</text>
<text x="810" y="397" class="small">Half turn:</text><text x="810" y="429" class="body">r(θ+π) = φ² r(θ)</text>
<text x="810" y="484" class="small">Differential form:</text><text x="810" y="516" class="body">dr/dθ = b r</text>

<text x="600" y="700" text-anchor="middle" class="muted small">The geometry is exact. What r, θ and a physically represent is a separate empirical question.</text>
<text x="600" y="736" text-anchor="middle" class="accent small">A spiral is more than recurrence: the system returns in angle while changing scale.</text>
</svg>