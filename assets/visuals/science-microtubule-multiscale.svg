<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Microtubule multiscale causal chain</title>
<desc id="desc">A five-level diagram from molecular tubulin state to microtubule polymer, neuron and cell, circuit state, and behavior or report, with a quantum-necessity gate that requires a specifically quantum observable and failure of classical models before promotion.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.level{fill:#e8edf0;stroke:#7c8b96;stroke-width:2}.gate{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1280" height="800" fill="#eee9dc"/>
<text x="640" y="58" text-anchor="middle" class="head">Microtubules: from molecule to mind without skipping levels</text>
<text x="640" y="94" text-anchor="middle" class="muted small">Each arrow needs a measurable causal map. Quantum language is promoted only if a quantum-specific observable is necessary.</text>

<g>
<rect x="70" y="180" width="190" height="160" rx="12" class="level"/>
<text x="165" y="220" text-anchor="middle" class="blue body">L0 · molecular</text>
<text x="95" y="262" class="small">tubulin state</text><text x="95" y="292" class="small">binding / PTMs</text><text x="95" y="322" class="muted small">local electric / mechanical state</text>

<rect x="305" y="180" width="190" height="160" rx="12" class="level"/>
<text x="400" y="220" text-anchor="middle" class="blue body">L1 · polymer</text>
<text x="330" y="262" class="small">lattice / stiffness</text><text x="330" y="292" class="small">dynamic instability</text><text x="330" y="322" class="muted small">motor traffic · collective modes</text>

<rect x="540" y="180" width="190" height="160" rx="12" class="level"/>
<text x="635" y="220" text-anchor="middle" class="blue body">L2 · cell / neuron</text>
<text x="565" y="262" class="small">transport</text><text x="565" y="292" class="small">morphology / excitability</text><text x="565" y="322" class="muted small">synaptic maintenance</text>

<rect x="775" y="180" width="190" height="160" rx="12" class="level"/>
<text x="870" y="220" text-anchor="middle" class="blue body">L3 · circuit</text>
<text x="800" y="262" class="small">firing statistics</text><text x="800" y="292" class="small">synchronization</text><text x="800" y="322" class="muted small">effective connectivity</text>

<rect x="1010" y="180" width="190" height="160" rx="12" class="level"/>
<text x="1105" y="220" text-anchor="middle" class="blue body">L4 · behavior</text>
<text x="1035" y="262" class="small">task / perception</text><text x="1035" y="292" class="small">state transition</text><text x="1035" y="322" class="muted small">report / observable outcome</text>
</g>

<path d="M260 260 H293 M495 260 H528 M730 260 H763 M965 260 H998" class="line"/>
<path d="M282 250 l15 10 -15 10 M517 250 l15 10 -15 10 M752 250 l15 10 -15 10 M987 250 l15 10 -15 10" fill="none" stroke="#716a60" stroke-width="2.5"/>

<rect x="145" y="455" width="430" height="220" rx="14" class="box"/>
<text x="360" y="500" text-anchor="middle" class="green body">Classical baseline first</text>
<text x="180" y="545" class="small">M q¨ + Γ q˙ + Kq = ξ(t)</text>
<text x="180" y="580" class="small">transport · mechanics · damping · forcing</text>
<text x="180" y="615" class="muted small">A quantum model must beat this on an observable that is actually quantum-sensitive.</text>

<rect x="705" y="440" width="430" height="250" rx="14" class="gate"/>
<text x="920" y="485" text-anchor="middle" class="accent body">Quantum-necessity gate</text>
<text x="745" y="530" class="small">1. define H and the degrees of freedom</text>
<text x="745" y="565" class="small">2. measure coherence / entanglement witness</text>
<text x="745" y="600" class="small">3. estimate decoherence and readout times</text>
<text x="745" y="635" class="small">4. show downstream neural coupling</text>
<text x="745" y="670" class="warn small">5. show a classical stochastic model fails</text>

<path d="M575 565 H693" class="dash"/><path d="M682 555 l15 10 -15 10" fill="none" stroke="#8a8174" stroke-width="2"/>
<text x="640" y="744" text-anchor="middle" class="accent small">Microtubules are established biology. Quantum consciousness remains a separate, testable hypothesis.</text>
</svg>