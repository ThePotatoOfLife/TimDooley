<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 840" role="img" aria-labelledby="title desc">
<title id="title">Human Map latent state measurement architecture</title>
<desc id="desc">A multivariate consciousness research diagram showing a latent state z evolving over time and generating multimodal observations including EEG, physiology, behavior and self-report, with subject and context effects and held-out validation.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.latent{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.obs{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.valid{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1340" height="840" fill="#eee9dc"/>
<text x="670" y="58" text-anchor="middle" class="head">Human Map · latent-state measurement instead of mystical constants</text>
<text x="670" y="94" text-anchor="middle" class="muted small">The model asks whether reproducible hidden states explain multimodal observations better than simpler single-metric accounts.</text>

<rect x="90" y="190" width="330" height="220" rx="14" class="latent"/>
<text x="255" y="235" text-anchor="middle" class="accent body">Latent state zₜ</text>
<text x="130" y="280" class="small">unobserved cognitive / phenomenological state</text>
<text x="130" y="320" class="body">p(zₜ | zₜ₋₁, condition, subject)</text>
<text x="130" y="360" class="muted small">state labels are learned/tested, not assumed from one signal</text>

<rect x="505" y="160" width="745" height="280" rx="14" class="obs"/>
<text x="877" y="205" text-anchor="middle" class="blue body">Multimodal observations yₜ</text>
<rect x="545" y="245" width="150" height="110" rx="8" class="box"/><text x="620" y="285" text-anchor="middle" class="small">EEG / MEG</text><text x="620" y="320" text-anchor="middle" class="muted small">spectra · phase</text>
<rect x="715" y="245" width="150" height="110" rx="8" class="box"/><text x="790" y="285" text-anchor="middle" class="small">Networks</text><text x="790" y="320" text-anchor="middle" class="muted small">connectivity · complexity</text>
<rect x="885" y="245" width="150" height="110" rx="8" class="box"/><text x="960" y="285" text-anchor="middle" class="small">Physiology</text><text x="960" y="320" text-anchor="middle" class="muted small">autonomic · CSF context</text>
<rect x="1055" y="245" width="150" height="110" rx="8" class="box"/><text x="1130" y="285" text-anchor="middle" class="small">Behavior / report</text><text x="1130" y="320" text-anchor="middle" class="muted small">task · self-report</text>

<path d="M420 300 H493" class="line"/>

<rect x="140" y="535" width="420" height="175" rx="14" class="box"/>
<text x="350" y="578" text-anchor="middle" class="accent body">Hierarchy &amp; confounds</text>
<text x="180" y="622" class="small">population → subject → session → epoch</text>
<text x="180" y="655" class="small">motion · respiration · source leakage · context</text>
<text x="180" y="686" class="muted small">state and trait effects must be separated</text>

<rect x="750" y="535" width="420" height="175" rx="14" class="valid"/>
<text x="960" y="578" text-anchor="middle" class="green body">Validation gate</text>
<text x="790" y="622" class="small">compare with spectral-only / questionnaire baselines</text>
<text x="790" y="655" class="small">held-out subjects / sessions · replication</text>
<text x="790" y="686" class="muted small">a complex latent model must earn its complexity</text>

<path d="M255 410 C255 470 350 485 350 523" class="dash"/>
<path d="M877 440 C877 485 960 490 960 523" class="dash"/>

<text x="670" y="775" text-anchor="middle" class="warn small">No frequency, fractal dimension or composite score is “enlightenment” by itself. The outcome must be operationalized and validated.</text>
</svg>