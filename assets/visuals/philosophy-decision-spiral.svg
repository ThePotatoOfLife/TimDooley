<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Potatoism decision spiral</title>
<desc id="d">A spiral decision process moves from actual conditions to evidence, values, action, fruit, consequence and revision, returning changed rather than merely repeating.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="76" fill="#ecefe7" font-size="39" font-family="Georgia,serif">A principle becomes philosophy when it survives a real choice</text>
<text x="70" y="108" fill="#9ca69a" font-size="15" font-family="system-ui,sans-serif">observe → interpret → choose → act → inspect fruit → revise</text>
<g fill="none" stroke="#b8dc82" stroke-width="4" stroke-linecap="round">
  <path d="M215 355C215 200 400 150 570 210C760 278 815 462 655 535C505 603 333 529 350 410C366 300 506 271 594 321C678 369 654 455 590 466C535 475 501 438 516 403"/>
</g>
<g font-family="system-ui,sans-serif">
  <g transform="translate(95 315)"><circle cx="70" cy="40" r="55" fill="#111711" stroke="#536451"/><text x="70" y="35" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Conditions</text><text x="70" y="57" text-anchor="middle" fill="#aeb7aa" font-size="11">what is actually here?</text></g>
  <g transform="translate(260 120)"><circle cx="70" cy="40" r="55" fill="#111711" stroke="#536451"/><text x="70" y="35" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Evidence</text><text x="70" y="57" text-anchor="middle" fill="#aeb7aa" font-size="11">what supports it?</text></g>
  <g transform="translate(525 115)"><circle cx="70" cy="40" r="55" fill="#111711" stroke="#536451"/><text x="70" y="35" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Values</text><text x="70" y="57" text-anchor="middle" fill="#aeb7aa" font-size="11">what matters here?</text></g>
  <g transform="translate(780 250)"><circle cx="70" cy="40" r="55" fill="#111711" stroke="#536451"/><text x="70" y="35" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Action</text><text x="70" y="57" text-anchor="middle" fill="#aeb7aa" font-size="11">what changes?</text></g>
  <g transform="translate(690 500)"><circle cx="70" cy="40" r="55" fill="#111711" stroke="#536451"/><text x="70" y="35" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Fruit</text><text x="70" y="57" text-anchor="middle" fill="#aeb7aa" font-size="11">what happened downstream?</text></g>
  <g transform="translate(390 510)"><circle cx="70" cy="40" r="55" fill="#111711" stroke="#536451"/><text x="70" y="35" text-anchor="middle" fill="#e5c77f" font-size="18" font-family="Georgia,serif">Revision</text><text x="70" y="57" text-anchor="middle" fill="#aeb7aa" font-size="11">what changes next time?</text></g>
</g>
<circle cx="554" cy="404" r="48" fill="#171d17" stroke="#d8b56b" stroke-width="2"/>
<text x="554" y="396" text-anchor="middle" fill="#ecefe7" font-size="20" font-family="Georgia,serif">Door</text>
<text x="554" y="418" text-anchor="middle" fill="#b8dc82" font-size="11" font-family="system-ui,sans-serif">a real state change?</text>
<text x="955" y="360" fill="#d7ddd3" font-size="17" font-family="Georgia,serif">Ring = same recurrence</text>
<text x="955" y="391" fill="#b8dc82" font-size="17" font-family="Georgia,serif">Spiral = return with changed state</text>
<text x="955" y="430" fill="#929c90" font-size="12" font-family="system-ui,sans-serif">The Fruit test is not “did I feel right?”</text>
<text x="955" y="451" fill="#929c90" font-size="12" font-family="system-ui,sans-serif">It asks what changed for the world affected by the choice.</text>
</svg>