<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Unified Potato Theory recovered sector map</title>
<desc id="desc">Diagram separating established gravity and Standard Model sectors, the recovered 2025 Potato-sector proposal, and two later mathematically cleaner repair forks.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#e9e4d9}.muted{fill:#aaa69e}.gold{fill:#d8b56b}.green{fill:#9db7a6}.blue{fill:#9fb3c8}.warn{fill:#d4a08e}.box{fill:#151514;stroke:#4d4942;stroke-width:2}.base{fill:#121820;stroke:#536372;stroke-width:2}.proj{fill:#181610;stroke:#806c48;stroke-width:3}.repair{fill:#121914;stroke:#506d59;stroke-width:2}.line{stroke:#888279;stroke-width:2.5;fill:none}.dash{stroke:#736c60;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:20px}.body{font-size:25px}.head{font-size:38px;font-weight:650}
</style>
<rect width="1280" height="760" fill="#0b0b0b"/>
<text x="640" y="58" text-anchor="middle" class="head">Unified Potato Theory · recovered 18 April 2025 skeleton</text>
<text x="640" y="95" text-anchor="middle" class="muted small">Historically important project proposal; not a validated physical theory.</text>

<rect x="55" y="160" width="280" height="190" rx="14" class="base"/>
<text x="195" y="202" text-anchor="middle" class="blue body">Established baseline</text>
<text x="85" y="250" class="body">Einstein gravity</text>
<text x="85" y="286" class="body">Standard Model</text>
<text x="85" y="324" class="muted small">known fields · gauge structure · tested physics</text>

<rect x="425" y="135" width="430" height="265" rx="16" class="proj"/>
<text x="640" y="180" text-anchor="middle" class="gold body">Recovered project sector</text>
<text x="462" y="230" class="body">Potato field P</text>
<text x="462" y="268" class="body">PSG ≅ U(1)ₚ × Z₆</text>
<text x="462" y="306" class="body">fractional / nonlocal □ᵅ · α = 1.3</text>
<text x="462" y="344" class="body">Fₚ + Lint + schematic GB/CDT terms</text>
<text x="462" y="378" class="muted small">representation, operator definition and gauge meaning unresolved</text>

<rect x="945" y="160" width="280" height="190" rx="14" class="box"/>
<text x="1085" y="202" text-anchor="middle" class="warn body">Recovered couplings</text>
<text x="975" y="250" class="body">gₚ P ψ̄ψ</text>
<text x="975" y="288" class="body">λₚ P²H</text>
<text x="975" y="326" class="muted small">historical forms need gauge-consistent interpretation</text>

<path d="M335 255 H413" class="line"/><path d="M401 245 l16 10 -16 10" fill="none" stroke="#888279" stroke-width="2.5"/>
<path d="M855 255 H933" class="line"/><path d="M921 245 l16 10 -16 10" fill="none" stroke="#888279" stroke-width="2.5"/>

<text x="640" y="455" text-anchor="middle" class="gold body">Later repair forks</text>

<rect x="145" y="500" width="430" height="170" rx="14" class="repair"/>
<text x="360" y="540" text-anchor="middle" class="green body">Fork A · neutral singlet EFT</text>
<text x="178" y="585" class="body">real scalar P + Higgs portal</text>
<text x="178" y="622" class="small">define K(□/Λ²), stable V(P), poles and cutoff</text>
<text x="178" y="651" class="muted small">smallest calculable repair</text>

<rect x="705" y="500" width="430" height="170" rx="14" class="repair"/>
<text x="920" y="540" text-anchor="middle" class="green body">Fork B · explicit U(1)ₚ EFT</text>
<text x="738" y="585" class="body">complex Φₚ + Abelian gauge field Aₚ</text>
<text x="738" y="622" class="small">charges · symmetry breaking · anomalies · mixing</text>
<text x="738" y="651" class="muted small">repairs the recovered Fₚ / U(1) structure</text>

<path d="M640 400 V465 H360 V488" class="dash"/>
<path d="M640 465 H920 V488" class="dash"/>
<text x="640" y="718" text-anchor="middle" class="gold small">Scientific promotion requires a completed sector, correspondence limit, parameter constraints and a discriminating prediction.</text>
</svg>