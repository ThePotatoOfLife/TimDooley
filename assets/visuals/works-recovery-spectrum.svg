<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Creative artifact recovery spectrum</title>
<desc id="d">Works are classified from surviving primary artifact through catalogued, partial, reconstructed and memory-only states so the archive does not invent missing originals.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="74" fill="#edf0e8" font-size="39" font-family="Georgia,serif">A remembered work is not the same thing as a surviving artifact</text>
<text x="70" y="106" fill="#9da79b" font-size="15" font-family="system-ui,sans-serif">Works becomes stronger when recovery status is visible instead of implied</text>
<g font-family="system-ui,sans-serif">
<g transform="translate(75 180)"><rect width="210" height="220" rx="18" fill="#152018" stroke="#587052"/><text x="105" y="42" text-anchor="middle" fill="#b8dc82" font-size="13" font-weight="700">1 · PRIMARY</text><text x="105" y="82" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Artifact survives</text><text x="105" y="116" text-anchor="middle" fill="#d4dad0" font-size="12">inspectable file / text</text><text x="105" y="137" text-anchor="middle" fill="#d4dad0" font-size="12">or durable published object</text><text x="105" y="180" text-anchor="middle" fill="#9da79b" font-size="11">Example: Great Book</text></g>
<g transform="translate(300 180)"><rect width="210" height="220" rx="18" fill="#131913" stroke="#4d5d49"/><text x="105" y="42" text-anchor="middle" fill="#b8dc82" font-size="13" font-weight="700">2 · CATALOGUED</text><text x="105" y="82" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Owner record survives</text><text x="105" y="116" text-anchor="middle" fill="#d4dad0" font-size="12">titles · dates · provenance</text><text x="105" y="137" text-anchor="middle" fill="#d4dad0" font-size="12">some full objects may remain</text><text x="105" y="180" text-anchor="middle" fill="#9da79b" font-size="11">Example: Suno archive</text></g>
<g transform="translate(525 180)"><rect width="210" height="220" rx="18" fill="#121612" stroke="#444c41"/><text x="105" y="42" text-anchor="middle" fill="#e5c77f" font-size="13" font-weight="700">3 · PARTIAL</text><text x="105" y="82" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Pieces survive</text><text x="105" y="116" text-anchor="middle" fill="#d4dad0" font-size="12">prompt · scene · lineage</text><text x="105" y="137" text-anchor="middle" fill="#d4dad0" font-size="12">original incomplete</text><text x="105" y="180" text-anchor="middle" fill="#9da79b" font-size="11">Example: Mashy Arc</text></g>
<g transform="translate(750 180)"><rect width="210" height="220" rx="18" fill="#111411" stroke="#3c423a"/><text x="105" y="42" text-anchor="middle" fill="#d7c188" font-size="13" font-weight="700">4 · RECONSTRUCTED</text><text x="105" y="82" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Concept is recoverable</text><text x="105" y="116" text-anchor="middle" fill="#d4dad0" font-size="12">later descriptions align</text><text x="105" y="137" text-anchor="middle" fill="#d4dad0" font-size="12">but original object is absent</text><text x="105" y="180" text-anchor="middle" fill="#9da79b" font-size="11">Example: some visual concepts</text></g>
<g transform="translate(975 180)"><rect width="150" height="220" rx="18" fill="#101310" stroke="#343a33"/><text x="75" y="42" text-anchor="middle" fill="#b7bbb3" font-size="13" font-weight="700">5 · MEMORY</text><text x="75" y="82" text-anchor="middle" fill="#e5c77f" font-size="21" font-family="Georgia,serif">Name survives</text><text x="75" y="116" text-anchor="middle" fill="#d4dad0" font-size="12">do not fabricate</text><text x="75" y="137" text-anchor="middle" fill="#d4dad0" font-size="12">a replacement</text><text x="75" y="180" text-anchor="middle" fill="#9da79b" font-size="11">Example: Infinite Potato</text></g>
</g>
<path d="M110 465H1090" stroke="#5a6856" stroke-width="3"/>
<path d="M1075 455l15 10-15 10" fill="none" stroke="#5a6856" stroke-width="3"/>
<text x="600" y="505" text-anchor="middle" fill="#9da79b" font-size="13" font-family="system-ui,sans-serif">less surviving object → more important to label uncertainty</text>
<g font-family="system-ui,sans-serif">
<rect x="180" y="555" width="840" height="95" rx="18" fill="#111511" stroke="#30382f"/>
<text x="215" y="590" fill="#b8dc82" font-size="13" font-weight="700">RECOVERY RULE</text>
<text x="215" y="617" fill="#d7ddd3" font-size="14">Preserve the title, memory, prompt, lineage or reconstruction that really exists—but never upgrade it into an original file that has not been recovered.</text>
</g>
</svg>