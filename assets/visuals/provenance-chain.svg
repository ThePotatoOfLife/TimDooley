<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Archive provenance chain</title>
<desc id="d">A claim moves from original object through locator, date, extraction, classification, reader statement and later correction while preserving links back to the source.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="74" fill="#edf0e8" font-size="39" font-family="Georgia,serif">A trustworthy sentence should be able to walk back to its roots</text>
<text x="70" y="106" fill="#9da79b" font-size="15" font-family="system-ui,sans-serif">provenance is not a badge; it is a reversible path from reader claim to source object</text>
<g font-family="system-ui,sans-serif">
<g transform="translate(60 210)"><rect width="145" height="105" rx="15" fill="#111711" stroke="#465343"/><text x="72" y="38" text-anchor="middle" fill="#e5c77f" font-size="19" font-family="Georgia,serif">Object</text><text x="72" y="66" text-anchor="middle" fill="#aeb7aa" font-size="11">post · file · image</text><text x="72" y="84" text-anchor="middle" fill="#aeb7aa" font-size="11">recording · memory</text></g>
<g transform="translate(220 210)"><rect width="145" height="105" rx="15" fill="#111711" stroke="#465343"/><text x="72" y="38" text-anchor="middle" fill="#e5c77f" font-size="19" font-family="Georgia,serif">Locator</text><text x="72" y="66" text-anchor="middle" fill="#aeb7aa" font-size="11">URL · file path</text><text x="72" y="84" text-anchor="middle" fill="#aeb7aa" font-size="11">message / archive id</text></g>
<g transform="translate(380 210)"><rect width="145" height="105" rx="15" fill="#111711" stroke="#465343"/><text x="72" y="38" text-anchor="middle" fill="#e5c77f" font-size="19" font-family="Georgia,serif">Clock</text><text x="72" y="66" text-anchor="middle" fill="#aeb7aa" font-size="11">event date</text><text x="72" y="84" text-anchor="middle" fill="#aeb7aa" font-size="11">source date · recovery</text></g>
<g transform="translate(540 210)"><rect width="145" height="105" rx="15" fill="#111711" stroke="#465343"/><text x="72" y="38" text-anchor="middle" fill="#e5c77f" font-size="19" font-family="Georgia,serif">Extraction</text><text x="72" y="66" text-anchor="middle" fill="#aeb7aa" font-size="11">exact wording</text><text x="72" y="84" text-anchor="middle" fill="#aeb7aa" font-size="11">measurement · observation</text></g>
<g transform="translate(700 210)"><rect width="145" height="105" rx="15" fill="#111711" stroke="#465343"/><text x="72" y="38" text-anchor="middle" fill="#e5c77f" font-size="19" font-family="Georgia,serif">Class</text><text x="72" y="66" text-anchor="middle" fill="#aeb7aa" font-size="11">primary · report</text><text x="72" y="84" text-anchor="middle" fill="#aeb7aa" font-size="11">interpretation · rumor</text></g>
<g transform="translate(860 210)"><rect width="145" height="105" rx="15" fill="#111711" stroke="#465343"/><text x="72" y="38" text-anchor="middle" fill="#e5c77f" font-size="19" font-family="Georgia,serif">Reader claim</text><text x="72" y="66" text-anchor="middle" fill="#aeb7aa" font-size="11">the sentence shown</text><text x="72" y="84" text-anchor="middle" fill="#aeb7aa" font-size="11">to the public</text></g>
<g transform="translate(1020 210)"><rect width="125" height="105" rx="15" fill="#111711" stroke="#465343"/><text x="62" y="38" text-anchor="middle" fill="#e5c77f" font-size="19" font-family="Georgia,serif">Revision</text><text x="62" y="66" text-anchor="middle" fill="#aeb7aa" font-size="11">narrow · correct</text><text x="62" y="84" text-anchor="middle" fill="#aeb7aa" font-size="11">retain history</text></g>
</g>
<g stroke="#b8dc82" stroke-width="3" fill="none">
<path d="M205 262H220M365 262H380M525 262H540M685 262H700M845 262H860M1005 262H1020"/>
<path d="M1080 335C1080 485 140 485 140 335" stroke="#697866"/>
</g>
<text x="610" y="450" text-anchor="middle" fill="#b8dc82" font-size="15" font-family="system-ui,sans-serif">correction travels forward; provenance remains backward-readable</text>
<g font-family="system-ui,sans-serif">
<rect x="200" y="520" width="800" height="95" rx="18" fill="#101410" stroke="#30382f"/>
<text x="235" y="555" fill="#e5c77f" font-size="14" font-weight="700">SAME SOURCE, DIFFERENT QUESTIONS</text>
<text x="235" y="582" fill="#d7ddd3" font-size="14">A Tim post can be primary for what Tim said, weak for a scientific fact, and strong for how a public identity was expressed.</text>
</g>
<text x="600" y="670" text-anchor="middle" fill="#9da79b" font-size="13" font-family="system-ui,sans-serif">authority is question-relative · closeness to the event does not make every claim in a source true</text>
</svg>