<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
<title id="title">Mirror vector projections and dimensional collapse</title>
<desc id="desc">A typed state vector with multiple paired coordinates projected into physical, symbolic, biological and social views, with a Door interface and a warning that projections are not numerically identical.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.state{fill:#e8edf0;stroke:#7c8b96;stroke-width:2}.view{fill:#e8efe9;stroke:#718978;stroke-width:2}.door{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2;fill:none}.small{font-size:17px}.body{font-size:22px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="820" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Mirror / Vector Overlay · one state, many typed projections</text>
<text x="680" y="94" text-anchor="middle" class="muted small">Inner/outer, macro/micro and Father/Son can be coordinates without being the same measurable quantity.</text>
<rect x="70" y="170" width="390" height="300" rx="14" class="state"/>
<text x="265" y="215" text-anchor="middle" class="blue body">Typed state X</text>
<text x="110" y="260" class="small">x_sp : spiritual ↔ physical</text><text x="110" y="300" class="small">x_scale : micro ↔ macro</text><text x="110" y="340" class="small">x_orientation : vertical ↔ plane</text><text x="110" y="380" class="small">x_role : Father ↔ Son</text><text x="110" y="420" class="small">x_view : observer ↔ house</text>
<rect x="555" y="205" width="250" height="230" rx="14" class="door"/>
<text x="680" y="250" text-anchor="middle" class="accent body">Door / interface</text>
<text x="595" y="300" class="small">couple selected coordinates</text><text x="595" y="340" class="small">reclassify state</text><text x="595" y="380" class="muted small">no automatic numerical identity</text>
<rect x="900" y="130" width="330" height="125" rx="12" class="view"/><text x="1065" y="173" text-anchor="middle" class="green body">Physical view πphys(X)</text><text x="940" y="215" class="small">measured quantities / geometry</text>
<rect x="900" y="285" width="330" height="125" rx="12" class="view"/><text x="1065" y="328" text-anchor="middle" class="green body">Biological view πbio(X)</text><text x="940" y="370" class="small">anatomy / physiology / networks</text>
<rect x="900" y="440" width="330" height="125" rx="12" class="view"/><text x="1065" y="483" text-anchor="middle" class="green body">Symbolic view πsym(X)</text><text x="940" y="525" class="small">roles / myths / project semantics</text>
<path d="M460 320 H543" class="line"/><path d="M805 280 C850 230 860 200 888 195" class="line"/><path d="M805 320 H888" class="line"/><path d="M805 360 C850 410 860 500 888 502" class="line"/>
<rect x="190" y="585" width="980" height="120" rx="12" class="box"/>
<text x="680" y="628" text-anchor="middle" class="accent body">Dimensional collapse as information loss</text>
<text x="680" y="666" text-anchor="middle" class="small">F_d : M_d → M_(d−1) removes relational/contextual degrees of freedom · R_d adds them back only with additional structure</text>
<text x="680" y="748" text-anchor="middle" class="warn small">A useful invariant is something that survives several projections without requiring the projections themselves to be identical.</text>
</svg>