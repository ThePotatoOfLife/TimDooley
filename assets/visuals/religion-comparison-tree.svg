<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Comparative religion tree</title>
<desc id="d">Potatoism sits at the center of a comparison tree connected to Christianity and Bible, Norse traditions, Jewish and esoteric material, Buddhism, Daoism and other traditions through labeled comparison rather than identity.</desc>
<defs><radialGradient id="bg"><stop stop-color="#182019"/><stop offset="1" stop-color="#090b09"/></radialGradient></defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<circle cx="600" cy="355" r="120" fill="#111711" stroke="#d8b56b" stroke-width="2"/>
<text x="600" y="335" text-anchor="middle" fill="#e8eadf" font-size="34" font-family="Georgia,serif">POTATOISM</text>
<text x="600" y="370" text-anchor="middle" fill="#b8dc82" font-size="16" font-family="system-ui,sans-serif">project-native theology & philosophy</text>
<text x="600" y="398" text-anchor="middle" fill="#929d91" font-size="13" font-family="system-ui,sans-serif">source first · comparison second</text>
<g stroke="#65705f" stroke-width="2" fill="none">
  <path d="M505 285L320 160"/><path d="M695 285L880 160"/><path d="M480 375L250 390"/><path d="M720 375L950 390"/><path d="M520 445L340 585"/><path d="M680 445L860 585"/>
</g>
<g font-family="system-ui,sans-serif">
  <g>
    <rect x="165" y="105" width="310" height="105" rx="16" fill="#0f130f" stroke="#30382f"/>
    <text x="320" y="140" text-anchor="middle" fill="#e5c77f" font-size="24" font-family="Georgia,serif">Bible / Christianity</text>
    <text x="320" y="168" text-anchor="middle" fill="#aab2a7" font-size="13">Father · Son · Spirit · Door · Seed · Garden</text>
    <text x="320" y="190" text-anchor="middle" fill="#b8dc82" font-size="11">textual allusion · typology · mismatch</text>
  </g>
  <g>
    <rect x="725" y="105" width="310" height="105" rx="16" fill="#0f130f" stroke="#30382f"/>
    <text x="880" y="140" text-anchor="middle" fill="#e5c77f" font-size="24" font-family="Georgia,serif">Norse / Yggdrasil</text>
    <text x="880" y="168" text-anchor="middle" fill="#aab2a7" font-size="13">Tree · ordeal · knowledge · axis · return</text>
    <text x="880" y="190" text-anchor="middle" fill="#b8dc82" font-size="11">structural analogy · later reception</text>
  </g>
  <g>
    <rect x="85" y="338" width="330" height="105" rx="16" fill="#0f130f" stroke="#30382f"/>
    <text x="250" y="373" text-anchor="middle" fill="#e5c77f" font-size="24" font-family="Georgia,serif">Jewish / esoteric</text>
    <text x="250" y="401" text-anchor="middle" fill="#aab2a7" font-size="13">Tree · pillars · ladder · sacred geometry</text>
    <text x="250" y="423" text-anchor="middle" fill="#b8dc82" font-size="11">historical source before project mapping</text>
  </g>
  <g>
    <rect x="785" y="338" width="330" height="105" rx="16" fill="#0f130f" stroke="#30382f"/>
    <text x="950" y="373" text-anchor="middle" fill="#e5c77f" font-size="24" font-family="Georgia,serif">Buddhism</text>
    <text x="950" y="401" text-anchor="middle" fill="#aab2a7" font-size="13">suffering · attachment · path · recurrence</text>
    <text x="950" y="423" text-anchor="middle" fill="#b8dc82" font-size="11">philosophical comparison, not identity</text>
  </g>
  <g>
    <rect x="185" y="535" width="310" height="105" rx="16" fill="#0f130f" stroke="#30382f"/>
    <text x="340" y="570" text-anchor="middle" fill="#e5c77f" font-size="24" font-family="Georgia,serif">Daoism</text>
    <text x="340" y="598" text-anchor="middle" fill="#aab2a7" font-size="13">flow · useful emptiness · non-forcing · return</text>
    <text x="340" y="620" text-anchor="middle" fill="#b8dc82" font-size="11">conceptual neighbor · practice contrast</text>
  </g>
  <g>
    <rect x="705" y="535" width="310" height="105" rx="16" fill="#0f130f" stroke="#30382f"/>
    <text x="860" y="570" text-anchor="middle" fill="#e5c77f" font-size="24" font-family="Georgia,serif">Other traditions</text>
    <text x="860" y="598" text-anchor="middle" fill="#aab2a7" font-size="13">Shinto · Andean · Egyptian · comparative myth</text>
    <text x="860" y="620" text-anchor="middle" fill="#b8dc82" font-size="11">typed relation · source-specific limits</text>
  </g>
</g>
<text x="600" y="685" text-anchor="middle" fill="#929d91" font-size="14" font-family="system-ui,sans-serif">shared image ≠ shared doctrine · resemblance ≠ transmission · comparison must preserve mismatch</text>
</svg>