<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
<title id="title">Model discrimination ladder</title>
<desc id="desc">A seven-level ladder from clear description through pattern, formal model, calibration, discriminating test, replication and causal support, with uncertainty and baseline checks shown alongside.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.step{fill:#e8edf0;stroke:#7c8b96;stroke-width:2}.test{fill:#e8efe9;stroke:#718978;stroke-width:2}.line{stroke:#716a60;stroke-width:2.5;fill:none}.small{font-size:17px}.body{font-size:22px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="820" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Model discrimination · what would make one explanation better?</text>
<text x="680" y="94" text-anchor="middle" class="muted small">Attaching mathematics is not enough. Each rung adds a stricter obligation.</text>
<g>
<rect x="60" y="180" width="150" height="115" rx="10" class="box"/><text x="135" y="220" text-anchor="middle" class="accent body">C0</text><text x="135" y="258" text-anchor="middle" class="small">Description</text>
<rect x="240" y="180" width="150" height="115" rx="10" class="box"/><text x="315" y="220" text-anchor="middle" class="accent body">C1</text><text x="315" y="258" text-anchor="middle" class="small">Pattern</text>
<rect x="420" y="180" width="150" height="115" rx="10" class="step"/><text x="495" y="220" text-anchor="middle" class="blue body">C2</text><text x="495" y="258" text-anchor="middle" class="small">Model</text>
<rect x="600" y="180" width="150" height="115" rx="10" class="step"/><text x="675" y="220" text-anchor="middle" class="blue body">C3</text><text x="675" y="258" text-anchor="middle" class="small">Calibrated</text>
<rect x="780" y="180" width="150" height="115" rx="10" class="test"/><text x="855" y="220" text-anchor="middle" class="green body">C4</text><text x="855" y="258" text-anchor="middle" class="small">Discriminating</text>
<rect x="960" y="180" width="150" height="115" rx="10" class="test"/><text x="1035" y="220" text-anchor="middle" class="green body">C5</text><text x="1035" y="258" text-anchor="middle" class="small">Replicated</text>
<rect x="1140" y="180" width="150" height="115" rx="10" class="test"/><text x="1215" y="220" text-anchor="middle" class="green body">C6</text><text x="1215" y="258" text-anchor="middle" class="small">Causal support</text>
</g>
<path d="M210 237 H228 M390 237 H408 M570 237 H588 M750 237 H768 M930 237 H948 M1110 237 H1128" class="line"/>
<rect x="120" y="430" width="500" height="220" rx="14" class="box"/>
<text x="370" y="472" text-anchor="middle" class="accent body">Every serious test needs</text>
<text x="165" y="520" class="small">baseline + plausible alternative</text>
<text x="165" y="555" class="small">parameter-estimation rule</text>
<text x="165" y="590" class="small">held-out / out-of-sample check</text>
<text x="165" y="625" class="muted small">and a failure condition that can cost the model territory</text>
<rect x="740" y="430" width="500" height="220" rx="14" class="box"/>
<text x="990" y="472" text-anchor="middle" class="warn body">Uncertainty is plural</text>
<text x="785" y="520" class="small">measurement · sampling · parameter</text>
<text x="785" y="555" class="small">structural · provenance · interpretive</text>
<text x="785" y="590" class="small">residuals tell you where the model fails</text>
<text x="785" y="625" class="muted small">a good fit can still be the wrong explanation</text>
<text x="680" y="748" text-anchor="middle" class="accent small">Promotion belongs to the narrow claim that survived comparison—not to every metaphysical story attached to the same symbol.</text>
</svg>