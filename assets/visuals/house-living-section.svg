<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">The Potato House living section</title>
<desc id="d">A vertical section through Crown, Garden and House, Door and Axis, World, and Below, connected by a return loop from roots through fruit and seed.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#152018"/><stop offset=".55" stop-color="#0c110d"/><stop offset="1" stop-color="#090b09"/></linearGradient>
  <linearGradient id="axis" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5c77f"/><stop offset=".5" stop-color="#b8dc82"/><stop offset="1" stop-color="#7a8b68"/></linearGradient>
  <radialGradient id="door"><stop stop-color="#b8dc82" stop-opacity=".28"/><stop offset="1" stop-color="#b8dc82" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1200" height="720" rx="28" fill="url(#bg)"/>
<g opacity=".18" stroke="#73806f" fill="none">
  <path d="M110 120H1090M110 245H1090M110 370H1090M110 495H1090M110 620H1090"/>
  <circle cx="600" cy="360" r="225"/><circle cx="600" cy="360" r="305"/>
</g>
<path d="M600 70V650" stroke="url(#axis)" stroke-width="4"/>
<path d="M320 370H880" stroke="#536052" stroke-width="2"/>
<circle cx="600" cy="370" r="95" fill="url(#door)" filter="url(#glow)"/>
<circle cx="600" cy="370" r="70" fill="#111712" stroke="#b8dc82" stroke-width="2"/>
<text x="600" y="360" text-anchor="middle" fill="#eef2e7" font-size="30" font-family="Georgia,serif">DOOR</text>
<text x="600" y="388" text-anchor="middle" fill="#9eaa9b" font-size="14" font-family="system-ui,sans-serif">shared threshold · Axis × Plane</text>

<g font-family="system-ui,sans-serif">
  <text x="150" y="106" fill="#b8dc82" font-size="14" font-weight="700" letter-spacing="2">01 · CROWN</text>
  <text x="150" y="139" fill="#e5c77f" font-size="29" font-family="Georgia,serif">Mountain · North of North · Fruit</text>
  <text x="150" y="165" fill="#aeb7aa" font-size="14">integration · perspective · transmission</text>

  <text x="150" y="231" fill="#b8dc82" font-size="14" font-weight="700" letter-spacing="2">02 · HOUSE / GARDEN</text>
  <text x="150" y="264" fill="#e5c77f" font-size="29" font-family="Georgia,serif">Father · Rooms · River · Tree of Life</text>
  <text x="150" y="290" fill="#aeb7aa" font-size="14">belonging · cultivation · nourishment · responsibility</text>

  <text x="755" y="354" fill="#b8dc82" font-size="14" font-weight="700" letter-spacing="2">03 · PASSAGE</text>
  <text x="755" y="387" fill="#e5c77f" font-size="29" font-family="Georgia,serif">Needle · Gate · Ladder · Axis</text>
  <text x="755" y="413" fill="#aeb7aa" font-size="14">state change · continuity · relation</text>

  <text x="150" y="481" fill="#b8dc82" font-size="14" font-weight="700" letter-spacing="2">04 · WORLD</text>
  <text x="150" y="514" fill="#e5c77f" font-size="29" font-family="Georgia,serif">Body · history · culture · institutions</text>
  <text x="150" y="540" fill="#aeb7aa" font-size="14">observable consequence · work · public life</text>

  <text x="150" y="606" fill="#b8dc82" font-size="14" font-weight="700" letter-spacing="2">05 · BELOW</text>
  <text x="150" y="639" fill="#e5c77f" font-size="29" font-family="Georgia,serif">Roots · Memory · Forge · Swamp · Drain</text>
  <text x="150" y="665" fill="#aeb7aa" font-size="14">provenance · residue · testing · repair</text>
</g>

<g fill="none" stroke="#b8dc82" stroke-width="3" stroke-linecap="round">
  <path d="M1045 590C1110 510 1115 205 1015 132"/>
  <path d="M1016 132l4 25m-4-25 24 8"/>
</g>
<text x="1010" y="570" text-anchor="end" fill="#9eaa9b" font-size="13" font-family="system-ui,sans-serif">return is part of the system</text>
<text x="1010" y="592" text-anchor="end" fill="#d9dfd4" font-size="15" font-family="Georgia,serif">Root → Door → Fruit → Seed → World</text>
</svg>