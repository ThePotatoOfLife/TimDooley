<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc">
<title id="title">Axis Eye Door observable and hysteresis dynamics</title>
<desc id="desc">A diagram showing hidden Axis flow, Eye observables, a Door with separate entry and exit thresholds, and measurable event times and dwell intervals.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.flow{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.gate{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1320" height="800" fill="#eee9dc"/>
<text x="660" y="58" text-anchor="middle" class="head">Axis · Eye · Door · measurable transition dynamics</text>
<text x="660" y="94" text-anchor="middle" class="muted small">The Eye sees observables of a hidden flow; the Door can remember direction through hysteresis.</text>

<rect x="80" y="180" width="345" height="220" rx="14" class="flow"/>
<text x="252" y="225" text-anchor="middle" class="blue body">Axis / hidden flow</text>
<text x="120" y="270" class="body">X(s) = Φs(X₀)</text>
<text x="120" y="310" class="small">state evolves along time/scale/order parameter</text>
<text x="120" y="350" class="muted small">the full X need not be directly observed</text>

<rect x="490" y="180" width="345" height="220" rx="14" class="box"/>
<text x="662" y="225" text-anchor="middle" class="green body">Eye / observable</text>
<text x="530" y="270" class="body">y = O(X) + ε</text>
<text x="530" y="310" class="small">Kˢo = o ∘ Φs</text>
<text x="530" y="350" class="muted small">observable evolution can be modeled without omniscience</text>

<rect x="900" y="160" width="345" height="260" rx="14" class="gate"/>
<text x="1072" y="205" text-anchor="middle" class="accent body">Door / hysteresis</text>
<text x="940" y="252" class="body">enter if h(X) ≥ τup</text>
<text x="940" y="292" class="body">exit if h(X) ≤ τdown</text>
<text x="940" y="332" class="small">τdown &lt; τup</text>
<text x="940" y="370" class="muted small">the return path need not reset at the same threshold</text>

<path d="M425 290 H478" class="line"/><path d="M835 290 H888" class="line"/>

<rect x="160" y="535" width="440" height="155" rx="14" class="box"/>
<text x="380" y="578" text-anchor="middle" class="accent body">Event timing</text>
<text x="205" y="622" class="body">τk = first guard-crossing time</text>
<text x="205" y="656" class="muted small">dwell intervals Δτ become measurable data</text>

<rect x="720" y="535" width="440" height="155" rx="14" class="box"/>
<text x="940" y="578" text-anchor="middle" class="accent body">Testable comparison</text>
<text x="765" y="622" class="small">single threshold vs hysteretic threshold</text>
<text x="765" y="656" class="muted small">compare held-out transition likelihood / timing error</text>

<path d="M1072 420 C1072 475 940 485 940 523" class="dash"/>
<text x="660" y="752" text-anchor="middle" class="accent small">Residue, memory and “return-not-reset” become scientific only when repeated trajectories support asymmetric thresholds.</text>
</svg>