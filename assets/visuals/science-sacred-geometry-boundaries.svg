<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" role="img" aria-labelledby="title desc">
<title id="title">Sacred geometry evidence layers</title>
<desc id="desc">A four-column diagram separating exact mathematics, measured biology, historical symbolism and project interpretation for Platonic solids, vesica geometry, golden spirals and phyllotaxis.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.math{fill:#e8edf0;stroke:#7c8b96;stroke-width:2}.bio{fill:#e8efe9;stroke:#718978;stroke-width:2}.symbol{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2}.line{stroke:#716a60;stroke-width:2;fill:none}.small{font-size:18px}.body{font-size:22px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="840" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Sacred Geometry · four evidence layers</text>
<text x="680" y="94" text-anchor="middle" class="muted small">Exact form, biological occurrence, historical meaning and project interpretation answer different questions.</text>
<rect x="60" y="170" width="285" height="440" rx="14" class="math"/>
<text x="202" y="214" text-anchor="middle" class="blue body">Exact mathematics</text>
<text x="95" y="262" class="small">five Platonic solids</text><text x="95" y="302" class="small">Vesica intersection geometry</text><text x="95" y="342" class="small">φ=(1+√5)/2</text><text x="95" y="382" class="small">Fibonacci recurrence</text><text x="95" y="422" class="small">logarithmic spiral</text><text x="95" y="462" class="muted small">proof lives here</text>
<rect x="375" y="170" width="285" height="440" rx="14" class="bio"/>
<text x="517" y="214" text-anchor="middle" class="green body">Measured biology</text>
<text x="410" y="262" class="small">phyllotaxis counts</text><text x="410" y="302" class="small">golden-angle patterns</text><text x="410" y="342" class="small">species / organ variation</text><text x="410" y="382" class="small">non-Fibonacci cases</text><text x="410" y="422" class="muted small">measurement lives here</text>
<rect x="690" y="170" width="285" height="440" rx="14" class="symbol"/>
<text x="832" y="214" text-anchor="middle" class="accent body">Historical symbolism</text>
<text x="725" y="262" class="small">Plato: elements / cosmos</text><text x="725" y="302" class="small">Merkavah / chariot history</text><text x="725" y="342" class="small">later esoteric overlays</text><text x="725" y="382" class="muted small">source dating matters</text>
<rect x="1005" y="170" width="285" height="440" rx="14" class="box"/>
<text x="1147" y="214" text-anchor="middle" class="warn body">Project interpretation</text>
<text x="1040" y="262" class="small">Potato Axis spiral</text><text x="1040" y="302" class="small">cube / Earth comparator</text><text x="1040" y="342" class="small">Door / Vesica role</text><text x="1040" y="382" class="small">counter-rotation symbolism</text><text x="1040" y="422" class="muted small">comparison, not backdated proof</text>
<text x="680" y="690" text-anchor="middle" class="accent body">Reader test</text>
<text x="680" y="730" text-anchor="middle" class="small">Which column is the claim in—and what evidence would be required to move it into another?</text>
<text x="680" y="770" text-anchor="middle" class="muted small">A perfect ratio does not prove a biological law; a biological pattern does not prove a metaphysical meaning.</text>
</svg>