<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc">
<title id="title">Quark polarity type boundary</title>
<desc id="desc">A side-by-side diagram separating real up and down quark electric charge arithmetic from a symbolic project polarity coordinate, with a future physical coupling requiring a gauge-invariant operator.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.physics{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.symbol{fill:#f1e9d9;stroke:#8b6f43;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1320" height="800" fill="#eee9dc"/>
<text x="660" y="58" text-anchor="middle" class="head">Up / Down Quark Polarity · same words, different variable types</text>
<text x="660" y="94" text-anchor="middle" class="muted small">Real particle charge arithmetic and project ascent/grounding symbolism can coexist only if they remain typed apart.</text>

<rect x="80" y="170" width="500" height="360" rx="14" class="physics"/>
<text x="330" y="215" text-anchor="middle" class="blue body">Established particle physics</text>
<text x="125" y="270" class="body">up quark: +⅔e</text>
<text x="125" y="315" class="body">down quark: −⅓e</text>
<text x="125" y="372" class="small">proton uud: ⅔ + ⅔ − ⅓ = +1</text>
<text x="125" y="415" class="small">neutron udd: ⅔ − ⅓ − ⅓ = 0</text>
<text x="125" y="472" class="muted small">charge, flavor, QCD and electroweak quantum numbers</text>

<rect x="740" y="170" width="500" height="360" rx="14" class="symbol"/>
<text x="990" y="215" text-anchor="middle" class="accent body">Project symbolic coordinate</text>
<text x="785" y="270" class="body">p ∈ [−1,+1]</text>
<text x="785" y="315" class="small">+ : ascent / integration</text>
<text x="785" y="355" class="small">− : descent / grounding</text>
<text x="785" y="415" class="small">dp/ds = Fp(p,X)</text>
<text x="785" y="472" class="muted small">mnemonic state variable, not quark flavor evolution</text>

<rect x="355" y="600" width="610" height="105" rx="12" class="box"/>
<text x="660" y="640" text-anchor="middle" class="warn body">Future physical bridge requires an actual operator</text>
<text x="660" y="678" text-anchor="middle" class="small">define P's Lorentz/gauge representation → enumerate invariant quark couplings → derive an observable</text>

<text x="660" y="755" text-anchor="middle" class="accent small">The words “up” and “down” do not transfer electric charge, morality, gravity or consciousness between the two columns.</text>
</svg>