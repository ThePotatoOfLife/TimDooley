<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">Field of Life reaction-diffusion scientific descendant</title>
<desc id="desc">A scientific diagram showing a measurable spatial field phi evolving by diffusion, local reaction and source terms, with comparison against local-only, diffusion-only and graph-spread baselines.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.green{fill:#526d59}.blue{fill:#4d667d}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.domain{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:24px}.head{font-size:38px;font-weight:650}</style>
<rect width="1280" height="800" fill="#eee9dc"/>
<text x="640" y="58" text-anchor="middle" class="head">Field of Life · reaction–diffusion descendant</text>
<text x="640" y="94" text-anchor="middle" class="muted small">A measurable biological or ecological field model—not evidence for a universal life force.</text>

<rect x="90" y="175" width="540" height="400" rx="16" class="domain"/>
<text x="360" y="215" text-anchor="middle" class="green body">Spatial domain Ω</text>
<text x="360" y="252" text-anchor="middle" class="body">φ(x,t) = measured density / concentration / occupancy</text>

<g opacity=".9">
<circle cx="195" cy="365" r="58" fill="#d5e2d7"/><circle cx="295" cy="330" r="88" fill="#c7d9ca"/><circle cx="405" cy="380" r="105" fill="#b7ceb9"/><circle cx="500" cy="335" r="70" fill="#cfdfd1"/>
</g>
<path d="M170 455 C250 420 325 500 410 450 C480 410 545 455 575 430" class="line"/>
<text x="360" y="525" text-anchor="middle" class="accent body">∂t φ = D∇²φ + f(φ;θ) + S(x,t)</text>

<rect x="720" y="165" width="420" height="125" rx="12" class="box"/>
<text x="930" y="205" text-anchor="middle" class="blue body">Diffusion / transport</text>
<text x="760" y="246" class="body">D∇²φ</text><text x="860" y="246" class="muted small">spatial coupling</text>

<rect x="720" y="320" width="420" height="125" rx="12" class="box"/>
<text x="930" y="360" text-anchor="middle" class="green body">Local reaction</text>
<text x="760" y="401" class="body">f(φ;θ)</text><text x="860" y="401" class="muted small">growth · decay · nonlinear response</text>

<rect x="720" y="475" width="420" height="125" rx="12" class="box"/>
<text x="930" y="515" text-anchor="middle" class="warn body">External source / sink</text>
<text x="760" y="556" class="body">S(x,t)</text><text x="860" y="556" class="muted small">forcing that must be declared</text>

<path d="M630 280 H708 M630 385 H708 M630 490 H708" class="dash"/>

<rect x="150" y="635" width="980" height="95" rx="10" class="box"/>
<text x="640" y="672" text-anchor="middle" class="accent body">Model competition</text>
<text x="640" y="707" text-anchor="middle" class="small">local-only · diffusion-only · full reaction–diffusion · graph-spread baseline</text>

<text x="640" y="770" text-anchor="middle" class="muted small">If spatial coupling does not improve prediction, the field representation is unnecessary for that application.</text>
</svg>