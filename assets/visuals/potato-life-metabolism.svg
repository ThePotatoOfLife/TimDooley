<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">Potato biology to project meaning</title>
<desc id="d">A disciplined three-layer diagram connects literal potato biology to project metaphors and practical tests without treating biology as theological proof.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="74" fill="#edf0e8" font-size="39" font-family="Georgia,serif">The potato is useful because the organism already has a life cycle</text>
<text x="70" y="106" fill="#9da79b" font-size="15" font-family="system-ui,sans-serif">biology can discipline the metaphor without proving the theology</text>
<g font-family="system-ui,sans-serif">
<text x="95" y="160" fill="#b8dc82" font-size="13" font-weight="700" letter-spacing="2">LITERAL ORGANISM</text>
<text x="475" y="160" fill="#e5c77f" font-size="13" font-weight="700" letter-spacing="2">PROJECT METAPHOR</text>
<text x="850" y="160" fill="#c9d0c6" font-size="13" font-weight="700" letter-spacing="2">PRACTICAL TEST</text>
</g>
<g stroke="#364034" stroke-width="2" fill="none">
<path d="M350 205H440M730 205H820"/><path d="M350 315H440M730 315H820"/><path d="M350 425H440M730 425H820"/><path d="M350 535H440M730 535H820"/>
</g>
<g font-family="Georgia,serif">
<g><rect x="80" y="180" width="270" height="82" rx="15" fill="#111711" stroke="#455441"/><text x="105" y="215" fill="#e5c77f" font-size="22">Eyes are buds</text><text x="105" y="240" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">latent meristems can sprout</text></g>
<g><rect x="445" y="180" width="285" height="82" rx="15" fill="#111711" stroke="#4f563f"/><text x="470" y="215" fill="#e5c77f" font-size="22">Eye = possible direction</text><text x="470" y="240" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">not literal mystical sight</text></g>
<g><rect x="825" y="180" width="295" height="82" rx="15" fill="#111711" stroke="#424a40"/><text x="850" y="215" fill="#e5c77f" font-size="22">What can still grow?</text><text x="850" y="240" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">look for viable capacity, not prestige</text></g>

<g><rect x="80" y="290" width="270" height="82" rx="15" fill="#111711" stroke="#455441"/><text x="105" y="325" fill="#e5c77f" font-size="22">Dormancy ≠ death</text><text x="105" y="350" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">state and environment constrain growth</text></g>
<g><rect x="445" y="290" width="285" height="82" rx="15" fill="#111711" stroke="#4f563f"/><text x="470" y="325" fill="#e5c77f" font-size="22">Burial can be incubation</text><text x="470" y="350" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">but concealment alone is not salvation</text></g>
<g><rect x="825" y="290" width="295" height="82" rx="15" fill="#111711" stroke="#424a40"/><text x="850" y="325" fill="#e5c77f" font-size="22">Are the conditions viable?</text><text x="850" y="350" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">growth needs more than hidden potential</text></g>

<g><rect x="80" y="400" width="270" height="82" rx="15" fill="#111711" stroke="#455441"/><text x="105" y="435" fill="#e5c77f" font-size="22">Sink becomes source</text><text x="105" y="460" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">storage later feeds a new shoot</text></g>
<g><rect x="445" y="400" width="285" height="82" rx="15" fill="#111711" stroke="#4f563f"/><text x="470" y="435" fill="#e5c77f" font-size="22">Role can reverse over time</text><text x="470" y="460" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">source and receiver need not be fixed identities</text></g>
<g><rect x="825" y="400" width="295" height="82" rx="15" fill="#111711" stroke="#424a40"/><text x="850" y="435" fill="#e5c77f" font-size="22">Does stored value circulate?</text><text x="850" y="460" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">capacity that never returns becomes hoarding</text></g>

<g><rect x="80" y="510" width="270" height="82" rx="15" fill="#111711" stroke="#455441"/><text x="105" y="545" fill="#e5c77f" font-size="22">Tuber can reproduce</text><text x="105" y="570" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">vegetative propagation preserves viable eyes</text></g>
<g><rect x="445" y="510" width="285" height="82" rx="15" fill="#111711" stroke="#4f563f"/><text x="470" y="545" fill="#e5c77f" font-size="22">Seed = future capacity</text><text x="470" y="570" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">not every copy is healthy Fruit</text></g>
<g><rect x="825" y="510" width="295" height="82" rx="15" fill="#111711" stroke="#424a40"/><text x="850" y="545" fill="#e5c77f" font-size="22">What does it reproduce?</text><text x="850" y="570" fill="#aeb7aa" font-size="13" font-family="system-ui,sans-serif">judge the downstream pattern, not the slogan</text></g>
</g>
<path d="M90 640H1110" stroke="#5c6958" stroke-width="2"/>
<text x="600" y="675" text-anchor="middle" fill="#dce1d8" font-size="17" font-family="Georgia,serif">Biology supplies constraints and analogies. Theology, philosophy and ethics remain separate claims.</text>
</svg>