<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
<title id="t">World systems flow</title>
<desc id="d">A world-facing systems diagram connects territory, institutions, law and finance, infrastructure, people and firms, and measurable outcomes with feedback and source refresh dates.</desc>
<rect width="1200" height="720" rx="28" fill="#0b0e0b"/>
<text x="70" y="76" fill="#ecefe7" font-size="39" font-family="Georgia,serif">The World page should follow mechanisms, not just categories</text>
<text x="70" y="108" fill="#9ca69a" font-size="15" font-family="system-ui,sans-serif">place → authority → resources → capability → behavior → consequence → feedback</text>
<g font-family="system-ui,sans-serif">
  <g transform="translate(70 190)"><rect width="180" height="115" rx="18" fill="#111711" stroke="#465343"/><text x="90" y="40" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Territory</text><text x="90" y="68" text-anchor="middle" fill="#aeb7aa" font-size="12">geography · borders</text><text x="90" y="90" text-anchor="middle" fill="#aeb7aa" font-size="12">resources · population</text></g>
  <g transform="translate(290 190)"><rect width="180" height="115" rx="18" fill="#111711" stroke="#465343"/><text x="90" y="40" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Institutions</text><text x="90" y="68" text-anchor="middle" fill="#aeb7aa" font-size="12">mandates · offices</text><text x="90" y="90" text-anchor="middle" fill="#aeb7aa" font-size="12">coordination · authority</text></g>
  <g transform="translate(510 190)"><rect width="180" height="115" rx="18" fill="#111711" stroke="#465343"/><text x="90" y="40" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Law + Money</text><text x="90" y="68" text-anchor="middle" fill="#aeb7aa" font-size="12">rules · budgets · debt</text><text x="90" y="90" text-anchor="middle" fill="#aeb7aa" font-size="12">tax · procurement</text></g>
  <g transform="translate(730 190)"><rect width="180" height="115" rx="18" fill="#111711" stroke="#465343"/><text x="90" y="40" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Capability</text><text x="90" y="68" text-anchor="middle" fill="#aeb7aa" font-size="12">energy · logistics · data</text><text x="90" y="90" text-anchor="middle" fill="#aeb7aa" font-size="12">industry · skills</text></g>
  <g transform="translate(950 190)"><rect width="180" height="115" rx="18" fill="#111711" stroke="#465343"/><text x="90" y="40" text-anchor="middle" fill="#e5c77f" font-size="23" font-family="Georgia,serif">Outcomes</text><text x="90" y="68" text-anchor="middle" fill="#aeb7aa" font-size="12">prices · access · risk</text><text x="90" y="90" text-anchor="middle" fill="#aeb7aa" font-size="12">resilience · welfare</text></g>
</g>
<g stroke="#b8dc82" stroke-width="3" fill="none">
  <path d="M250 247H290"/><path d="M470 247H510"/><path d="M690 247H730"/><path d="M910 247H950"/>
  <path d="M1040 305C1040 520 160 520 160 305" stroke="#6f7f68"/>
</g>
<g fill="#b8dc82"><path d="M281 240l9 7-9 7"/><path d="M501 240l9 7-9 7"/><path d="M721 240l9 7-9 7"/><path d="M941 240l9 7-9 7"/></g>
<g font-family="system-ui,sans-serif">
  <text x="600" y="388" text-anchor="middle" fill="#e7eadf" font-size="28" font-family="Georgia,serif">Cross-border systems cut across every box</text>
  <text x="600" y="422" text-anchor="middle" fill="#aeb7aa" font-size="14">grid interconnectors · shipping lanes · semiconductor supply · fibre routes · financial claims</text>
  <rect x="210" y="470" width="780" height="105" rx="18" fill="#101410" stroke="#30382f"/>
  <text x="245" y="508" fill="#b8dc82" font-size="13" font-weight="700">EVIDENCE STRIP</text>
  <text x="245" y="538" fill="#d7ddd3" font-size="14">source · geography · date / refresh · unit · ownership / mandate · uncertainty · what the data does not show</text>
  <text x="245" y="562" fill="#929c90" font-size="12">A current-world claim should be traceable back to a dated competent source.</text>
</g>
<text x="600" y="650" text-anchor="middle" fill="#e0e4dc" font-size="16" font-family="Georgia,serif">A policy idea becomes real only when authority, law, budget and physical capacity line up.</text>
</svg>