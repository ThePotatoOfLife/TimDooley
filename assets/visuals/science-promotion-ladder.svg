<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" role="img" aria-labelledby="title desc">
<title id="title">Scientific promotion ladder for the Tim Dooley science archive</title>
<desc id="desc">A hierarchy moving from metaphor through defined variables, formal model, observable consequence, model comparison and empirical result, with failure arrows that narrow or reject claims rather than reinterpret every result as confirmation.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.green{fill:#526d59}.blue{fill:#4d667d}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.formal{fill:#e8edf0;stroke:#7c8b96;stroke-width:2}.test{fill:#e8efe9;stroke:#718978;stroke-width:2}.fail{fill:#f2e5e0;stroke:#9a6f64;stroke-width:2}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:9 9;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1320" height="780" fill="#eee9dc"/>
<text x="660" y="58" text-anchor="middle" class="head">How a project idea earns scientific weight</text>
<text x="660" y="94" text-anchor="middle" class="muted small">Mathematical precision can promote an idea from vague to calculable. Evidence is what promotes it from calculable to empirically supported.</text>

<g>
<rect x="45" y="185" width="170" height="120" rx="10" class="box"/><text x="130" y="225" text-anchor="middle" class="accent body">Metaphor</text><text x="130" y="264" text-anchor="middle" class="small">“like a Door”</text>
<rect x="255" y="185" width="170" height="120" rx="10" class="formal"/><text x="340" y="225" text-anchor="middle" class="blue body">Variables</text><text x="340" y="264" text-anchor="middle" class="small">state · units · types</text>
<rect x="465" y="185" width="170" height="120" rx="10" class="formal"/><text x="550" y="225" text-anchor="middle" class="blue body">Model</text><text x="550" y="264" text-anchor="middle" class="small">equation · assumptions</text>
<rect x="675" y="185" width="170" height="120" rx="10" class="test"/><text x="760" y="225" text-anchor="middle" class="green body">Observable</text><text x="760" y="264" text-anchor="middle" class="small">prediction · measurement</text>
<rect x="885" y="185" width="170" height="120" rx="10" class="test"/><text x="970" y="225" text-anchor="middle" class="green body">Competition</text><text x="970" y="264" text-anchor="middle" class="small">simpler / rival baselines</text>
<rect x="1095" y="185" width="170" height="120" rx="10" class="test"/><text x="1180" y="225" text-anchor="middle" class="green body">Result</text><text x="1180" y="264" text-anchor="middle" class="small">support · narrow · reject</text>
</g>
<path d="M215 245 H243 M425 245 H453 M635 245 H663 M845 245 H873 M1055 245 H1083" class="line"/>

<rect x="150" y="420" width="420" height="210" rx="14" class="box"/>
<text x="360" y="463" text-anchor="middle" class="accent body">Equation context contract</text>
<text x="190" y="510" class="small">• define every symbol</text>
<text x="190" y="543" class="small">• units / dimensions / types</text>
<text x="190" y="576" class="small">• role: law, ansatz, estimator, constraint?</text>
<text x="190" y="609" class="small">• limiting case + observable consequence</text>

<rect x="750" y="420" width="420" height="210" rx="14" class="fail"/>
<text x="960" y="463" text-anchor="middle" class="warn body">Failure must cost the model territory</text>
<text x="790" y="510" class="small">wrong scaling → revise</text>
<text x="790" y="543" class="small">non-identifiable parameters → simplify</text>
<text x="790" y="576" class="small">baseline performs as well → special language not needed</text>
<text x="790" y="609" class="small">failed replication → downgrade confidence</text>

<path d="M970 305 C970 360 960 375 960 408" class="dash"/>
<text x="660" y="705" text-anchor="middle" class="accent small">Archive rule: recovered Tim material, later formalization, established external science and speculative interpretation remain visibly different evidence classes.</text>
</svg>