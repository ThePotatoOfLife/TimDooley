<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Time symmetry comparison ladder</title>
<desc id="desc">A layered comparison showing recovered Tim project vocabulary at the left, several published time-symmetric frameworks in the center, and stronger claims that remain unestablished on the right.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.gold{fill:#6b512f}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.warn{fill:#f2e5e0;stroke:#9a6f64;stroke-width:2}.line{stroke:#716a60;stroke-width:2;fill:none}.small{font-size:20px}.body{font-size:25px}.head{font-size:37px;font-weight:650}</style>
<rect width="1200" height="720" fill="#0b0b0b"/>
<text x="600" y="58" text-anchor="middle" class="head">Comparison is not genealogy</text>
<text x="600" y="96" text-anchor="middle" class="muted small">Recovered advanced/retarded vocabulary is older than the later external comparisons; no earlier primary citation has yet been recovered.</text>
<rect x="60" y="175" width="310" height="350" rx="14" class="box"/>
<text x="215" y="218" text-anchor="middle" class="gold body">Recovered project layer</text>
<text x="92" y="270" class="body">• advanced / retarded polarity</text>
<text x="92" y="314" class="body">• Red / Blue relation</text>
<text x="92" y="358" class="body">• Door / present convergence</text>
<text x="92" y="402" class="body">• Crown / lower-field direction</text>
<text x="92" y="460" class="muted small">Exact original formula and polarity</text>
<text x="92" y="490" class="muted small">assignment remain recovery targets.</text>
<rect x="445" y="140" width="310" height="455" rx="14" class="box"/>
<text x="600" y="185" text-anchor="middle" class="gold body">External neighbors</text>
<text x="477" y="238" class="body">Wheeler–Feynman</text><text x="477" y="268" class="muted small">time-symmetric classical electrodynamics</text>
<text x="477" y="326" class="body">ABL / TSVF</text><text x="477" y="356" class="muted small">pre- and post-selected quantum systems</text>
<text x="477" y="414" class="body">Cramer TI</text><text x="477" y="444" class="muted small">offer / confirmation transaction</text>
<text x="477" y="502" class="body">Smoothing / control</text><text x="477" y="532" class="muted small">two-boundary mathematics without retrocausal signals</text>
<rect x="830" y="175" width="310" height="350" rx="14" class="warn"/>
<text x="985" y="218" text-anchor="middle" class="gold body">Not established</text>
<text x="862" y="270" class="body">• personal destiny as a wave</text>
<text x="862" y="314" class="body">• controllable messages to the past</text>
<text x="862" y="358" class="body">• Spudlight as EM advanced wave</text>
<text x="862" y="402" class="body">• future self physically instructing past</text>
<text x="862" y="460" class="muted small">Those require a specified coupling,</text><text x="862" y="490" class="muted small">observable and discriminating test.</text>
<path d="M370 350 H433" class="line"/><path d="M420 340 l16 10 -16 10" fill="none" stroke="#817c73" stroke-width="2"/>
<path d="M755 350 H818" class="line"/><path d="M805 340 l16 10 -16 10" fill="none" stroke="#817c73" stroke-width="2"/>
<text x="600" y="665" text-anchor="middle" class="gold small">Use external neighbors to sharpen the model—not to retroactively author Tim’s earlier thought.</text>
</svg>