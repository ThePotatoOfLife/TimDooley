<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 840" role="img" aria-labelledby="title desc">
<title id="title">Gauge unification and supersymmetry model-building obligations</title>
<desc id="desc">A diagram showing that choosing a unified group requires representations, symmetry-breaking fields and scales, matching to the Standard Model and quantitative observables; group names alone are not a model.</desc>
<style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.blue{fill:#4d667d}.green{fill:#526d59}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.group{fill:#e8edf0;stroke:#7c8b96;stroke-width:2.5}.step{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.small{font-size:18px}.body{font-size:23px}.head{font-size:38px;font-weight:650}</style>
<rect width="1360" height="840" fill="#eee9dc"/>
<text x="680" y="58" text-anchor="middle" class="head">Gauge unification / SUSY · a group name is only the beginning</text>
<text x="680" y="94" text-anchor="middle" class="muted small">Each arrow needs fields, representations, scales and matching conditions before it becomes physics.</text>

<rect x="75" y="185" width="235" height="150" rx="12" class="group"/>
<text x="192" y="230" text-anchor="middle" class="blue body">Choose G</text>
<text x="115" y="275" class="small">SU(5) · Spin(10)</text>
<text x="115" y="307" class="muted small">or another explicit route</text>

<rect x="365" y="185" width="235" height="150" rx="12" class="step"/>
<text x="482" y="230" text-anchor="middle" class="green body">Representations</text>
<text x="405" y="275" class="small">chiral fermion ledger</text>
<text x="405" y="307" class="muted small">charges + anomaly checks</text>

<rect x="655" y="185" width="235" height="150" rx="12" class="step"/>
<text x="772" y="230" text-anchor="middle" class="green body">Breaking</text>
<text x="695" y="275" class="small">G —⟨Φ⟩→ H</text>
<text x="695" y="307" class="muted small">vev · scale · thresholds</text>

<rect x="945" y="185" width="335" height="150" rx="12" class="group"/>
<text x="1112" y="230" text-anchor="middle" class="blue body">Recover low-energy physics</text>
<text x="985" y="275" class="small">SU(3)×SU(2)×U(1)</text>
<text x="985" y="307" class="muted small">spectrum · couplings · symmetry assignments</text>

<path d="M310 260 H353 M600 260 H643 M890 260 H933" class="line"/>

<rect x="150" y="500" width="300" height="170" rx="14" class="box"/>
<text x="300" y="543" text-anchor="middle" class="accent body">Coupling test</text>
<text x="190" y="590" class="small">run couplings + thresholds</text>
<text x="190" y="625" class="muted small">quantify matching residual</text>

<rect x="530" y="500" width="300" height="170" rx="14" class="box"/>
<text x="680" y="543" text-anchor="middle" class="accent body">Particle test</text>
<text x="570" y="590" class="small">proton decay · new vectors</text>
<text x="570" y="625" class="muted small">neutrino / Higgs / SUSY spectra</text>

<rect x="910" y="500" width="300" height="170" rx="14" class="box"/>
<text x="1060" y="543" text-anchor="middle" class="warn body">Failure gate</text>
<text x="950" y="590" class="small">wrong charges / anomalies</text>
<text x="950" y="625" class="muted small">or no quantitative distinction</text>

<text x="680" y="760" text-anchor="middle" class="accent small">Pati–Salam, SU(5), Spin(10), SUSY and 11D geometry should not be stacked into one model until the embeddings and predictions are explicit.</text>
</svg>