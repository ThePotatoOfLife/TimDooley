<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 820" role="img" aria-labelledby="title desc">
<title id="title">Revolving Door of Moral Exclusion conceptual mechanism</title>
<desc id="desc">A social-science mechanism diagram moving from real harm and moral alarm through enemy construction, essentialization, moral exclusion, punitive exception, loyalty tests, semantic expansion and possible target transfer, with a separate child-centered prevention off-ramp.</desc>
<style>
text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d1b18}.muted{fill:#6f685d}.accent{fill:#6b512f}.green{fill:#526d59}.blue{fill:#4d667d}.warn{fill:#8d5e50}.box{fill:#f7f2e8;stroke:#81786a;stroke-width:2}.risk{fill:#f2e5e0;stroke:#9a6f64;stroke-width:2}.safe{fill:#e8efe9;stroke:#718978;stroke-width:2.5}.line{stroke:#716a60;stroke-width:2.5;fill:none}.dash{stroke:#8a8174;stroke-width:2;stroke-dasharray:8 8;fill:none}.small{font-size:17px}.body{font-size:21px}.head{font-size:37px;font-weight:650}</style>
<rect width="1380" height="820" fill="#eee9dc"/>
<text x="690" y="58" text-anchor="middle" class="head">The Revolving Door of Moral Exclusion</text>
<text x="690" y="94" text-anchor="middle" class="muted small">A mechanism/risk model, not a claim that transfer is inevitable.</text>

<g>
<rect x="45" y="190" width="145" height="112" rx="10" class="box"/><text x="117" y="228" text-anchor="middle" class="blue body">Real harm</text><text x="117" y="262" text-anchor="middle" class="small">child abuse</text>
<rect x="215" y="190" width="145" height="112" rx="10" class="box"/><text x="287" y="228" text-anchor="middle" class="accent body">Moral alarm</text><text x="287" y="262" text-anchor="middle" class="small">fear · disgust</text>
<rect x="385" y="190" width="145" height="112" rx="10" class="risk"/><text x="457" y="228" text-anchor="middle" class="warn body">Folk devil</text><text x="457" y="262" text-anchor="middle" class="small">enemy category</text>
<rect x="555" y="190" width="145" height="112" rx="10" class="risk"/><text x="627" y="228" text-anchor="middle" class="warn body">Essentialize</text><text x="627" y="262" text-anchor="middle" class="small">identity = destiny</text>
<rect x="725" y="190" width="145" height="112" rx="10" class="risk"/><text x="797" y="228" text-anchor="middle" class="warn body">Exclude</text><text x="797" y="262" text-anchor="middle" class="small">outside justice</text>
<rect x="895" y="190" width="145" height="112" rx="10" class="risk"/><text x="967" y="228" text-anchor="middle" class="warn body">Exception</text><text x="967" y="262" text-anchor="middle" class="small">extraordinary treatment</text>
<rect x="1065" y="190" width="145" height="112" rx="10" class="risk"/><text x="1137" y="228" text-anchor="middle" class="warn body">Loyalty test</text><text x="1137" y="262" text-anchor="middle" class="small">precision = suspicion</text>
</g>

<path d="M190 246 H203 M360 246 H373 M530 246 H543 M700 246 H713 M870 246 H883 M1040 246 H1053" class="line"/>

<rect x="410" y="405" width="250" height="130" rx="12" class="risk"/>
<text x="535" y="447" text-anchor="middle" class="warn body">Semantic expansion</text>
<text x="535" y="484" text-anchor="middle" class="small">label boundary widens</text>
<text x="535" y="514" text-anchor="middle" class="muted small">S ↑</text>

<rect x="720" y="405" width="250" height="130" rx="12" class="risk"/>
<text x="845" y="447" text-anchor="middle" class="warn body">Possible target transfer</text>
<text x="845" y="484" text-anchor="middle" class="small">exception rule moves domains</text>
<text x="845" y="514" text-anchor="middle" class="muted small">T is empirical, not assumed</text>

<path d="M1137 302 C1137 355 650 352 535 393" class="dash"/>
<path d="M660 470 H708" class="line"/>

<rect x="155" y="620" width="1070" height="125" rx="14" class="safe"/>
<text x="690" y="658" text-anchor="middle" class="green body">Child-centered prevention off-ramp</text>
<text x="690" y="692" text-anchor="middle" class="small">victim support · safeguarding · evidence preservation · lawful investigation · individualized risk management</text>
<text x="690" y="720" text-anchor="middle" class="small">early prevention access · treatment · proportionate incapacitation · measurable victim reduction</text>

<path d="M287 302 C287 500 420 560 520 608" class="line"/><path d="M507 596 l17 14 -22 2" fill="none" stroke="#716a60" stroke-width="2.5"/>
<text x="298" y="465" class="green small">alternative path:</text><text x="298" y="492" class="green small">turn alarm into prevention</text>

<text x="690" y="790" text-anchor="middle" class="accent small">The paper's test is outcome-based: does the rhetoric improve prevention and victim reduction, or mainly intensify enemy production?</text>
</svg>