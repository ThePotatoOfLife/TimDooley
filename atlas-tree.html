<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Potato of Life — Root Directory</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="consistency.css"><link rel="stylesheet" href="atlas-tree.css"></head><body><main class="tree-shell"><header class="tree-head"><div><div class="eyebrow">ATLAS · ROOT DIRECTORY</div><h1>Unfold the archive.</h1><p class="tree-sub">The Atlas is not a list. It is a living directory: roots, branches, records and relationships. Everything begins closed; open only the branch you want to enter.</p></div><div class="view-switch"><a class="active" href="atlas-tree.html">2D ROOT</a><a href="axis.html">3D AXIS</a></div></header><div class="tree-tools"><input id="q" type="search" placeholder="Find a branch or record…"><button id="open">Open all</button><button id="close">Close all</button></div><section id="tree" class="root" aria-label="Atlas root directory"></section></main><script>const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}async function main(){const [n,c,s,r,e,sectors,countries,people,rel,found,adj]=await Promise.all([j('data/nodes.json'),j('data/tree-child-records.json'),j('data/tree-support-records.json'),j('data/research.json'),j('data/events.json'),j('data/european-sector-atlas.json'),j('data/nations.json'),j('data/people-registry.json'),j('data/religious-lexicon.json'),j('data/religious-foundations.json'),j('data/religious-adjacent/records.json')]);const roots=[{id:'core',name:'Core Atlas',meta:'records · concepts · structures',items:[...(n.nodes||[]),...(c.records||[]),...(s.records||[])]},{id:'world',name:'World',meta:'195 nations',items:countries.nations||[]},{id:'people',name:'People',meta:'people registry',items:people.people||people.records||[]},{id:'history',name:'History & Events',meta:'events',items:e.events||[]},{id:'systems',name:'Systems & Economy',meta:'sectors and infrastructure',items:sectors.sector_families||[]},{id:'research',name:'Evidence & Research',meta:'research records',items:r.facts||[]},{id:'belief',name:'Ideas & Religion',meta:'religions and foundations',items:[...(rel.entries||[]).map(x=>({id:x.id||x[0],name:x.name||x[0],description:x.description||x.definition||x[1]})),...(found.records||[])]},{id:'adjacent',name:'Extremism / High-Control',meta:'movement research',items:adj.records||[]}];const norm=x=>({id:x.id||x.slug||x[0],name:x.name||x.tradition_name||x[0]||x.id,description:x.description||x.definition||x.historical_emergence||x.field||x[1]||''});const data=roots.map(x=>({...x,items:x.items.map(norm).filter(x=>x.id)}));const root=$('tree');function render(){const term=$('q').value.trim().toLowerCase();root.innerHTML=data.map(branch=>{const hits=!term||[branch.name,branch.meta,...branch.items.map(i=>i.name+' '+i.description)].join(' ').toLowerCase().includes(term);if(!hits)return '';const items=branch.items.filter(i=>!term||[i.id,i.name,i.description].join(' ').toLowerCase().includes(term));return '<details class="branch"><summary><span class="branch-name">'+esc(branch.name)+'</span><span class="branch-meta">'+esc(term?items.length+' matching':' '+branch.items.length+' records')+'</span></summary><div class="children">'+items.slice(0,500).map(i=>'<a class="leaf" href="node.html?id='+encodeURIComponent(i.id)+'"><strong>'+esc(i.name)+'</strong><small>'+esc(i.description).slice(0,180)+'</small></a>').join('')+'</div></details>'}).join('')||'<div class="empty">No branch matches.</div>'}$('q').addEventListener('input',render);$('open').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=true);$('close').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);render()}main().catch(e=>$('tree').innerHTML='<div class="empty">Atlas load error: '+esc(e.message)+'</div>');</script></body></html>
