<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Potato of Life</title>
<style>
:root{--rail:220px;--gap:20px;--line:#ddd;--ink:#111;--muted:#777;--wash:#f6f6f6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#fff}body{overflow:hidden}button,summary{font:inherit}#app{display:grid;grid-template-columns:var(--rail) 1fr;width:100%;height:100vh;overflow:hidden}#rail{position:relative;min-width:0;height:100%;border-right:1px solid var(--line);background:#fff;z-index:10}.branch{position:absolute;left:0;width:100%;margin:0}.axis{top:0;height:50%}.world{top:50%;height:50%}.branch>summary{position:absolute;left:0;width:100%;padding:14px;background:#fff;cursor:pointer;list-style:none;font-weight:700;letter-spacing:.12em;font-size:16px;z-index:2}.branch>summary::-webkit-details-marker{display:none}.axis>summary{bottom:0}.world>summary{top:0}.branch>summary:hover{background:var(--wash)}.panel{position:absolute;left:0;width:100%;background:#fff;border:1px solid var(--line);box-shadow:4px 0 18px rgba(0,0,0,.06);overflow:auto;padding:6px 0;z-index:20}.axis>.panel{bottom:49px;max-height:calc(50vh - 58px)}.world>.panel{top:49px;max-height:calc(50vh - 58px)}.dir>summary{padding:7px 12px;cursor:pointer;list-style:none;font-size:13px;font-weight:650}.dir>summary::-webkit-details-marker{display:none}.dir>summary:hover,.entry button:hover{background:var(--wash)}.children{padding-left:10px}.entry{padding:1px 5px}.entry button{width:100%;border:0;background:#fff;text-align:left;padding:4px 7px;cursor:pointer;font-size:12px;line-height:1.3}.empty{padding:12px;color:var(--muted);font-size:12px}#reader{min-width:0;min-height:0;height:100%;padding:var(--gap);overflow:hidden}.page{width:100%;height:100%;border:1px solid var(--line);overflow:auto;background:#fff}.content{width:min(900px,calc(100% - 56px));margin:0 auto;padding:58px 0 90px;font-size:16px;line-height:1.72}.content h1{font-size:clamp(25px,3vw,42px);line-height:1.08;letter-spacing:.07em;margin:0 0 28px}.content h2{font-size:24px;margin:2em 0 .6em}.content h3{font-size:18px;margin:1.7em 0 .5em}.content p{max-width:78ch;margin:0 0 1em}.content img,.content video{max-width:100%;height:auto}.content pre{overflow:auto;padding:15px;background:var(--wash);border:1px solid var(--line)}.content table{max-width:100%;border-collapse:collapse}.content th,.content td{padding:6px 9px;border:1px solid var(--line);text-align:left}#hide{position:absolute;right:var(--gap);top:var(--gap);z-index:30;border:1px solid var(--line);background:#fff;padding:7px 10px;cursor:pointer;font-size:12px}.hidden{visibility:hidden!important}@media(max-width:700px){:root{--rail:165px;--gap:14px}.content{width:calc(100% - 28px);font-size:15px;padding-top:48px}}@media(max-width:430px){:root{--rail:135px}.branch>summary{font-size:12px}}
</style></head><body>
<div id="app"><aside id="rail"><details class="branch axis"><summary>↑ AXIS</summary><div class="panel" id="axis-panel"><div class="empty">loading…</div></div></details><details class="branch world"><summary>↓ WORLD</summary><div class="panel" id="world-panel"><div class="empty">loading…</div></div></details></aside><main id="reader"><button id="hide" type="button">hide</button><section class="page"><article id="content" class="content"><h1>THE POTATO OF LIFE</h1><p>Reader loading.</p></article></section></main></div>
<!-- BUILD DATA: scripts/build_site.py embeds data/root-navigation.json and data/root-record-index.json here. -->
<script id="potato-data" type="application/json">null</script>
<script>
(()=>{const C=document.getElementById('content'),A=document.getElementById('axis-panel'),W=document.getElementById('world-panel'),H=document.getElementById('hide');
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const data=(()=>{try{return JSON.parse(document.getElementById('potato-data').textContent||'null')}catch(e){return null}})();
const records=Array.isArray(data?.records)?data.records:Array.isArray(data?.items)?data.items:[];const map=new Map(records.filter(r=>r?.id).map(r=>[r.id,r]));
function show(r){if(!r)return;let body=r.html||r.content_html||r.document_html||r.body_html||r.content;let h='<h1>'+esc(r.title||r.name||r.id||'Untitled')+'</h1>';if(typeof body==='string'&&body.trim())h+=body;else{if(r.description)h+='<p>'+esc(r.description)+'</p>';if(r.summary)h+='<p>'+esc(r.summary)+'</p>'}C.innerHTML=h;document.querySelector('.page').scrollTop=0}
function entry(r){let d=document.createElement('div'),b=document.createElement('button');d.className='entry';b.type='button';b.textContent=r.title||r.name||r.id;b.onclick=()=>{location.hash='node='+encodeURIComponent(r.id);show(r)};d.append(b);return d}
function branch(panel,name){panel.innerHTML='';let m=data?.manifest,c=Array.isArray(m?.[name])?m[name]:Array.isArray(m?.collections)?m.collections.filter(x=>x.branch===name):[];let n=0;for(let x of c){let ids=Array.isArray(x.ids)?x.ids:Array.isArray(x.records)?x.records.map(y=>typeof y==='string'?y:y?.id):[];let rs=ids.map(id=>map.get(id)).filter(Boolean);if(!rs.length&&x.filter&&typeof x.filter==='object')rs=[...map.values()].filter(r=>Object.entries(x.filter).every(([k,v])=>r[k]===v));if(!rs.length)continue;let d=document.createElement('details'),s=document.createElement('summary'),ch=document.createElement('div');d.className='dir';s.textContent=x.title||x.name||x.id||'collection';ch.className='children';rs.forEach(r=>ch.append(entry(r)));d.append(s,ch);panel.append(d);n+=rs.length}if(!n)panel.innerHTML='<div class="empty">No records in this branch.</div>'}
if(!data){C.innerHTML='<h1>THE POTATO OF LIFE</h1><p><strong>Build data missing.</strong></p><p>The published page did not receive the build-time data.</p>';A.innerHTML=W.innerHTML='<div class="empty">No embedded data.</div>'}else{branch(A,'axis');branch(W,'world');let id=decodeURIComponent(location.hash.replace(/^#node=/,''));show(map.get(id)||map.get('tim-dooley')||map.get('potatoism'))}
H.onclick=()=>{let p=document.querySelector('.page');p.classList.toggle('hidden');H.textContent=p.classList.contains('hidden')?'show':'hide'};
window.onhashchange=()=>{let id=decodeURIComponent(location.hash.replace(/^#node=/,''));show(map.get(id))};})();
</script></body></html>
