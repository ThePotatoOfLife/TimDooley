<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="The Potato of Life — one navigable reading surface for the World and Axis corpus.">
<title>The Potato of Life</title>
<style>
:root{--menu-width:238px;--frame-gap:24px;--line:#dedede;--soft:#f5f5f3;--ink:#111;--muted:#777}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}button,summary{font:inherit}
.root,.root-main{width:100%;height:100vh;margin:0;padding:0}.root-main{display:grid;grid-template-columns:var(--menu-width) minmax(0,1fr);position:relative;isolation:isolate;overflow:hidden}
#root-tree{grid-column:1;grid-row:1;position:relative;width:100%;height:100%;z-index:10;border-right:1px solid var(--line);background:#fff;pointer-events:none;overflow:visible}
.tree-branch{position:absolute!important;left:0;width:100%;display:block!important;pointer-events:auto}.branch-axis{top:0;height:50%;padding-bottom:18px;display:flex!important;flex-direction:column;justify-content:flex-end}.branch-world{top:50%;height:50%;padding-top:18px}
.tree-branch>summary{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;background:#fff;color:var(--ink);font-size:17px;line-height:1.2;letter-spacing:.11em;cursor:pointer;list-style:none;user-select:none}.tree-branch>summary::-webkit-details-marker{display:none}.tree-branch>summary .tree-name{font-weight:750}.tree-branch>summary .tree-count{margin-left:auto;color:var(--muted);font-size:10px;letter-spacing:.05em;font-weight:500}.branch-axis>summary::before{content:"↑";font-size:1.05em}.branch-world>summary::before{content:"↓";font-size:1.05em}.tree-branch>summary:hover{background:var(--soft)}
.branch-axis[open]>.branch-children{position:absolute;left:0;bottom:52px;top:auto;width:100%;max-height:calc(50vh - 72px);overflow-y:auto;overflow-x:hidden;background:#fff;border:1px solid var(--line);z-index:50;box-shadow:5px 0 24px rgba(0,0,0,.07);pointer-events:auto}.branch-world[open]>.branch-children{position:absolute;left:0;top:52px;width:100%;max-height:calc(50vh - 72px);overflow-y:auto;overflow-x:hidden;background:#fff;border:1px solid var(--line);z-index:50;box-shadow:5px 0 24px rgba(0,0,0,.07);pointer-events:auto}
.tree-collection>summary,.tree-center>summary{display:flex;align-items:center;gap:7px;width:100%;padding:8px 12px;font-size:12px;line-height:1.25;cursor:pointer;list-style:none}.tree-collection>summary::-webkit-details-marker,.tree-center>summary::-webkit-details-marker{display:none}.tree-collection>summary .tree-name,.tree-center>summary .tree-name{font-weight:650}.tree-count{margin-left:auto;color:#999;font-size:10px}.tree-collection .tree-children,.tree-center .tree-children{padding-left:8px}.tree-subdir>summary{display:flex;padding:6px 8px;font-size:11px;cursor:pointer}.tree-subdir>summary .tree-count{margin-left:auto}.tree-entry{display:flex;align-items:flex-start;padding:4px 8px;font-size:11px;line-height:1.35}.tree-button{width:100%;padding:0;border:0;background:transparent;color:#333;font:inherit;text-align:left;cursor:pointer}.tree-button:hover,.tree-collection>summary:hover,.tree-subdir>summary:hover,.tree-center>summary:hover{color:#000;text-decoration:underline;text-underline-offset:2px}.dataset-entry .tree-button{display:flex;justify-content:space-between;gap:8px}.dataset-entry small{color:#aaa;font-size:9px;letter-spacing:.04em}.tree-empty{padding:10px;font-size:11px;color:var(--muted)}
.center{grid-column:2;grid-row:1;min-width:0;min-height:0;width:100%;height:100%;padding:var(--frame-gap);background:#fff;z-index:1;overflow:hidden}.center-frame{position:relative;width:100%;height:100%;min-width:0;min-height:0;border:1px solid var(--line);background:#fff;overflow:auto;box-shadow:0 1px 4px rgba(0,0,0,.025);transition:opacity .18s ease,visibility .18s ease}.center-frame.is-hidden{opacity:0;visibility:hidden;pointer-events:none}.frame-label{position:absolute;top:13px;left:17px;z-index:2;font-size:9px;line-height:1;letter-spacing:.2em;color:#aaa;pointer-events:none}.frame-content{width:min(920px,calc(100% - 64px));margin:0 auto;padding:62px 0 90px;font-size:16px;line-height:1.72}.frame-content h1{margin:0 0 26px;font-size:clamp(27px,3vw,43px);line-height:1.06;letter-spacing:.075em;font-weight:760}.frame-content h2{margin:2.4em 0 .65em;padding-top:.35em;border-top:1px solid #eee;font-size:22px;line-height:1.2}.frame-content h3{margin:1.7em 0 .5em;font-size:16px}.frame-content p{margin:0 0 1em;max-width:82ch}.frame-content .eyebrow{margin-bottom:12px;color:#999;font-size:10px;font-weight:650;letter-spacing:.18em}.frame-content .lead{font-size:19px;line-height:1.55;color:#333;max-width:70ch}.frame-content .meta{display:flex;flex-wrap:wrap;gap:6px;margin:20px 0 30px}.frame-content .meta span{padding:4px 7px;border:1px solid #e5e5e5;border-radius:3px;color:#777;font-size:10px;letter-spacing:.06em;text-transform:uppercase}.frame-content a{color:inherit}.frame-content img,.frame-content video{max-width:100%;height:auto}.frame-content pre{max-width:100%;overflow:auto;padding:16px;background:var(--soft);border:1px solid var(--line)}.frame-content code{font-size:.88em}.frame-content table{max-width:100%;border-collapse:collapse}.frame-content th,.frame-content td{padding:6px 9px;border:1px solid var(--line);text-align:left}.frame-content blockquote{margin:1.5em 0;padding-left:16px;border-left:2px solid #ddd;color:#555}.source-record>section{margin:0 0 1.6em}.source-record>section>h3{padding-bottom:5px;border-bottom:1px solid #eee;text-transform:capitalize}.loading{color:#888}
.frame-toggle{position:absolute;right:var(--frame-gap);top:var(--frame-gap);z-index:20;padding:7px 10px;border:1px solid var(--line);border-radius:3px;background:#fff;color:#666;font:11px system-ui,sans-serif;cursor:pointer}.frame-toggle:hover{color:#111;border-color:#aaa}
@media(max-width:800px){:root{--menu-width:205px;--frame-gap:14px}.tree-branch>summary{font-size:15px}.frame-content{width:calc(100% - 34px);padding-top:50px}}@media(max-width:500px){:root{--menu-width:168px}.tree-branch>summary{font-size:13px;letter-spacing:.06em}.tree-collection>summary{font-size:11px}.frame-content{font-size:15px;width:calc(100% - 24px)}.frame-content h1{font-size:26px}}
</style>
</head>
<body>
<div class="root"><main class="root-main">
<section class="center" id="root-center" aria-label="Central reading frame"><div class="center-frame" id="center-frame"><div class="frame-label">READING SURFACE</div><article class="frame-content" id="frame-content"><div class="eyebrow">THE POTATO OF LIFE</div><h1>THE WHOLE CORPUS, ONE DOOR</h1><p class="lead">The navigation at left is the carved entrance into the repository. AXIS rises above. WORLD opens below. The material stays in the repository; this surface brings it together.</p></article></div><button class="frame-toggle" id="frame-toggle" type="button" aria-controls="center-frame" aria-expanded="true">hide</button></section>
<section class="tree" id="root-tree" aria-label="World and Axis directory tree"></section><section class="dossier" id="root-dossier" hidden aria-live="polite"></section>
</main></div>
<script src="./root.js?v=20260908-11" defer></script>
</body>
</html>
