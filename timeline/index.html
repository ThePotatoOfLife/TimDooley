<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tim Dooley Timeline 1987–2030 — Potato of Life</title><meta name="description" content="Sortable 1987–2030 Tim Dooley / Potato of Life timeline: biography, public statements, predictions, visions, North, world context, Great Book and future horizons."><style>body{margin:0;background:#0d0f12;color:#e8ecef;font:16px/1.55 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 20px 80px}a{color:#9ed0ff}h1{font-size:clamp(2rem,5vw,4rem);margin:.2em 0}.lead{max-width:850px;color:#b9c2ca}.controls{position:sticky;top:0;background:#0d0f12ee;backdrop-filter:blur(10px);padding:14px 0;border-bottom:1px solid #29313a;display:flex;gap:10px;flex-wrap:wrap;z-index:3}select,input,button{background:#171b20;color:#eef;border:1px solid #39434d;border-radius:8px;padding:9px 11px}button.active{outline:2px solid #8ab4f8}.stats{color:#9ba8b4;margin:18px 0}.year{display:grid;grid-template-columns:110px 1fr;gap:18px;padding:18px 0;border-top:1px solid #252c33}.date{font-weight:800;font-size:1.08rem}.event{background:#13171b;border:1px solid #242b32;border-radius:12px;padding:13px 15px;margin:0 0 10px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tag{font-size:.74rem;padding:2px 7px;border:1px solid #3a4650;border-radius:999px;color:#b9c6d1}.future{border-style:dashed}.open{box-shadow:inset 3px 0 #7b8793}.importance-5{border-left:4px solid #d9e2ea}.nav{display:flex;gap:16px;flex-wrap:wrap}@media(max-width:650px){.year{grid-template-columns:1fr}.date{position:sticky;top:64px;background:#0d0f12;padding:4px 0}}</style></head><body><main><nav class="nav"><a href="../">Home</a><a href="../chronology/">Chronology</a><a href="../faq/">FAQ</a><a href="../index-a-z/">A–Z</a></nav><h1>Timeline · 1987–2030</h1><p class="lead">One chronology with two densities. <b>Main spine</b> shows the major turning points. <b>All events</b> exposes the denser ledger with provenance, category, status and tags. Future years are open horizons—not invented history.</p><div class="controls"><button id="mainBtn" class="active">Main spine</button><button id="allBtn">All events</button><select id="category"><option value="">All categories</option></select><select id="status"><option value="">All states</option></select><select id="importance"><option value="">Any importance</option><option value="5">Importance 5</option><option value="4">4+</option><option value="3">3+</option></select><input id="search" placeholder="Search tags / text…"></div><div class="stats" id="stats">Loading timeline…</div><section id="timeline"></section></main><script>const DATA='../knowledge/chronology/master-timeline-1987-2030.json';let data,mode='main';const $=id=>document.getElementById(id);function y(d){return String(d).match(/^\d{4}/)?.[0]||String(d)}function normMain(e,i){return {id:'main-'+i,date:e.date,summary:e.summary,category:e.category||'milestone',importance:e.importance||5,active_status:(+y(e.date)>2026?'future':'historical'),tags:e.tags||[],epistemic_status:'main-spine'}}function populate(){const ev=data.all_events||[];[...new Set(ev.map(x=>x.category).filter(Boolean))].sort().forEach(v=>$('category').add(new Option(v,v)));[...new Set(ev.map(x=>x.active_status).filter(Boolean))].sort().forEach(v=>$('status').add(new Option(v,v)));render()}function current(){let ev=mode==='main'?(data.main_spine||[]).map(normMain):[...(data.all_events||[])];const q=$('search').value.toLowerCase(),cat=$('category').value,st=$('status').value,min=+$('importance').value||0;return ev.filter(e=>(!cat||e.category===cat)&&(!st||e.active_status===st)&&(!min||(e.importance||0)>=min)&&(!q||JSON.stringify(e).toLowerCase().includes(q))).sort((a,b)=>String(a.date).localeCompare(String(b.date)))}function render(){const ev=current(),groups={};ev.forEach(e=>(groups[y(e.date)]??=[]).push(e));$('stats').textContent=`${ev.length} events · ${Object.keys(groups).length} years/periods · ${mode==='main'?'curated spine':'dense ledger'}`;$('timeline').innerHTML=Object.entries(groups).map(([yr,arr])=>`<div class="year"><div class="date">${yr}</div><div>${arr.map(e=>`<article class="event importance-${e.importance||0} ${e.active_status==='future'?'future':''} ${e.active_status==='open'?'open':''}"><b>${e.date}</b> · ${esc(e.summary||'')}<div class="meta"><span class="tag">${esc(e.category||'event')}</span>${e.epistemic_status?`<span class="tag">${esc(e.epistemic_status)}</span>`:''}${e.source_class?`<span class="tag">${esc(e.source_class)}</span>`:''}<span class="tag">importance ${e.importance||'–'}</span>${(e.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></article>`).join('')}</div></div>`).join('')||'<p>No matching events.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('mainBtn').onclick=()=>{mode='main';$('mainBtn').classList.add('active');$('allBtn').classList.remove('active');render()};$('allBtn').onclick=()=>{mode='all';$('allBtn').classList.add('active');$('mainBtn').classList.remove('active');render()};['category','status','importance','search'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));fetch(DATA).then(r=>r.json()).then(d=>{data=d;populate()}).catch(e=>$('stats').textContent='Timeline data failed to load: '+e);</script></body></html>
