function perfClass(v){return v>=0?'positive':'negative'}
function badge(a){if(a.source==='manual')return '<span class="tag manual">USER-ENTERED</span>';if(a.source==='sim')return '<span class="tag error">LEGACY FICTION</span>';if(a.source==='live'){const age=a.checkedAt&&now()-a.checkedAt;if(!Number.isFinite(age)||age>30*60000)return '<span class="tag stale">DELAYED / STALE</span>';return '<span class="tag live">PROVIDER</span>'}const label=['stale','error','pending'].includes(a.source)?a.source.toUpperCase():'UNVERIFIED';return '<span class="tag stale">'+html(label)+'</span>'}
function assetRow(a){const delta=finite(+a.price)&&a.price!==null&&finite(+a.prevPrice)&&a.prevPrice>0?(a.price/a.prevPrice-1)*100:NaN;const mark=markToBase(a);return `<tr class="${a.id===state.selected?'row-active':''}" data-row="${html(a.id)}"><td><div class="asset-cell"><span class="asset-icon">${ICON[a.type]||'◇'}</span><div><div class="ticker">${html(a.symbol)}</div><div class="asset-name">${html(a.name)}</div>${a.feedError?`<div class="asset-name" style="color:var(--red)" title="${html(a.feedError)}">Feed: ${html(a.feedError).slice(0,100)}</div>`:""}</div></div></td><td>${html(a.type)}</td><td><div>${a.price!==null&&Number.isFinite(+a.price)?money(+a.price,a.currency):'—'}</div><div class="asset-name">${html(a.currency)}${a.checkedAt?' · fetched '+relative(a.checkedAt):''}${a.provider==='coingecko'&&a.updatedAt?' · observation '+relative(a.updatedAt):''}</div></td><td class="${perfClass(delta)}">${pct(delta)}</td><td>${Number.isFinite(mark)?money(mark,state.currency):'—'}</td><td>${badge(a)}</td><td><button class="action-link" data-act="select" data-id="${html(a.id)}">TRADE ↗</button></td></tr>`}
function quoteNote(){return 'Only actual provider data is used. Missing, delayed, or unsupported tickers remain unavailable; prices never drift randomly.'}
function missionsPanel(){const q=netWorth(),known=state.assets.filter(a=>a.source==='live').length,missing=state.assets.filter(a=>!a.updatedAt||a.source!=='live').length;return `<div class="panel panel-pad"><div class="tiny-label">DATA INTEGRITY</div><h2 style="margin-top:6px">No invented prices</h2><p class="tip">Quotes from supported data providers only. A ticker can be tracked without being eligible for paper trading.</p><div class="split"><strong>Last fetched from a provider</strong><span>${known} / ${state.assets.length}</span></div><div class="split" style="margin-top:9px"><strong>Not currently verified</strong><span>${missing}</span></div><p class="tip" style="margin-top:14px">Execution is disabled for unsupported, user-entered and stale quotes. Cash, fees and profit/loss are simulated; market prices are not.</p></div>`}
function dashboard(){const q=netWorth(),change=q.complete?q.value-state.starting:NaN,ret=q.complete&&state.starting>0?change/state.starting*100:NaN;return `<section class="hero"><div class="eyebrow">REAL-MARKET PAPER TRADING</div><h1>Build your own fortune<span class="positive">.</span></h1><p>Trade virtual assets, follow real-world tickers, and see whether your strategy survives. No real money, no brokerage account, no risk to your wallet.</p></section><div class="metrics"><div class="metric"><div class="label">Account equity</div><div class="value">${q.complete?money(q.value,state.currency):'—'}</div><small>${q.complete?'Virtual portfolio value':'Some holdings cannot be valued'}</small></div><div class="metric"><div class="label">Available cash</div><div class="value">${money(state.cash,state.currency)}</div><small>Ready to invest</small></div><div class="metric"><div class="label">Total return</div><div class="value ${perfClass(change)}">${q.complete?money(change,state.currency):'—'}</div><small class="${perfClass(ret)}">${pct(ret)} since start</small></div><div class="metric"><div class="label">Open positions</div><div class="value">${holdingCount()}</div><small>${state.trades.length} total orders filled</small></div></div><div class="layout"><div class="left-stack"><div class="panel"><div class="panel-head"><div><h2>Portfolio performance</h2><p>${'Portfolio values recorded at quote refreshes and paper orders'}</p></div><span class="tag">${state.currency}</span></div><div class="chart-frame">${chart(state.snapshots.map(v=>v.v),780,225,'#a8ef9c','Portfolio equity history')}<div class="chart-labels"><span>${state.snapshots.length?when(state.snapshots[0].t):'Start'}</span><span>${state.snapshots.length?when(state.snapshots.at(-1).t):'Now'}</span></div></div></div><div class="panel"><div class="panel-head"><div><h2>Market watchlist</h2><p>Follow a ticker, then place a virtual order.</p></div><button class="btn small" data-act="add">+ Add asset</button></div>${marketTable(true)}</div></div><div class="right-stack">${tradePanel()}<div class="panel panel-pad"><div class="split"><div><div class="tiny-label">A SAVABLE LITTLE UNIVERSE</div><h2 style="margin-top:6px">Your game, your rules.</h2></div><span style="font-size:25px">🥔</span></div><p class="tip">The portfolio automatically saves in this browser. Export a <strong>.json</strong> save file to move it to another computer or preserve it before clearing browser data.</p><div class="quick-help"><button class="btn small" data-act="export">↓ Save file</button><button class="btn small" data-act="import">↑ Load file</button></div></div>${missionsPanel()}</div></div>`}
function marketTable(short=false){return `<div class="table-wrap"><table class="data-table"><thead><tr><th>Instrument</th><th>Class</th><th>Last quote</th><th>Move</th><th>In ${html(state.currency)}</th><th>Source</th><th></th></tr></thead><tbody id="asset-table-body">${state.assets.map(assetRow).join('')}</tbody></table></div>${state.assets.length===0?'<div class="empty">No assets yet. Add a ticker to get started.</div>':''}`}
function markets(){return `<section class="hero"><div class="eyebrow">DISCOVER & FOLLOW</div><h1>Market terminal<span class="positive">.</span></h1><p>Add Danish shares, US shares, gold, oil, Bitcoin, ETFs, and custom symbols. The watchlist can grow as large as your strategy.</p></section><div class="layout"><div class="left-stack"><div class="panel"><div class="panel-head"><div><h2>All tracked instruments</h2><p>${state.assets.length} symbols · ${quoteNote()}</p></div><div class="inline-field"><input aria-label="Filter tracked symbols" id="market-search" class="search" placeholder="Search watchlist" value="${html(search)}"><button class="btn small primary" data-act="add">+ Ticker</button></div></div>${marketTable()}</div><div class="notebox">Danish example: <b>NOVO-B</b>, exchange <b>Copenhagen</b>, currency <b>DKK</b>. A Twelve Data subscription may be needed for international exchange coverage.</div></div><div class="right-stack">${tradePanel()}${selectedChartPanel()}</div></div>`}
function selectedChartPanel(){const a=assetById(state.selected);if(!a)return '';return `<div class="panel"><div class="panel-head"><div><h2>${html(a.symbol)} · Price path</h2><p>Recorded quotes${state.mode==='real'?' / fetched history':''}</p></div><button class="btn small" data-act="history-load">Load history</button></div><div class="chart-frame">${chart(a.history.map(x=>x.p),480,150,'#98b8ff',a.symbol+' price history')}<div class="chart-labels"><span>${a.history.length?when(a.history[0].t):'—'}</span><span>${a.history.length?when(a.history.at(-1).t):'—'}</span></div></div><div class="panel-pad" style="padding-top:0"><p class="tip">Historical coverage depends on the provider. If a feed is unavailable, you can still enter a manual quote and play.</p><button class="btn small" data-act="manual" data-id="${html(a.id)}">✎ Set quote</button> <button class="btn small danger" data-act="remove" data-id="${html(a.id)}">Remove ticker</button></div></div>`}
function tradePanel(){const a=assetById(state.selected)||state.assets[0];if(!a)return '<div class="panel panel-pad"><h2>Trade terminal</h2><p>Add an asset first.</p></div>';const p=position(a.id),v=markToBase(a),blocked=tradeBlocked(a),q=finite(+a.price)&&a.price!==null?a.price:null;return `<div class="panel"><div class="panel-head"><div><h2>Order ticket</h2><p>Buy and sell with virtual cash</p></div><span class="tag">PAPER</span></div><div class="trade-content"><div class="selected-asset"><span class="asset-icon">${ICON[a.type]||'◇'}</span><div><strong>${html(a.symbol)}</strong><small>${html(a.name)}</small></div></div><div class="quote">${q!==null?number(q,q<1?8:2):'—'} <small>${html(a.currency)} ${badge(a)}</small></div><div class="tip">${q!==null&&Number.isFinite(v)?'≈ '+money(v,state.currency)+' per unit':'Quote unavailable · refresh the provider feed'}</div><div class="order-tabs"><button data-act="side" data-side="buy" class="${state.side==='buy'?'active buy':''}">BUY / LONG</button><button data-act="side" data-side="sell" class="${state.side==='sell'?'active sell':''}">SELL</button></div><div class="field"><label for="order-qty">Quantity · units or shares</label><input id="order-qty" type="number" min="0.00000001" step="any" placeholder="0.00" autocomplete="off"></div><div class="quick"><button data-act="fraction" data-fr=".25">25%</button><button data-act="fraction" data-fr=".5">50%</button><button data-act="fraction" data-fr="1">MAX</button></div><div class="order-details"><div class="detail-line"><span>Available cash</span><strong>${money(state.cash,state.currency)}</strong></div><div class="detail-line"><span>Units owned</span><strong>${number(p.qty,8)}</strong></div><div class="detail-line"><span>Order value</span><strong id="order-value">—</strong></div><div class="detail-line"><span>Game fee (${number(state.config.fee,2)}%)</span><strong id="order-fee">—</strong></div><div class="detail-line total"><span>${state.side==='buy'?'Total payable':'Total proceeds'}</span><strong id="order-total">—</strong></div></div><button class="btn full ${state.side==='buy'?'primary':'danger'}" id="trade-submit" data-act="trade" ${blocked||!Number.isFinite(v)?'disabled':''}>${state.side==='buy'?'Buy':'Sell'} ${html(a.symbol)} ↗</button><p class="tip" style="margin:13px 0 0">${blocked?html(blocked):'Indicative paper fill using provider data and modeled slippage; provider quotes may be delayed.'} Fee: ${number(state.config.fee,2)}%.</p><div class="quick-help" style="margin-top:10px"><button class="linklike" data-act="manual" data-id="${html(a.id)}">Record reference price</button></div></div></div>`}
function riskPanel(){const q=netWorth();if(!q.complete||!Number.isFinite(q.value)||q.value<=0)return '<p class="tip">Exposure requires valid prices and exchange rates for every holding.</p>';const rows=Object.entries(state.positions).filter(([,p])=>p.qty>1e-8).map(([key,p])=>{const a=assetById(key);return {name:a?.symbol||'Unknown',v:a?markToBase(a)*p.qty:0}}).sort((a,b)=>b.v-a.v);rows.unshift({name:'Cash reserve',v:state.cash});return rows.map(r=>{const share=Math.max(0,Math.min(100,r.v/q.value*100));return `<div class="exposure-item"><strong>${html(r.name)}</strong><span>${money(r.v,state.currency)} · ${share.toFixed(1)}%</span></div><div class="exposure-track"><div class="exposure-fill" style="width:${share.toFixed(2)}%"></div></div>`}).join('')+(rows.slice(1).some(r=>r.v/q.value>.5)?'<p class="tip">⚠ One holding exceeds half your portfolio value. That is concentrated exposure, not a predicted loss.</p>':'')}
function portfolio(){const q=netWorth(),keys=Object.keys(state.positions).filter(k=>state.positions[k].qty>1e-8);return `<section class="hero"><div class="eyebrow">YOUR POSITIONS</div><h1>Portfolio holdings<span class="positive">.</span></h1><p>Your current exposure, average acquisition cost, and unrealized profit or loss. All figures are virtual.</p></section><div class="metrics"><div class="metric"><div class="label">Invested assets</div><div class="value">${q.complete?money(holdingsValue(),state.currency):'—'}</div><small>Market value</small></div><div class="metric"><div class="label">Realized P/L</div><div class="value ${perfClass(state.realized)}">${money(state.realized,state.currency)}</div><small>After game fees</small></div><div class="metric"><div class="label">Trading fees</div><div class="value">${money(state.fees,state.currency)}</div><small>Paid in the simulation</small></div><div class="metric"><div class="label">Positions</div><div class="value">${keys.length}</div><small>Open investments</small></div></div><div class="panel"><div class="panel-head"><div><h2>Owned assets</h2><p>Average cost includes virtual entry fees.</p></div><button class="btn small" data-act="tab" data-tab="markets">Explore markets</button></div>${keys.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Asset</th><th>Quantity</th><th>Average entry</th><th>Last value</th><th>Unrealized P/L</th><th>Action</th></tr></thead><tbody>${keys.map(key=>{let a=assetById(key),p=position(key),mark=a?markToBase(a):NaN,mv=mark*p.qty,pnl=Number.isFinite(mv)?mv-p.cost:NaN;return `<tr><td><div class="ticker">${html(a?a.symbol:'Missing ticker')}</div><div class="asset-name">${html(a?a.name:'Unpriced')}</div></td><td>${number(p.qty,8)}</td><td>${money(p.cost/p.qty,state.currency)}</td><td>${money(mv,state.currency)}</td><td class="${perfClass(pnl)}">${money(pnl,state.currency)}</td><td><button class="action-link" data-act="select" data-id="${html(key)}">TRADE ↗</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><strong>No open positions yet.</strong>Choose a ticker and buy your first shares.</div>'}</div><div class="panel panel-pad section-gap"><h2>Portfolio exposure</h2><p class="tip">A snapshot of your largest position and cash reserve, based on available marks.</p>${riskPanel()}</div><div class="section-gap notebox">Prices and FX rates can be delayed or missing. A portfolio with missing marks has no trustworthy total value; the game displays a dash rather than an invented valuation.</div>`}
function historyView(){return `<section class="hero"><div class="eyebrow">THE TAPE NEVER FORGETS</div><h1>Trade history<span class="positive">.</span></h1><p>Every virtual order is recorded with its execution price, fee, converted cost, and timestamp.</p></section><div class="panel"><div class="panel-head"><div><h2>Order ledger</h2><p>${state.trades.length} completed virtual orders · newest first</p></div><div class="quick-help"><button class="btn small" data-act="csv">↓ CSV ledger</button><button class="btn small" data-act="export">↓ Save JSON</button></div></div>${state.trades.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>Instrument</th><th>Side</th><th>Quantity</th><th>Price (native)</th><th>Net total</th><th>Fee</th><th>Time</th></tr></thead><tbody>${[...state.trades].reverse().slice(0,250).map(t=>`<tr><td><span class="ticker">${html(t.symbol)}</span></td><td class="${t.side==='buy'?'positive':'negative'}">${t.side.toUpperCase()}</td><td>${number(t.qty,8)}</td><td>${money(t.price,t.currency)}</td><td>${money(t.total,state.currency)}</td><td>${money(t.fee,state.currency)}</td><td>${when(t.time)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>Nothing in the ledger.</strong>Your first order will appear here.</div>'}</div>`}
function settings(){return `<section class="hero"><div class="eyebrow">CONTROL ROOM</div><h1>Market data & portfolio<span class="positive">.</span></h1><p>Configure your market feed, choose how to play, and protect your saved progress.</p></section><div class="settings-grid"><div class="panel panel-pad"><div class="tiny-label">MARKET FEEDS</div><h2 style="margin:7px 0">Choose the price source</h2><p class="setting-help">Real-market feeds only. No artificial prices or time acceleration.</p><div class="field"><label for="api-key">Twelve Data API key (optional)</label><input id="api-key" type="password" autocomplete="off" placeholder="Paste your own Twelve Data API key" value="${html(apiKey)}"></div><div class="quick-help" style="margin-top:10px"><button class="btn small" data-act="save-key">Save key locally</button><button class="btn small" data-act="clear-key">Forget key</button><a href="https://twelvedata.com/" target="_blank" rel="noopener noreferrer" class="tip">Get a key ↗</a></div><p class="setting-help">Used for ticker-based stock, ETF, energy and other supported instruments. Exchange and instrument access depend on your API plan. Keys in a browser-only app are not secret from the browser or its extensions; for a public deployment, use a backend proxy.</p><div class="field"><label><input type="checkbox" id="auto-check" ${state.config.auto?'checked':''} style="width:auto;vertical-align:middle;margin-right:7px"> Auto-refresh real quotes every 90 seconds</label></div><p class="setting-help">Refresh is rate-limited in the app; free API quotas are more restrictive than paid plans.</p><div class="field"><button class="btn" data-act="refresh">↻ Refresh all quotes</button></div></div><div class="panel panel-pad"><div class="tiny-label">YOUR PROGRESS</div><h2 style="margin:7px 0">Save / Load</h2><p class="setting-help">Game progress is saved automatically in localStorage. Clearing site data, private browsing, or changing browsers may delete it. Export a file as a backup.</p><div class="quick-help section-gap"><button class="btn primary" data-act="export">↓ Export .json</button><button class="btn" data-act="import">↑ Import .json</button></div><div style="height:1px;background:var(--line);margin:25px 0"></div><div class="tiny-label">PAPER EXECUTION COSTS</div><div class="field"><label for="fee-input">Trading fee (%)</label><input id="fee-input" type="number" min="0" max="10" step=".05" value="${html(state.config.fee)}"></div><div class="field"><label for="slippage-input">Modeled slippage (%)</label><input id="slippage-input" type="number" min="0" max="2" step=".01" value="${html(state.config.slippage||0)}"></div><div class="quick-help" style="margin-top:10px"><button class="btn small" data-act="save-fee">Apply trading costs</button></div><p class="setting-help">Changing fees affects future orders only, not past trades.</p><div style="height:1px;background:var(--line);margin:25px 0"></div><h2>Start a new portfolio</h2><p class="setting-help">Choose virtual starting cash and a ledger currency. This resets all trades and positions, so export your current save first.</p><button class="btn danger section-gap" data-act="reset">↺ New game / reset</button></div><div class="panel panel-pad"><div class="tiny-label">FX CONVERSION</div><h2 style="margin:7px 0">Trading across currencies</h2><div class="big-number">${html(state.currency)} base</div><p class="setting-help">USD, EUR, Danish kroner and other fiat-denominated prices are converted into the account currency. ${state.mode==='demo'?'Demo mode uses illustrative FX rates.':'Real mode uses the latest reference rates from Frankfurter, updated on banking days.'}</p><p class="statusline">${state.mode==='demo'?'Illustrative FX · not market data':`Last FX sync: ${when(state.fx.updatedAt)} ${state.fx.date?'· rate date '+html(state.fx.date):''}`}</p><div class="quick-help" style="margin-top:14px"><button class="btn small" data-act="fx-refresh">↻ Update FX</button></div></div><div class="panel panel-pad"><div class="tiny-label">LIMITATIONS</div><h2 style="margin:7px 0">Paper trading, not a broker</h2><p class="setting-help">No real purchases or money transfers, margin, short selling, dividends, taxes, stock splits, corporate actions or order-book execution. Orders fill instantly at the last obtained price. Real market prices might be delayed, markets can close, and quote providers can restrict symbols and calls.</p><p class="setting-help">Uses CoinGecko (crypto), Gold API (metals), Twelve Data (other tickers) and Frankfurter (fiat FX). API availability and terms may change.</p></div></div>`}
function render(){const q=netWorth();const nav=[['dashboard','▦','Overview'],['markets','◈','Markets'],['portfolio','▤','Portfolio'],['history','◷','Trade history'],['settings','⚙','Settings']];$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-coin">🥔</span><div><strong>Potato Exchange</strong><small>Market simulator</small></div></div><nav class="nav" aria-label="Main navigation">${nav.map(([key,ico,name])=>`<button data-act="tab" data-tab="${key}" class="${state.tab===key?'active':''}" title="${name}"><span class="i">${ico}</span><span class="label">${name}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div class="tiny-label">YOUR TREASURY</div><strong>${money(state.cash,state.currency)}</strong><div class="signal ${state.mode==='real'?'real':''}"><span class="dot"></span>${'Market data mode'}</div><p style="margin-top:12px">Built for play. Your cash is entirely virtual.</p></div></aside><main class="main"><div class="topbar"><div><div class="crumb">TRADING / ${html(state.tab)}</div><div class="header-note">${'Provider-sourced quotes; check timestamp'}</div></div><div class="top-actions"><a class="btn small site-return" href="https://thepotatooflife.github.io/TimDooley/rooms/inside/games-simulations/">← Games room</a><span class="pill ${state.mode==='demo'?'sim':'live'}">● ${'REAL MARKET DATA'}</span><button class="btn" data-act="refresh" ${busy?'disabled':''}>↻ ${busy?'Syncing':'Refresh'}</button><button class="btn soft" data-act="export">↓ Save</button></div></div>${state.tab==='dashboard'?dashboard():state.tab==='markets'?markets():state.tab==='portfolio'?portfolio():state.tab==='history'?historyView():settings()}<footer class="footer"><span>POTATO EXCHANGE v2.2 · Local-first paper trading · ${q.complete?'Portfolio valued':'Some marks missing'}</span><span>${'NO REAL EXECUTIONS'} · No financial advice</span></footer></main></div>`;updateOrder();if(search)filterMarkets();}
function updateOrder(){const input=$('#order-qty'),a=assetById(state.selected);if(!input||!a)return;const qty=n(input.value),val=markToBase(a),slip=(Number(state.config.slippage)||0)/100,base=qty*val*(state.side==='buy'?1+slip:1-slip),fee=base*state.config.fee/100;$('#order-value').textContent=qty>0&&Number.isFinite(base)?money(base,state.currency):'—';$('#order-fee').textContent=qty>0&&Number.isFinite(fee)?money(fee,state.currency):'—';$('#order-total').textContent=qty>0&&Number.isFinite(base)?money(state.side==='buy'?base+fee:base-fee,state.currency):'—'}
function filterMarkets(){const tbody=$('#asset-table-body');if(!tbody)return;$$('tr[data-row]',tbody).forEach(r=>{const a=assetById(r.dataset.row);r.hidden=!!search&&!(a.symbol+' '+a.name+' '+a.type).toLowerCase().includes(search.toLowerCase())})}
function tradeBlocked(a){return window.PotatoEngine?window.PotatoEngine.blockQuote(a,now()):'Trading engine unavailable. Reload the page.'}
function trade(){const a=assetById(state.selected),input=$('#order-qty'),raw=input?.value,qty=Number(raw);if(!raw||!Number.isFinite(qty)||qty<=0){toast('Enter a positive quantity.',true);return}const blocked=tradeBlocked(a);if(blocked){toast('Order blocked: '+blocked,true);return}const rate=rateToBase(a.currency),positionBefore=position(a.id);let order;try{order=window.PotatoEngine.preview({side:state.side,qty,price:a.price,rate,feePct:state.config.fee,slippagePct:state.config.slippage,cash:state.cash,position:positionBefore})}catch(e){toast('Order rejected: '+e.message,true);return}const action=state.side==='buy'?'Buy':'Sell';if(!confirm('Paper '+action.toLowerCase()+' '+number(qty,8)+' '+a.symbol+' at modeled fill '+money(order.fill,a.currency)+'? Total '+money(order.total,state.currency)+' includes '+money(order.fee,state.currency)+' fees and '+number(state.config.slippage,2)+'% assumed slippage. No real order will be sent.'))return;let next;try{next=window.PotatoEngine.settle({cash:state.cash,position:positionBefore,realized:state.realized,fees:state.fees},order)}catch(e){toast('Settlement failed: '+e.message,true);return}state.cash=next.cash;state.positions[a.id]=next.position;state.realized=next.realized;state.fees=next.fees;state.trades.push({id:id(),time:now(),assetId:a.id,symbol:a.symbol,side:order.side,qty:order.qty,price:order.fill,currency:a.currency,quoteTime:a.updatedAt,quoteProvider:a.quoteProvider||a.provider,slippage:state.config.slippage,rate,fee:order.fee,total:order.total});snapshot();save();render();toast(action+' paper order recorded: '+number(qty,8)+' '+a.symbol+' · '+money(order.total,state.currency)+'.')}
function switchMode(){toast('Potato Exchange uses real-market data only. No fictional market mode is available.',true)}
function manualModal(a){if(!a)return;openModal(`<h2>Record a reference price</h2><p>Manual entries are marked USER-ENTERED and cannot be used to execute paper orders. For tradable prices, connect a supported quote provider.</p><form id="manual-form"><div class="field"><label>Asset</label><input value="${html(a.symbol)} (${html(a.currency)})" disabled></div><div class="field"><label for="manual-price">Reference price in ${html(a.currency)}</label><input id="manual-price" type="number" min=".00000001" step="any" required></div><div class="modal-actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Record unverified price</button></div></form>`,()=>{const v=Number($('#manual-price').value);if(!Number.isFinite(v)||v<=0)return toast('Enter a positive reference price.',true);recordPrice(a,v,'manual');snapshot();save();closeModal();render();toast('Reference recorded; paper trading remains blocked until a real quote is retrieved.')})}
function openModal(body,onSubmit){activeModal=onSubmit;$('#modal-root').innerHTML=`<div class="modal-layer" id="modal-layer"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`;$('#modal-root form')?.addEventListener('submit',e=>{e.preventDefault();activeModal?.(e)});$('#modal-root input:not([disabled])')?.focus()}
function closeModal(){activeModal=null;$('#modal-root').innerHTML=''}
function addModal(){openModal(`<h2>Track a new ticker</h2><p>Any symbol can be added. Choose a market-data source or use manual quotes. Enter the exchange for ambiguous or Danish securities.</p><form id="add-form"><div class="modal-grid"><div class="field"><label for="new-symbol">Ticker / Symbol</label><input id="new-symbol" maxlength="40" placeholder="e.g. NOVO-B" required></div><div class="field"><label for="new-name">Display name</label><input id="new-name" maxlength="70" placeholder="e.g. Novo Nordisk B"></div><div class="field"><label for="new-type">Asset type</label><select id="new-type"><option value="stock">Stock</option><option value="etf">ETF / fund</option><option value="crypto">Cryptocurrency</option><option value="metal">Precious metal</option><option value="energy">Oil / energy</option><option value="forex">Foreign exchange</option><option value="custom">Other / custom</option></select></div><div class="field"><label for="new-currency">Quote currency</label><select id="new-currency">${Object.keys(DKK).map(c=>`<option value="${c}" ${c==='USD'?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label for="new-provider">Price provider</label><select id="new-provider"><option value="twelve">Twelve Data (key)</option><option value="coingecko">CoinGecko (crypto)</option><option value="gold">Gold API (metals)</option><option value="manual">Manual quote</option></select></div><div class="field"><label for="new-exchange">Exchange (optional)</label><input id="new-exchange" maxlength="70" placeholder="e.g. Copenhagen"></div><div class="field"><label for="new-coin">CoinGecko coin ID</label><input id="new-coin" maxlength="80" placeholder="e.g. bitcoin"></div><div class="field"><label for="new-price">Optional user reference price</label><input id="new-price" min="0.00000001" type="number" step="any" placeholder="e.g. 125.00"></div></div><p class="tip">For Gold API use XAU, XAG, XPT or XPD. For crypto specify a CoinGecko ID (e.g. bitcoin, not BTC). Manual reference prices cannot be traded.</p><div class="modal-actions"><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Add ticker</button></div></form>`,()=>{const symbol=$('#new-symbol').value.trim().toUpperCase(),name=$('#new-name').value.trim()||symbol,provider=$('#new-provider').value,type=$('#new-type').value,currency=$('#new-currency').value,exchange=$('#new-exchange').value.trim(),coinId=$('#new-coin').value.trim().toLowerCase(),raw=$('#new-price').value,initial=raw===''?null:Number(raw);if(!/^[A-Z0-9.\-\/\^:_]{1,40}$/.test(symbol))return toast('Ticker can contain letters, numbers, dot, dash, colon, slash, caret and underscore.',true);if(state.assets.some(a=>a.symbol===symbol&&a.exchange.toLowerCase()===exchange.toLowerCase()))return toast('This ticker and exchange are already tracked.',true);if(raw!==''&&(!Number.isFinite(initial)||initial<=0))return toast('Initial price must be positive.',true);if(provider==='coingecko'&&!coinId)return toast('A CoinGecko coin ID is required.',true);const a={id:id(),symbol,name,type,currency,provider,exchange,coinId,seedPrice:initial,price:null,prevPrice:null,history:[],source:'pending',updatedAt:0};state.assets.push(a);state.selected=a.id;save();closeModal();render();toast(`${symbol} added to your watchlist.`);if(state.mode==='real')refreshAll()})}
function resetModal(){openModal(`<h2>New paper-trading portfolio</h2><p>Reset your virtual holdings and transaction ledger. Export a backup first.</p><form id="reset-form"><div class="field"><label>Portfolio currency</label><select id="reset-currency"><option value="DKK">DKK · Danish kroner</option><option value="USD">USD · US dollars</option><option value="EUR">EUR · euros</option></select></div><div class="field"><label>Starting virtual cash</label><input id="reset-cash" type="number" min="100" max="1000000000000" value="100000" required></div><div class="modal-actions"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn danger">Create new portfolio</button></div></form>`,()=>{const c=$('#reset-currency').value,cash=Number($('#reset-cash').value);if(!finite(cash)||cash<100||cash>1e12)return toast('Choose between 100 and 1 trillion.',true);if(!confirm('Replace the current portfolio? Export it first if needed.'))return;state=freshState(c,cash);closeModal();save();render();refreshAll()})}
function exportCsv(){if(!state.trades.length)return toast('There are no trades to export.',true);const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const rows=[['Timestamp','Ticker','Side','Units','Price','Price currency','FX to base','Fee ('+state.currency+')','Net total ('+state.currency+')'],...state.trades.map(t=>[new Date(t.time).toISOString(),t.symbol,t.side,t.qty,t.price,t.currency,t.rate,t.fee,t.total])];const csv='\uFEFF'+rows.map(row=>row.map(safe).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='potato-exchange-trades-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Trade ledger exported as CSV.')}
function exportFile(){const copy=JSON.parse(JSON.stringify(state));copy.exportedAt=new Date().toISOString();const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`potato-exchange-${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('Game exported. Keep the JSON file as your backup. API key not included.')}
async function importFile(file){if(!file)return;try{if(file.size>10e6)throw Error('File is too large');const obj=validSave(JSON.parse(await file.text()));if(obj.mode==='demo'||obj.assets.some(a=>a.source==='sim')||obj.trades.some(t=>t.source==='sim'))throw Error('A fictional-price game save cannot become a real-market portfolio. Export the old game separately and start a real-market portfolio.');if(!confirm('Replace your current portfolio with this saved portfolio?'))return;state=obj;state.mode='real';state.config={fee:0.1,auto:false,slippage:.05,...state.config};delete state.config.speed;delete state.config.volatility;state.fx=state.fx||{rates:{},updatedAt:0,date:''};state.assets=state.assets.map(a=>({...a,history:Array.isArray(a.history)?a.history:[],source:a.source==='live'?'stale':a.source}));state.tab='dashboard';state.side='buy';if(!assetById(state.selected))state.selected=state.assets[0]?.id||'';save();render();toast('Portfolio loaded. Refresh market quotes before trading.')}catch(e){toast('Could not load portfolio: '+e.message,true)}finally{const f=$('#file-import');if(f)f.value=''}}
async function fetchJson(url,timeout=12000){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const res=await fetch(url,{signal:ctrl.signal,cache:'no-store'});let data;try{data=await res.json()}catch{throw Error('Provider did not return JSON')}if(!res.ok)throw Error((data&&data.message)||`HTTP ${res.status}`);return data}finally{clearTimeout(timer)}}
async function refreshFx(force=false){if(!force&&now()-state.fx.updatedAt<4*3600e3)return true;const d=await fetchJson('https://api.frankfurter.dev/v1/latest?base='+encodeURIComponent(state.currency));if(!d.rates||!d.date)throw Error('FX response missing rate date');state.fx={rates:d.rates,updatedAt:now(),date:d.date};return true}
async function quoteFor(a){if(a.provider==='manual')return null;if(a.provider==='gold'){if(!['XAU','XAG','XPT','XPD','HG'].includes(a.symbol))throw Error('Unsupported metal symbol');const d=await fetchJson('https://api.gold-api.com/price/'+encodeURIComponent(a.symbol));const p=Number(d.price),stamp=Date.parse(d.updatedAt||d.updated_at||'');if(!(p>0))throw Error('Metal provider gave no valid price');return {price:p,stamp:Number.isFinite(stamp)?stamp:0,currency:'USD',provider:'Gold API'}}
if(a.provider==='coingecko'){if(!a.coinId)throw Error('CoinGecko coin ID required');const d=await fetchJson(`https://api.coingecko.com/api/v3/simple/price?ids=${encodeURIComponent(a.coinId)}&vs_currencies=${encodeURIComponent(a.currency.toLowerCase())}&include_last_updated_at=true`);const entry=d[a.coinId],p=Number(entry?.[a.currency.toLowerCase()]);if(!(p>0))throw Error('CoinGecko has no price for this coin or currency');return {price:p,stamp:entry.last_updated_at?entry.last_updated_at*1000:0,currency:a.currency,provider:'CoinGecko'}}
if(a.provider==='twelve'){if(!apiKey)throw Error('Twelve Data key required for this instrument');lastTdCalls=lastTdCalls.filter(t=>now()-t<61000);if(lastTdCalls.length>=7)throw Error('Quota guard: maximum seven requests per minute');lastTdCalls.push(now());const params=new URLSearchParams({symbol:a.symbol,apikey:apiKey});if(a.exchange)params.set('exchange',a.exchange);const d=await fetchJson('https://api.twelvedata.com/quote?'+params.toString());if(d.status==='error'||d.code)throw Error(d.message||'Market unavailable on this plan');const p=Number(d.close||d.price),stamp=Number(d.last_quote_at)>0?Number(d.last_quote_at)*1000:Number(d.timestamp)>0?Number(d.timestamp)*1000:0;if(!(p>0))throw Error('Provider returned no closing/last-traded price');return {price:p,stamp,currency:d.currency||a.currency,exchange:d.exchange||a.exchange,marketOpen:d.is_market_open===true?true:d.is_market_open===false?false:null,provider:'Twelve Data'}}
throw Error('Unknown provider')}
async function refreshAll(){if(busy)return;busy=true;render();let successes=0,failures=[],fxOk=true;try{try{await refreshFx()}catch(e){fxOk=false;failures.push('FX: '+e.message)}let ct=0;for(const a of state.assets){if(a.provider==='manual')continue;ct++;try{const result=await quoteFor(a);if(result&&recordPrice(a,result.price,'live',result.stamp||0)){if(result.currency&&/^[A-Z]{3}$/.test(result.currency))a.currency=result.currency;if(result.exchange)a.exchange=result.exchange;a.quoteProvider=result.provider;a.marketOpen=result.marketOpen;a.checkedAt=now();a.feedError='';successes++}}catch(e){a.source=a.price!==null?'stale':'error';a.feedError=String(e.message).slice(0,200);failures.push(`${a.symbol}: ${e.message}`)}if(ct%3===0)await new Promise(r=>setTimeout(r,125))}snapshot();lastRefreshAt=now();save();if(successes)toast(`Fetched ${successes} market quote${successes===1?'':'s'}; ${failures.length} issue${failures.length===1?'':'s'}.`,failures.length>0);else toast(failures.length?`No new quotes: ${failures.slice(0,2).join(' · ')}`:'No automatic quote providers configured.',true);if(failures.length)console.warn('Quote provider errors:',failures)}finally{busy=false;render()}}
async function refreshOneHistory(){const a=assetById(state.selected);if(!a)return;try{let entries=[];if(a.provider==='coingecko'){const d=await fetchJson(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(a.coinId)}/market_chart?vs_currency=${encodeURIComponent(a.currency.toLowerCase())}&days=30`,20000);entries=(d.prices||[]).map(([t,p])=>({t,p})).filter(x=>x.p>0)}else if(a.provider==='twelve'){if(!apiKey)throw Error('Twelve Data API key required');lastTdCalls=lastTdCalls.filter(t=>now()-t<61000);if(lastTdCalls.length>=7)throw Error('Rate limit: retry in a minute');lastTdCalls.push(now());const u=new URLSearchParams({symbol:a.symbol,interval:'1day',outputsize:'90',apikey:apiKey});if(a.exchange)u.set('exchange',a.exchange);const d=await fetchJson('https://api.twelvedata.com/time_series?'+u.toString());if(!Array.isArray(d.values))throw Error(d.message||'No historical bars available');entries=d.values.map(x=>({t:Date.parse(x.datetime.replace(' ','T')+'Z'),p:Number(x.close)})).filter(x=>Number.isFinite(x.t)&&x.p>0).reverse()}else throw Error('Historical series not available from this provider; chart tracks future quotes instead');if(!entries.length)throw Error('No historical data available');a.history=entries.slice(-220);save();render();toast(`Loaded ${a.history.length} historical price observations for ${a.symbol}.`)}catch(e){toast('History unavailable: '+e.message,true)}}
function tickDemo(){throw Error('Fictional price generation is disabled in real-market paper trading.')}
function autoLoop(){if(state.config.auto&&!busy&&now()-lastRefreshAt>120000)refreshAll()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const action=b.dataset.act;if(action==='tab'){state.tab=b.dataset.tab;save();render();window.scrollTo(0,0)}if(action==='select'){state.selected=b.dataset.id;state.tab='markets';state.side='buy';save();render();if(window.innerWidth<940)window.scrollTo({top:0,behavior:'smooth'})}if(action==='side'){state.side=b.dataset.side;render()}if(action==='fraction'){const a=assetById(state.selected),p=position(a.id),unit=markToBase(a),fr=Number(b.dataset.fr);if(!Number.isFinite(unit)||unit<=0)return toast('Get a price and FX quote first.',true);const qty=state.side==='buy'?state.cash*fr/(unit*(1+(Number(state.config.slippage)||0)/100)*(1+state.config.fee/100)):p.qty*fr;$('#order-qty').value=round8(qty)||'';updateOrder()}if(action==='trade')trade();if(action==='add')addModal();if(action==='close')closeModal();if(action==='manual')manualModal(assetById(b.dataset.id));if(action==='reset')resetModal();if(action==='export')exportFile();if(action==='csv')exportCsv();if(action==='import')$('#file-import').click();if(action==='refresh'){refreshAll()}if(action==='history-load')refreshOneHistory();if(action==='fx-refresh'){try{await refreshFx(true);snapshot();save();render();toast('Reference FX rates updated.')}catch(e){toast('FX refresh failed: '+e.message,true)}}if(action==='save-key'){apiKey=$('#api-key')?.value.trim()||'';try{localStorage.setItem(KEYSTORE,apiKey);toast(apiKey?'API key stored in this browser (not included in exported saves).':'Key cleared.')}catch{toast('Browser storage unavailable.',true)}}if(action==='clear-key'){apiKey='';localStorage.removeItem(KEYSTORE);render();toast('API key cleared from this browser.')}if(action==='save-fee'){const v=Number($('#fee-input')?.value);if(!Number.isFinite(v)||v<0||v>10)return toast('Choose a fee between 0 and 10%.',true);state.config.fee=v;save();render();toast('Virtual trading fee updated.')}if(action==='remove'){const a=assetById(b.dataset.id);if(!a)return;if(position(a.id).qty>1e-8)return toast('Sell your position before removing this ticker.',true);if(!confirm(`Remove ${a.symbol} from the watchlist?`))return;state.assets=state.assets.filter(x=>x.id!==a.id);if(state.selected===a.id)state.selected=state.assets[0]?.id||'';save();render();toast('Ticker removed.')} });
document.addEventListener('input',e=>{if(e.target.id==='order-qty')updateOrder();if(e.target.id==='market-search'){search=e.target.value;filterMarkets()}});
document.addEventListener('change',e=>{if(e.target.id==='auto-check'){state.config.auto=e.target.checked;save();toast(state.config.auto?'Automatic real-feed refresh enabled.':'Automatic refresh disabled.')}});
$('#file-import').addEventListener('change',e=>importFile(e.target.files[0]));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal-layer'))closeModal()});
document.addEventListener('click',e=>{if(e.target.id==='modal-layer')closeModal()});
window.addEventListener('beforeunload',()=>save());setInterval(autoLoop,15000);
state.assets.forEach(a=>{if(a.source==='live')a.source='stale'});
render();save();if(migratedLegacy)toast('The old fictional-price save was backed up in this browser. A clean real-market portfolio has been created.');refreshAll();
})();
</script>
</body>
</html>
