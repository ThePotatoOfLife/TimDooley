:root{--bg:#090b09;--ink:#f4f0e5;--muted:#9fa79d;--line:#30382f;--green:#b8dc82;--gold:#d8b56b;--panel:#0f130f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}.page{max-width:1080px;margin:auto;padding:36px 22px 100px}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:48px}nav a{color:var(--muted);text-decoration:none}nav a:hover{color:var(--green)}h1{font:400 clamp(52px,9vw,92px)/.88 Georgia,serif;letter-spacing:-.055em;margin:0 0 18px}.lede{max-width:820px;font:400 21px/1.5 Georgia,serif;color:#d7ddd3}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0 58px}.actions a{border:1px solid var(--line);border-radius:999px;padding:9px 13px;text-decoration:none;color:var(--green)}.actions a:first-child{background:var(--ink);border-color:var(--ink);color:var(--bg)}#relations-field{border-top:1px solid var(--line);padding-top:34px}.field-head{display:flex;gap:20px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}.field-head h2{font:400 34px Georgia,serif;margin:0}.field-head label{min-width:min(100%,360px);color:var(--muted);font-size:13px}.field-head input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#101410;color:var(--ink);font:inherit}.count{color:var(--muted);font-size:13px;margin-bottom:16px}.relation{padding:22px 0;border-top:1px solid #242b24}.relation:first-child{border-top:0}.meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:8px}.meta span{border:1px solid var(--line);border-radius:999px;padding:3px 7px}.relation h3{font:400 23px/1.25 Georgia,serif;margin:0 0 8px}.project{color:#d2d7ce;margin:0 0 12px}.refs{color:var(--gold);margin:0}.motifs{color:var(--muted);font-size:13px;margin-top:8px}.empty{padding:20px 0;color:var(--muted)}
</style>

<body><main class="page">
<nav><a href="../../religion/">← Religion</a><a href="../../tim-dooley/">Tim Dooley</a><a href="../../">Home</a></nav>
<h1>TIM &amp; THE BIBLE</h1>
<p class="lede">Dated project material beside biblical references. The timeline owns chronology; this page is only the relation reader.</p>
<div class="actions">
<a href="../../religion/#jesus-tim">JESUS ↔ TIM / SON</a>
<a href="../../chronology/?tl_layers=roadmap,scripture-at-time,biblical-parallel,biblical-unlock&tl_actors=son,tim,shared&tl_detail=1">TIMELINE · BIBLE LAYERS</a>
</div>
<section id="relations-field">
<div class="field-head"><h2>Biblical relations</h2><label>Search<input id="search" type="search" placeholder="Lamb, Door, John 12, Father…"></label></div>
<div class="count" id="count">Loading…</div>
<div id="relations"></div>
</section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[];
function searchable(r){return [r.date,r.actor,r.project_anchor,r.discovery_mode,r.relation_class,...(r.biblical_refs||[]),...(r.motifs||[])].join(' ').toLowerCase()}
function render(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const list=rows.filter(r=>!q||searchable(r).includes(q));
 document.getElementById('count').textContent=`${list.length} relation${list.length===1?'':'s'}`;
 document.getElementById('relations').innerHTML=list.length?list.map(r=>`<article class="relation"><div class="meta"><span>${esc(r.date||'undated')}</span><span>${esc(r.actor||'project')}</span><span>${esc(r.relation_class||'relation')}</span>${r.strength?`<span>${esc(r.strength)}/5</span>`:''}</div><h3>${esc((r.motifs||[]).slice(0,3).join(' · ') || (r.biblical_refs||[])[0] || r.id)}</h3><p class="project">${esc(r.project_anchor||'')}</p><p class="refs">${esc((r.biblical_refs||[]).join(' · '))}</p>${r.motifs?.length?`<div class="motifs">${esc(r.motifs.join(' · '))}</div>`:''}</article>`).join(''):'<div class="empty">No matching relations.</div>';
}
fetch('../../knowledge/traditions/biblical-syncretism-field.json').then(r=>r.json()).then(data=>{rows=data.relations||[];render()}).catch(()=>{document.getElementById('count').textContent='Relation data unavailable.'});
document.getElementById('search').addEventListener('input',render);
</script>
</body></html>
