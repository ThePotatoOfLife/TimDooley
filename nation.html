<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nation — The Potato of Life</title><link rel="stylesheet" href="site.css"><style>main{max-width:1280px;margin:auto;padding:48px 24px}.back{opacity:.7}.nation-meta{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.pill{padding:7px 10px;border:1px solid #333;border-radius:999px}.research-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:28px}.research-card{padding:20px;border:1px solid #292929;border-radius:10px;background:#0b0b0b}.research-card h3{margin-top:0}.metric{font-size:1.65rem;margin:.35rem 0}.muted{opacity:.65}.error{color:#f88}.source{font-size:.75rem;opacity:.55}.section{margin-top:42px}.relation{display:inline-block;margin:4px;padding:8px 10px;border:1px solid #333;border-radius:8px}.queue{columns:2;line-height:1.8}.status-enriched{border-color:#777}.status-index{border-style:dashed}.coverage{margin-top:24px;padding:16px;border:1px solid #292929;border-radius:10px;background:#0b0b0b}.coverage strong{font-size:1.05rem}@media(max-width:700px){.queue{columns:1}}</style></head><body><main><a class="back" href="nations.html">← All nations</a><section id="content"><p>Loading national record…</p></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');const modules=[['Government','political_system'],['Economy','economy'],['Finance','public_finance'],['Population & labour','population'],['Energy & resources','energy_and_resources'],['Trade & value chains','trade_and_value_chains'],['Infrastructure','infrastructure'],['Technology & research','technology'],['Health & education','health'],['History','history'],['Culture & society','culture'],['Security & geopolitics','security_and_external_relations']];async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}async function init(){try{const [atlas,nationDirectory]=await Promise.all([j('data/countries/index.json'),j('data/nations.json')]);const n=(atlas.countries||[]).find(x=>x.id===id);const directory=(nationDirectory.nations||[]).find(x=>x.id===id);if(!n&&!directory)throw Error('Nation not found');const base={...(directory||{}),...(n||{})};let enrichment=null;try{enrichment=await j('data/countries/'+id+'-enrichment.json')}catch(e){}document.title=(base.name||id)+' — The Potato of Life';const i={...base,...(enrichment?.identity||{})};const o=enrichment?.observations||{};const coverage=Array.isArray(enrichment?.observations)?enrichment.observations.length:Object.keys(o).length;document.getElementById('content').innerHTML=`<p class="eyebrow">NATIONAL RECORD · ${esc(enrichment?'ENRICHED':'INDEX')}</p><h1>${esc(i.official_name||i.name||id)}</h1><div class="nation-meta"><span class="pill">${esc(i.iso3||'—')}</span><span class="pill">ISO-2: ${esc(i.iso2||'—')}</span><span class="pill">Capital: ${esc(i.capital||'—')}</span><span class="pill">${esc(i.region||'—')}</span><span class="pill ${enrichment?'status-enriched':'status-index'}">${enrichment?'Enrichment loaded':'Blueprint / index only'}</span></div>${enrichment?renderEnriched(enrichment):`<p class="hero-lead">This nation has a canonical directory record and complete blueprint inheritance, but its evidence layer has not yet been populated.</p><section class="coverage"><strong>Research status</strong><p class="muted">The national atlas distinguishes the canonical record from its evidence enrichment. This page is ready for the next research pass.</p><p>Blueprint: countries-blueprint v1.0.0 · Enrichment observations: ${coverage}</p></section>`}` }catch(e){document.getElementById('content').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}function renderEnriched(d){const cards=modules.map(([title,key])=>{const x=d[key];if(!x)return `<article class="research-card"><h3>${esc(title)}</h3><p class="muted">Research layer queued.</p></article>`;let body='';if(key==='population')body=`<div class="metric">${Number(x.value||0).toLocaleString()}</div><p>Population · ${esc(x.year)}</p><p>Growth: ${esc(x.growth_rate)}% · Life expectancy: ${esc(x.life_expectancy)} years</p>`;else if(key==='economy')body=`<div class="metric">$${esc(x.gdp_current_usd_trillion)}T</div><p>GDP · ${esc(x.gdp_year)}</p><p>Per capita: $${Number(x.gdp_per_capita_usd||0).toLocaleString()} · Growth: ${esc(x.gdp_growth_percent)}% · Unemployment: ${esc(x.unemployment_percent)}%</p>`;else if(key==='public_finance')body=`<div class="metric">${esc(x.central_government_debt_percent_gdp)}%</div><p>Central-government debt / GDP · ${esc(x.debt_year)}</p>`;else if(key==='political_system')body=`<p><strong>${esc(x.system_type)}</strong></p><p>Head of state: ${esc(x.head_of_state)}<br>Head of government: ${esc(x.head_of_government)}</p><p>Current leader: ${esc(x.current_leader?.name||'—')}</p>`;else if(key==='history')body=(x.turning_points||[]).map(h=>`<p><strong>${esc(h.date)}</strong> — ${esc(h.event)}</p>`).join('');else if(Array.isArray(x.major_relationships))body='<p>'+x.major_relationships.map(v=>`<span class="relation">${esc(v)}</span>`).join('')+'</p>';else if(Array.isArray(x.strategic_assets))body='<p>'+x.strategic_assets.map(v=>`<span class="relation">${esc(v)}</span>`).join('')+'</p>';else if(Array.isArray(x.major_organizations))body='<p>'+x.major_organizations.map(v=>`<span class="relation">${esc(v)}</span>`).join('')+'</p>';else body='<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';return `<article class="research-card"><h3>${esc(title)}</h3>${body}<p class="source">Source: ${esc(x.source||'country enrichment layer')}</p></article>`}).join('');const rel=(d.relationships||[]).map(r=>`<span class="relation">${esc(r.type)} → ${esc(r.target)}</span>`).join('');const queue=(d.research_queue||[]).map(q=>`<li>${esc(q)}</li>`).join('');return `<p class="hero-lead">A relationship-first national record. Empirical observations are kept separate from project interpretation and retain their provenance.</p><section class="section"><h2>Core national layers</h2><div class="research-grid">${cards}</div></section><section class="section"><h2>Relationships</h2><div>${rel||'<p class="muted">No relationship edges yet.</p>'}</div></section><section class="section"><h2>Research queue</h2><ul class="queue">${queue||'<li>Expand the national record with authoritative evidence across the blueprint layers.</li>'}</ul></section><section class="section"><p class="source">Updated ${esc(d.updated)} · Blueprint: ${esc(d.blueprint)}</p></section>`}init();</script></body></html>
