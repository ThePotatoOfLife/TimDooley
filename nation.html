<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nation — The Potato of Life</title><link rel="stylesheet" href="site.css"><style>main{max-width:1280px;margin:auto;padding:48px 24px}.back{opacity:.7}.nation-meta{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}.research-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:28px}.research-card{padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:0 4px 18px rgba(30,25,18,.05)}.research-card h3{margin-top:0}.metric{font-size:1.65rem;margin:.35rem 0}.muted{opacity:.75}.error{color:#a72f2f}.source{font-size:.75rem;color:var(--muted)}.section{margin-top:42px}.relation{display:inline-block;margin:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.queue{columns:2;line-height:1.8}.fact-list{margin:0;padding-left:20px}@media(max-width:700px){.queue{columns:1}}</style></head><body><main><a class="back" href="nations.html">← All nations</a><section id="content"><p>Loading national record…</p></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}function simpleEnrichment(d){const cards=[['Strategic assets',Array.isArray(d.strategic_assets)?d.strategic_assets:[]],['Relationships',Array.isArray(d.relationships)?d.relationships.map(r=>`${r[1]||'Unknown'} — ${r[2]||'relationship'}`):[]],['Research queue',Array.isArray(d.research_queue)?d.research_queue:[]],['Sources',Array.isArray(d.sources)?d.sources:[]]];return `<p class="hero-lead">A relationship-first national record built from normalized country facts, strategic observations and explicit research priorities. The enrichment layer is empirical/analytical metadata; it is not a substitute for the underlying source documents.</p><section class="section"><h2>National facts</h2><div class="research-grid"><article class="research-card"><h3>Identity</h3><p><strong>${esc(d.official_name||d.country_id)}</strong></p><p>Capital: ${esc(d.capital||'—')}<br>Region: ${esc(d.region||'—')} · ${esc(d.subregion||'—')}<br>Currency: ${esc(d.currency||'—')}<br>Government: ${esc(d.government||'—')}<br>Independence: ${esc(d.independence||'—')}</p></article>${cards.map(([title,items])=>`<article class="research-card"><h3>${esc(title)}</h3>${items.length?`<ul class="fact-list">${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">No entries yet.</p>'}</article>`).join('')}</div></section><section class="section"><h2>Relationship edges</h2><div>${(d.relationships||[]).length?d.relationships.map(r=>`<span class="relation">${esc(r[1])} · ${esc(r[2])}</span>`).join(''):'<p class="muted">No explicit edges recorded yet.</p>'}</div></section><section class="section"><p class="source">Country ID: ${esc(d.country_id)} · Version: ${esc(d.version)} · Sources: ${esc((d.sources||[]).join(', '))}</p></section>`}function richEnrichment(d){const modules=[['Government','political_system'],['Economy','economy'],['Finance','public_finance'],['Population & labour','population'],['Energy & resources','energy_and_resources'],['Trade & value chains','trade_and_value_chains'],['Infrastructure','infrastructure'],['Technology & research','technology'],['Health & education','health'],['History','history'],['Culture & society','culture'],['Security & geopolitics','security_and_external_relations']];const cards=modules.map(([title,key])=>{const x=d[key];if(!x)return `<article class="research-card"><h3>${esc(title)}</h3><p class="muted">Research layer queued.</p></article>`;let body='';if(key==='population')body=`<div class="metric">${Number(x.value||0).toLocaleString()}</div><p>Population · ${esc(x.year)}</p><p>Growth: ${esc(x.growth_rate)}% · Life expectancy: ${esc(x.life_expectancy)} years</p>`;else if(key==='economy')body=`<div class="metric">$${esc(x.gdp_current_usd_trillion)}T</div><p>GDP · ${esc(x.gdp_year)}</p><p>Per capita: $${Number(x.gdp_per_capita_usd||0).toLocaleString()} · Growth: ${esc(x.gdp_growth_percent)}% · Unemployment: ${esc(x.unemployment_percent)}%</p>`;else if(key==='public_finance')body=`<div class="metric">${esc(x.central_government_debt_percent_gdp)}%</div><p>Central-government debt / GDP · ${esc(x.debt_year)}</p>`;else if(key==='political_system')body=`<p><strong>${esc(x.system_type)}</strong></p><p>Head of state: ${esc(x.head_of_state)}<br>Head of government: ${esc(x.head_of_government)}</p><p>Current leader: ${esc(x.current_leader?.name||'—')}</p>`;else if(key==='history')body=(x.turning_points||[]).map(h=>`<p><strong>${esc(h.date)}</strong> — ${esc(h.event)}</p>`).join('');else if(Array.isArray(x.major_relationships))body='<p>'+x.major_relationships.map(v=>`<span class="relation">${esc(v)}</span>`).join('')+'</p>';else if(Array.isArray(x.strategic_assets))body='<p>'+x.strategic_assets.map(v=>`<span class="relation">${esc(v)}</span>`).join('')+'</p>';else if(Array.isArray(x.major_organizations))body='<p>'+x.major_organizations.map(v=>`<span class="relation">${esc(v)}</span>`).join('')+'</p>';else body='<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';return `<article class="research-card"><h3>${esc(title)}</h3>${body}<p class="source">Source: ${esc(x.source||'country enrichment layer')}</p></article>`}).join('');return `<p class="hero-lead">A relationship-first national record. Empirical observations are kept separate from project interpretation and retain their provenance.</p><section class="section"><h2>Core national layers</h2><div class="research-grid">${cards}</div></section><section class="section"><h2>Relationships</h2><div>${(d.relationships||[]).map(r=>`<span class="relation">${esc(r.type)} → ${esc(r.target)}</span>`).join('')||'<p class="muted">No relationship edges yet.</p>'}</div></section><section class="section"><h2>Research queue</h2><ul class="queue">${(d.research_queue||[]).map(q=>`<li>${esc(q)}</li>`).join('')||'<li>Expand the national record with authoritative evidence across the blueprint layers.</li>'}</ul></section><section class="section"><p class="source">Updated ${esc(d.updated)} · Blueprint: ${esc(d.blueprint)}</p></section>`}async function init(){try{const [atlas,nationDirectory]=await Promise.all([j('data/countries/index.json'),j('data/nations.json')]);const n=(atlas.countries||[]).find(x=>x.id===id);const directory=(nationDirectory.nations||[]).find(x=>x.id===id);if(!n&&!directory)throw Error('Nation not found');const base={...(directory||{}),...(n||{})};let enrichment=null;try{enrichment=await j('data/countries/'+encodeURIComponent(id)+'-enrichment.json')}catch(e){}document.title=(base.name||id)+' — The Potato of Life';const identity=enrichment?.identity||{};const title=identity.official_name||enrichment?.official_name||base.name||id;document.getElementById('content').innerHTML=`<p class="eyebrow">NATIONAL RECORD · ${enrichment?'ENRICHED':'INDEX'}</p><h1>${esc(title)}</h1><div class="nation-meta"><span class="pill">${esc(base.iso3||'—')}</span><span class="pill">ISO-2: ${esc(base.iso2||'—')}</span><span class="pill">Capital: ${esc(identity.capital||enrichment?.capital||base.capital||'—')}</span><span class="pill">${esc(identity.region||enrichment?.region||base.region||'—')}</span><span class="pill">${enrichment?'Enrichment loaded':'Blueprint / index only'}</span></div>${enrichment?(enrichment.identity||enrichment.observations?richEnrichment(enrichment):simpleEnrichment(enrichment)):`<p class="hero-lead">This nation has a canonical directory record and complete blueprint inheritance. Its evidence enrichment has not yet been populated.</p><section class="coverage"><strong>Research status</strong><p>The canonical record remains usable while the evidence layer is expanded.</p></section>`}` }catch(e){document.getElementById('content').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}init();</script></body></html>
