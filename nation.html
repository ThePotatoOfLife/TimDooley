<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nation — The Potato of Life</title><link rel="stylesheet" href="site.css"><style>main{max-width:1200px;margin:auto;padding:48px 24px}.back{opacity:.7}.nation-meta{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.pill{padding:7px 10px;border:1px solid #333;border-radius:999px}.research-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:28px}.research-card{padding:20px;border:1px solid #292929;border-radius:10px;background:#0b0b0b}.research-card h3{margin-top:0}.muted{opacity:.65}.error{color:#f88}</style></head><body><main><a class="back" href="nations.html">← All nations</a><section id="content"><p>Loading nation…</p></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');const modules=[['Government','constitutional structure, executive, legislature, judiciary, elections, parties, administrative organization and public institutions'],['Economy','GDP, output, sectors, firms, labour, wages, productivity, inflation, fiscal position, debt and investment'],['Finance','banking, central bank, currency, sovereign debt, capital markets, foreign assets, ownership and financial dependencies'],['Energy','electricity, oil, gas, renewables, grids, imports, exports, storage and strategic dependencies'],['Trade','imports, exports, major goods and services, trade partners, ports, corridors and supply chains'],['Infrastructure','roads, rail, ports, airports, pipelines, grids, telecoms, data infrastructure and strategic nodes'],['Technology & research','universities, research institutions, patents, digital infrastructure, advanced industry and innovation capacity'],['People & labour','population, demographics, migration, employment, skills, education and regional distribution'],['Land & resources','territory, agriculture, water, minerals, forests, fisheries and other strategic resources'],['History','major historical periods, state formation, conflicts, treaties, borders and inherited institutional conditions'],['Culture & society','languages, religion, cultural institutions, media, education, family structures and social organization'],['Security & geopolitics','alliances, defence, borders, strategic relationships, international organizations and geopolitical exposure'],['Relationships','connections to other nations, companies, institutions, infrastructure, capital, trade, energy and obligations']];async function init(){try{const r=await fetch('data/nations.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const data=await r.json(),n=(data.nations||[]).find(x=>x.id===id);if(!n)throw Error('Nation not found');document.title=n.name+' — The Potato of Life';document.getElementById('content').innerHTML=`<p class="eyebrow">NATIONAL RECORD</p><h1>${esc(n.name)}</h1><div class="nation-meta"><span class="pill">${esc(n.status)}</span><span class="pill">${esc(n.iso3)}</span><span class="pill">Capital: ${esc(n.capital)}</span><span class="pill">${esc(n.region)}</span><span class="pill">${esc(n.subregion)}</span></div><p class="hero-lead">This is the national anchor record. The atlas treats the country as a node in a larger relationship graph rather than an isolated profile.</p><div class="research-grid">${modules.map(([title,text])=>`<article class="research-card"><h3>${esc(title)}</h3><p>${esc(text)}</p><p class="muted">Research layer ready to be populated and connected to evidence.</p></article>`).join('')}</div>`}catch(e){document.getElementById('content').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}init();</script></body></html>
