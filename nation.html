<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nation — The Potato of Life</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="consistency.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav aria-label="Primary"><a href="index.html">Home</a><a href="repository.html">Atlas</a><a href="nations.html" aria-current="page">World</a><a href="people.html">People</a><a href="belief.html">Ideas</a><a href="potatoism.html">Potatoism</a><a href="hawkins.html">Hawkins</a></nav></header><main class="nation-page"><a class="back" href="nations.html">← All nations</a><div id="content"><p class="loading">Loading live national record…</p></div></main><script>
const id=new URLSearchParams(location.search).get('id');const iso3=new URLSearchParams(location.search).get('iso3');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status+' for '+u);return r.json()});const wb=code=>`https://api.worldbank.org/v2/country/${encodeURIComponent(code)}/indicator/SP.POP.TOTL,NY.GDP.MKTP.CD,NY.GDP.PCAP.CD,NY.GDP.MKTP.KD.ZG,FP.CPI.TOTL.ZG,SL.UEM.TOTL.ZS,GC.DOD.TOTL.GD.ZS?format=json&per_page=100`;function latest(rows,key){return(rows||[]).filter(r=>r.indicator?.id===key&&r.value!==null&&r.value!==undefined).sort((a,b)=>Number(b.date)-Number(a.date))[0]||null}function money(c){const x=Object.values(c||{})[0];return x?`${x.name}${x.symbol?' ('+x.symbol+')':''}`:'—'}function languages(x){return Object.values(x||{}).join(', ')||'—'}async function init(){try{let code=iso3;if(!code){const local=await api('data/nations.json');const n=(local.nations||[]).find(x=>x.id===id||String(x.iso3).toLowerCase()===String(id).toLowerCase());code=n?.iso3;if(!code)throw Error('Nation not found in canonical directory')}const [countries,wbraw]=await Promise.all([api(`https://restcountries.com/v3.1/alpha/${encodeURIComponent(code)}?fields=name,cca2,cca3,capital,region,subregion,flag,independent,unMember,landlocked,area,population,languages,currencies,borders,timezones,continents,maps`),api(wb(code))]);const c=Array.isArray(countries)?countries[0]:countries;if(!c)throw Error('Nation source returned no record');const rows=Array.isArray(wbraw?.[1])?wbraw[1]:[];const pop=latest(rows,'SP.POP.TOTL'),gdp=latest(rows,'NY.GDP.MKTP.CD'),pc=latest(rows,'NY.GDP.PCAP.CD'),growth=latest(rows,'NY.GDP.MKTP.KD.ZG'),infl=latest(rows,'FP.CPI.TOTL.ZG'),unemp=latest(rows,'SL.UEM.TOTL.ZS'),debt=latest(rows,'GC.DOD.TOTL.GD.ZS');document.title=`${c.name.common} — The Potato of Life`;document.getElementById('content').innerHTML=`<section class="nation-hero"><div class="eyebrow">LIVE NATIONAL RECORD · ${esc(c.cca3)}</div><h1>${esc(c.flag||'')} ${esc(c.name.common)}</h1><p>${esc(c.name.official)}</p><div class="meta"><span>ISO-2 ${esc(c.cca2)}</span><span>ISO-3 ${esc(c.cca3)}</span><span>Capital ${esc((c.capital||[]).join(', ')||'—')}</span><span>${esc(c.region)} · ${esc(c.subregion)}</span><span>${c.landlocked?'Landlocked':'Coastal'}</span></div></section><section class="nation-section"><h2>Country facts</h2><div class="facts"><div class="fact"><h3>Population</h3><div class="metric">${pop?Number(pop.value).toLocaleString():(c.population?Number(c.population).toLocaleString():'—')}</div><p>${esc(pop?.date||'REST Countries population field')}</p></div><div class="fact"><h3>Economy</h3><div class="metric">${gdp?'$'+(Number(gdp.value)/1e9).toFixed(1)+'B':'—'}</div><p>GDP current US$ · ${esc(gdp?.date||'—')}</p><p>GDP per capita: ${pc?'$'+Number(pc.value).toLocaleString():'—'}</p></div><div class="fact"><h3>Public finance</h3><div class="metric">${debt?Number(debt.value).toFixed(1)+'%':'—'}</div><p>General government gross debt / GDP · ${esc(debt?.date||'—')}</p></div></div></section><section class="nation-section"><h2>Current indicators</h2><div class="grid"><div class="fact"><h3>Growth</h3><p>${growth?Number(growth.value).toFixed(2)+'% real GDP growth · '+growth.date:'Not available'}</p><h3>Inflation</h3><p>${infl?Number(infl.value).toFixed(2)+'% · '+infl.date:'Not available'}</p><h3>Unemployment</h3><p>${unemp?Number(unemp.value).toFixed(2)+'% · '+unemp.date:'Not available'}</p></div><div class="fact"><h3>State and geography</h3><p>Independent: ${c.independent?'Yes':'No / not classified'}</p><p>UN member: ${c.unMember?'Yes':'No'}</p><p>Area: ${Number(c.area||0).toLocaleString()} km²</p><p>Time zones: ${esc((c.timezones||[]).join(', ')||'—')}</p></div></div></section><section class="nation-section"><div class="grid"><div><h2>Languages</h2><p>${esc(languages(c.languages))}</p><h2>Currency</h2><p>${esc(money(c.currencies))}</p></div><div><h2>Land borders</h2><p>${esc((c.borders||[]).join(', ')||'None')}</p><h2>Continents</h2><p>${esc((c.continents||[]).join(', ')||'—')}</p></div></div></section><section class="nation-section"><h2>Repository layer</h2><p>The repository's local country record remains the project's research/graph layer. This page does not treat an empty local enrichment file as the country's facts.</p><p><a href="https://github.com/ThePotatoOfLife/TimDooley/blob/main/data/countries/${encodeURIComponent(id)}.json">Open local country record</a></p><p class="source">External data: REST Countries for identity/geography; World Bank for macroeconomic indicators. Values retain their source reference periods.</p></section>`}catch(e){document.getElementById('content').innerHTML=`<p class="error">${esc(e.message)}</p><p>The live source failed. The repository remains available through the Atlas and GitHub links.</p>`}}init();
</script></body></html>
