<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Repository-backed national record. No live API is required to display a country.">
<title>Nation — The Potato of Life</title>
<link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="consistency.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav aria-label="Primary"><a href="index.html">Home</a><a href="repository.html">Atlas</a><a href="nations.html" aria-current="page">World</a><a href="people.html">People</a><a href="belief.html">Ideas</a><a href="potatoism.html">Potatoism</a><a href="hawkins.html">Hawkins</a></nav></header>
<main class="nation-page"><a class="back" href="nations.html">← All nations</a><div id="content"><p class="loading">Loading national record…</p></div></main>
<script>
const params=new URLSearchParams(location.search);
const requested=(params.get('id')||params.get('iso3')||'').trim().toLowerCase();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=async path=>{const r=await fetch(path);if(!r.ok)throw Error('HTTP '+r.status+' for '+path);return r.json()};
const optional=async path=>{try{return await load(path)}catch{return null}};
const fmt=v=>v===null||v===undefined||v===''?'Not yet sourced':typeof v==='number'?v.toLocaleString():String(v);
const link=(id,label)=>`<a href="node.html?id=${encodeURIComponent(id)}">${esc(label||id)}</a>`;

async function init(){
  const content=document.getElementById('content');
  try{
    const index=await load('data/countries/index.json');
    const directory=Array.isArray(index.countries)?index.countries:[];
    const directoryCountry=directory.find(c=>c.id===requested||String(c.iso3||'').toLowerCase()===requested||String(c.iso2||'').toLowerCase()===requested);
    if(!directoryCountry)throw Error('Country not found in the canonical country index: '+requested);
    const snapshot=await optional('data/country-static.json');
    let country=(snapshot?.countries||[]).find(c=>c.id===directoryCountry.id);
    if(!country){
      const local=await optional(`data/countries/${encodeURIComponent(directoryCountry.id)}.json`);
      if(local) country={id:local.identity?.id||directoryCountry.id,name:local.identity?.name||directoryCountry.name,status:directoryCountry.status,iso2:local.identity?.iso2||directoryCountry.iso2,iso3:local.identity?.iso3||directoryCountry.iso3,capital:directoryCountry.capital,region:directoryCountry.region,subregion:directoryCountry.subregion,record_status:local.status,coverage:local.coverage||{},observations:local.observations||{},relationships:local.relationships||[],history:local.history||[],research_queue:local.research_queue||[],provenance:local.provenance||{},enrichment:{}};
    }
    if(!country)throw Error('The repository has not generated the static country snapshot for this record yet.');
    const obs=country.observations||{};
    const relationships=Array.isArray(country.relationships)?country.relationships:[];
    const enrichment=country.enrichment||{};
    const political=enrichment.political_system||{};
    const identity=enrichment.identity||{};
    const description=identity.description||`${country.name} is a canonical national record in the Atlas. The figures shown here are repository snapshots with source and year metadata preserved.`;
    const metric=(key,label)=>{const x=obs[key];if(x&&typeof x==='object'&&'value' in x)return `<div class="fact"><h3>${esc(label)}</h3><div class="metric">${esc(fmt(x.value))}</div><p>${esc(x.year||x.reference_period||'Source year not stated')} · repository snapshot</p></div>`;if(x!==undefined&&x!==null)return `<div class="fact"><h3>${esc(label)}</h3><div class="metric">${esc(fmt(x))}</div><p>repository snapshot</p></div>`;return `<div class="fact"><h3>${esc(label)}</h3><div class="metric">Not yet sourced</div><p>Explicitly missing</p></div>`;};
    const links=relationships.slice(0,100).map(r=>`<li><strong>${esc(r.type||'related')}</strong> → ${r.target?link(r.target,r.target):'Unresolved target'}${r.status?' · '+esc(r.status):''}</li>`).join('');
    const queue=(country.research_queue||[]).slice(0,30).map(x=>`<li>${esc(x)}</li>`).join('');
    document.title=`${country.name} — The Potato of Life`;
    content.innerHTML=`<section class="nation-hero"><div class="eyebrow">NATIONAL RECORD · ${esc(country.iso3||directoryCountry.iso3)}</div><h1>${esc(country.name)}</h1><p>${esc(identity.official_name||country.name)}</p><div class="meta"><span>ISO-2 ${esc(country.iso2||directoryCountry.iso2)}</span><span>ISO-3 ${esc(country.iso3||directoryCountry.iso3)}</span><span>Capital ${esc(country.capital||'Not yet sourced')}</span><span>${esc(country.region||'')} · ${esc(country.subregion||'')}</span><span>${esc(country.status||'State')}</span></div></section><section class="nation-section"><h2>Country record</h2><p>${esc(description)}</p><div class="facts">${metric('population','Population')}${metric('gdp','GDP')}${metric('gdp_per_capita','GDP per capita')}${metric('real_growth','Real GDP growth')}${metric('inflation','Inflation')}${metric('unemployment','Unemployment')}${metric('life_expectancy','Life expectancy')}${metric('fertility','Fertility')}</div></section><section class="nation-section"><h2>Political and institutional layer</h2><div class="grid"><div class="fact"><h3>Political system</h3><p>${esc(political.system_type||'Not yet sourced')}</p><p>${political.head_of_state?'Head of state: '+esc(political.head_of_state):'Head of state: Not yet sourced'}</p><p>${political.head_of_government?'Head of government: '+esc(political.head_of_government):'Head of government: Not yet sourced'}</p></div><div class="fact"><h3>Archive coverage</h3><p>Status: ${esc(country.record_status||'instantiated')}</p><p>Observations: ${esc(country.coverage?.observations??Object.keys(obs).length)}</p><p>Relationships: ${esc(country.coverage?.relationships??relationships.length)}</p><p>Sources: ${esc(country.coverage?.sources??0)}</p></div></div></section>${relationships.length?`<section class="nation-section"><h2>Explicit relationships</h2><ul>${links}</ul></section>`:''}<section class="nation-section"><h2>Research state</h2><p>${queue?`The repository has ${country.research_queue.length} identified research areas for further source enrichment.`:'No open research queue is currently recorded.'}</p>${queue?`<ul>${queue}</ul>`:''}<p class="source">Unknown values are shown as missing rather than invented. The browser does not query a live country API.</p></section><section class="nation-section"><h2>Data provenance</h2><p>Static repository snapshot generated by the country acquisition workflow. Individual observations retain their source and year where available.</p><p class="source">Last repository refresh: ${esc(country.provenance?.last_refresh||country.provenance?.retrieved||snapshot?.generated_at||'Not yet recorded')}</p></section><section class="nation-section"><h2>Repository layer</h2><p><a href="https://github.com/ThePotatoOfLife/TimDooley/blob/main/data/countries/${encodeURIComponent(country.id)}.json">Open local country record</a> · <a href="nations.html">Back to the country directory</a></p><p class="source">Canonical directory: ${directory.length} countries. Live internet access is not required to display this page.</p></section>`;
  }catch(e){content.innerHTML=`<section class="nation-section"><h1>National record unavailable</h1><p class="error">${esc(e.message)}</p><p>The frontend is repository-only. If this is a newly generated static snapshot, the country acquisition workflow may still be rebuilding the data.</p><p><a href="nations.html">Return to all nations</a> · <a href="repository.html">Open the Atlas</a></p></section>`}
}
init();
</script>
</body></html>
