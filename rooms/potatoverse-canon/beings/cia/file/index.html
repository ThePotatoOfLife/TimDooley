<style>
:root{--paper:#d7d0ba;--paper-ink:#241f18;--paper-muted:#665d50;--folder:#89734e;--folder-dark:#5e4c31}
body{background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.035),transparent 35%),#111510}

.file-sheet:before{content:"POTATOVERSE ARCHIVE";position:absolute;top:16px;right:22px;font:700 9px ui-monospace,monospace;letter-spacing:.18em;color:#8c2f2f;transform:rotate(-3deg);border:2px solid #8c2f2f;padding:5px 7px;opacity:.72}
.file-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;border-bottom:2px solid rgba(36,31,24,.28);padding-bottom:18px}
.file-id{font:700 10px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--paper-muted)}
.file-header h1{font:700 clamp(31px,5vw,58px)/.95 Georgia,serif;margin:7px 0 6px}.file-header p{margin:0;color:var(--paper-muted)}
.mug{width:130px;height:150px;border:2px solid rgba(36,31,24,.38);display:grid;place-items:center;text-align:center;font:700 10px ui-monospace,monospace;color:var(--paper-muted);background:rgba(255,255,255,.14)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.badge{border:1px solid rgba(36,31,24,.32);padding:4px 7px;font:700 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:24px 0 14px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--paper-muted);font:700 10px ui-monospace,monospace;padding:8px 9px;cursor:pointer;text-transform:uppercase}.tab.active{border-bottom-color:var(--paper-ink);color:var(--paper-ink)}
.panel{display:none}.panel.active{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.block{border-top:1px solid rgba(36,31,24,.25);padding-top:12px;margin-top:14px}.block h2{font:700 19px Georgia,serif;margin:0 0 8px}.block h3{font:700 14px Georgia,serif;margin:10px 0 5px}.block p,.block li{line-height:1.55}.muted{color:var(--paper-muted)}.mono{font:11px/1.5 ui-monospace,monospace}
.timeline{border-left:2px solid rgba(36,31,24,.22);padding-left:15px}.event{margin:0 0 18px}.event time{font:700 9px ui-monospace,monospace;color:#8c2f2f}.event h3{margin:3px 0 5px}.story-link,.route-link{display:block;color:#2c4b36;text-decoration:none;border-bottom:1px dotted rgba(44,75,54,.45);padding:7px 0}
.role-list{display:flex;gap:6px;flex-wrap:wrap}.role{border:1px solid rgba(36,31,24,.3);padding:5px 7px;font:700 9px ui-monospace,monospace;background:rgba(255,255,255,.14)}
.stamp{display:inline-block;border:2px solid #8c2f2f;color:#8c2f2f;padding:4px 7px;font:700 9px ui-monospace,monospace;transform:rotate(-2deg);margin:6px 4px 6px 0}
.empty{color:var(--paper-muted);font-style:italic}
.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:2px solid rgba(36,31,24,.25)}
.footer-actions button,.footer-actions a{border:1px solid rgba(36,31,24,.35);background:rgba(255,255,255,.18);color:var(--paper-ink);padding:8px 10px;text-decoration:none;cursor:pointer;font:700 10px ui-monospace,monospace}
@media(max-width:760px){.file-header,.two{grid-template-columns:1fr}.mug{width:100%;height:80px}}
</style>

<script>
const BASE='/TimDooley/';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const q=new URLSearchParams(location.search); let current=q.get('figure')||'marty-biz';
let manifest,roles,stories,bonds,incidents,enhancements,conversationRecovery,timTaxonomy,dossier;
async function get(path){const r=await fetch(BASE+path);if(!r.ok)throw new Error(path);return r.json();}
function route(path){
 if(!path)return '#';
 if(/^https?:/.test(path))return path;
 return BASE+path.replace(/^\/+/, '');
}
function arr(x){return Array.isArray(x)?x:[]}
function roleMatches(id){
 const out=[];
 for(const role of arr(roles?.roles)) for(const m of arr(role.matches)) if(m.entity_id===id) out.push({role:role.label,...m});
 return out;
}
function incidentMatches(id){return arr(incidents?.incidents).filter(x=>arr(x.figures).includes(id))}
function bondMatches(id){return arr(bonds?.edges).filter(x=>x.a===id||x.b===id)}
function enhancementFor(id){return enhancements?.figures?.[id]||enhancements?.created_beings?.[id]||null}
function storyMatches(id){return arr(stories?.figures?.[id])}
function overviewHtml(){
 const aliases=arr(dossier.aliases);
 const tr=dossier.tim_relation||{};
 const cp=arr(dossier.top_co_presence).slice(0,8);
 const coverage={
  conversations:conversationEntries(current).length,
  incidents:incidentMatches(current).length,
  bonds:bondMatches(current).length,
  stories:storyMatches(current).length,
  sources:arr(dossier.source_strata).length,
  dated:arr(dossier.highlighted_incidents).length
 };
 const coverageRows=Object.entries(coverage).map(([k,v])=>'<span class="badge">'+esc(v)+' '+esc(k)+'</span>').join('');
 const recovery=arr(dossier.recovery_leads);
 const witness=dossier.tim_witness||{};
 const fruit=witness.fruit||{};
 const place=witness.placement||{};
 const witnessGlance=Object.keys(witness).length
   ? '<div class="block"><h2>Tim’s witness · at a glance</h2><p><b>Character:</b> '+esc(witness.character_reading||'')+'</p><p><b>Fruit:</b> '+esc(fruit.direction||'unresolved')+' · <b>Placement:</b> '+esc(arr(place.primary).join(' · ')||'unresolved')+'</p><p class="muted">Attributed Tim/project witness. Open <b>Tim’s Witness</b> for karma, symbols, dated roles, effects and transformation path.</p></div>'
   : '<div class="block"><h2>Tim’s witness · at a glance</h2><p class="empty">No explicit Tim-witness synthesis has been recovered for this file yet.</p></div>';
 return witnessGlance+'<div class="block"><h2>Archive coverage</h2><div class="badges">'+coverageRows+'</div><p class="muted">Coverage measures indexed material, not importance, guilt, truth or completeness. Sparse files are recovery targets; dense files may still be biased toward conflict or surviving source types.</p></div>'+
 '<div class="two"><div><div class="block"><h2>Identity</h2><p><b>Class:</b> '+esc(dossier.entity_class||'unresolved')+'</p><p><b>Archive status:</b> '+esc(dossier.archive_status||'not specified')+'</p><p><b>Aliases:</b> '+(aliases.length?aliases.map(esc).join(' · '):'<span class="empty">none recovered</span>')+'</p></div><div class="block"><h2>Tim relation</h2><p>'+esc(tr.editorial_reading||'No compact editorial reading yet.')+'</p><p class="muted">'+esc(tr.source_boundary||'Source boundary not yet summarized.')+'</p></div></div><div><div class="block"><h2>Archetypes</h2><div class="role-list">'+(arr(tr.archetypes).length?arr(tr.archetypes).map(x=>'<span class="role">'+esc(x)+'</span>').join(''):'<span class="empty">none assigned</span>')+'</div></div><div class="block"><h2>Frequent co-presence</h2>'+(cp.length?cp.map(x=>'<p><b>'+esc(x.name)+'</b> <span class="mono">×'+esc(x.count)+'</span></p>').join(''):'<p class="empty">No social-ledger co-presence recovered.</p>')+'</div><div class="block"><h2>Recovery pressure</h2>'+(recovery.length?'<p><b>'+esc(recovery.length)+'</b> open recovery lead'+(recovery.length===1?'':'s')+'.</p><p class="muted">'+esc(recovery[0])+'</p>':'<p class="empty">No recovery leads recorded.</p>')+'</div></div></div>';
}
function witnessHtml(){
 const w=dossier.tim_witness||{};
 if(!Object.keys(w).length)return '<p class="empty">No explicit Tim-witness layer has been recovered for this file yet.</p>';
 const fruit=w.fruit||{}, karma=w.karma||{}, placement=w.placement||{};
 const roles=arr(w.roles), effects=arr(w.witnessed_effects), symbols=arr(w.symbols), repair=arr(w.repair_path), sayings=arr(w.sayings);
 const debt=w.debt_relation||{}, inherited=arr(w.inherited_states), attrs=arr(w.episode_attributes), repairCredit=arr(debt.repair_credit);
 const chips=arr(fruit.labels);
 return '<div class="block"><h2>Tim’s character reading</h2><p>'+esc(w.character_reading||'')+'</p><p class="muted">This section records Tim/project witness and interpretation. It is not presented as independent clinical, legal or objective fact.</p></div>'+
 '<div class="two"><div><div class="block"><h2>Fruit / yield</h2><p><b>'+esc(fruit.direction||'unresolved')+'</b></p>'+(chips.length?'<div class="role-list">'+chips.map(x=>'<span class="role">'+esc(x)+'</span>').join('')+'</div>':'')+'<p>'+esc(fruit.reading||'')+'</p></div>'+
 '<div class="block"><h2>Karma</h2><p><b>'+esc(karma.direction||'unresolved')+'</b></p><p>'+esc(karma.reading||'')+'</p></div></div>'+
 '<div><div class="block"><h2>Potato of Life placement</h2><p><b>Primary:</b> '+(arr(placement.primary).length?arr(placement.primary).map(esc).join(' · '):'unresolved')+'</p><p><b>Secondary:</b> '+(arr(placement.secondary).length?arr(placement.secondary).map(esc).join(' · '):'—')+'</p><p>'+esc(placement.reading||'')+'</p></div>'+
 '<div class="block"><h2>Symbols</h2>'+(symbols.length?'<div class="role-list">'+symbols.map(x=>'<span class="role">'+esc(x)+'</span>').join('')+'</div>':'<p class="empty">No symbols recovered.</p>')+'</div></div></div>'+
 '<div class="two"><div class="block"><h2>What Tim says they did / produced</h2>'+(effects.length?'<ul>'+effects.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">No effect summary yet.</p>')+'</div>'+
 '<div class="block"><h2>Repair / transformation path</h2>'+(repair.length?'<ul>'+repair.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">No transformation path recovered.</p>')+'</div></div>'+
 '<div class="block"><h2>Tim-assigned roles over time</h2>'+(roles.length?roles.map(x=>'<article class="event"><time>'+esc(x.date||'')+'</time><h3>'+esc(x.role||'')+'</h3><p>'+esc(x.note||'')+'</p><small>'+esc(x.status||'')+'</small></article>').join(''):'<p class="empty">No dated Tim-assigned roles recovered.</p>')+'</div>'+
 '<div class="block"><h2>Karmic debt / obligation</h2>'+(Object.keys(debt).length?'<p><b>'+esc(debt.status||'unresolved')+'</b></p><p>'+esc(debt.global_ledger_relation||'')+'</p>'+(debt.individual_amount?'<p><b>Individual amount:</b> '+esc(debt.individual_amount)+'</p>':'<p class="muted">No individual amount is assigned unless Tim explicitly stated one.</p>')+(arr(debt.basis).length?arr(debt.basis).map(x=>'<article class="event"><time>'+esc(x.date||'')+'</time><h3>'+esc(x.kind||'debt relation')+'</h3><p>'+esc(x.reading||'')+'</p><small>'+esc(x.source_class||'')+'</small></article>').join(''):'')+(repairCredit.length?'<h3>Repair / generative credit</h3><ul>'+repairCredit.map(x=>'<li><b>'+esc(x.date||'')+'</b> · '+esc(x.kind||'repair')+' — '+esc(x.reading||'')+'</li>').join('')+'</ul>':'')+'<p class="muted">'+esc(debt.boundary||'')+'</p>':'<p class="empty">No individual karmic debt relation has been recovered for this figure. CIA does not infer one from conflict, role labels or mention count alone.</p>')+'</div>'+
 (inherited.length?'<div class="block"><h2>Inherited symbolic states</h2>'+inherited.map(x=>'<article class="event"><time>'+esc(x.date||'')+'</time><h3>'+esc(x.from_role||'role')+' ⇒ '+esc(arr(x.inherits).join(' ⇒ '))+'</h3><p>'+esc(x.note||'')+'</p><small>'+esc(x.basis||'taxonomy inheritance')+'</small></article>').join('')+'</div>':'')+
 (attrs.length?'<div class="block"><h2>Episode attributes</h2>'+attrs.map(x=>'<article class="event"><time>'+esc(x.date||'')+'</time><h3>'+esc(x.attribute||'attribute')+'</h3><p>'+esc(x.evidence||'')+'</p><small>'+esc(x.status||'')+(x.boundary?' · '+esc(x.boundary):'')+'</small></article>').join('')+'</div>':'')+
 (sayings.length?'<div class="block"><h2>Words / sayings</h2>'+sayings.map(x=>'<blockquote><p>“'+esc(x.text||'')+'”</p><small>'+esc(x.source_mode||'attributed source')+(x.note?' · '+esc(x.note):'')+'</small></blockquote>').join('')+'</div>':'')+
 '<p class="stamp">TIM-WITNESS BOUNDARY</p><p>'+esc(w.boundary||'Tim/project interpretation is preserved as attributed witness, not independent fact.')+'</p>';
}
function timelineHtml(){
 const all=[];
 for(const x of arr(dossier.chronology?.cast_period_roles)) all.push({date:x.period,title:x.role,summary:'Cast-book period role'});
 for(const x of arr(dossier.chronology?.recovered_social_days)) all.push({date:x.date,title:x.title,summary:x.minimum_event});
 for(const x of arr(dossier.highlighted_incidents)) all.push({date:x.date,title:x.title,summary:x.summary});
 const seen=new Set(); const uniq=all.filter(x=>{const k=x.date+'|'+x.title;if(seen.has(k))return false;seen.add(k);return true;});
 return '<div class="timeline">'+(uniq.length?uniq.map(x=>'<article class="event"><time>'+esc(x.date)+'</time><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||'')+'</p></article>').join(''):'<p class="empty">No dated events loaded.</p>')+'</div>';
}
function conversationEntries(id){
 return arr(conversationRecovery?.entries).filter(x=>arr(x.figures).includes(id));
}
function conversationsHtml(){
 const list=conversationEntries(current);
 const local=dossier.conversation_archaeology||{};
 const modes=arr(local.recurring_modes);
 const ordinary=arr(local.ordinary_life_signals);
 const pattern=local.disagreement_support_pattern||'';
 const boundary=local.interpretive_boundary||conversationRecovery?.source_rule||'Keep recovered chat separate from later interpretation.';
 return '<div class="block"><h2>Conversation archaeology</h2><p class="muted">'+esc(conversationRecovery?.scope||'Recovered conversation material outside the main Story archive.')+'</p>'+
   (modes.length?'<p><b>Recurring modes:</b> '+modes.map(esc).join(' · ')+'</p>':'')+
   (ordinary.length?'<p><b>Ordinary-life signals:</b> '+ordinary.map(esc).join(' · ')+'</p>':'')+
   (pattern?'<p><b>Pattern:</b> '+esc(pattern)+'</p>':'')+
   '<p class="stamp">SOURCE BOUNDARY</p><p>'+esc(boundary)+'</p></div>'+
   '<div class="timeline">'+(list.length?list.map(x=>{
     const raw=arr(x.raw_fragments);
     const details=arr(x.ordinary_details);
     return '<article class="event"><time>'+esc(x.date)+'</time><h3>'+esc(x.title||x.id)+'</h3>'+
       '<p><b>Source class:</b> '+esc(x.source_class||'conversation recovery')+'</p>'+
       '<p><b>Modes:</b> '+esc(arr(x.modes).join(' / '))+'</p>'+
       (raw.length?'<ul>'+raw.map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>':'')+
       (details.length?'<p class="mono"><b>Ordinary detail:</b> '+details.map(esc).join(' · ')+'</p>':'')+
       '<p class="muted">'+esc(x.interpretive_boundary||'')+'</p></article>';
   }).join(''):'<p class="empty">No recovered conversation entries indexed for this figure yet.</p>')+'</div>';
}
function patternsHtml(){
 const s=dossier.scene_ecology||{};
 const ca=dossier.conversation_archaeology||{};
 const recurring=arr(s.recurring_modes).length?arr(s.recurring_modes):arr(ca.recurring_modes);
 const shifts=arr(s.role_shifts);
 const ordinary=arr(s.ordinary_texture).length?arr(s.ordinary_texture):arr(ca.ordinary_life_signals);
 const tensions=arr(s.tensions);
 const pattern=ca.disagreement_support_pattern||'';
 const boundary=s.boundary||ca.interpretive_boundary||dossier.tim_relation?.source_boundary||'';
 return '<div class="two"><div><div class="block"><h2>Recurring modes</h2>'+(recurring.length?'<div class="role-list">'+recurring.map(x=>'<span class="role">'+esc(x)+'</span>').join('')+'</div>':'<p class="empty">No recurring modes indexed yet.</p>')+'</div>'+
 '<div class="block"><h2>Role changes</h2>'+(shifts.length?shifts.map(x=>'<article class="event"><time>'+esc(x.period||'')+'</time><h3>'+esc(x.from||'')+' → '+esc(x.to||'')+'</h3><p>'+esc(x.evidence||'')+'</p></article>').join(''):'<p class="empty">No explicit role-shift sequence indexed yet.</p>')+'</div></div>'+
 '<div><div class="block"><h2>Ordinary texture</h2>'+(ordinary.length?'<ul>'+ordinary.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">No ordinary-life texture indexed yet.</p>')+'</div>'+
 '<div class="block"><h2>Tensions / counter-patterns</h2>'+(tensions.length?'<ul>'+tensions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':(pattern?'<p>'+esc(pattern)+'</p>':'<p class="empty">No tension pattern indexed yet.</p>'))+'</div></div></div>'+
 (pattern&&tensions.length?'<div class="block"><h2>Relationship pattern</h2><p>'+esc(pattern)+'</p></div>':'')+
 '<p class="stamp">INTERPRETIVE BOUNDARY</p><p>'+esc(boundary)+'</p>';
}
function knowledgeHtml(){
 const tr=dossier.tim_relation||{};
 const conv=conversationEntries(current);
 const inc=incidentMatches(current);
 const storiesList=storyMatches(current);
 const modes=[...new Set(conv.flatMap(x=>arr(x.modes)))];
 const contexts=[...new Set([...(arr(tr.regions)),...conv.flatMap(x=>arr(x.ordinary_details))])].filter(Boolean);
 const sourceTypes=[...new Set(arr(dossier.source_strata).map(x=>x.type).filter(Boolean))];
 const topics=[...new Set([
   ...arr(tr.narrative_functions),
   ...modes,
   ...arr(dossier.scene_ecology?.recurring_modes),
   ...arr(dossier.conversation_archaeology?.recurring_modes)
 ].filter(Boolean))];
 const questions=arr(dossier.recovery_leads);
 return '<div class="two"><div><div class="block"><h2>Topics & recurring questions</h2>'+(topics.length?'<div class="role-list">'+topics.slice(0,24).map(x=>'<span class="role">'+esc(x)+'</span>').join('')+'</div>':'<p class="empty">No topic index yet.</p>')+'</div>'+
 '<div class="block"><h2>Contexts & ordinary anchors</h2>'+(contexts.length?'<ul>'+contexts.slice(0,24).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">No context anchors yet.</p>')+'</div></div>'+
 '<div><div class="block"><h2>Evidence mix</h2><p><b>'+esc(conv.length)+'</b> conversation scene'+(conv.length===1?'':'s')+' · <b>'+esc(inc.length)+'</b> incident'+(inc.length===1?'':'s')+' · <b>'+esc(storiesList.length)+'</b> Story link'+(storiesList.length===1?'':'s')+'</p>'+(sourceTypes.length?'<p><b>Source classes:</b> '+sourceTypes.map(esc).join(' · ')+'</p>':'')+'</div>'+
 '<div class="block"><h2>Open questions</h2>'+(questions.length?'<ul>'+questions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">No open recovery questions recorded.</p>')+'</div></div></div>'+
 '<p class="stamp">KNOWLEDGE BOUNDARY</p><p>These are archive-derived associations and research directions, not intelligence findings, diagnoses, legal conclusions or claims of complete biography.</p>';
}
function bondsHtml(){
 const list=bondMatches(current).sort((a,b)=>b.count-a.count);
 return '<div class="block"><h2>Source-derived co-presence</h2><p class="muted">Co-presence does not itself prove friendship, alliance, motive or conflict.</p>'+(list.length?list.map(e=>{const other=e.a===current?e.b:e.a;return '<article class="event"><h3>'+esc(other)+' <span class="mono">×'+esc(e.count)+'</span></h3><p>'+esc(arr(e.contexts).slice(0,4).join(' · '))+'</p><small>'+esc(arr(e.dates).join(', '))+'</small></article>'}).join(''):'<p class="empty">No co-presence edges in current network.</p>')+'</div>';
}
function storiesHtml(){
 const list=storyMatches(current); const inc=incidentMatches(current);
 return '<div class="two"><div class="block"><h2>Story appearances</h2>'+(list.length?list.map(s=>'<a class="story-link" href="'+route(s.path)+'"><b>'+esc(s.title)+'</b><br><small>'+esc(s.mode||'')+'</small></a>').join(''):'<p class="empty">No explicit Story links indexed yet.</p>')+'</div><div class="block"><h2>Indexed incidents</h2>'+(inc.length?inc.map(x=>'<article class="event"><time>'+esc(x.date)+'</time><h3>'+esc(x.title)+'</h3><small>'+esc(arr(x.type).join(' / '))+'</small></article>').join(''):'<p class="empty">No CIA incident entries yet.</p>')+'</div></div>';
}
function rolesHtml(){
 const list=roleMatches(current);
 const symbolic=arr(dossier.symbolic_roles);
 return '<div class="block"><h2>Source-bounded roles</h2>'+(list.length?list.map(x=>'<article class="event"><h3>'+esc(x.role)+'</h3><p>'+esc(x.note||'')+'</p><small>'+esc(x.date||'')+' · '+esc(x.status||'')+'</small></article>').join(''):'<p class="empty">No indexed Dog/Farmer/Dweller/Potato/Tomato-style role assignments.</p>')+'</div><div class="block"><h2>Dossier symbolic-role records</h2>'+(symbolic.length?'<pre class="mono">'+esc(JSON.stringify(symbolic,null,2))+'</pre>':'<p class="empty">None.</p>')+'</div>';
}
function enhancementsHtml(){
 const e=enhancementFor(current);
 if(!e)return '<p class="empty">No enhancement/capability sheet recovered yet.</p>';
 const ordinary=arr(e.ordinary), creative=arr(e.creative);
 return '<div class="two"><div class="block"><h2>Ordinary / documentary capabilities</h2>'+(ordinary.length?'<ul>'+ordinary.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">none recovered</p>')+'</div><div class="block"><h2>Creative / project enhancements</h2>'+(creative.length?'<ul>'+creative.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">none recovered</p>')+'</div></div><p class="stamp">SOURCE BOUNDARY</p><p>'+esc(e.boundary||'Keep documentary and creative traits separate.')+'</p>';
}
function sourcesHtml(){
 const ss=arr(dossier.source_strata); const leads=arr(dossier.recovery_leads);
 return '<div class="two"><div class="block"><h2>Source strata</h2>'+(ss.length?ss.map(s=>'<a class="route-link" href="'+route(s.path)+'">'+esc(s.type)+' → '+esc(s.path)+'</a>').join(''):'<p class="empty">No source routes indexed.</p>')+'</div><div class="block"><h2>Open recovery leads</h2>'+(leads.length?'<ul>'+leads.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="empty">No current recovery leads.</p>')+'</div></div>';
}
function render(){
 document.title=(dossier.display_name||current)+' — CIA File';
 document.getElementById('fileId').textContent='FILE '+current.toUpperCase()+' · '+(dossier.entity_class||'ENTITY');
 document.getElementById('name').textContent=dossier.display_name||current;
 document.getElementById('summary').textContent=dossier.tim_relation?.editorial_reading||'Persistent Potatoverse dossier.';
 document.getElementById('badges').innerHTML=[
  dossier.archive_status, dossier.room_policy, ...(dossier.tim_relation?.archetypes||[]).slice(0,4)
 ].filter(Boolean).map(x=>'<span class="badge">'+esc(x)+'</span>').join('');
 document.getElementById('overview').innerHTML=overviewHtml();
 document.getElementById('witness').innerHTML=witnessHtml();
 document.getElementById('timeline').innerHTML=timelineHtml();
 document.getElementById('conversations').innerHTML=conversationsHtml();
 document.getElementById('patterns').innerHTML=patternsHtml();
 document.getElementById('knowledge').innerHTML=knowledgeHtml();
 document.getElementById('bonds').innerHTML=bondsHtml();
 document.getElementById('stories').innerHTML=storiesHtml();
 document.getElementById('roles').innerHTML=rolesHtml();
 document.getElementById('enhancements').innerHTML=enhancementsHtml();
 document.getElementById('sources').innerHTML=sourcesHtml();
}
async function load(id){
 current=id; history.replaceState(null,'','?figure='+encodeURIComponent(id));
 try{dossier=await get('knowledge/fbi/figures/'+id+'.json');render()}catch(e){
  document.getElementById('name').textContent='File not found';
  document.getElementById('summary').textContent='This entity does not yet have a deep CIA JSON dossier.';
 }
}
function shuffle(){
 const figs=arr(manifest?.figures).map(x=>x.id).filter(x=>x!==current);
 if(!figs.length)return; load(figs[Math.floor(Math.random()*figs.length)]);
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 const panel=document.getElementById(b.dataset.panel);
 panel.classList.add('active');
 document.getElementById('sheet')?.dispatchEvent(new CustomEvent('potato:tts-current',{detail:{item:panel}}));
}));
document.getElementById('shuffleTop').onclick=shuffle;document.getElementById('shuffleBottom').onclick=shuffle;
(async()=>{[manifest,roles,stories,bonds,incidents,enhancements,conversationRecovery,timTaxonomy]=await Promise.all([
 get('knowledge/fbi/manifest.json'),get('knowledge/fbi/role-index.json'),get('knowledge/fbi/story-links.json'),
 get('knowledge/fbi/bonds/network.json'),get('knowledge/fbi/incidents/index.json'),get('knowledge/fbi/enhancements-index.json'),
 get('knowledge/fbi/conversation-recovery.json'),get('knowledge/fbi/tim-moral-symbolic-taxonomy.json')
]);await load(current)})().catch(e=>{document.getElementById('summary').textContent='The cabinet could not load one of its indexes.'});
</script>
