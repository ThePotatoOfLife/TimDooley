<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Inhabitants — Potato House</title><meta name="description" content="Browse cases, entities, concepts, texts, artifacts and processes that live inside Potato House Rooms."><link rel="stylesheet" href="../../app/site-system.css?v=20260914a"><style>
.index{max-width:1120px}.obj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:10px}.obj-card{border:1px solid var(--site-line);padding:14px}.obj-card h3{font:400 20px var(--site-font-serif);color:var(--site-gold);margin:0 0 6px}.obj-card p{font-size:10px;color:var(--site-muted);line-height:1.5}.obj-card a{display:inline-block;margin-top:10px;text-decoration:none;border-bottom:1px solid var(--site-line);font-size:9px}.lenses{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.lenses span{border:1px solid var(--site-line);border-radius:999px;padding:4px 6px;font-size:7px;color:var(--site-muted)}.kind-group{margin:28px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.controls input,.controls select{border:1px solid var(--site-line);background:transparent;color:inherit;padding:8px 10px}.loading{color:var(--site-muted)}
</style></head><body><main class="page page--reading index"><nav class="page-nav"><a href="../../elevator/">← Elevator</a><a href="../">Rooms</a><a href="../../house/">House</a><a href="../../">Home</a></nav><header class="page-header"><p class="eyebrow">Level 3 · contents of the House</p><h1>INHABITANTS<br>&amp; CASES</h1><p class="summary" id="summary">Loading registered objects…</p></header><div class="controls"><input id="q" type="search" placeholder="Search inhabitants, cases, concepts…"><select id="kind"><option value="">All kinds</option></select><select id="room"><option value="">All Rooms</option></select><select id="maturity"><option value="">All maturity</option><option value="described">Described</option><option value="faceted">Faceted</option><option value="case-ready">Case-ready</option><option value="seed">Seed</option></select></div><div id="results"><p class="loading">Loading registry…</p></div></main><script src="../../app/house-journey.js"></script><script>
(async()=>{
 const esc=v=>String(v??'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
 const [ir,sr]=await Promise.all([fetch('../../data/house/room-inhabitants.json'),fetch('../../data/house/subrooms.json')]);
 if(!ir.ok||!sr.ok){document.getElementById('results').innerHTML='<p>Registry unavailable.</p>';return}
 const data=await ir.json(), sub=await sr.json();
 const subBy=Object.fromEntries((sub.subrooms||[]).map(x=>[x.id,x]));
 const rows=data.inhabitants||[];
 const q=document.getElementById('q'),kind=document.getElementById('kind'),room=document.getElementById('room'),maturity=document.getElementById('maturity'),results=document.getElementById('results');
 document.getElementById('summary').textContent=rows.length+' registered objects currently live inside one or more Rooms. They can be inspected through different Room lenses without becoming new Rooms or duplicate owners.';
 [...new Set(rows.map(x=>x.kind).filter(Boolean))].sort().forEach(v=>kind.insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'+esc(v)+'</option>'));
 [...new Set(rows.flatMap(x=>x.room_ids||[]))].sort((a,b)=>(subBy[a]?.title||a).localeCompare(subBy[b]?.title||b)).forEach(v=>room.insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'+esc(subBy[v]?.title||v)+'</option>'));
 function render(){
   const term=q.value.trim().toLowerCase(),kv=kind.value,rv=room.value,mv=maturity.value;
   const filtered=rows.filter(x=>(!kv||x.kind===kv)&&(!rv||(x.room_ids||[]).includes(rv))&&(!mv||x.maturity===mv)&&(!term||[x.label,x.kind,x.summary,...(x.room_ids||[]).map(id=>subBy[id]?.title||id)].join(' ').toLowerCase().includes(term)));
   const groups={};filtered.forEach(x=>(groups[x.kind||'object']??=[]).push(x));
   results.innerHTML=Object.entries(groups).sort(([a],[b])=>a.localeCompare(b)).map(([k,list])=>'<section class="kind-group"><p class="eyebrow">'+esc(k)+'</p><div class="obj-grid">'+list.map(x=>{const first=(x.room_ids||[])[0],s=subBy[first],params=new URLSearchParams({room:s?.parent_room_id||'',inner:first||'',object:x.id});return '<article class="obj-card"><h3>'+esc(x.label)+'</h3><p>'+esc(x.summary||'Registered House inhabitant.')+'</p><div class="lenses"><span>'+esc(x.maturity||'seed')+'</span>'+(x.room_ids||[]).map(id=>'<span>'+esc(subBy[id]?.title||id)+'</span>').join('')+'</div><a href="../../elevator/?'+params.toString()+'">Place on center table →</a></article>'}).join('')+'</div></section>').join('')||'<p>No inhabitants match this view.</p>';
 }
 q.addEventListener('input',render);kind.addEventListener('change',render);room.addEventListener('change',render);maturity.addEventListener('change',render);render();
})();
</script></body></html>
