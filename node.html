<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Dense record dossier — The Potato of Life.">
<title>Record — The Potato of Life</title>
<link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css">
<style>
:root{--ink:#171815;--muted:#6f7069;--paper:#fffdf8;--line:#ded8ca;--soft:#f3efe6;--accent:#9a4d2e;--dark:#171916}body{background:var(--paper);color:var(--ink)}.record-wrap{max-width:1180px;margin:auto}.record-hero{padding:72px 6vw 44px;border-bottom:1px solid var(--line)}.record-hero h1{font:400 clamp(3rem,7vw,6.4rem)/.92 Georgia,serif;letter-spacing:-.055em;margin:10px 0 20px}.record-lead{max-width:900px;font-size:1.13rem;line-height:1.85;color:#4e5049}.record-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:22px}.record-meta span{padding:6px 9px;border:1px solid var(--line);font:700 .7rem ui-monospace,monospace;text-transform:uppercase;color:#65665e}.record-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,.8fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.record-main,.record-aside{background:var(--paper);padding:42px 6vw}.record-aside{padding-left:28px;padding-right:28px}.section-kicker{font:800 .68rem ui-monospace,monospace;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}.record-main h2{font:400 2rem Georgia,serif;margin:8px 0 15px}.record-main p{line-height:1.86;font-size:1rem}.meaning-block{padding:28px 0;border-bottom:1px solid var(--line)}.meaning-block:last-child{border-bottom:0}.meaning-block h3{font:400 1.55rem Georgia,serif;margin:7px 0 10px}.meaning-block ul{padding-left:20px}.meaning-block li{margin:8px 0;line-height:1.7}.callout{margin:22px 0;padding:18px 20px;background:var(--soft);border-left:3px solid var(--accent);line-height:1.75}.aside-card{padding:16px 0;border-bottom:1px solid var(--line)}.aside-card strong{display:block;font:400 1.15rem Georgia,serif;margin-bottom:5px}.aside-card span,.aside-card p{font-size:.84rem;line-height:1.6;color:var(--muted)}.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.links a{padding:7px 9px;border:1px solid var(--line);font-size:.76rem;text-decoration:none}.evidence{padding:45px 6vw;background:var(--dark);color:#eee9df}.evidence p,.evidence li{color:#c6c1b7;line-height:1.75}.evidence h2{font:400 2.2rem Georgia,serif;margin:8px 0 18px}.evidence-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#3a3d38;margin-top:25px}.evidence-card{background:var(--dark);padding:22px}.evidence-card strong{display:block;margin-bottom:7px}.research-gap{padding:45px 6vw;border-bottom:1px solid var(--line)}.research-gap h2{font:400 2.2rem Georgia,serif}.related{display:flex;flex-wrap:wrap;gap:8px}.related a{padding:8px 10px;border:1px solid var(--line);text-decoration:none}.error{padding:45px;color:#8d3d3d}@media(max-width:780px){.record-grid{grid-template-columns:1fr}.record-aside{padding:32px 6vw}.evidence-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav aria-label="Primary"><a href="repository.html">Repository</a><a href="axis.html">Axis</a><a href="nations.html">World</a><a href="people.html">People</a><a href="belief.html">Ideas</a><a href="potatoism.html">Potatoism</a><a href="hawkins.html">Hawkins</a></nav></header>
<main id="app"></main>
<footer><span>THE POTATO OF LIFE · DENSE RECORD</span><span><a href="repository.html">Repository</a> · <a href="health.html">Health</a></span></footer>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
async function load(p){const r=await fetch(p+'?v=20260908-10',{cache:'no-store'});if(!r.ok)throw Error(p+' · '+r.status);return r.json()}
const optional=async(p,f)=>{try{return await load(p)}catch{return f}};
const slug=s=>String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const list=v=>Array.isArray(v)?v:[];
function bullets(a){return a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}
function block(label,title,body){return '<section class="meaning-block"><p class="section-kicker">'+esc(label)+'</p><h3>'+esc(title)+'</h3>'+body+'</section>'}
function relatedLinks(ids){return '<div class="related">'+ids.slice(0,20).map(x=>'<a href="node.html?id='+encodeURIComponent(x)+'">'+esc(x.replaceAll('-',' '))+'</a>').join('')+'</div>'}
(async()=>{try{
const [nodes,children,support,rels,lore,meaning,nations,lex]=await Promise.all([
optional('data/nodes.json',{nodes:[]}),optional('data/tree-child-records.json',{records:[]}),optional('data/tree-support-records.json',{records:[]}),optional('data/relationships.json',{relationships:[]}),optional('data/potatoverse-lore.json',{records:[]}),optional('data/meaning-layer.json',{records:[]}),optional('data/nations.json',{nations:[]}),optional('data/potatoism-lexicon.json',{entries:[]})]);
const country=list(nations.nations).find(x=>x.id===id||String(x.iso3||'').toLowerCase()===String(id||'').toLowerCase());if(country){location.replace('nation.html?id='+encodeURIComponent(country.id));return}
const all=[...list(nodes.nodes),...list(children.records),...list(support.records)];let record=all.find(x=>x.id===id);
if(!record){const term=list(lex.entries).find(x=>slug(x.term)===slug(id));if(term)record={id, name:term.term, type:'potatoism-lexicon', layer:'meaning', description:term.definition, ...term}}
if(!record){document.getElementById('app').innerHTML='<div class="error">No record found for <strong>'+esc(id)+'</strong>. The repository should never invent a record simply because a link exists.</div>';return}
const md=list(meaning.records).find(x=>x.id===id);const lr=list(lore.records).find(x=>x.id===id);const baseName=record.name||record.title||id;
const edges=list(rels.relationships);const related=edges.flatMap(e=>e.source===id?[e.target]:e.target===id?[e.source]:[]).filter(Boolean);
const relatedNames=[...new Set(related)];
let main='<section class="record-hero"><p class="section-kicker">'+esc(record.layer||'record')+' · '+esc(record.type||'archive')+'</p><h1>'+esc(baseName)+'</h1><p class="record-lead">'+esc(record.description||md?.purpose||'This record exists in the archive because it participates in a larger structure. Its purpose must be established through relationships, mechanisms, evidence and consequences rather than through its label alone.')+'</p><div class="record-meta"><span>Dense record</span><span>Meaning layer '+(md?'attached':'not yet attached')+'</span><span>'+relatedNames.length+' graph relations</span></div></section>';
main+='<div class="record-grid"><article class="record-main">';
if(md){
main+=block('01 · PURPOSE','Why this belongs in the archive','<p>'+esc(md.purpose)+'</p>');
main+=block('02 · MECHANISM','How it actually matters',bullets(md.mechanisms));
main+=block('03 · QUESTIONS','What the record should let us investigate',bullets(md.questions));
main+=block('04 · FAILURE MODES','What a shallow reading would get wrong',bullets(md.failure_modes));
main+=block('05 · PROJECT USE','How this connects to the architecture','<p>'+esc(md.use_in_project||'The record is useful when connected to adjacent systems rather than treated as an isolated definition.')+'</p>');
if(md.research_routes)main+=block('06 · RESEARCH ROUTES','Fields and evidence worth following',bullets(md.research_routes));
}else if(lr){main+='<div class="callout"><strong>This record has a dedicated project study.</strong> The study is kept separate from the empirical archive so mythology, historical tradition and interpretation do not silently become the same thing.</div>';main+=block('EXTENDED STUDY',lr.name,'<p>'+esc(lr.description||'')+'</p>');for(const s of list(lr.sections))main+=block('STUDY',s.heading,'<p>'+esc(s.text)+'</p>');if(lr.stages)main+=block('SEQUENCE','Stages',lr.stages.map(s=>'<p><strong>'+esc(s.order)+'. '+esc(s.name)+'</strong> — '+esc(s.meaning)+'</p>').join(''));if(lr.rules)main+=block('METHOD','Rules',bullets(lr.rules));
}else{main+='<div class="callout"><strong>This is not yet a deep record.</strong> The archive has an identifier and description, but it should not pretend that this is equivalent to research. The next enrichment pass should add purpose, mechanism, evidence, failure modes and explicit relationships.</div>';main+=block('STRUCTURED DATA','What is currently known','<p>'+esc(record.description||'No substantive description is currently attached.')+'</p>')}
main+='</article><aside class="record-aside"><div class="aside-card"><strong>Record class</strong><span>'+esc(record.type||'record')+' · '+esc(record.layer||'archive')+'</span></div><div class="aside-card"><strong>Repository rule</strong><p>A label is not an explanation. This page separates what the thing is, what it does, why it matters and what remains unknown.</p></div><div class="aside-card"><strong>Relationships</strong>'+ (relatedNames.length?relatedLinks(relatedNames):'<p>No explicit relationship edges were found.</p>')+'</div>';
if(record.status)main+='<div class="aside-card"><strong>Status</strong><span>'+esc(record.status)+'</span></div>';
main+='</aside></div>';
const evidence=(md?.questions||[]).slice(0,4);main+='<section class="evidence"><p class="section-kicker">EVIDENCE DISCIPLINE</p><h2>What would make this record genuinely useful?</h2><p>The archive should not fill empty space with generic prose. A strong record earns its place by giving the reader mechanisms, relationships, questions and a route to evidence. For empirical material, source trails are required. For mythology, the project interpretation must remain labelled as interpretation.</p><div class="evidence-grid"><div class="evidence-card"><strong>Known</strong><p>'+esc(record.description||'The stored record definition.')+'</p></div><div class="evidence-card"><strong>Open</strong><p>'+esc(evidence.join(' ' )||'No dedicated research questions have been attached yet.')+'</p></div><div class="evidence-card"><strong>Graph</strong><p>'+esc(relatedNames.length+' explicit relationship(s) currently connect this record.')+'</p></div><div class="evidence-card"><strong>Standard</strong><p>Do not call a record enriched merely because a JSON object exists. Substance means a reader can understand why the thing matters and what can be investigated next.</p></div></div></section>';
main+='<section class="research-gap"><p class="section-kicker">NEXT DEPTH PASS</p><h2>Where this record should go next</h2><p>The repository is being rebuilt around a simple rule: every major thing needs a reason to exist. The next research pass should add primary sources, quantitative measures where appropriate, chronology, competing interpretations, ownership/control or dependency relationships, and explicit uncertainty rather than another layer of adjectives.</p></section>';
document.getElementById('app').innerHTML=main;document.title=baseName+' — The Potato of Life';
}catch(e){document.getElementById('app').innerHTML='<div class="error">Record loader failed: '+esc(e.message)+'</div>'}})();
</script>
</body></html>
