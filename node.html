<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A reference record in The Potato of Life atlas."><title>Record — The Potato of Life</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav><a href="repository.html">Atlas</a><a href="nations.html">World</a><a href="people.html">People</a><a href="belief.html">Ideas</a><a href="potatoism.html">Potatoism</a><a href="hawkins.html">Hawkins</a></nav></header><main id="node-page"><section class="section"><div class="section-heading"><div><p class="section-label" id="node-layer">RECORD</p><h1 id="node-name">Loading…</h1></div><p class="muted" id="node-type"></p></div><div class="record-columns"><article class="record-article"><h2>Overview</h2><p id="node-description"></p><div id="node-note"></div><div id="node-lore"></div></article><aside class="record-sidebar"><h3>In the atlas</h3><div id="node-position"></div><h3>Related records</h3><div id="node-relations" class="related-list"></div></aside></div></section><section id="nation-directory-section" class="section record-section" hidden><div class="section-heading"><div><p class="section-label">WORLD</p><h2>195 Nations</h2></div><p class="muted">Canonical national records.</p></div><div class="nations-directory"><div class="nation-toolbar"><input id="nation-q" placeholder="Search country, capital, ISO code…"><select id="nation-region"><option value="">All regions</option></select><select id="nation-subregion"><option value="">All subregions</option></select></div><p id="nation-count" class="nation-count">Loading…</p><div id="nation-grid" class="nation-grid"></div></div></section><section id="evidence-section" class="section record-section"><div class="section-heading"><div><p class="section-label">EVIDENCE</p><h2>What is known</h2></div></div><div id="node-evidence" class="evidence-list"></div></section><section id="source-section" class="section record-section"><div class="section-heading"><div><p class="section-label">SOURCE TRAIL</p><h2>Where information comes from</h2></div></div><div id="node-sources" class="source-list"></div></section></main><footer><span>THE POTATO OF LIFE · ATLAS RECORD</span><span><a href="repository.html">Atlas</a> · <a href="health.html">Health</a></span></footer><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}function setupNationDirectory(nations){const q=document.getElementById('nation-q'),region=document.getElementById('nation-region'),sub=document.getElementById('nation-subregion'),grid=document.getElementById('nation-grid'),count=document.getElementById('nation-count');const render=()=>{const term=q.value.trim().toLowerCase(),r=region.value,s=sub.value,out=nations.filter(n=>(!term||[n.name,n.capital,n.iso2,n.iso3].join(' ').toLowerCase().includes(term))&&(!r||n.region===r)&&(!s||n.subregion===s));count.textContent=out.length+' of '+nations.length+' nations';grid.innerHTML=out.map(n=>`<a class="nation-card" href="nation.html?id=${encodeURIComponent(n.id)}"><strong>${esc(n.name)}</strong><small>${esc(n.capital)} · ${esc(n.iso3)} · ${esc(n.region)}</small></a>`).join('')||'<p>No nations match.</p>'};[...new Set(nations.map(n=>n.region).filter(Boolean))].sort().forEach(v=>region.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));[...new Set(nations.map(n=>n.subregion).filter(Boolean))].sort().forEach(v=>sub.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));q.addEventListener('input',render);region.addEventListener('change',render);sub.addEventListener('change',render);render()}const loreFor={'tim-dooley':'tim-dooley','son':'thomas-son-study','thomas':'thomas-son-study','twin':'thomas-son-study','jesus-christ':'thomas-son-study','father':'son-father-mirror','father-son-relationship':'son-father-mirror','son-to-door':'son-as-door-vessel','son-to-ladder':'son-as-door-vessel','door':'son-as-door-vessel','vessel':'son-as-door-vessel','narrow-gate':'son-as-door-vessel','pineal-gland':'son-as-door-vessel','potato-of-life':'potato-of-life-study','potatoism':'potato-of-life-study','red-potato':'red-blue-potato-dialectic','blue-potato':'red-blue-potato-dialectic','crucifixion':'son-transformation-cycle','death':'son-transformation-cycle','transformation':'son-transformation-cycle','north-pole':'north-pole-christmas-myth','christmas':'north-pole-christmas-myth'};function renderLore(l){if(!l)return '';let out=`<section class="lore-entry"><p class="section-label">EXTENDED STUDY</p><h2>${esc(l.name)}</h2><p>${esc(l.description||'')}</p>`;if(l.sections)for(const s of l.sections)out+=`<div class="lore-section"><h3>${esc(s.heading)}</h3><p>${esc(s.text)}</p></div>`;if(l.stages)out+='<div class="lore-stages">'+l.stages.map(s=>`<article><strong>${esc(s.order)}. ${esc(s.name)}</strong><p>${esc(s.meaning)}</p></article>`).join('')+'</div>';if(l.rules)out+='<div class="lore-rules">'+l.rules.map(x=>`<p>• ${esc(x)}</p>`).join('')+'</div>';return out+'</section>'}(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('node-name').textContent='No record selected';return}try{if(id==='nations'||id==='world'){document.title='World — The Potato of Life';document.getElementById('node-name').textContent='World';document.getElementById('node-layer').textContent='WORLD';document.getElementById('node-type').textContent='directory';document.getElementById('node-description').textContent='The canonical world layer contains 195 national records, each expandable into geography, institutions, population, economy and relationships.';document.getElementById('node-note').innerHTML='<p class="record-note">The World directory is the canonical entry point for national records.</p>';document.getElementById('node-position').innerHTML='<a href="repository.html">Atlas</a>';document.getElementById('node-relations').innerHTML='<a href="nations.html"><strong>195 Nations</strong><span>Open World directory</span></a>';document.getElementById('evidence-section').hidden=true;document.getElementById('source-section').hidden=true;document.getElementById('nation-directory-section').hidden=false;setupNationDirectory((await j('data/nations.json')).nations||[]);return}const directory=await j('data/nations.json'),country=directory.nations?.find(n=>n.id===id);if(country){location.replace('nation.html?id='+encodeURIComponent(id));return}const [nd,rd,rs,td,cd,pl,gr,gc]=await Promise.all([j('data/nodes.json'),j('data/relationships.json'),j('data/research.json'),j('data/tree.json'),j('data/tree-child-records.json'),j('data/potatoverse-lore.json'),j('data/graph-registry.json'),j('data/graph-carvings.json')]);const all=[...(nd.nodes||[]),...(cd.records||[]),...(gr.records||[])],rels=[...(rd.relationships||[]),...(gc.relationships||[])],facts=rs.facts||[],lore=pl.records||[],map=new Map(all.map(x=>[x.id,x])),record=map.get(id);if(!record)throw Error('No backend record exists for '+id);document.title=record.name+' — The Potato of Life';document.getElementById('node-name').textContent=record.name;document.getElementById('node-layer').textContent=(record.layer||'archive').replaceAll('-',' ').toUpperCase();document.getElementById('node-type').textContent=record.type||'record';document.getElementById('node-description').textContent=record.description||'This record is registered in the atlas and is available for further research.';document.getElementById('node-note').innerHTML='<p class="record-note">Archive class: '+esc(record.layer||'general')+'. Definition, evidence and relationships are maintained as separate layers.</p>';const parents=[];for(const l of td.levels||[])if((l.children||[]).includes(id))parents.push(l);document.getElementById('node-position').innerHTML=parents.length?parents.map(l=>`<a href="node.html?id=${encodeURIComponent(l.id)}">${esc(l.name)}</a>`).join('<br>'):'<a href="repository.html">Atlas</a>';const links=rels.filter(r=>r.source===id||r.target===id).map(r=>{const oid=r.source===id?r.target:r.source;return `<a href="node.html?id=${encodeURIComponent(oid)}"><strong>${esc(map.get(oid)?.name||oid)}</strong><span>${esc(r.source===id?'→ ':'← ')}${esc(r.relationship||'related')}</span></a>`});document.getElementById('node-relations').innerHTML=links.length?links.join(''):'<p class="muted">No graph edge recorded yet.</p>';const lr=lore.find(x=>x.id===loreFor[id]||x.id===id);document.getElementById('node-lore').innerHTML=lr?renderLore(lr):'';const matched=facts.filter(f=>f.node_ids?.includes(id)||f.nodes?.includes(id)||String(f.jurisdiction||'').toLowerCase()===String(record.name).toLowerCase());document.getElementById('node-evidence').innerHTML=matched.length?matched.map(f=>`<article class="evidence-entry"><div><span class="evidence-class">${esc(f.evidence||'evidence')}</span><span class="muted"> · ${esc(f.date||'undated')}</span></div><p>${esc(f.claim)}</p><small>Source record: ${esc(f.source||'not specified')} · confidence: ${esc(f.confidence||'not specified')}</small></article>`).join(''):'<article class="evidence-entry"><div><span class="evidence-class">ARCHIVE STATUS</span></div><p>No dedicated external fact is attached to this record yet.</p></article>';const sourceIds=[...new Set(matched.map(f=>f.source).filter(Boolean))],sources=(rs.sources||[]).filter(s=>sourceIds.includes(s.id));document.getElementById('node-sources').innerHTML=sources.length?sources.map(s=>`<article><h3>${esc(s.title||s.id)}</h3><p>${esc(s.publisher||'')}</p><a href="${esc(s.url)}" target="_blank" rel="noopener">Open source</a></article>`).join(''):'<p class="muted">No external source is attached yet.</p>'}catch(e){document.getElementById('node-name').textContent='Record could not be loaded';document.getElementById('node-description').textContent=e.message}})();</script></body></html>
