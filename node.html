<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Dense record dossier — The Potato of Life."><title>Record — The Potato of Life</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css"><style>
:root{--paper:#fffdf8;--line:#ded8ca;--muted:#6f7069;--accent:#9a4d2e;--dark:#171916}body{background:var(--paper)}.wrap{max-width:1180px;margin:auto}.hero{padding:72px 6vw 44px;border-bottom:1px solid var(--line)}h1{font:400 clamp(3rem,7vw,6.4rem)/.92 Georgia,serif;letter-spacing:-.055em;margin:10px 0 20px}.lead{max-width:900px;font-size:1.12rem;line-height:1.85;color:#4e5049}.meta,.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.meta span,.links a{padding:6px 9px;border:1px solid var(--line);font-size:.72rem;text-decoration:none}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,.8fr);gap:1px;background:var(--line)}main,aside{background:var(--paper);padding:42px 6vw}aside{padding-left:28px;padding-right:28px}.k{font:800 .68rem ui-monospace,monospace;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}.block{padding:27px 0;border-bottom:1px solid var(--line)}.block h2{font:400 1.65rem Georgia,serif;margin:7px 0 11px}.block p,.block li{line-height:1.8}.block ul{padding-left:20px}.callout{padding:18px 20px;background:#f3efe6;border-left:3px solid var(--accent);line-height:1.75}.aside-card{padding:16px 0;border-bottom:1px solid var(--line)}.aside-card strong{display:block;font:400 1.1rem Georgia,serif;margin-bottom:5px}.aside-card p,.aside-card span{font-size:.83rem;color:var(--muted);line-height:1.6}.evidence{padding:45px 6vw;background:var(--dark);color:#eee9df}.evidence p{color:#c6c1b7;line-height:1.75}.evidence h2{font:400 2.2rem Georgia,serif}.eg{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#3a3d38}.ec{background:var(--dark);padding:20px}.ec p{margin-bottom:0}.error{padding:50px;color:#8d3d3d}@media(max-width:780px){.grid{grid-template-columns:1fr}.eg{grid-template-columns:1fr}aside{padding:32px 6vw}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav><a href="repository.html">Repository</a><a href="axis.html">Axis</a><a href="nations.html">World</a><a href="people.html">People</a><a href="belief.html">Ideas</a><a href="potatoism.html">Potatoism</a><a href="hawkins.html">Hawkins</a></nav></header><div id="app"></div><footer><span>THE POTATO OF LIFE · DENSE RECORD</span><span><a href="repository.html">Repository</a> · <a href="health.html">Health</a></span></footer><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');const list=x=>Array.isArray(x)?x:[];async function j(p,f={}){try{const r=await fetch(p+'?v=20260908-11',{cache:'no-store'});return r.ok?r.json():f}catch{return f}}function bullets(a){return a?.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':''}function block(k,t,b){return '<section class="block"><p class="k">'+esc(k)+'</p><h2>'+esc(t)+'</h2>'+b+'</section>'}function links(a){return '<div class="links">'+[...new Set(a)].slice(0,24).map(x=>'<a href="node.html?id='+encodeURIComponent(x)+'">'+esc(x.replaceAll('-',' '))+'</a>').join('')+'</div>'}
(async()=>{if(!id){app.innerHTML='<div class="error">No record selected.</div>';return}const [n,c,s,r,l,m,sm,na]=await Promise.all([j('data/nodes.json'),j('data/tree-child-records.json'),j('data/tree-support-records.json'),j('data/relationships.json'),j('data/potatoverse-lore.json'),j('data/meaning-layer.json'),j('data/meaning-layer-symbolic.json'),j('data/nations.json')]);const nation=list(na.nations).find(x=>x.id===id||String(x.iso3||'').toLowerCase()===id.toLowerCase());if(nation){location.replace('nation.html?id='+encodeURIComponent(nation.id));return}const all=[...list(n.nodes),...list(c.records),...list(s.records)];let rec=all.find(x=>x.id===id);const term=list((await j('data/potatoism-lexicon.json')).entries).find(x=>String(x.term||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')===id);if(!rec&&term)rec={id,name:term.term,type:'potatoism-lexicon',layer:'meaning',description:term.definition,...term};if(!rec){app.innerHTML='<div class="error">No record found for <strong>'+esc(id)+'</strong>. The archive will not manufacture substance for a missing record.</div>';return}const md=list(m.records).find(x=>x.id===id)||list(sm.records).find(x=>x.id===id);const lore=list(l.records).find(x=>x.id===id);const edges=list(r.relationships),rel=edges.flatMap(e=>e.source===id?[e.target]:e.target===id?[e.source]:[]);let h='<section class="hero wrap"><p class="k">'+esc(rec.layer||'record')+' · '+esc(rec.type||'archive')+'</p><h1>'+esc(rec.name||rec.title||id)+'</h1><p class="lead">'+esc(rec.description||md?.purpose||'A registered record whose meaning must be established through evidence, mechanisms and relationships.')+'</p><div class="meta"><span>Dense record</span><span>'+esc(md?'Meaning layer attached':'Depth gap identified')+'</span><span>'+rel.length+' graph relations</span></div></section><div class="grid wrap"><main>';if(md){h+=block('01 · PURPOSE','Why this belongs in the archive','<p>'+esc(md.purpose)+'</p>');h+=block('02 · MECHANISM','How it actually matters',bullets(md.mechanisms));h+=block('03 · QUESTIONS','What it should let us investigate',bullets(md.questions));h+=block('04 · FAILURE MODES','What a shallow reading gets wrong',bullets(md.failure_modes));h+=block('05 · PROJECT USE','How it functions here','<p>'+esc(md.use_in_project||'The record is useful when connected to the graph rather than treated as an isolated label.')+'</p>');if(md.research_routes)h+=block('06 · RESEARCH ROUTES','Where to go next',bullets(md.research_routes))}else if(lore){h+='<div class="callout"><strong>Dedicated study attached.</strong> Mythological, historical and interpretive claims remain separated.</div>';h+=block('EXTENDED STUDY',lore.name,'<p>'+esc(lore.description||'')+'</p>');for(const x of list(lore.sections))h+=block('STUDY',x.heading,'<p>'+esc(x.text)+'</p>');if(lore.stages)h+=block('SEQUENCE','Stages',lore.stages.map(x=>'<p><strong>'+esc(x.order)+'. '+esc(x.name)+'</strong> — '+esc(x.meaning)+'</p>').join(''));if(lore.rules)h+=block('METHOD','Rules',bullets(lore.rules))}else h+='<div class="callout"><strong>Depth gap.</strong> This record has a label/description but no dense meaning layer yet. That is now visible instead of being disguised as a completed entry.</div><p>'+esc(rec.description||'No description.')+'</p>';h+='</main><aside><div class="aside-card"><strong>Repository rule</strong><p>A fancy word is not an explanation. Major records need purpose, mechanism, questions, failure modes and relationships.</p></div><div class="aside-card"><strong>Relationships</strong>'+(rel.length?links(rel):'<p>No explicit edges are currently recorded.</p>')+'</div><div class="aside-card"><strong>Stored class</strong><span>'+esc(rec.type||'record')+' · '+esc(rec.layer||'archive')+'</span></div></aside></div><section class="evidence"><p class="k">EVIDENCE DISCIPLINE</p><h2>What would make this genuinely useful?</h2><p>The archive should not fill space with generic encyclopedia prose. A strong entry explains why the thing matters, how it operates, what depends on it, what could falsify an interpretation, and where the evidence comes from. Symbolic material can be deep without pretending to be empirical.</p><div class="eg"><div class="ec"><strong>Known</strong><p>'+esc(rec.description||'Stored record.')+'</p></div><div class="ec"><strong>Open</strong><p>'+esc((md?.questions||[]).join(' ')||'The research questions still need to be written.')+'</p></div><div class="ec"><strong>Graph</strong><p>'+esc(rel.length+' explicit relationship(s) connect this record.')+'</p></div><div class="ec"><strong>Standard</strong><p>Existence of a file is not evidence of research. A record earns depth through substance and provenance.</p></div></div></section>';document.getElementById('app').innerHTML=h;document.title=(rec.name||id)+' — The Potato of Life'})();</script></body></html>
