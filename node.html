<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Dense record dossier — The Potato of Life."><title>Record — The Potato of Life</title><link rel="stylesheet" href="site.css"><link rel="stylesheet" href="consistency.css"><style>:root{--paper:#fffdf8;--line:#ded8ca;--muted:#6f7069;--accent:#9a4d2e;--dark:#171916}body{background:var(--paper)}.wrap{max-width:1180px;margin:auto}.hero{padding:72px 6vw 44px;border-bottom:1px solid var(--line)}h1{font:400 clamp(3rem,7vw,6.4rem)/.92 Georgia,serif;letter-spacing:-.055em;margin:10px 0 20px}.lead{max-width:900px;font-size:1.12rem;line-height:1.85;color:#4e5049}.meta,.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.meta span,.links a{padding:6px 9px;border:1px solid var(--line);font-size:.72rem;text-decoration:none}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,.8fr);gap:1px;background:var(--line)}main,aside{background:var(--paper);padding:42px 6vw}aside{padding-left:28px;padding-right:28px}.block{padding:27px 0;border-bottom:1px solid var(--line)}.k{font:800 .68rem ui-monospace,monospace;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}.block h2{font:400 1.65rem Georgia,serif;margin:7px 0 11px}.block p,.block li{line-height:1.8}.block ul{padding-left:20px}.callout{padding:18px 20px;background:#f3efe6;border-left:3px solid var(--accent);line-height:1.75}.aside-card{padding:16px 0;border-bottom:1px solid var(--line)}.aside-card strong{display:block;font:400 1.1rem Georgia,serif;margin-bottom:5px}.aside-card p,.aside-card span{font-size:.83rem;color:var(--muted);line-height:1.6}.evidence{padding:45px 6vw;background:var(--dark);color:#eee9df}.evidence p{color:#c6c1b7;line-height:1.75}.evidence h2{font:400 2.2rem Georgia,serif}.eg{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#3a3d38}.ec{background:var(--dark);padding:20px}.ec p{margin-bottom:0}.error{padding:50px;color:#8d3d3d}@media(max-width:780px){.grid,.eg{grid-template-columns:1fr}aside{padding:32px 6vw}}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>THE POTATO OF LIFE</span></a><nav aria-label="Primary"><a href="repository.html">Repository</a><a href="axis.html">Axis</a><a href="nations.html">World</a><a href="people.html">People</a><a href="belief.html">Ideas</a><a href="potatoism.html">Potatoism</a><a href="hawkins.html">Hawkins</a></nav></header><div id="app"></div><footer><span>THE POTATO OF LIFE · DENSE RECORD</span><span><a href="repository.html">Repository</a> · <a href="health.html">Health</a></span></footer><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=x=>Array.isArray(x)?x:[];const id=new URLSearchParams(location.search).get('id');async function j(p,f={}){try{const r=await fetch(p+'?v=20260908-16',{cache:'no-store'});return r.ok?r.json():f}catch{return f}}function atPath(root,path){let cur=root;for(const part of list(path)){if(cur==null)return null;cur=cur[part]}return cur&&typeof cur==='object'?cur:null}function linkIds(ids){return '<div class="links">'+[...new Set(ids.filter(Boolean))].slice(0,32).map(x=>'<a href="node.html?id='+encodeURIComponent(x)+'">'+esc(String(x).replaceAll('-',' '))+'</a>').join('')+'</div>'}function block(k,t,b){return '<section class="block"><p class="k">'+esc(k)+'</p><h2>'+esc(t)+'</h2>'+b+'</section>'}function bullets(a){return a?.length?'<ul>'+a.map(x=>'<li>'+esc(typeof x==='string'?x:(x.name||x.label||JSON.stringify(x)))+'</li>').join('')+'</ul>':''}
(async()=>{if(!id){app.innerHTML='<div class="error">No record selected.</div>';return}const [n,c,s,r,l,m,sm,na,ev,hk,research,geom,index]=await Promise.all([j('data/nodes.json'),j('data/tree-child-records.json'),j('data/tree-support-records.json'),j('data/relationships.json'),j('data/potatoverse-lore.json'),j('data/meaning-layer.json'),j('data/meaning-layer-symbolic.json'),j('data/nations.json'),j('data/events.json'),j('data/hawkins-scale.json'),j('data/research-carvings-2026-09.json'),j('data/geometry-records.json'),j('data/repository-index.json')]);const nation=list(na.nations).find(x=>x.id===id||String(x.iso3||'').toLowerCase()===id.toLowerCase());if(nation){location.replace('nation.html?id='+encodeURIComponent(nation.id));return}const core=[...list(n.nodes),...list(c.records),...list(s.records)];let rec=core.find(x=>x.id===id);let source='core';if(!rec){rec=list(ev.events).find(x=>x.id===id);source='event'}if(!rec){const h=list(hk.scale).find(x=>'hawkins-'+x.level===id);if(h){rec={id:'hawkins-'+h.level,name:h.name,type:'hawkins-state',layer:'hawkinscale',description:h.psychology,definition:h.psychology,context:'Entry in the Hawkins comparative consciousness model.',mechanisms:h.action_tendency,dimensions:{level:h.level,phase:h.phase,model_status:hk.status,physical_frequency_status:hk.physical_frequency_status},questions:['How should this model be compared with contemporary emotion science without treating its calibration numbers as physical measurements?'],failure_modes:[h.risk_pattern],couplings:h.likely_outcomes_in_model,sources:[hk.source_model],project_extrapolations:[`Within the repository this is treated as a comparative model, not an established physical scale.`]};source='hawkins'}}if(!rec){rec=list(research.records).find(x=>x.id===id);source='research'}if(!rec){rec=list(geom.records).find(x=>x.id===id);source='geometry'}if(!rec){const term=list((await j('data/potatoism-lexicon.json')).entries).find(x=>String(x.term||'').toLowerCase().replace(/[^a-z0-9]+/g,'-')===id);if(term){rec={id,name:term.term,type:'potatoism-lexicon',layer:'meaning',description:term.definition,...term};source='lexicon'}}
// The repository index is a navigation projection, not a second canonical database.
// If an entry was indexed from another JSON source, resolve its exact stored path so
// node.html can display it without pretending it belongs in data/nodes.json.
if(!rec&&Array.isArray(index.records)){const hit=index.records.find(x=>String(x.id).toLowerCase()===id.toLowerCase()&&x.source&&Array.isArray(x.path));if(hit){const payload=await j(hit.source);const candidate=atPath(payload,hit.path);if(candidate&&typeof candidate==='object'){rec=candidate;source=hit.source+' · canonical path'}}}
if(!rec){app.innerHTML='<div class="error"><h1>No record found</h1><p>The identifier <strong>'+esc(id)+'</strong> is not currently registered in a canonical source or resolvable indexed path.</p><p>That is a routing/data-integrity problem, not a reason to invent content.</p><p><a href="repository.html">Return to Repository</a></p></div>';return}const md=list(m.records).find(x=>x.id===id)||list(sm.records).find(x=>x.id===id)||null;const lore=list(l.records).find(x=>x.id===id)||null;const edges=list(r.relationships),rel=edges.flatMap(e=>e.source===id?[e.target]:e.target===id?[e.source]:[]);const description=rec.description||rec.definition||rec.summary||md?.purpose||'';let h='<section class="hero wrap"><p class="k">'+esc(rec.layer||source)+' · '+esc(rec.type||'record')+'</p><h1>'+esc(rec.name||rec.title||id)+'</h1><p class="lead">'+esc(description||'Registered record; detailed description is still being researched.')+'</p><div class="meta"><span>Source: '+esc(source)+'</span><span>'+esc(md?'Meaning layer attached':rec.definition?'Definition attached':'Research record')+'</span><span>'+rel.length+' graph relations</span></div></section><div class="grid wrap"><main>';if(rec.definition)h+=block('01 · DEFINITION','What this thing is','<p>'+esc(rec.definition)+'</p>');if(rec.context)h+=block('02 · CONTEXT','Origin and setting','<p>'+esc(typeof rec.context==='string'?rec.context:JSON.stringify(rec.context))+'</p>');if(rec.mechanisms||rec.mechanisms_or_function)h+=block('03 · MECHANISM','How it functions',bullets(rec.mechanisms||rec.mechanisms_or_function));if(rec.dimensions)h+=block('04 · DIMENSIONS','Independent coordinates','<p>'+esc(JSON.stringify(rec.dimensions,null,2))+'</p>');if(md){h+=block('05 · PURPOSE','Why it belongs here','<p>'+esc(md.purpose||'')+'</p>');h+=block('06 · QUESTIONS','What it lets us investigate',bullets(md.questions));h+=block('07 · FAILURE MODES','Where interpretation can fail',bullets(md.failure_modes));if(md.use_in_project)h+=block('08 · PROJECT USE','How it functions in the archive','<p>'+esc(md.use_in_project)+'</p>')}if(rec.project_extrapolations)h+=block('09 · PROJECT EXTRAPOLATIONS','Interpretation beyond the evidence',bullets(rec.project_extrapolations));if(rec.sources)h+=block('10 · SOURCES','Evidence / provenance',bullets(rec.sources));if(lore){h+=block('EXTENDED STUDY','Dedicated study','<p>'+esc(lore.description||'')+'</p>');for(const x of list(lore.sections))h+=block('STUDY',x.heading,'<p>'+esc(x.text)+'</p>')}h+='</main><aside><div class="aside-card"><strong>Repository rule</strong><p>Define the thing first. Then explain context, mechanism, evidence and relationships.</p></div><div class="aside-card"><strong>Relationships</strong>'+(rel.length?linkIds(rel):'<p>No explicit graph edges currently recorded.</p>')+'</div><div class="aside-card"><strong>Canonical source</strong><span>'+esc(source)+'</span></div></aside></div><section class="evidence"><p class="k">EVIDENCE DISCIPLINE</p><h2>Definition before coupling.</h2><p>The repository index is a navigation projection. An indexed record remains owned by its source JSON file; node.html follows that source path rather than requiring every record to be copied into data/nodes.json.</p><div class="eg"><div class="ec"><strong>Known</strong><p>'+esc(description||'No description currently attached.')+'</p></div><div class="ec"><strong>Open</strong><p>'+esc((md?.questions||rec.questions||[]).join(' ')||'Further research is required.')+'</p></div><div class="ec"><strong>Graph</strong><p>'+esc(rel.length+' explicit relationship(s).')+'</p></div><div class="ec"><strong>Boundary</strong><p>Project interpretation, historical claims and scientific claims must remain distinguishable.</p></div></div></section>';document.getElementById('app').innerHTML=h;document.title=(rec.name||id)+' — The Potato of Life'})();</script></body></html>
