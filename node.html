<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A record page in The Potato of Life living atlas.">
<title>Node — The Frame</title><link rel="stylesheet" href="site.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">THE FRAME</a><nav><a href="index.html">Axis</a><a href="repository.html">Repository</a></nav></header>
<main id="node-page" class="section repository-section">
  <div class="section-heading"><div><p class="section-label" id="node-layer">NODE</p><h1 id="node-name">Loading…</h1></div><p class="muted" id="node-type"></p></div>
  <div class="north-grid">
    <article><h3>Record</h3><p id="node-description"></p><div id="node-note" class="prose"></div></article>
    <article><h3>Connected records</h3><div id="node-relations" class="children large"></div></article>
  </div>
  <section class="statement" id="node-evidence-section"><p class="section-label">EVIDENCE</p><h2>What the archive currently knows.</h2><div id="node-evidence" class="prose"></div></section>
</main>
<footer><span>THE FRAME</span><span><a href="index.html">Return to Axis</a></span></footer>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(p){const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.json()}
(async()=>{
 const id=new URLSearchParams(location.search).get('id');
 if(!id){document.getElementById('node-name').textContent='No node selected';return;}
 try{
  const [nodesData,relData,researchData,treeData,childData]=await Promise.all([j('data/nodes.json'),j('data/relationships.json'),j('data/research.json'),j('data/tree.json'),j('data/tree-child-records.json')]);
  const nodes=nodesData.nodes||[], rels=relData.relationships||[], research=researchData.facts||researchData.research||[];
  const node=nodes.find(n=>n.id===id), child=(childData.records||[]).find(n=>n.id===id);
  const record=node||child;
  if(!record) throw Error('No backend record exists for '+id);
  document.title=record.name+' — The Frame';
  document.getElementById('node-name').textContent=record.name;
  document.getElementById('node-layer').textContent=(record.layer||'archive').replaceAll('-',' ').toUpperCase();
  document.getElementById('node-type').textContent=record.type||'record';
  document.getElementById('node-description').textContent=record.description||'';
  const notes={
   source:'Undivided origin in the symbolic architecture.',father:"Upper/source principle associated with the Father's House.",ladder:'The connecting vertical structure; its children describe levels, movement and thresholds.',door:'The zero/bifurcation point of the spatial model: Tree of Life rises from it and Hermes/Serpent descends from it.',son:'The person-bearing centre of the story, coupled to the Door and the vertical transformation sequence.',
   'tree-of-life':'The living form of the Axis: roots, trunk, branches, leaves, fruit and seed preserve continuity and renewal.',
   'tree-of-strife':'The fractured form of the same relational grammar: fear, extraction, stagnation and fragmentation.',
   'north-programme':'Applied layer of the archive. It uses the European Economic Graph as its empirical research layer while keeping framework claims distinct from observed facts.',
   'european-economic-graph':'Relationship-first empirical mapping: ownership, obligations, debt, energy, infrastructure, trade, technology, research and labour are edges, not merely labels.',
   spine:'Continuous central line of the Axis. The Door is its zero point; Tree of Life rises and Hermes/Serpent descends around it.'
  };
  document.getElementById('node-note').innerHTML=notes[id]?'<p>'+esc(notes[id])+'</p>':'';

  const lookup=new Map(nodes.map(n=>[n.id,n]));
  const treeParents=[];
  for(const level of treeData.levels||[])for(const childId of level.children||[])if(childId===id)treeParents.push(level);
  const relBox=document.getElementById('node-relations');
  const links=[];
  for(const r of rels.filter(r=>r.source===id||r.target===id)){
   const otherId=r.source===id?r.target:r.source, other=lookup.get(otherId)||(childData.records||[]).find(n=>n.id===otherId);
   links.push(`<a href="node.html?id=${encodeURIComponent(otherId)}">${esc(r.source===id?'→ ':'← ')}${esc(other?.name||otherId)} · ${esc(r.relationship)}</a>`);
  }
  if(treeParents.length){for(const p of treeParents)links.unshift(`<a href="node.html?id=${encodeURIComponent(p.id)}">↑ ${esc(p.name)} · canonical level</a>`);}
  if(!links.length)links.push('<p class="muted">No explicit relationship has been carved yet. This record is real and available for the next relationship pass.</p>');
  relBox.innerHTML=links.join('');

  const evidence=document.getElementById('node-evidence');
  const facts=research.filter(f=>String(f.jurisdiction||'').toLowerCase()===String(record.name).toLowerCase()||String(f.claim||'').toLowerCase().includes(String(record.name).toLowerCase()));
  evidence.innerHTML=facts.length?facts.map(f=>`<p>${esc(f.claim)} <span class="muted">[${esc(f.evidence)}, ${esc(f.confidence)}]</span></p>`).join(''):'<p class="muted">No dedicated sourced fact is attached yet. This is distinct from the record itself: the record exists, while empirical evidence can be added separately.</p>';
 }catch(e){document.getElementById('node-name').textContent='Record could not be loaded';document.getElementById('node-description').textContent=e.message;}
})();
</script>
</body>
</html>
